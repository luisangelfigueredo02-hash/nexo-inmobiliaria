name = "nexo-inmueble"
main = "worker.js"
compatibility_date = "2026-08-19"

[placement]
mode = "smart"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "nexo-db"
database_id = "03a0f232-751a-4d5b-a865-473062fbefbe"

[[vectorize]]
binding = "VECTOR_INDEX"
index_name = "nexo-index"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "BUCKET_IMAGENES"
bucket_name = "nexo-media"

[vars]
WHATSAPP_PHONE = "+5358385702"
# DSN de Sentry (opcional): configura con `wrangler secret put SENTRY_DSN`
# o reemplaza el valor por un DSN real cuando lo tengas disponible
SENTRY_DSN = ""
# DEMO_MODE: "1" para marcar datos de demostración en la UI y API.
# Útil para mostrar el producto con inventario de ejemplo claramente rotulado.
# Activo: el inventario actual es seed DEMO (reversible: scripts/seed-demo.mjs --clear).
DEMO_MODE = "1"
# White-label (opcional, se sirven en /api/config.brand):
# BRAND_NAME = "NEXO"
# BRAND_DESCRIPTION = "..."
# BRAND_TAGLINE = "..."
# BRAND_THEME_COLOR = "#1C1917"
# CONTACT_EMAIL = "..."  CONTACT_PHONE = "..."  BUSINESS_ADDRESS = "..."
# SOCIAL_INSTAGRAM / SOCIAL_FACEBOOK / SOCIAL_LINKEDIN = "https://..."
