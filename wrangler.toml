name = "nexo-inmobiliaria"
main = "worker.js"
compatibility_date = "2026-08-15"

# Coloca el Worker cerca del backend D1 cuando Cloudflare
# detecta que reduce latencia (automático, seguro de revertir).
[placement]
mode = "smart"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "nexo-db"
database_id = "03a0f232-751a-4d5b-a865-473062fbefbe"

[ai]
binding = "AI"