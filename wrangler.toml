name = "nexo-inmobiliaria"
main = "worker.js"
compatibility_date = "2026-08-15"

# Coloca el Worker cerca del backend D1 cuando Cloudflare
# detecta que reduce latencia (automático, seguro de revertir).
[placement]
mode = "smart"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "nexo-db"
database_id = "03a0f232-751a-4d5b-a865-473062fbefbe"

[ai]
binding = "AI"

# Vectorize (NEXO IA 2.0) — índice creado con:
#   npx wrangler vectorize create nexo-index \
#     --dimensions=768 --metric=cosine
[[vectorize]]
binding = "VECTOR_INDEX"
index_name = "nexo-index"

# R2 para medios (Hito 1): descomentar cuando se cree
# el bucket de producción con:
#   npx wrangler r2 bucket create nexo-media
#
# [[r2_buckets]]
# binding = "BUCKET_IMAGENES"
# bucket_name = "nexo-media"