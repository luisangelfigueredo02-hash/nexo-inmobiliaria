<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXO — Descubrimiento Inmobiliario Premium</title>
  <meta name="description" content="Nexo es el nexo moderno de conexión inmobiliaria táctil e internacional en La Habana. Encuentra propiedades exclusivas con fluidez de interacción.">
  
  <!-- SEO & OpenGraph -->
  <meta property="og:title" content="NEXO — Descubrimiento Inmobiliario Premium">
  <meta property="og:description" content="Plataforma interactiva contemporánea para explorar el catálogo de propiedades exclusivas en Cuba con sincronización cartográfica en tiempo real.">
  <meta property="og:type" content="website">
  <link rel="canonical" href="/">

  <!-- PWA & Mobile Optimization -->
  <meta name="theme-color" content="#1C1917">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192' fill='%231C1917'><rect width='192' height='192' rx='40'/><path d='M60 60h32v32H60zm40 40h32v32h-32zm0-40h32v32h-32zm-40 40h32v32H60z' fill='%23C2410C'/></svg>">

  <!-- Hojas de Estilo Mapas Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <style>
    :root {
      --nexo-obsidian: #1C1917;
      --nexo-porcelain: #FAF9F6;
      --nexo-stone-light: #F5F5F4;
      --nexo-stone-dark: #57534E;
      --nexo-clay: #C2410C;
      --nexo-sage: #78716C;
      --nexo-border: #E7E5E4;
      --nexo-transition: all 400ms cubic-bezier(0.16, 1, 0.3, 1);
      --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-stack);
      background-color: var(--nexo-porcelain);
      color: var(--nexo-obsidian);
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* Core Layout — Mobile-First */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(250, 249, 246, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--nexo-border);
      padding: 1.25rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.03em;
      color: var(--nexo-obsidian);
    }

    .logo-dot {
      width: 8px;
      height: 8px;
      background-color: var(--nexo-clay);
      border-radius: 50%;
    }

    /* Controls & Search */
    .search-panel {
      padding: 1rem 1.5rem;
      background-color: var(--nexo-porcelain);
      border-bottom: 1px solid var(--nexo-border);
    }

    .search-input-wrapper {
      position: relative;
      width: 100%;
      margin-bottom: 0.75rem;
    }

    .search-input {
      width: 100%;
      padding: 0.85rem 1.25rem;
      background-color: var(--nexo-stone-light);
      border: 1px solid transparent;
      border-radius: 6px;
      font-family: var(--font-stack);
      font-size: 0.95rem;
      color: var(--nexo-obsidian);
      transition: var(--nexo-transition);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--nexo-clay);
      background-color: #FFFFFF;
    }

    .filters-row {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
      scrollbar-width: none;
    }
    .filters-row::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      padding: 0.5rem 1rem;
      border: 1px solid var(--nexo-border);
      background-color: #FFFFFF;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      color: var(--nexo-stone-dark);
      transition: var(--nexo-transition);
    }

    .filter-btn.active, .filter-btn:hover {
      background-color: var(--nexo-obsidian);
      color: #FFFFFF;
      border-color: var(--nexo-obsidian);
    }

    /* Main Grid Viewport */
    .main-viewport {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 140px);
    }

    .list-section {
      flex: 1;
      padding: 1.5rem;
    }

    .map-section {
      height: 280px;
      width: 100%;
      border-top: 1px solid var(--nexo-border);
      border-bottom: 1px solid var(--nexo-border);
      position: relative;
    }

    #map-canvas {
      width: 100%;
      height: 100%;
    }

    /* Property Cards Design System */
    .properties-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.75rem;
    }

    .property-card {
      background: #FFFFFF;
      border: 1px solid var(--nexo-border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: var(--nexo-transition);
    }

    .property-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(28,25,23,0.04);
    }

    .card-media {
      position: relative;
      width: 100%;
      padding-top: 68%; /* Aspect Ratio Propietario */
      overflow: hidden;
      background-color: var(--nexo-stone-light);
    }

    .card-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .property-card:hover .card-image {
      transform: scale(1.04);
    }

    .badge {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      padding: 0.35rem 0.65rem;
      background-color: rgba(28, 25, 23, 0.85);
      color: #FFFFFF;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 3px;
      backdrop-filter: blur(4px);
    }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .card-meta {
      display: flex;
      gap: 0.75rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--nexo-sage);
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--nexo-obsidian);
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    .card-price {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--nexo-clay);
    }

    .card-location {
      font-size: 0.85rem;
      color: var(--nexo-stone-dark);
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    /* Modal Contextual Premium de Detalle */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(28, 25, 23, 0.5);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      justify-content: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 350ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      width: 100%;
      max-width: 580px;
      background-color: var(--nexo-porcelain);
      height: 100%;
      box-shadow: -10px 0 30px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 400ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .modal-sheet {
      transform: translateX(0);
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--nexo-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFFFFF;
    }

    .close-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
      font-size: 1.5rem;
      color: var(--nexo-stone-dark);
      transition: var(--nexo-transition);
    }

    .close-btn:hover {
      color: var(--nexo-obsidian);
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
    }

    .gallery-container {
      position: relative;
      width: 100%;
      height: 300px;
      background-color: var(--nexo-stone-light);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .gallery-slide {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-nav {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      background: rgba(28, 25, 23, 0.8);
      color: #FFFFFF;
      padding: 0.35rem 0.75rem;
      border-radius: 12px;
      font-size: 0.8rem;
      backdrop-filter: blur(4px);
    }

    .detail-price {
      font-size: 2rem;
      font-weight: 700;
      color: var(--nexo-clay);
      margin-bottom: 0.5rem;
    }

    .detail-title {
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1.25;
      margin-bottom: 0.5rem;
    }

    .detail-meta-box {
      display: flex;
      gap: 1rem;
      background-color: var(--nexo-stone-light);
      padding: 0.85rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
    }

    .meta-item {
      display: flex;
      flex-direction: column;
    }

    .meta-val {
      font-weight: 600;
      font-size: 1rem;
    }

    .meta-lbl {
      font-size: 0.75rem;
      color: var(--nexo-sage);
    }

    .detail-description {
      font-size: 0.95rem;
      color: var(--nexo-stone-dark);
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .whatsapp-cta {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      background-color: var(--nexo-obsidian);
      color: #FFFFFF;
      text-decoration: none;
      padding: 1rem;
      border-radius: 6px;
      font-weight: 600;
      text-align: center;
      transition: var(--nexo-transition);
    }

    .whatsapp-cta:hover {
      background-color: var(--nexo-clay);
    }

    /* Floating Offline Alert */
    .offline-alert {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background-color: var(--nexo-stone-dark);
      color: #FFFFFF;
      padding: 0.75rem 1.25rem;
      border-radius: 40px;
      font-size: 0.85rem;
      z-index: 1000;
      transition: var(--nexo-transition);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .offline-alert.active {
      transform: translateX(-50%) translateY(0);
    }

    /* Responsive Expansions (Desktop UI Split Layout) */
    @media (min-width: 900px) {
      .main-viewport {
        flex-direction: row;
        height: calc(100vh - 140px);
      }

      .list-section {
        flex: 1.1;
        overflow-y: auto;
        padding: 2rem;
      }

      .map-section {
        flex: 0.9;
        height: auto;
        border-top: none;
        border-left: 1px solid var(--nexo-border);
      }

      .properties-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <div class="logo-dot"></div>
      NEXO
    </div>
    <div style="font-size: 0.85rem; font-weight: 500; color: var(--nexo-sage)">Caribean Real Estate</div>
  </header>

  <div class="search-panel">
    <div class="search-input-wrapper">
      <input type="text" id="search-box" class="search-input" placeholder="Buscar por zona, palabra clave...">
    </div>
    <div class="filters-row">
      <button class="filter-btn active" data-type="">Todos</button>
      <button class="filter-btn" data-type="casa">Casas</button>
      <button class="filter-btn" data-type="apartamento">Apartamentos</button>
      <button class="filter-btn" data-type="terreno">Terrenos</button>
    </div>
  </div>

  <div class="main-viewport">
    <section class="list-section">
      <div class="properties-grid" id="properties-grid">
        <!-- Renderizado de Skeletons mediante JS -->
      </div>
    </section>
    
    <section class="map-section">
      <div id="map-canvas"></div>
    </section>
  </div>

  <!-- Modal Inmersivo de Propiedad -->
  <div class="modal-overlay" id="property-modal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 id="modal-header-ref" style="font-weight: 600; font-size: 1.1rem;">Detalles</h3>
        <button class="close-btn" id="close-modal-btn">&times;</button>
      </div>
      <div class="modal-body" id="modal-content">
        <!-- Renderizado Dinámico de la Ficha -->
      </div>
    </div>
  </div>

  <!-- Estado Offline Informativo -->
  <div class="offline-alert" id="offline-toast">
    <span style="display:inline-block; width:6px; height:6px; background:#F59E0B; border-radius:50%"></span>
    Modo offline activo: explorando catálogo en caché
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""></script>
  <script>
    let propertiesData = [];
    let map = null;
    let markersLayer = null;
    let currentFilterType = "";
    
    const placeholdersImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300' fill='%23FAF9F6'><rect width='400' height='300' fill='%23F5F5F4'/><path d='M150 120h100v60H150z' fill='%23FAF9F6'/><circle cx='200' cy='150' r='15' fill='%23E7E5E4'/></svg>";

    document.addEventListener("DOMContentLoaded", () => {
      initMap();
      fetchProperties();
      setupEvents();
      registerPWA();
      checkNetworkStatus();
    });

    function setupEvents() {
      // Filtrado por botones de Categoría
      const filterBtns = document.querySelectorAll(".filter-btn");
      filterBtns.forEach(btn => {
        btn.addEventListener("click", (e) => {
          filterBtns.forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          currentFilterType = btn.getAttribute("data-type");
          renderList();
        });
      });

      // Búsqueda inteligente interactiva
      const searchBox = document.getElementById("search-box");
      searchBox.addEventListener("input", () => {
        renderList();
      });

      // Cierre del Modal
      document.getElementById("close-modal-btn").addEventListener("click", closeModal);
      document.getElementById("property-modal").addEventListener("click", (e) => {
        if (e.target.id === "property-modal") closeModal();
      });

      window.addEventListener("online", checkNetworkStatus);
      window.addEventListener("offline", checkNetworkStatus);
    }

    function checkNetworkStatus() {
      const toast = document.getElementById("offline-toast");
      if (!navigator.onLine) {
        toast.classList.add("active");
      } else {
        toast.classList.remove("active");
      }
    }

    function initMap() {
      // Coordenadas por defecto (Habana del Este, Cuba)
      map = L.map('map-canvas', {
        zoomControl: false,
        attributionControl: false
      }).setView([23.16, -82.30], 12);

      // Usamos CartoDB Positron: elegante, en tonos de gris, sin contaminación visual
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);
    }

    async function fetchProperties() {
      const grid = document.getElementById("properties-grid");
      // Animación de Skeleton de Carga
      grid.innerHTML = Array(4).fill(0).map(() => `
        <div class="property-card" style="pointer-events: none; opacity:0.6;">
          <div class="card-media"></div>
          <div class="card-body">
            <div style="height:14px; width:40%; background:var(--nexo-border); border-radius:4px;"></div>
            <div style="height:20px; width:80%; background:var(--nexo-border); border-radius:4px;"></div>
            <div style="height:16px; width:50%; background:var(--nexo-border); border-radius:4px;"></div>
          </div>
        </div>
      `).join("");

      try {
        const res = await fetch("/api/properties");
        propertiesData = await res.json();
        renderList();
      } catch (err) {
        grid.innerHTML = `
          <div style="padding:3rem 0; text-align:center; width:100%; color:var(--nexo-stone-dark)">
            <p>Ocurrió un error al sincronizar el catálogo.</p>
            <button onclick="fetchProperties()" class="filter-btn" style="margin-top:1rem;">Reintentar</button>
          </div>
        `;
      }
    }

    function renderList() {
      const grid = document.getElementById("properties-grid");
      const searchVal = document.getElementById("search-box").value.toLowerCase();
      markersLayer.clearLayers();

      const filtered = propertiesData.filter(prop => {
        const matchesType = currentFilterType === "" || prop.type === currentFilterType;
        const matchesSearch = prop.title.toLowerCase().includes(searchVal) || 
                              prop.location.toLowerCase().includes(searchVal) ||
                              prop.description.toLowerCase().includes(searchVal);
        return matchesType && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="padding:4rem 0; text-align:center; width:100%; color:var(--nexo-stone-dark)">
            No se encontraron propiedades bajo el filtro seleccionado.
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(prop => {
        const mainImage = prop.images && prop.images.length > 0 ? prop.images[0] : placeholdersImg;
        
        // Agregar marcadores estructurados al mapa con formato de burbuja de precio nativa
        if (prop.latitude && prop.longitude) {
          const formattedPrice = new Intl.NumberFormat('en-US', { style: 'currency', currency: prop.currency, maximumFractionDigits: 0 }).format(prop.price);
          const priceMarkerHtml = `
            <div style="background-color:var(--nexo-clay); color:#FFFFFF; padding: 4px 8px; border-radius:12px; font-weight:700; font-size:11px; box-shadow:0 2px 5px rgba(0,0,0,0.2); white-space:nowrap;">
              ${formattedPrice}
            </div>
          `;
          
          const customIcon = L.divIcon({
            html: priceMarkerHtml,
            className: 'custom-leaflet-marker',
            iconSize: [50, 20],
            iconAnchor: [25, 10]
          });

          const m = L.marker([prop.latitude, prop.longitude], { icon: customIcon }).addTo(markersLayer);
          m.on('click', () => {
            openProperty(prop.id);
          });
        }

        return `
          <article class="property-card" onclick="openProperty(${prop.id})">
            <div class="card-media">
              <span class="badge">${prop.status}</span>
              <img src="${mainImage}" onerror="this.src='${placeholdersImg}'" class="card-image" alt="${prop.title}" loading="lazy">
            </div>
            <div class="card-body">
              <div class="card-meta">${prop.type} • ${prop.area}m²</div>
              <h4 class="card-title">${prop.title}</h4>
              <div class="card-location">
                <svg width="12" height="14" viewBox="0 0 12 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 0C2.68629 0 0 2.68629 0 6C0 10.5 6 14 6 14C6 14 12 10.5 12 6C12 2.68629 9.31371 0 6 0ZM6 8C4.89543 8 4 7.10457 4 6C4 4.89543 4.89543 4 6 4C7.10457 4 8 4.89543 8 6C8 7.10457 7.10457 8 6 8Z" fill="currentColor"/></svg>
                ${prop.location}
              </div>
              <div class="card-price">${new Intl.NumberFormat('en-US', { style: 'currency', currency: prop.currency }).format(prop.price)}</div>
            </div>
          </article>
        `;
      }).join("");

      // Reajustar mapa a los marcadores si existen
      if (markersLayer.getLayers().length > 0) {
        const group = new L.featureGroup(markersLayer.getLayers());
        map.fitBounds(group.getBounds().pad(0.1));
      }
    }

    async function openProperty(id) {
      const modal = document.getElementById("property-modal");
      const content = document.getElementById("modal-content");
      document.getElementById("modal-header-ref").innerText = `NEXO REF-${id}`;

      content.innerHTML = `
        <div style="padding:4rem 0; text-align:center; color:var(--nexo-stone-dark)">
          Obteniendo detalles del espacio...
        </div>
      `;
      modal.classList.add("active");

      try {
        const res = await fetch(`/api/properties/${id}`);
        const prop = await res.json();

        const imagesList = prop.images && prop.images.length > 0 ? prop.images : [placeholdersImg];
        const formattedPrice = new Intl.NumberFormat('en-US', { style: 'currency', currency: prop.currency }).format(prop.price);

        // Generar el mensaje contextual estructurado para WhatsApp
        const textMessage = encodeURIComponent(
          `Hola Nexo Inmobiliaria, me interesa la propiedad [REF-${prop.id}] "${prop.title}" en la ubicación: ${prop.location}. Me gustaría recibir más detalles.`
        );
        const waLink = `https://wa.me/5355360739?text=${textMessage}`;

        content.innerHTML = `
          <div class="gallery-container">
            <img src="${imagesList[0]}" id="gallery-focused-img" class="gallery-slide" alt="Vista del inmueble" onerror="this.src='${placeholdersImg}'">
            ${imagesList.length > 1 ? `
              <div class="gallery-nav" id="gallery-count">1 / ${imagesList.length}</div>
            ` : ''}
          </div>
          
          ${imagesList.length > 1 ? `
            <div style="display:flex; gap:0.5rem; overflow-x:auto; margin-bottom:1.5rem; padding-bottom:0.5rem;">
              ${imagesList.map((img, index) => `
                <img src="${img}" class="img-thumb" style="width:70px; height:50px; object-fit:cover; border-radius:3px; cursor:pointer;" onclick="setGalleryImage('${img}', ${index + 1}, ${imagesList.length})">
              `).join("")}
            </div>
          ` : ''}

          <div class="detail-price">${formattedPrice}</div>
          <h2 class="detail-title">${prop.title}</h2>
          <div class="card-location" style="margin-bottom:1.5rem;">${prop.location}</div>

          <div class="detail-meta-box">
            <div class="meta-item">
              <span class="meta-val">${prop.bedrooms}</span>
              <span class="meta-lbl">Cuartos</span>
            </div>
            <div class="meta-item" style="border-left: 1px solid var(--nexo-border); padding-left:1rem;">
              <span class="meta-val">${prop.bathrooms}</span>
              <span class="meta-lbl">Baños</span>
            </div>
            <div class="meta-item" style="border-left: 1px solid var(--nexo-border); padding-left:1rem;">
              <span class="meta-val">${prop.area} m²</span>
              <span class="meta-lbl">Superficie</span>
            </div>
          </div>

          <h4 style="margin-bottom:0.5rem; font-weight:600;">Descripción del Inmueble</h4>
          <p class="detail-description">${prop.description || "Sin descripción proporcionada."}</p>

          <a href="${waLink}" target="_blank" class="whatsapp-cta">
            Contactar por WhatsApp
          </a>
        `;
      } catch {
        content.innerHTML = `
          <div style="padding:2rem 0; text-align:center; color:var(--nexo-stone-dark)">
            Error al consultar los detalles de la propiedad. Intente nuevamente.
          </div>
        `;
      }
    }

    function setGalleryImage(src, current, total) {
      document.getElementById("gallery-focused-img").src = src;
      document.getElementById("gallery-count").innerText = `${current} / ${total}`;
    }

    function closeModal() {
      document.getElementById("property-modal").classList.remove("active");
    }

    function registerPWA() {
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .catch(err => console.log('Service Worker no inicializado:', err));
        });
      }
    }
  </script>
</body>
</html>
