<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NEXO — Propiedades Exclusivas en Cuba</title>
    <!-- CSS de Leaflet para el Mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-color: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --border: rgba(0, 0, 0, 0.08);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow-x: hidden;
            padding-bottom: calc(80px + var(--safe-bottom));
        }

        /* Cabecera Premium Translúcida */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent);
        }

        /* Panel de Filtros Moderno */
        .filters-container {
            padding: 16px 24px;
            background: var(--card-color);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-behavior: smooth;
        }

        .filters-container::-webkit-scrollbar {
            display: none;
        }

        select, input {
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--bg-color);
            font-size: 14px;
            outline: none;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        select:focus, input:focus {
            border-color: var(--accent);
            background: var(--card-color);
        }

        /* Contenedores de Visualización */
        .view-toggle {
            padding: 12px 24px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn-toggle {
            background: var(--card-color);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-toggle.active {
            background: var(--text-primary);
            color: white;
            border-color: var(--text-primary);
        }

        /* Grid de Inmuebles */
        .catalog {
            padding: 0 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .property-card {
            background: var(--card-color);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.02);
            border: 1px solid var(--border);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .property-card:hover {
            transform: translateY(-4px);
        }

        .img-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #e5e5ea;
            overflow: hidden;
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .badge-op {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(255, 255, 255, 0.9);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .price {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .loc {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .specs {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            padding-top: 12px;
            margin-top: 4px;
        }

        /* Mapa de Catálogo */
        #map-view {
            width: 100%;
            height: 60vh;
            border-bottom: 1px solid var(--border);
            display: none;
        }

        /* Elementos Skeleton */
        .skeleton {
            animation: pulse 1.5s infinite ease-in-out;
            background: #e5e5ea;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* Drawer Flotante de NEXO IA */
        .chat-drawer {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            background: var(--card-color);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1000;
            height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .chat-drawer.open {
            transform: translateY(0);
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-title {
            font-weight: 600;
            font-size: 17px;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
        }

        .msg.user {
            background: var(--accent);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .msg.bot {
            background: var(--bg-color);
            color: var(--text-primary);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .chat-property-link {
            display: inline-block;
            margin-top: 6px;
            padding: 6px 12px;
            background: var(--accent);
            color: white !important;
            text-decoration: none;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .chat-input-area {
            padding: 16px 24px calc(16px + var(--safe-bottom));
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }

        .chat-input-area input {
            flex: 1;
        }

        .btn-send {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Botón de Activación de IA */
        .ai-fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--text-primary);
            color: white;
            padding: 14px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 99;
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">NE<span>X</span>O</a>
        <a href="/admin.html" style="font-size: 14px; color: var(--text-secondary); text-decoration: none;">Gestión</a>
    </header>

    <!-- Filtros de Inmuebles -->
    <div class="filters-container">
        <select id="filter-type">
            <option value="">Tipo</option>
            <option value="casa">Casa</option>
            <option value="apartamento">Apartamento</option>
            <option value="terreno">Terreno</option>
            <option value="penthouse">Penthouse</option>
        </select>
        <select id="filter-operation">
            <option value="">Operación</option>
            <option value="venta">Venta</option>
            <option value="alquiler">Alquiler</option>
        </select>
        <select id="filter-province">
            <option value="">Provincia</option>
            <option value="La Habana">La Habana</option>
            <option value="Matanzas">Matanzas</option>
            <option value="Cienfuegos">Cienfuegos</option>
        </select>
        <input type="number" id="filter-price" placeholder="Precio Máximo (USD)">
    </div>

    <div class="view-toggle">
        <button class="btn-toggle active" id="btn-grid">Cuadrícula</button>
        <button class="btn-toggle" id="btn-map">Mapa</button>
    </div>

    <!-- Mapa Interactivo -->
    <div id="map-view"></div>

    <!-- Catálogo de Propiedades -->
    <main class="catalog" id="catalog">
        <!-- Inyección dinámica de skeletons -->
    </main>

    <!-- Botón Flotante para Lanzar Chatbot -->
    <div class="ai-fab" onclick="toggleChat(true)">
        <span>✨</span> NEXO IA
    </div>

    <!-- Chat de NEXO IA -->
    <div class="chat-drawer" id="chat-drawer">
        <div class="chat-header">
            <div class="chat-title">✨ NEXO IA — Asistente Inteligente</div>
            <button class="btn-close" onclick="toggleChat(false)">×</button>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="msg bot">¡Hola! Soy tu asistente de NEXO. ¿Buscas comprar o alquilar en alguna zona específica de Cuba? Cuéntame qué necesitas.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Ej. Casa en Vedado con 3 habs..." onkeypress="handleChatKey(event)">
            <button class="btn-send" onclick="sendChatMessage()">Enviar</button>
        </div>
    </div>

    <!-- Scripts CDN Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let propertiesData = [];
        let map = null;
        let markersGroup = null;

        function showSkeletons() {
            const catalog = document.getElementById("catalog");
            catalog.innerHTML = Array(6).fill(0).map(() => `
                <div class="property-card" style="pointer-events: none;">
                    <div class="img-wrapper skeleton"></div>
                    <div class="card-info">
                        <div class="skeleton" style="height: 24px; width: 40%; border-radius: 4px;"></div>
                        <div class="skeleton" style="height: 18px; width: 80%; border-radius: 4px;"></div>
                        <div class="skeleton" style="height: 14px; width: 60%; border-radius: 4px;"></div>
                    </div>
                </div>
            `).join('');
        }

        async function loadProperties() {
            showSkeletons();
            const type = document.getElementById("filter-type").value;
            const op = document.getElementById("filter-operation").value;
            const prov = document.getElementById("filter-province").value;
            const price = document.getElementById("filter-price").value;

            let query = `/api/properties?`;
            if (type) query += `&type=${type}`;
            if (op) query += `&operation=${op}`;
            if (prov) query += `&province=${prov}`;
            if (price) query += `&maxPrice=${price}`;

            try {
                const response = await fetch(query);
                propertiesData = await response.json();
                renderCatalog();
                syncMapMarkers();
            } catch (err) {
                document.getElementById("catalog").innerHTML = `<p style="padding: 24px; text-align: center; color: var(--text-secondary);">Error al conectar con NEXO.</p>`;
            }
        }

        function renderCatalog() {
            const catalog = document.getElementById("catalog");
            if (propertiesData.length === 0) {
                catalog.innerHTML = `<p style="grid-column: 1/-1; padding: 48px; text-align: center; color: var(--text-secondary);">No hay inmuebles disponibles con estos filtros.</p>`;
                return;
            }

            catalog.innerHTML = propertiesData.map(p => {
                const mainImg = p.images[0] || "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=800&q=80";
                return `
                    <a href="/property.html?id=${p.id}" class="property-card">
                        <div class="img-wrapper">
                            <span class="badge-op">${p.operation}</span>
                            <img src="${mainImg}" alt="${p.title}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=800&q=80'">
                        </div>
                        <div class="card-info">
                            <div class="price">$${parseFloat(p.price).toLocaleString()} USD</div>
                            <div class="title">${p.title}</div>
                            <div class="loc">${p.neighborhood}, ${p.city}</div>
                            <div class="specs">
                                <span>🛏️ ${p.bedrooms}</span>
                                <span>🛁 ${p.bathrooms}</span>
                                <span>📐 ${p.area} m²</span>
                            </div>
                        </div>
                    </a>
                `;
            }).join('');
        }

        function initMap() {
            if (map) return;
            map = L.map('map-view').setView([23.1136, -82.3666], 12);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
            markersGroup = L.layerGroup().addTo(map);
        }

        function syncMapMarkers() {
            if (!map) return;
            markersGroup.clearLayers();
            const validCoords = [];

            propertiesData.forEach(p => {
                if (p.latitude && p.longitude) {
                    const marker = L.marker([p.latitude, p.longitude]);
                    const mainImg = p.images[0] || "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=800&q=80";
                    marker.bindPopup(`
                        <div style="width: 150px; font-family:-apple-system, sans-serif;">
                            <img src="${mainImg}" style="width:100%; height:80px; object-fit:cover; border-radius:8px;">
                            <strong style="display:block; margin-top:6px;">$${parseFloat(p.price).toLocaleString()} USD</strong>
                            <span style="font-size:12px; color:#666;">${p.title}</span>
                            <a href="/property.html?id=${p.id}" style="display:block; font-size:12px; color:var(--accent); margin-top:4px; text-decoration:none;">Ver Detalles</a>
                        </div>
                    `);
                    markersGroup.addLayer(marker);
                    validCoords.push([p.latitude, p.longitude]);
                }
            });

            if (validCoords.length > 0) {
                map.fitBounds(validCoords, { padding: [30, 30] });
            }
        }

        // Controladores de Vista
        document.getElementById("btn-grid").addEventListener("click", () => {
            document.getElementById("btn-grid").classList.add("active");
            document.getElementById("btn-map").classList.remove("active");
            document.getElementById("catalog").style.display = "grid";
            document.getElementById("map-view").style.display = "none";
        });

        document.getElementById("btn-map").addEventListener("click", () => {
            document.getElementById("btn-map").classList.add("active");
            document.getElementById("btn-grid").classList.remove("active");
            document.getElementById("catalog").style.display = "none";
            document.getElementById("map-view").style.display = "block";
            initMap();
            setTimeout(() => { map.invalidateSize(); }, 200);
        });

        // Eventos de Filtro
        document.querySelectorAll(".filters-container select, .filters-container input").forEach(el => {
            el.addEventListener("change", loadProperties);
        });

        // Control del Cajón de Chat
        function toggleChat(show) {
            document.getElementById("chat-drawer").classList.toggle("open", show);
        }

        function handleChatKey(e) {
            if (e.key === "Enter") sendChatMessage();
        }

        async function sendChatMessage() {
            const input = document.getElementById("chat-input");
            const messageText = input.value.trim();
            if (!messageText) return;

            input.value = "";
            const messagesContainer = document.getElementById("chat-messages");

            // Añadir mensaje del usuario
            const userMsg = document.createElement("div");
            userMsg.className = "msg user";
            userMsg.textContent = messageText;
            messagesContainer.appendChild(userMsg);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // Añadir indicador de escritura
            const typingMsg = document.createElement("div");
            typingMsg.className = "msg bot skeleton";
            typingMsg.style.width = "60px";
            typingMsg.style.height = "32px";
            messagesContainer.appendChild(typingMsg);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: messageText })
                });
                const data = await response.json();
                messagesContainer.removeChild(typingMsg);

                const botMsg = document.createElement("div");
                botMsg.className = "msg bot";
                
                // Expresión regular para capturar e interactuar con códigos de propiedades estructurados [N-XXX]
                let formattedResponse = data.response.replace(/\\n/g, "<br>");
                formattedResponse = formattedResponse.replace(/\[(N-\d{3})\]/g, (match, id) => {
                    return `<br><a href="/property.html?id=${id}" class="chat-property-link">Explorar Propiedad ${id} ↗</a>`;
                });

                botMsg.innerHTML = formattedResponse;
                messagesContainer.appendChild(botMsg);
            } catch (err) {
                messagesContainer.removeChild(typingMsg);
                const botMsg = document.createElement("div");
                botMsg.className = "msg bot";
                botMsg.textContent = "Lo siento, tuve un problema al conectarme con el servicio. ¿Podrías volver a intentarlo?";
                messagesContainer.appendChild(botMsg);
            }
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        window.onload = loadProperties;
    </script>
</body>
</html>
