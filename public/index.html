<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NEXO — Propiedades Exclusivas en Cuba</title>
    <link rel="stylesheet" href="/variables.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#faf9f7">
    <!-- Monitoreo: errores del cliente (Sentry lite) + Web Analytics (Cloudflare) -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": ""}' onerror="console.warn('CF analytics bloqueado')"></script>
    <script>
        // Cliente Sentry mínimo: captura errores no controlados del navegador
        window.__SENTRY_DSN = "";
        window.addEventListener("error", function (event) {
            const dsn = window.__SENTRY_DSN;
            if (!dsn) return;
            const m = dsn.match(/^(https?):\/\/([^@]+)@([^/]+)\/(\d+)$/);
            if (!m) return;
            const payload = {
                message: event.message,
                level: "error",
                platform: "javascript",
                tags: { url: event.filename || location.href },
                timestamp: Date.now() / 1000
            };
            fetch(`${m[1]}://${m[3]}/api/${m[4]}/store/`, {
                method: "POST",
                headers: { "Content-Type": "application/json", Authorization: `Bearer ${m[2]}` },
                body: JSON.stringify(payload)
            }).catch(function () {});
        }, true);
    </script>
    <!-- CSS de Leaflet para el Mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
/* Tokens: variables.css (sistema de diseño NEXO) */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-ink);
            overflow-x: hidden;
            padding-bottom: calc(80px + var(--safe-bottom));
        }

        /* Shimmer premium para skeleton loaders */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, var(--color-bg) 25%, var(--color-surface) 50%, var(--color-bg) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite ease-in-out;
        }

        /* Overlay de estados (offline/error) */
        .state-overlay {
            position: fixed;
            inset: 0;
            background: var(--color-bg);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 24px;
            text-align: center;
        }
        .state-overlay[hidden] { display: none; }
        .state-overlay .icon { font-size: 48px; }
        .state-overlay h2 { font-size: 20px; font-weight: 700; }
        .state-overlay p { font-size: 15px; color: var(--color-ink-muted); max-width: 320px; }
        .state-overlay .btn-retry {
            background: var(--color-accent);
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 22px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Cabecera Premium Translúcida */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--color-border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--color-ink);
            text-decoration: none;
        }

        .logo span {
            color: var(--color-accent);
        }

        /* Panel de Filtros Moderno */
        .filters-container {
            padding: 16px 24px;
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-behavior: smooth;
        }

        .filters-container::-webkit-scrollbar {
            display: none;
        }

        select, input {
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            font-size: 14px;
            outline: none;
            color: var(--color-ink);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        select:focus, input:focus {
            border-color: var(--color-accent);
            background: var(--color-surface);
        }

        /* Contenedores de Visualización */
        .view-toggle {
            padding: 12px 24px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn-toggle {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-toggle.active {
            background: var(--color-ink);
            color: white;
            border-color: var(--color-ink);
        }

        /* Grid de Inmuebles */
        .catalog {
            padding: 0 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .property-card {
            background: var(--color-surface);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.02);
            border: 1px solid var(--color-border);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .property-card:hover {
            transform: translateY(-4px);
        }

        .img-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #e5e5ea;
            overflow: hidden;
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .badge-op {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(255, 255, 255, 0.9);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .price {
            font-size: 22px;
            font-weight: 700;
            color: var(--color-ink);
        }

        .title {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .loc {
            font-size: 13px;
            color: var(--color-ink-muted);
        }

        .specs {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: var(--color-ink-muted);
            border-top: 1px solid var(--color-border);
            padding-top: 12px;
            margin-top: 4px;
        }

        /* Mapa de Catálogo */
        #map-view {
            width: 100%;
            height: 60vh;
            border-bottom: 1px solid var(--color-border);
            display: none;
        }

        /* Drawer Flotante de NEXO IA */
        .chat-drawer {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            background: var(--color-surface);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1000;
            height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .chat-drawer.open {
            transform: translateY(0);
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-title {
            font-weight: 600;
            font-size: 17px;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
        }

        .msg.user {
            background: var(--color-accent);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .msg.bot {
            background: var(--color-bg);
            color: var(--color-ink);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .chat-property-link {
            display: inline-block;
            margin-top: 6px;
            padding: 6px 12px;
            background: var(--color-accent);
            color: white !important;
            text-decoration: none;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .chat-input-area {
            padding: 16px 24px calc(16px + var(--safe-bottom));
            border-top: 1px solid var(--color-border);
            display: flex;
            gap: 12px;
        }

        .chat-input-area input {
            flex: 1;
        }

        .btn-send {
            background: var(--color-accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Utilidad accesible: visible solo para lectores de pantalla */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Botón de Activación de IA */
        .ai-fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--color-ink);
            color: white;
            padding: 14px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 99;
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">NE<span>X</span>O</a>
        <a href="/admin.html" style="font-size: 14px; color: var(--color-ink-muted); text-decoration: none;">Gestión</a>
    </header>

    <!-- Filtros de Inmuebles -->
    <div class="filters-container" role="search" aria-label="Filtros de propiedades">
        <label class="sr-only" for="filter-type">Tipo de inmueble</label>
        <select id="filter-type" aria-label="Tipo de inmueble">
            <option value="">Tipo</option>
            <option value="casa">Casa</option>
            <option value="apartamento">Apartamento</option>
            <option value="terreno">Terreno</option>
            <option value="penthouse">Penthouse</option>
        </select>
        <label class="sr-only" for="filter-operation">Tipo de operación</label>
        <select id="filter-operation" aria-label="Tipo de operación">
            <option value="">Operación</option>
            <option value="venta">Venta</option>
            <option value="alquiler">Alquiler</option>
        </select>
        <label class="sr-only" for="filter-province">Provincia</label>
        <select id="filter-province" aria-label="Provincia">
            <option value="">Provincia</option>
            <option value="La Habana">La Habana</option>
            <option value="Matanzas">Matanzas</option>
            <option value="Cienfuegos">Cienfuegos</option>
        </select>
        <label class="sr-only" for="filter-price">Precio máximo en USD</label>
        <input type="number" id="filter-price" placeholder="Precio Máximo (USD)" aria-label="Precio máximo en USD" inputmode="numeric">
    </div>

    <div class="view-toggle" role="group" aria-label="Cambiar vista del catálogo">
        <button class="btn-toggle active" id="btn-grid" aria-pressed="true">Cuadrícula</button>
        <button class="btn-toggle" id="btn-map" aria-pressed="false">Mapa</button>
    </div>

    <!-- Mapa Interactivo -->
    <div id="map-view"></div>

    <!-- Catálogo de Propiedades -->
    <main class="catalog" id="catalog">
        <!-- Inyección dinámica de skeletons -->
    </main>

    <!-- Botón Flotante para Lanzar Chatbot -->
    <div class="ai-fab" id="ai-fab" role="button" tabindex="0" aria-expanded="false" aria-controls="chat-drawer" onclick="toggleChat(true)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleChat(true)}">
        <span>✨</span> NEXO IA
    </div>

    <!-- Overlay de estados red (offline / error crítico) -->
    <div class="state-overlay" id="state-overlay" hidden role="alert" aria-live="assertive"></div>

    <!-- Chat de NEXO IA -->
    <div class="chat-drawer" id="chat-drawer" role="dialog" aria-label="Asistente NEXO IA" aria-hidden="true">
        <div class="chat-header">
            <div class="chat-title">✨ NEXO IA — Asistente Inteligente</div>
            <button class="btn-close" onclick="toggleChat(false)">×</button>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="msg bot">¡Hola! Soy tu asistente de NEXO. ¿Buscas comprar o alquilar en alguna zona específica de Cuba? Cuéntame qué necesitas.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Ej. Casa en Vedado con 3 habs..." onkeypress="handleChatKey(event)">
            <button class="btn-send" onclick="sendChatMessage()">Enviar</button>
        </div>
    </div>

    <!-- Scripts CDN Leaflet -->
    <script>
        let propertiesData = [];
        let leafletPromise = null;

        // srcset responsive: variantes webp almacenadas junto al JPG en R2 (-w400/-w800/-w1200)
        function responsiveSrcSet(url) {
            const m = url && url.match(/^(\/media\/.+)\.(jpe?g|png)$/i);
            if (!m) return "";
            return `${m[1]}-w400.webp 400w, ${m[1]}-w800.webp 800w, ${m[1]}-w1200.webp 1200w`;
        }

        // Carga perezosa de Leaflet solo si el usuario abre el mapa (ahorra ~40KB en 3G)
        function loadLeafletOnce() {
            if (leafletPromise) return leafletPromise;
            leafletPromise = new Promise((resolve, reject) => {
                const script = document.createElement("script");
                script.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
            return leafletPromise;
        }

        window.addEventListener("offline", () => {
            showOverlay("Sin conexión", "NEXO necesita internet. Revisa tu conexión y reintenta.");
        });
        window.addEventListener("online", () => {
            hideOverlay();
            loadProperties();
        });
        let map = null;
        let markersGroup = null;

        function showSkeletons() {
            const catalog = document.getElementById("catalog");
            catalog.innerHTML = Array(6).fill(0).map(() => `
                <div class="property-card" style="pointer-events: none;">
                    <div class="img-wrapper skeleton"></div>
                    <div class="card-info">
                        <div class="skeleton" style="height: 24px; width: 40%; border-radius: 4px;"></div>
                        <div class="skeleton" style="height: 18px; width: 80%; border-radius: 4px;"></div>
                        <div class="skeleton" style="height: 14px; width: 60%; border-radius: 4px;"></div>
                    </div>
                </div>
            `).join('');
        }

        function buildQuery() {
            const type = document.getElementById("filter-type").value;
            const op = document.getElementById("filter-operation").value;
            const prov = document.getElementById("filter-province").value;
            const price = document.getElementById("filter-price").value;
            let query = `/api/properties?`;
            if (type) query += `&type=${type}`;
            if (op) query += `&operation=${op}`;
            if (prov) query += `&province=${prov}`;
            if (price) query += `&maxPrice=${price}`;
            return query;
        }

        async function fetchWithTimeout(url, ms, options = {}) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), ms);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(timeoutId);
                return response;
            } catch (err) {
                clearTimeout(timeoutId);
                throw err;
            }
        }

        function showOverlay(message, submessage, withRetry = true) {
            const overlay = document.getElementById("state-overlay");
            if (!overlay) return;
            overlay.innerHTML = `
                <div class="icon" aria-hidden="true">🌐</div>
                <h2>${message}</h2>
                <p>${submessage}</p>
                ${withRetry ? '<button class="btn-retry" onclick="loadProperties()">Reintentar</button>' : ''}
            `;
            overlay.hidden = false;
        }

        function hideOverlay() {
            const overlay = document.getElementById("state-overlay");
            if (overlay) overlay.hidden = true;
        }

        async function loadProperties() {
            if (!navigator.onLine) {
                showOverlay("Sin conexión", "NEXO necesita internet. Revisa tu conexión y reintenta.");
                return;
            }
            hideOverlay();
            showSkeletons();

            const query = buildQuery();
            const retries = [10000, 15000, 25000]; // 3G-safe sequences

            for (let attempt = 0; attempt < retries.length; attempt++) {
                try {
                    const response = await fetchWithTimeout(query, retries[attempt]);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    propertiesData = await response.json();
                    renderCatalog();
                    syncMapMarkers();
                    return;
                } catch (err) {
                    if (attempt === retries.length - 1) {
                        document.getElementById("catalog").innerHTML = `
                            <div class="state-inline" style="grid-column:1/-1;text-align:center;padding:48px 24px;">
                                <p style="color:var(--color-ink-muted);margin-bottom:12px;">No se pudo cargar el catálogo. Tu conexión parece lenta.</p>
                                <button class="btn-retry" style="background:var(--color-accent);color:#fff;border:none;padding:12px 24px;border-radius:20px;font-weight:600;cursor:pointer;" onclick="loadProperties()">Reintentar</button>
                            </div>
                        `;
                    }
                }
            }
        }

        function renderCatalog() {
            const catalog = document.getElementById("catalog");
            if (propertiesData.length === 0) {
                catalog.innerHTML = `<p style="grid-column: 1/-1; padding: 48px; text-align: center; color: var(--color-ink-muted);">No hay inmuebles disponibles con estos filtros.</p>`;
                return;
            }

            catalog.innerHTML = propertiesData.map(p => {
                const mainImg = p.images[0] || "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=800&q=80";
                return `
                    <a href="/property.html?id=${p.id}" class="property-card">
                        <div class="img-wrapper">
                            <span class="badge-op">${p.operation}</span>
                            <img src="${mainImg}" srcset="${responsiveSrcSet(mainImg)}" sizes="(max-width: 600px) 100vw, 300px" alt="${p.title}" loading="lazy" decoding="async" fetchpriority="low" onerror="this.src='https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=800&q=80'">
                        </div>
                        <div class="card-info">
                            <div class="price">$${parseFloat(p.price).toLocaleString()} USD</div>
                            <div class="title">${p.title}</div>
                            <div class="loc">${p.neighborhood}, ${p.city}</div>
                            <div class="specs">
                                <span><span aria-hidden="true">🛏️</span> <span class="sr-only">Habitaciones: </span>${p.bedrooms}</span>
                                <span><span aria-hidden="true">🛁</span> <span class="sr-only">Baños: </span>${p.bathrooms}</span>
                                <span><span aria-hidden="true">📐</span> <span class="sr-only">Área: </span>${p.area} m²</span>
                            </div>
                        </div>
                    </a>
                `;
            }).join('');
        }

        function initMap() {
            if (map) return;
            map = L.map('map-view').setView([23.1136, -82.3666], 12);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
            markersGroup = L.layerGroup().addTo(map);
        }

        function syncMapMarkers() {
            if (!map) return;
            markersGroup.clearLayers();
            const validCoords = [];

            propertiesData.forEach(p => {
                if (p.latitude && p.longitude) {
                    const marker = L.marker([p.latitude, p.longitude]);
                    const mainImg = p.images[0] || "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=800&q=80";
                    marker.bindPopup(`
                        <div style="width: 150px; font-family:-apple-system, sans-serif;">
                            <img src="${mainImg}" style="width:100%; height:80px; object-fit:cover; border-radius:8px;">
                            <strong style="display:block; margin-top:6px;">$${parseFloat(p.price).toLocaleString()} USD</strong>
                            <span style="font-size:12px; color:#666;">${p.title}</span>
                            <a href="/property.html?id=${p.id}" style="display:block; font-size:12px; color:var(--color-accent); margin-top:4px; text-decoration:none;">Ver Detalles</a>
                        </div>
                    `);
                    markersGroup.addLayer(marker);
                    validCoords.push([p.latitude, p.longitude]);
                }
            });

            if (validCoords.length > 0) {
                map.fitBounds(validCoords, { padding: [30, 30] });
            }
        }

        // Controladores de Vista
        document.getElementById("btn-grid").addEventListener("click", () => {
            document.getElementById("btn-grid").classList.add("active");
            document.getElementById("btn-grid").setAttribute("aria-pressed", "true");
            document.getElementById("btn-map").classList.remove("active");
            document.getElementById("btn-map").setAttribute("aria-pressed", "false");
            document.getElementById("catalog").style.display = "grid";
            document.getElementById("map-view").style.display = "none";
        });

        document.getElementById("btn-map").addEventListener("click", () => {
            document.getElementById("btn-map").classList.add("active");
            document.getElementById("btn-map").setAttribute("aria-pressed", "true");
            document.getElementById("btn-grid").classList.remove("active");
            document.getElementById("btn-grid").setAttribute("aria-pressed", "false");
            document.getElementById("catalog").style.display = "none";
            document.getElementById("map-view").style.display = "block";
            loadLeafletOnce().then(() => {
                initMap();
                syncMapMarkers();
                map.invalidateSize();
            });
        });

        // Eventos de Filtro — debounce de 400ms para reducir requests en 3G
        let filterDebounceTimer = null;
        document.querySelectorAll(".filters-container select, .filters-container input").forEach(el => {
            el.addEventListener("change", () => {
                clearTimeout(filterDebounceTimer);
                filterDebounceTimer = setTimeout(loadProperties, 400);
            });
            if (el.tagName === "INPUT") {
                el.addEventListener("input", () => {
                    clearTimeout(filterDebounceTimer);
                    filterDebounceTimer = setTimeout(loadProperties, 600);
                });
            }
        });

        // Control del Cajón de Chat
        function toggleChat(show) {
            const drawer = document.getElementById("chat-drawer");
            drawer.classList.toggle("open", show);
            document.getElementById("ai-fab").setAttribute("aria-expanded", String(show));
            drawer.setAttribute("aria-hidden", String(!show));
            if (show) document.getElementById("chat-input").focus();
        }

        function handleChatKey(e) {
            if (e.key === "Enter") sendChatMessage();
        }

        async function sendChatMessage() {
            const input = document.getElementById("chat-input");
            const messageText = input.value.trim();
            if (!messageText) return;

            input.value = "";
            const messagesContainer = document.getElementById("chat-messages");

            // Añadir mensaje del usuario
            const userMsg = document.createElement("div");
            userMsg.className = "msg user";
            userMsg.textContent = messageText;
            messagesContainer.appendChild(userMsg);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // Añadir indicador de escritura
            const typingMsg = document.createElement("div");
            typingMsg.className = "msg bot skeleton";
            typingMsg.style.width = "60px";
            typingMsg.style.height = "32px";
            messagesContainer.appendChild(typingMsg);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: messageText })
                });
                const data = await response.json();
                messagesContainer.removeChild(typingMsg);

                const botMsg = document.createElement("div");
                botMsg.className = "msg bot";
                
                // Expresión regular para capturar e interactuar con códigos de propiedades estructurados [N-XXX]
                let formattedResponse = data.response.replace(/\\n/g, "<br>");
                formattedResponse = formattedResponse.replace(/\[(N-\d{3})\]/g, (match, id) => {
                    return `<br><a href="/property.html?id=${id}" class="chat-property-link">Explorar Propiedad ${id} ↗</a>`;
                });

                botMsg.innerHTML = formattedResponse;
                messagesContainer.appendChild(botMsg);
            } catch (err) {
                messagesContainer.removeChild(typingMsg);
                const botMsg = document.createElement("div");
                botMsg.className = "msg bot";
                botMsg.textContent = "Lo siento, tuve un problema al conectarme con el servicio. ¿Podrías volver a intentarlo?";
                messagesContainer.appendChild(botMsg);
            }
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        window.onload = loadProperties;
    </script>
<script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js").catch(() => {});
        }
    </script>
</body>
</html>
