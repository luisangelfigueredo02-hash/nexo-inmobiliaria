/// public/index.html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NEXO — Propiedades Premium en Cuba</title>
    <link rel="stylesheet" href="/variables.css">
    <link rel="manifest" href="/manifest.json">
    <style>
        /* Estructura Base */
        body { padding-bottom: calc(90px + var(--safe-bottom-mobile)); background: var(--bg-secondary); }

        /* Cabecera Premium */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0 var(--space-4);
            height: var(--header-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
        }
        .logo { font-size: var(--text-lg); font-weight: var(--weight-bold); letter-spacing: -0.03em; display: flex; align-items: center; gap: 8px;}
        .logo span { color: var(--interactive-blue); }
        .admin-link { font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--text-secondary); }

        /* Filtros Scrollables Premium (WCAG > 44px) */
        .filters-container {
            padding: var(--space-3) var(--space-4);
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-default);
            display: flex;
            gap: var(--space-2);
            overflow-x: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .filters-container::-webkit-scrollbar { display: none; }
        .filter-select, .filter-input {
            height: 44px; /* Touch target */
            padding: 0 var(--space-4);
            border-radius: var(--radius-round);
            border: 1px solid var(--border-default);
            background: var(--bg-primary);
            font-size: var(--text-sm);
            font-weight: var(--weight-medium);
            color: var(--text-primary);
            white-space: nowrap;
            transition: var(--transition-fast);
            box-shadow: var(--shadow-sm);
            appearance: none; /* Eliminar flechas por defecto */
        }
        .filter-select:focus, .filter-input:focus { border-color: var(--interactive-blue); box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15); }

        /* Vistas y Controles */
        .view-controls { display: flex; justify-content: flex-end; padding: var(--space-3) var(--space-4); gap: var(--space-2); }
        .btn-view {
            height: 36px; padding: 0 var(--space-4); border-radius: var(--radius-round);
            font-size: var(--text-xs); font-weight: var(--weight-semibold);
            background: var(--bg-primary); border: 1px solid var(--border-default);
            transition: var(--transition-fast); color: var(--text-secondary);
        }
        .btn-view.active { background: var(--accent); color: var(--text-on-accent); border-color: var(--accent); }

        /* Grid de Inmuebles (Cards Nivel Apple) */
        .catalog {
            padding: 0 var(--space-4);
            max-width: var(--max-width-content);
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--space-5);
        }

        .property-card {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: var(--transition-normal);
            box-shadow: var(--shadow-sm);
            position: relative;
        }
        .property-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
        
        .card-img-wrapper {
            position: relative; width: 100%; aspect-ratio: 4/3; overflow: hidden; background: var(--bg-tertiary);
        }
        .card-img-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s var(--ease-apple); }
        .property-card:hover .card-img-wrapper img { transform: scale(1.05); }

        /* Badges Flotantes Premium */
        .badge-status {
            position: absolute; top: 12px; left: 12px;
            background: var(--bg-overlay); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 6px 12px; border-radius: var(--radius-round);
            font-size: 11px; font-weight: var(--weight-bold); letter-spacing: 0.05em; text-transform: uppercase;
            box-shadow: var(--shadow-sm); z-index: 2; color: var(--text-primary);
        }
        .badge-verified {
            position: absolute; bottom: 12px; right: 12px;
            background: var(--success); color: white;
            width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(52, 199, 89, 0.4); z-index: 2;
        }

        .card-content { padding: var(--space-4); display: flex; flex-direction: column; gap: 6px; }
        .card-price { font-size: var(--text-xl); font-weight: var(--weight-bold); color: var(--text-primary); letter-spacing: -0.02em; }
        .card-title { font-size: var(--text-base); font-weight: var(--weight-semibold); color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-location { font-size: var(--text-sm); color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
        
        .card-features {
            display: flex; gap: var(--space-3); margin-top: var(--space-2);
            padding-top: var(--space-3); border-top: 1px solid var(--border-subtle);
            font-size: var(--text-xs); color: var(--text-secondary); font-weight: var(--weight-medium);
        }
        .card-features span { display: flex; align-items: center; gap: 4px; }

        /* Fab NEXO IA Premium */
        .ai-fab {
            position: fixed; bottom: calc(24px + var(--safe-bottom-mobile)); right: var(--space-4);
            height: 56px; padding: 0 var(--space-4); border-radius: var(--radius-round);
            background: var(--text-primary); color: var(--bg-primary);
            box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 8px;
            font-weight: var(--weight-semibold); font-size: var(--text-sm);
            cursor: pointer; z-index: 99; transition: var(--transition-normal);
        }
        .ai-fab:hover { transform: scale(1.05); }

        /* Chat Drawer */
        .chat-drawer {
            position: fixed; bottom: 0; left: 0; right: 0; height: 85vh;
            background: var(--bg-primary); border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1); transform: translateY(100%);
            transition: var(--transition-normal); z-index: 1000; display: flex; flex-direction: column;
            will-change: transform;
        }
        .chat-drawer.open { transform: translateY(0); }
        .chat-header { padding: var(--space-4); border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; font-weight: var(--weight-semibold); }
        .btn-close { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .chat-body { flex: 1; padding: var(--space-4); overflow-y: auto; display: flex; flex-direction: column; gap: var(--space-3); }
        .msg { max-width: 85%; padding: var(--space-3); border-radius: var(--radius-lg); font-size: var(--text-sm); line-height: var(--line-height-normal); }
        .msg.user { background: var(--interactive-blue); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.ai { background: var(--bg-tertiary); color: var(--text-primary); align-self: flex-start; border-bottom-left-radius: 4px; }
        .chat-input-wrapper { padding: var(--space-3) var(--space-4) calc(var(--space-3) + var(--safe-bottom-mobile)); border-top: 1px solid var(--border-subtle); display: flex; gap: var(--space-2); }
        .chat-input-wrapper input { flex: 1; height: 44px; padding: 0 var(--space-3); border-radius: var(--radius-round); background: var(--bg-tertiary); }
        .chat-input-wrapper button { width: 44px; height: 44px; border-radius: 50%; background: var(--text-primary); color: white; display: flex; align-items: center; justify-content: center; }

        /* Contenedor del Mapa diferido */
        #map-view { width: 100%; height: 60vh; border-radius: var(--radius-lg); display: none; margin: 0 auto; max-width: var(--max-width-content); box-shadow: var(--shadow-md); }
    </style>
</head>
<body>

    <!-- Header Glass -->
    <header class="glass-effect">
        <a href="/" class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L2 12h3v8h14v-8h3L12 3zm0 13.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            NE<span>X</span>O
        </a>
        <a href="/admin.html" class="admin-link">Gestión</a>
    </header>

    <!-- Filtros de Contexto (Scroll Horizontal Rápido) -->
    <div class="filters-container">
        <select id="filter-type" class="filter-select" aria-label="Tipo de propiedad">
            <option value="">Cualquier tipo</option>
            <option value="casa">Casa</option>
            <option value="apartamento">Apartamento</option>
            <option value="penthouse">Penthouse</option>
            <option value="terreno">Terreno</option>
        </select>
        <select id="filter-operation" class="filter-select" aria-label="Operación">
            <option value="">Comprar o Alquilar</option>
            <option value="venta">Comprar</option>
            <option value="alquiler">Alquilar</option>
        </select>
        <select id="filter-province" class="filter-select" aria-label="Ubicación">
            <option value="">Toda Cuba</option>
            <option value="La Habana">La Habana</option>
            <option value="Matanzas">Matanzas</option>
        </select>
        <input type="number" id="filter-price" class="filter-input" placeholder="Precio máx. (USD)" aria-label="Precio máximo">
    </div>

    <div class="view-controls">
        <button class="btn-view active" id="btn-grid">Catálogo</button>
        <button class="btn-view" id="btn-map">Ver en Mapa</button>
    </div>

    <!-- Contenedor Mapa -->
    <div id="map-view"></div>

    <!-- Catálogo de Propiedades -->
    <main class="catalog" id="catalog">
        <!-- Inyección Skeletons por defecto -->
    </main>

    <!-- FAB de IA -->
    <div class="ai-fab" onclick="toggleChat(true)" role="button" tabindex="0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 4.9L19.3 7.6l-3.6 3.5.9 5.3-4.6-2.4-4.6 2.4.9-5.3-3.6-3.5 4.9-.7L12 2z"/></svg>
        Preguntar a NEXO IA
    </div>

    <!-- Modal Drawer Chat -->
    <div class="chat-drawer" id="chat-drawer" role="dialog" aria-modal="true" aria-label="Asistente Virtual IA">
        <div class="chat-header">
            <span>✨ Asistente NEXO IA</span>
            <button class="btn-close" onclick="toggleChat(false)" aria-label="Cerrar chat">✕</button>
        </div>
        <div class="chat-body" id="chat-messages">
            <div class="msg ai">Hola, soy el asistente inteligente de NEXO. Dime qué tipo de hogar buscas, tu presupuesto o tus preferencias en Cuba y buscaré opciones reales en segundos.</div>
        </div>
        <form class="chat-input-wrapper" onsubmit="event.preventDefault(); sendChatMessage();">
            <input type="text" id="chat-input" placeholder="Ej: Apartamento en Vedado..." autocomplete="off">
            <button type="submit" aria-label="Enviar mensaje">↑</button>
        </form>
    </div>

    <script>
        // Lógica de carga robusta
        let propertiesData = [];
        let map = null;

        // Lazy load Leaflet
        function loadLeaflet() {
            return new Promise((resolve) => {
                if (window.L) return resolve();
                const link = document.createElement('link');
                link.rel = 'stylesheet'; link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
                document.head.appendChild(link);
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
                script.onload = resolve;
                document.body.appendChild(script);
            });
        }

        function showSkeletons() {
            const catalog = document.getElementById("catalog");
            catalog.innerHTML = Array(6).fill(0).map(() => `
                <div class="property-card" style="pointer-events: none; border:none; box-shadow:none;">
                    <div class="card-img-wrapper skeleton"></div>
                    <div class="card-content">
                        <div class="skeleton" style="height:24px; width:40%; border-radius:4px;"></div>
                        <div class="skeleton" style="height:20px; width:80%; border-radius:4px;"></div>
                        <div class="skeleton" style="height:14px; width:60%; border-radius:4px;"></div>
                    </div>
                </div>
            `).join('');
        }

        async function loadProperties() {
            showSkeletons();
            
            const params = new URLSearchParams();
            ['type', 'operation', 'province'].forEach(id => {
                const val = document.getElementById(`filter-${id}`).value;
                if(val) params.append(id, val);
            });
            const price = document.getElementById('filter-price').value;
            if(price) params.append('maxPrice', price);

            try {
                const response = await fetch(`/api/properties?${params.toString()}`);
                propertiesData = await response.json();
                renderCatalog();
            } catch (err) {
                document.getElementById("catalog").innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 40px;">No se pudo conectar. Navegando en Modo Offline (Island Mode).</p>`;
            }
        }

        function renderCatalog() {
            const catalog = document.getElementById("catalog");
            if (propertiesData.length === 0) {
                catalog.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 40px;">No hay propiedades que coincidan con esta búsqueda.</p>`;
                return;
            }

            catalog.innerHTML = propertiesData.map(p => {
                const mainImg = (p.images && p.images[0]) ? p.images[0] : 'data:image/svg+xml;charset=UTF-8,%3Csvg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"%3E%3Crect width="100%25" height="100%25" fill="%23f5f5f7"/%3E%3C/svg%3E';
                // Lógica decorativa para la Insignia NEXO basada en campos completos
                const isVerified = (p.images && p.images.length >= 3 && p.description.length > 50) ? true : false;
                
                return `
                    <a href="/property.html?id=${p.id}" class="property-card">
                        <div class="card-img-wrapper">
                            <div class="badge-status">${p.operation}</div>
                            ${isVerified ? `<div class="badge-verified" title="Inmueble Verificado"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>` : ''}
                            <img src="${mainImg}" loading="lazy" alt="${p.title}">
                        </div>
                        <div class="card-content">
                            <div class="card-price">$${parseFloat(p.price).toLocaleString()} USD</div>
                            <h2 class="card-title">${p.title}</h2>
                            <div class="card-location">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                                ${p.neighborhood}, ${p.city}
                            </div>
                            <div class="card-features">
                                <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg> ${p.bedrooms} hab</span>
                                <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h20M7 12v10M17 12v10"></path></svg> ${p.bathrooms} ba</span>
                                <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"></path></svg> ${p.area} m²</span>
                            </div>
                        </div>
                    </a>
                `;
            }).join('');
        }

        // --- Vista Mapa Deferred ---
        document.getElementById("btn-map").addEventListener("click", async () => {
            document.getElementById("btn-map").classList.add("active");
            document.getElementById("btn-grid").classList.remove("active");
            document.getElementById("catalog").style.display = "none";
            
            const mapView = document.getElementById("map-view");
            mapView.style.display = "block";
