<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NEXO Inmobiliaria — Descubre tu próximo espacio</title>
    
    <!-- Enlace al sistema de diseño global -->
    <link rel="stylesheet" href="/variables.css">
    
    <!-- Estilos específicos de la página de inicio (Premium & Mobile-First) -->
    <style>
        /* Estructura general de la cabecera flotante */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--space-5);
            transition: var(--transition-normal);
        }

        .logo {
            font-size: var(--text-lg);
            font-weight: var(--weight-bold);
            color: var(--text-primary);
            letter-spacing: -0.03em;
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .logo svg {
            width: 24px;
            height: 24px;
            fill: var(--text-primary);
        }

        /* Menú de navegación principal */
        nav {
            display: flex;
            align-items: center;
            gap: var(--space-5);
        }

        nav a {
            font-size: var(--text-sm);
            font-weight: var(--weight-medium);
            color: var(--text-secondary);
            padding: var(--space-2) var(--space-3);
            border-radius: var(--radius-sm);
        }

        nav a:hover, nav a.active {
            color: var(--text-primary);
            background-color: var(--bg-secondary);
        }

        /* Hero Section minimalista */
        .hero {
            padding: calc(var(--header-height) + var(--space-7)) var(--space-5) var(--space-6);
            background-color: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: var(--space-4);
        }

        .hero h1 {
            font-size: clamp(var(--text-xl), 5vw, var(--text-display));
            font-weight: var(--weight-bold);
            color: var(--text-primary);
            line-height: var(--line-height-tight);
            letter-spacing: -0.04em;
            max-width: 800px;
        }

        .hero p {
            font-size: var(--text-base);
            color: var(--text-secondary);
            max-width: 500px;
            line-height: var(--line-height-normal);
        }

        /* Buscador integrado de alta precisión (Stripe-like) */
        .search-container {
            width: 100%;
            max-width: 840px;
            background-color: var(--bg-primary);
            padding: var(--space-3);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-subtle);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) auto;
            gap: var(--space-3);
            align-items: center;
        }

        .search-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 0 var(--space-3);
            border-right: 1px solid var(--border-subtle);
        }

        .search-group:last-of-type {
            border-right: none;
        }

        .search-group label {
            font-size: var(--text-xs);
            font-weight: var(--weight-semibold);
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: var(--space-1);
        }

        .search-group select, .search-group input {
            width: 100%;
            border: none;
            background: none;
            font-size: var(--text-sm);
            font-weight: var(--weight-medium);
            color: var(--text-primary);
            outline: none;
            cursor: pointer;
        }

        .search-btn {
            background-color: var(--accent);
            color: var(--text-on-accent);
            padding: var(--space-3) var(--space-5);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            font-weight: var(--weight-semibold);
            display: flex;
            align-items: center;
            gap: var(--space-2);
            transition: var(--transition-fast);
        }

        .search-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Sección del Catálogo */
        .catalog {
            max-width: var(--max-width-content);
            margin: 0 auto;
            padding: var(--space-6) var(--space-5) var(--space-8);
        }

        .catalog-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: var(--space-5);
        }

        .catalog-title h2 {
            font-size: var(--text-xl);
            font-weight: var(--weight-bold);
            letter-spacing: -0.03em;
        }

        .catalog-title p {
            font-size: var(--text-sm);
            color: var(--text-secondary);
        }

        /* Cuadrícula de Propiedades */
        .properties-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: var(--space-5);
        }

        /* Lanzador Flotante de NEXO IA */
        .ai-launcher {
            position: fixed;
            bottom: var(--space-5);
            right: var(--space-5);
            background-color: var(--accent);
            color: var(--text-on-accent);
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-round);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: var(--space-2);
            font-size: var(--text-sm);
            font-weight: var(--weight-semibold);
            z-index: 90;
            transition: var(--transition-normal);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ai-launcher:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .ai-launcher svg {
            width: 20px;
            height: 20px;
            fill: var(--text-on-accent);
            animation: pulse-ai 2s infinite ease-in-out;
        }

        @keyframes pulse-ai {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.8; }
        }

        /* Estado Vacío / Sin Resultados (Empty State Premium) */
        .empty-state {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-8) var(--space-5);
            text-align: center;
            background-color: var(--bg-tertiary);
            border-radius: var(--radius-xl);
            border: 1px dashed var(--border-default);
            gap: var(--space-4);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            fill: var(--text-tertiary);
        }

        .empty-state h3 {
            font-size: var(--text-lg);
            font-weight: var(--weight-bold);
            color: var(--text-primary);
        }

        .empty-state p {
            font-size: var(--text-sm);
            color: var(--text-secondary);
            max-width: 320px;
        }

        .empty-state button {
            background-color: var(--accent);
            color: var(--text-on-accent);
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            font-weight: var(--weight-semibold);
            transition: var(--transition-fast);
        }

        .empty-state button:hover {
            background-color: var(--accent-hover);
        }

        /* Adaptabilidad Móvil (Responsive CSS) */
        @media (max-width: 768px) {
            header {
                padding: 0 var(--space-4);
            }
            
            nav {
                display: none; /* Simplificación para menú móvil que se implementará */
            }

            .search-container {
                grid-template-columns: 1fr;
                gap: var(--space-2);
                border-radius: var(--radius-lg);
            }

            .search-group {
                border-right: none;
                border-bottom: 1px solid var(--border-subtle);
                padding: var(--space-2) 0;
            }

            .search-group:last-of-type {
                border-bottom: none;
            }

            .search-btn {
                width: 100%;
                justify-content: center;
                margin-top: var(--space-2);
            }

            .catalog-header {
                flex-direction: column;
                align-items: flex-start;
                gap: var(--space-2);
            }
        }
    </style>
</head>
<body>

    <!-- Cabecera de Navegación Premium con efecto glass -->
    <header class="glass-effect">
        <a href="/" class="logo">
            <!-- Icono Isotipo Minimalista -->
            <svg viewBox="0 0 24 24">
                <path d="M12 3L2 12h3v8h14v-8h3L12 3zm2 15h-4v-4h4v4z"/>
            </svg>
            NEXO
        </a>
        <nav>
            <a href="/" class="active">Propiedades</a>
            <a href="/mapa/index.html">Mapa</a>
            <a href="/comparar/index.html">Comparar</a>
            <a href="/ia/index.html">Chat IA</a>
            <a href="/admin.html" style="border: 1px solid var(--border-default);">Admin</a>
        </nav>
    </header>

    <!-- Hero y Sección del Buscador -->
    <section class="hero">
        <h1>Encuentra tu próximo espacio de vida.</h1>
        <p>Propiedades exclusivas combinadas con inteligencia artificial para una búsqueda precisa y sin esfuerzo.</p>
        
        <!-- Formulario de Búsqueda -->
        <form id="search-form" class="search-container" onsubmit="event.preventDefault(); executeSearch();">
            <div class="search-group">
                <label for="location-select">Ubicación</label>
                <input type="text" id="location-select" placeholder="Ciudad, zona o barrio" autocomplete="off">
            </div>
            <div class="search-group">
                <label for="type-select">Tipo</label>
                <select id="type-select">
                    <option value="">Todos los tipos</option>
                    <option value="casa">Casa</option>
                    <option value="departamento">Departamento</option>
                    <option value="terreno">Terreno</option>
                </select>
            </div>
            <div class="search-group">
                <label for="price-select">Precio Máximo</label>
                <select id="price-select">
                    <option value="">Cualquier precio</option>
                    <option value="50000">$50,000 USD</option>
                    <option value="100000">$100,000 USD</option>
                    <option value="200000">$200,000 USD</option>
                    <option value="500000">$500,000 USD</option>
                </select>
            </div>
            <button type="submit" class="search-btn">
                <svg viewBox="0 0 24 24" style="width:18px; height:18px; fill:currentColor;">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                Buscar
            </button>
        </form>
    </section>

    <!-- Contenido del Catálogo de Propiedades -->
    <main class="catalog">
        <div class="catalog-header">
            <div class="catalog-title">
                <h2>Explorar Propiedades</h2>
                <p id="properties-count">Cargando catálogo...</p>
            </div>
        </div>

        <!-- Rejilla donde se inyectan las propiedades dinámicamente -->
        <div id="properties-grid" class="properties-grid">
            <!-- Skeletons iniciales por defecto para evitar CLS -->
            <div class="property-card shimmer-effect" style="height: 380px;"></div>
            <div class="property-card shimmer-effect" style="height: 380px;"></div>
            <div class="property-card shimmer-effect" style="height: 380px;"></div>
        </div>
    </main>

    <!-- Lanzador de Inteligencia Artificial Flotante (NEXO IA) -->
    <a href="/ia/index.html" class="ai-launcher" aria-label="Preguntar a NEXO IA">
        <svg viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12c0 1.94.55 3.75 1.5 5.29L2 22l4.81-1.42C8.25 21.45 10.06 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/>
        </svg>
        NEXO IA
    </a>

    <!-- Lógica de Negocio y Renderizado con JS Puro (Vanilla Engine) -->
    <script>
        // Configuración unificada
        const API_ENDPOINT = '/api/properties';

        // Al iniciar la página, se cargan las propiedades
        document.addEventListener('DOMContentLoaded', () => {
            loadProperties();
        });

        // Función para consultar las propiedades al backend (Cloudflare D1)
        async function loadProperties(queryParams = '') {
            const grid = document.getElementById('properties-grid');
            const counter = document.getElementById('properties-count');

            // Renderizar 3 skeletons limpios antes del fetch
            grid.innerHTML = `
                <div class="property-card shimmer-effect" style="height: 380px; border-radius: var(--radius-lg);"></div>
                <div class="property-card shimmer-effect" style="height: 380px; border-radius: var(--radius-lg);"></div>
                <div class="property-card shimmer-effect" style="height: 380px; border-radius: var(--radius-lg);"></div>
            `;

            try {
                const response = await fetch(`${API_ENDPOINT}${queryParams}`);
                if (!response.ok) throw new Error('Error al conectar con la API de NEXO.');
                
                const properties = await response.json();
                renderProperties(properties, grid, counter);
            } catch (error) {
                console.error(error);
                renderErrorState(grid, counter);
            }
        }

        // Función para renderizar dinámicamente las propiedades en base a variables.css
        function renderProperties(properties, container, counterElement) {
            container.innerHTML = '';

            if (!properties || properties.length === 0) {
                counterElement.textContent = '0 propiedades disponibles';
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24">
                            <path d="M19 9.3V4h-3v2.6L12 3 2 12h3v8h5v-6h4v6h5v-8h3L19 9.3zM10 10c0-1.1.9-2 2-2s2 .9 2 2h-4z"/>
                        </svg>
                        <h3>No encontramos coincidencias</h3>
                        <p>Prueba ajustando tus parámetros de búsqueda o limpiando los filtros actuales.</p>
                        <button onclick="clearFilters()">Ver todas las propiedades</button>
                    </div>
                `;
                return;
            }

            counterElement.textContent = `${properties.length} propiedades encontradas`;

            properties.forEach(property => {
                const card = document.createElement('article');
                card.className = 'property-card';
                
                // Formateador de moneda integrado
                const formattedPrice = new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD',
                    maximumFractionDigits: 0
                }).format(property.price);

                // Determinar badge dinámico (venta/alquiler)
                const transactionType = property.type_transaction || 'Venta';

                // Renderizado semántico de la tarjeta de propiedades
                card.innerHTML = `
                    <div class="image-container">
                        <span class="badge">${transactionType}</span>
                        <button class="fav-button" aria-label="Añadir a favoritos" onclick="event.preventDefault(); toggleFavorite(${property.id});">
                            <svg viewBox="0 0 24 24" style="width:20px; height:20px; fill:currentColor;">
                                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                            </svg>
                        </button>
                        <img src="${property.image_url || 'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=600&q=80'}" alt="${property.title}" loading="lazy">
                    </div>
                    <div class="details-container">
                        <div class="price">${formattedPrice}</div>
                        <h3 class="title">${property.title}</h3>
                        <div class="location">
                            <svg viewBox="0 0 24 24" style="width:16px; height:16px; fill:currentColor; flex-shrink:0;">
                                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                            </svg>
                            ${property.location || 'Ubicación no especificada'}
                        </div>
                        <div class="features-grid">
                            <div class="feature-item" title="Habitaciones">
                                <svg viewBox="0 0 24 24" style="width:16px; height:16px; fill:currentColor;">
                                    <path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V5H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z"/>
                                </svg>
                                <span>${property.bedrooms || 0}</span> hab
                            </div>
                            <div class="feature-item" title="Baños">
                                <svg viewBox="0 0 24 24" style="width:16px; height:16px; fill:currentColor;">
                                    <path d="M21 11H3V9c0-1.1.9-2 2-2h14c1.1 0 2 .9 2 2v2zm-2 2v3h-2v-3h-2v3h-2v-3H9v3H7v-3H5v3H3v-5h18v5h-2z"/>
                                </svg>
                                <span>${property.bathrooms || 0}</span> bañ
                            </div>
                            <div class="feature-item" title="Superficie">
                                <svg viewBox="0 0 24 24" style="width:16px; height:16px; fill:currentColor;">
                                    <path d="M4 4h16v16H4V4zm2 2v12h12V6H6zm3 3h6v6H9V9z"/>
                                </svg>
                                <span>${property.area || 0}</span> m²
                            </div>
                        </div>
                    </div>
                `;

                // Hacer que toda la tarjeta sea clickeable hacia la ficha detallada
                card.style.cursor = 'pointer';
                card.addEventListener('click', (e) => {
                    if (e.target.closest('.fav-button')) return;
                    window.location.href = `/property.html?id=${property.id}`;
                });

                container.appendChild(card);
            });
        }

        // Manejar el flujo de búsqueda y filtros
        function executeSearch() {
            const location = document.getElementById('location-select').value.trim();
            const type = document.getElementById('type-select').value;
            const price = document.getElementById('price-select').value;

            let params = new URLSearchParams();
            if (location) params.append('location', location);
            if (type) params.append('type', type);
            if (price) params.append('maxPrice', price);

            const queryString = params.toString() ? `?${params.toString()}` : '';
            loadProperties(queryString);
        }

        // Limpiar filtros restableciendo el catálogo
        function clearFilters() {
            document.getElementById('search-form').reset();
            loadProperties();
        }

        // Renderizado ante fallos de conexión API
        function renderErrorState(container, counterElement) {
            counterElement.textContent = 'Error de conexión';
            container.innerHTML = `
                <div class="empty-state" style="border-color: var(--error);">
                    <svg viewBox="0 0 24 24" style="fill: var(--error);">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                    </svg>
                    <h3>Problema al conectar con NEXO</h3>
                    <p>No se pudo establecer conexión con el catálogo de propiedades. Por favor, reintenta en unos instantes.</p>
                    <button onclick="loadProperties()">Reintentar carga</button>
                </div>
            `;
        }

        // Guardado dinámico de favoritos (Local Storage con feedback interactivo)
        function toggleFavorite(id) {
            let favorites = JSON.parse(localStorage.getItem('nexo_favs')) || [];
            const index = favorites.indexOf(id);

            if (index === -1) {
                favorites.push(id);
                console.log(`Propiedad ${id} guardada en favoritos locales.`);
            } else {
                favorites.splice(index, 1);
                console.log(`Propiedad ${id} removida de favoritos.`);
            }

            localStorage.setItem('nexo_favs', JSON.stringify(favorites));
        }
    </script>
</body>
</html>
