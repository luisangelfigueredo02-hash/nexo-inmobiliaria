<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>
  NEXO · Detalle de propiedad
</title>

<meta
  name="description"
  content="Detalle de propiedad en NEXO. Fotos, precio, características y contacto."
>

<style>

:root{

  --bg:#fbfbfd;
  --panel:#fff;
  --ink:#1d1d1f;
  --muted:#86868b;
  --line:rgba(0,0,0,.08);

  --brand:#0071e3;
  --brand-soft:rgba(0,113,227,.09);
  --spring:cubic-bezier(.16,1,.3,1);
  --spring-back:cubic-bezier(.34,1.56,.64,1);

}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{

  background:var(--bg);
  color:var(--ink);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "Segoe UI",
    Roboto,
    sans-serif;

  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;

  padding-bottom:env(safe-area-inset-bottom);

}


/* HEADER
------------------------------------------------- */

header{

  position:sticky;
  top:0;
  z-index:100;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;

  padding:12px 16px;

  padding-top:calc(12px + env(safe-area-inset-top));

  border-bottom:1px solid var(--line);

  background:rgba(255,255,255,.86);

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

}

header strong{

  font-size:15px;
  font-weight:850;
  letter-spacing:0.5px;

}

header nav{

  display:flex;
  gap:6px;

}

header a{

  padding:7px 12px;

  border-radius:999px;

  font-size:10.5px;
  font-weight:750;

  text-decoration:none;
  color:var(--muted);

}

header a:hover{
  color:var(--ink);

  background:var(--bg);

}


/* LAYOUT
------------------------------------------------- */

.container{

  max-width:860px;

  margin:0 auto;

  padding:16px 14px;

}


/* CARD
------------------------------------------------- */

.card{
  animation:nexo-card-in .7s var(--spring) both;


  overflow:hidden;

  border:1px solid var(--line);
  border-radius:22px;

  background:var(--panel);

  box-shadow:
    0 12px 40px rgba(0,0,0,.06);

}


/* GALLERY
------------------------------------------------- */

.gallery{

  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:6px;

  padding:6px;

  background:var(--bg);

}

.gallery img{

  width:100%;

  display:block;

  object-fit:cover;

  border-radius:16px;

  cursor:pointer;

}

.gallery img:first-child{

  grid-row:span 2;

  height:100%;
  min-height:260px;

}

.gallery img:not(:first-child){

  height:128px;

}

.gallery img:hover{
  filter:brightness(.94);
}

@media (max-width:640px){

  .gallery{
    grid-template-columns:1fr 1fr;
  }

  .gallery img:first-child{

    grid-column:1 / -1;

    min-height:220px;

  }

}


/* BODY
------------------------------------------------- */

.content{
  padding:18px;
}

@media (min-width:640px){
  .content{
    padding:26px;
  }
}

.header-info{

  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:14px;

  flex-wrap:wrap;

  margin-bottom:15px;

}

.title{

  font-size:22px;
  font-weight:850;
  letter-spacing:-0.02em;

}

.address{

  margin-top:4px;

  color:var(--muted);

  font-size:12px;

}

.price{

  font-size:24px;
  font-weight:900;
  letter-spacing:-0.03em;

  white-space:nowrap;

}

.features{

  display:grid;
  grid-template-columns:repeat(
    auto-fit,
    minmax(105px,1fr)
  );
  gap:8px;

  margin:15px 0 18px;

}

.feature-item{

  padding:11px 12px;

  border:1px solid var(--line);
  border-radius:13px;

  background:var(--bg);

}

.feature-item span:first-child{

  display:block;

  font-size:9.5px;
  font-weight:750;

  color:var(--muted);

  margin-bottom:2px;

}

.feature-item span:last-child{

  font-size:12px;
  font-weight:800;

}

.description{

  color:#3d3d40;

  font-size:13.5px;
  line-height:1.65;

  white-space:pre-line;

}

.description h3{

  margin-bottom:8px;

  font-size:12px;
  font-weight:800;

}

.private-info{

  margin-top:16px;

  padding:13px 14px;

  border:1px solid var(--line);
  border-radius:13px;

  background:var(--brand-soft);

}

.private-info h3{

  margin-bottom:5px;

  color:var(--brand);

  font-size:11px;
  font-weight:800;

}

.private-info p{
  font-size:11.5px;
}


/* STATES
------------------------------------------------- */

.loading,
.error{

  padding:70px 20px;

  text-align:center;

  color:var(--muted);

  font-size:13px;

}

.btn-back{

  display:inline-block;

  margin-bottom:12px;

  color:var(--muted);

  font-size:11px;
  font-weight:700;

  text-decoration:none;

}

.btn-back:hover{
  color:var(--ink);
}

:focus-visible{
  outline:2px solid var(--ink);
  outline-offset:2px;
  border-radius:6px;
}


/* =========================================================
   NEXO MOTION SYSTEM — fisica spring unificada
========================================================= */

@keyframes nexo-card-in{
  from{
    opacity:0;
    transform:translateY(18px) scale(.99);
  }
  to{
    opacity:1;
    transform:none;
  }
}

button:active,
a[class*="btn"]:active{
  transform:scale(.96);
}

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{

    animation:none!important;
    transition:none!important;

    scroll-behavior:auto;

  }

}
</style>

</head>

<body>

<header>

  <strong>
    NEXO
  </strong>

  <nav>

    <a
      id="compareLink"
      href="/comparar/"
    >
      ⚖ Comparar
    </a>

    <a href="/">
      ← Catálogo
    </a>

  </nav>

</header>

<main>
  <div
    class="container"
    id="app"
  >
    <div class="loading">
      Cargando detalles de la propiedad...
    </div>
  </div>
</main>

<script>

"use strict";

function escapeHTML(
  value
){

  return String(value ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

function safeURL(
  value
){

  if(!value){
    return "";
  }

  try{

    const parsed =
      new URL(
        value,
        window.location.origin
      );

    if(
      ["http:","https:"]
        .includes(
          parsed.protocol
        )
    ){

      return parsed.href;

    }

  }catch(_){
    return "";
  }

  return "";

}

function formatPrice(
  value
){

  const number =
    Number(value);

  if(
    !Number.isFinite(number) ||
    number <= 0
  ){

    return "Precio a convenir";

  }

  return new Intl.NumberFormat(
    "en-US",
    {
      style:"currency",
      currency:"USD",
      maximumFractionDigits:0
    }
  ).format(number);

}


const urlParams =
  new URLSearchParams(
    window.location.search
  );

const propertyId =
  urlParams.get("id");

const appContainer =
  document.getElementById(
    "app"
  );

if(propertyId){
  document
    .getElementById(
      "compareLink"
    )
    .href =
      `/comparar/?ids=${encodeURIComponent(propertyId)}`;
}


async function fetchPropertyDetails(){

  if(!propertyId){

    appContainer.innerHTML = `
      <div class="error">
        No se especificó ningún ID de propiedad.
      </div>
    `;

    return;

  }

  try{

    const response =
      await fetch(
        `/api/properties/${encodeURIComponent(propertyId)}`
      );

    if(!response.ok){
      throw new Error(
        `Error en la solicitud (${response.status})`
      );
    }

    const property =
      await response.json();

    renderProperty(property);

  }catch(error){

    appContainer.innerHTML = `
      <div class="error">
        No se pudo cargar la información
        de esta propiedad.
      </div>
    `;

  }

}


/* =========================================================
   RENDER
========================================================= */

function renderProperty(
  prop
){

  let photosMarkup = "";
  let photos = [];

  try{

    photos =
      typeof prop.photos === "string"
        ? JSON.parse(prop.photos)
        : (prop.photos || []);

  }catch(_){
    photos = [];
  }

  if(
    Array.isArray(photos)
  ){

    const validPhotos =
      photos
        .map(safeURL)
        .filter(Boolean)
        .slice(0,5);

    if(validPhotos.length){

      photosMarkup = `
        <div class="gallery">
          ${validPhotos
            .map(
              url => `
                <img
                  src="${url}"
                  alt="${escapeHTML(
                    prop.title ||
                    "Propiedad"
                  )}"
                  loading="lazy"
                >
              `
            )
            .join("")
          }
        </div>
      `;

    }

  }


  /* Datos privados (solo con sesión admin) */

  let privateSection = "";

  if(
    prop.owner_name ||
    prop.owner_phone ||
    prop.notes
  ){

    privateSection = `
      <div class="private-info">
        <h3>Información Privada de Administración</h3>
        <p>
          <strong>Propietario:</strong>
          ${escapeHTML(
            prop.owner_name || "N/D"
          )}
        </p>
        <p>
          <strong>Teléfono:</strong>
          ${escapeHTML(
            prop.owner_phone || "N/D"
          )}
        </p>
        <p>
          <strong>Email:</strong>
          ${escapeHTML(
            prop.contact_email || "N/D"
          )}
        </p>
        ${
          prop.notes
            ? `<p>
                 <strong>Notas:</strong>
                 ${escapeHTML(prop.notes)}
               </p>`
            : ""
        }
      </div>
    `;

  }


  appContainer.innerHTML = `
    <a
      href="/"
      class="btn-back"
    >
      ← Volver a la búsqueda
    </a>

    <div class="card">

      ${photosMarkup}

      <div class="content">

        <div class="header-info">

          <div>

            <h1 class="title">
              ${escapeHTML(
                prop.title ||
                "Propiedad"
              )}
            </h1>

            <p class="address">
              📍 ${escapeHTML(
                prop.address ||
                prop.neighborhood ||
                prop.city ||
                "Ubicación a consultar"
              )}
            </p>

          </div>

          <div class="price">
            ${escapeHTML(
              formatPrice(
                prop.price
              )
            )}
          </div>

        </div>

        <div class="features">

          <div class="feature-item">
            <span>Habitaciones</span>
            <span>
              ${escapeHTML(
                prop.bedrooms || "—"
              )}
            </span>
          </div>

          <div class="feature-item">
            <span>Baños</span>
            <span>
              ${escapeHTML(
                prop.bathrooms || "—"
              )}
            </span>
          </div>

          <div class="feature-item">
            <span>Área</span>
            <span>
              ${escapeHTML(
                prop.square_meters
                  ? prop.square_meters +
                    " m²"
                  : "—"
              )}
            </span>
          </div>

          <div class="feature-item">
            <span>Tipo</span>
            <span>
              ${escapeHTML(
                prop.property_type ||
                "—"
              )}
            </span>
          </div>

        </div>

        <div class="description">

          <h3>Descripción</h3>

          ${escapeHTML(
            prop.description ||
            "Sin descripción disponible."
          )}

        </div>

        ${privateSection}

      </div>

    </div>
  `;

}


fetchPropertyDetails();

</script>

</body>

</html>
