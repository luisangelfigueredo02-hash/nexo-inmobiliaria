<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- El interceptor del worker inyectará aquí los metatags SEO si se consulta dinámicamente -->
    <!-- SEO_TAGS -->
    <title>NEXO — Propiedad Exclusiva</title>
    <!-- CSS de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-color: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --border: rgba(0, 0, 0, 0.08);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding-bottom: calc(100px + var(--safe-bottom));
        }

        /* Cabecera Flotante */
        .nav-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
        }

        .btn-back {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 500;
            color: var(--accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Galería de Imágenes Optimizada con Swipe */
        .gallery-container {
            position: relative;
            width: 100%;
            height: 55vh;
            background: #000;
            margin-top: 64px;
            overflow: hidden;
        }

        .gallery-track {
            display: flex;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
        }

        .gallery-track::-webkit-scrollbar {
            display: none;
        }

        .gallery-slide {
            min-width: 100%;
            height: 100%;
            scroll-snap-align: start;
            position: relative;
        }

        .gallery-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-counter {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            backdrop-filter: blur(10px);
        }

        /* Contenido Principal */
        .content {
            padding: 24px;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .main-info {
            background: var(--card-color);
            padding: 24px;
            border-radius: 24px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tag-row {
            display: flex;
            gap: 8px;
        }

        .tag {
            background: var(--bg-color);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .tag.premium {
            background: rgba(0, 113, 227, 0.1);
            color: var(--accent);
        }

        .prop-title {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.2;
        }

        .prop-price {
            font-size: 28px;
            font-weight: 800;
            color: var(--accent);
        }

        .specs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 16px 0;
            margin-top: 8px;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .spec-val {
            font-weight: 700;
            font-size: 17px;
        }

        .spec-lbl {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        /* Descripción */
        .block-section {
            background: var(--card-color);
            padding: 24px;
            border-radius: 24px;
            border: 1px solid var(--border);
        }

        .section-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .description-text {
            font-size: 15px;
            line-height: 1.6;
            color: #3a3a3c;
            white-space: pre-line;
        }

        /* Mapa Privacidad (Geolocalización Difuminada) */
        #map {
            width: 100%;
            height: 250px;
            border-radius: 16px;
            margin-top: 12px;
            z-index: 10;
        }

        /* Barra Inferior Fija */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 16px 24px calc(16px + var(--safe-bottom));
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 500;
        }

        .price-col {
            display: flex;
            flex-direction: column;
        }

        .price-col span {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .price-col strong {
            font-size: 20px;
            font-weight: 700;
        }

        .btn-whatsapp {
            background: #34c759;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 24px;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(52, 199, 89, 0.2);
        }
    </style>
</head>
<body>

    <header class="nav-header">
        <button class="btn-back" onclick="window.history.back()">⟨ Propiedades</button>
        <span style="font-weight: 600; font-size: 15px;" id="nav-id">...</span>
        <div style="width: 40px;"></div> <!-- Spacer para balance visual -->
    </header>

    <div class="gallery-container">
        <div class="gallery-track" id="gallery-track">
            <!-- Slides dinámicos -->
        </div>
        <div class="gallery-counter" id="gallery-counter">1 / 1</div>
    </div>

    <main class="content">
        <section class="main-info">
            <div class="tag-row">
                <span class="tag" id="tag-op">...</span>
                <span class="tag premium" id="tag-type">...</span>
            </div>
            <h1 class="prop-title" id="prop-title">Cargando Propiedad...</h1>
            <div class="prop-price" id="prop-price">$0 USD</div>
            <div style="font-size: 14px; color: var(--text-secondary);" id="prop-loc">...</div>

            <div class="specs-grid">
                <div class="spec-item">
                    <span class="spec-val" id="spec-beds">0</span>
                    <span class="spec-lbl">Habitaciones</span>
                </div>
                <div class="spec-item">
                    <span class="spec-val" id="spec-baths">0</span>
                    <span class="spec-lbl">Baños</span>
                </div>
                <div class="spec-item">
                    <span class="spec-val" id="spec-area">0</span>
                    <span class="spec-lbl">Área m²</span>
                </div>
            </div>
        </section>

        <section class="block-section">
            <h2 class="section-title">Sobre esta propiedad</h2>
            <p class="description-text" id="prop-description">...</p>
        </section>

        <section class="block-section">
            <h2 class="section-title">Ubicación aproximada</h2>
            <div style="font-size: 13px; color: var(--text-secondary); margin-bottom: 12px;">Por razones de privacidad, la ubicación exacta se reserva y se muestra únicamente un radio de cobertura en la zona.</div>
            <div id="map"></div>
        </section>
    </main>

    <div class="bottom-bar">
        <div class="price-col">
            <span>Precio Total</span>
            <strong id="bar-price">$0 USD</strong>
        </div>
        <a href="#" class="btn-whatsapp" id="btn-whatsapp" target="_blank">
            <svg width="18" height="18" fill="currentColor" viewBox="0 0 16 16" style="vertical-align: middle;">
                <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.69-4.98c-.202-.1-1.195-.59-1.388-.66-.193-.07-.333-.1-.474.1-.14.2-.543.66-.667.8-.124.14-.248.15-.45.05-.203-.1-.856-.315-1.63-1.002-.602-.537-1.008-1.2-1.127-1.4-.118-.2-.012-.307.088-.407.09-.09.2-.233.3-.35.1-.117.133-.2.2-.33.067-.133.033-.25-.017-.35-.05-.1-474-1.142-.65-1.575-.172-.43-.362-.37-.49-.375h-.415c-.14 0-.367.053-.56.26-.193.207-.733.717-.733 1.748s.75 2.025.855 2.162c.104.137 1.472 2.25 3.566 3.153.498.215.886.34 1.189.437.5.158.955.136 1.314.083.4-.06 1.195-.49 1.363-.96.168-.47.168-.875.118-.96-.05-.083-.183-.133-.385-.233z"/>
            </svg>
            Contactar por WhatsApp
        </a>
    </div>

    <!-- Scripts de Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const propId = urlParams.get("id");

        async function initProperty() {
            if (!propId) {
                document.body.innerHTML = `<p style="text-align:center; padding: 100px;">ID de propiedad no especificado.</p>`;
                return;
            }

            try {
                // Recuperar configuraciones globales de manera centralizada
                const configRes = await fetch("/api/config");
                const configData = await configRes.json();
                const whatsappNumber = configData.whatsapp_phone || "+5350000000";

                const response = await fetch(`/api/properties/${propId}`);
                if (!response.ok) throw new Error();
                const data = await response.json();

                // Hydrate HTML UI
                document.getElementById("nav-id").textContent = data.id;
                document.getElementById("tag-op").textContent = data.operation;
                document.getElementById("tag-type").textContent = data.type;
                document.getElementById("prop-title").textContent = data.title;
                document.getElementById("prop-price").textContent = `$${parseFloat(data.price).toLocaleString()} USD`;
                document.getElementById("bar-price").textContent = `$${parseFloat(data.price).toLocaleString()} USD`;
                document.getElementById("prop-loc").textContent = `${data.neighborhood}, ${data.city}, ${data.province}`;
                document.getElementById("spec-beds").textContent = data.bedrooms;
                document.getElementById("spec-baths").textContent = data.bathrooms;
                document.getElementById("spec-area").textContent = data.area;
                document.getElementById("prop-description").textContent = data.description;

                // 3. Renderizado de Galería
                const track = document.getElementById("gallery-track");
                const images = data.images.length > 0 ? data.images : ["https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=800&q=80"];
                
                track.innerHTML = images.map(img => `
                    <div class="gallery-slide">
                        <img src="${img}" alt="Fotografía del inmueble" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=800&q=80'">
                    </div>
                `).join('');

                const counter = document.getElementById("gallery-counter");
                counter.textContent = `1 / ${images.length}`;

                track.addEventListener("scroll", () => {
                    const page = Math.round(track.scrollLeft / track.clientWidth) + 1;
                    counter.textContent = `${page} / ${images.length}`;
                });

                // 9. Mapa difuminado para protección de datos
                if (data.latitude && data.longitude) {
                    const map = L.map('map', { zoomControl: false, dragging: false, scrollWheelZoom: false }).setView([data.latitude, data.longitude], 15);
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                        attribution: '&copy; OpenStreetMap contributors'
                    }).addTo(map);

                    // Representación en radio difuso de 250 metros
                    L.circle([data.latitude, data.longitude], {
                        color: '#0071e3',
                        fillColor: '#0071e3',
                        fillOpacity: 0.15,
                        radius: 250
                    }).addTo(map);
                } else {
                    document.getElementById("map").parentElement.style.display = "none";
                }

                // 8. CTA Dinámico de WhatsApp
                const textMsg = `Hola NEXO, me interesa la propiedad [${data.id}]: "${data.title}" publicada en ${data.neighborhood}. Solicito más información. Enlace: ${window.location.href}`;
                document.getElementById("btn-whatsapp").href = `https://wa.me/${whatsappNumber.replace("+", "")}?text=${encodeURIComponent(textMsg)}`;

            } catch (err) {
                document.body.innerHTML = `<p style="text-align:center; padding: 100px;">La propiedad seleccionada no existe o ha sido despublicada.</p>`;
            }
        }

        window.onload = initProperty;
    </script>
</body>
</html>
