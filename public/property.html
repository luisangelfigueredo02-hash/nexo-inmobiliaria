<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Propiedad - Nexo Inmueble</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-gray: #f8fafc;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-gray);
            color: var(--text-dark);
            line-height: 1.5;
            padding-bottom: 3rem;
        }

        header {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        header span {
            display: flex;
            gap: 1rem;
        }

        header a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        header a:hover {
            color: var(--primary-hover);
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: white;
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 0.5rem;
            background: #000;
            max-height: 450px;
            overflow-y: auto;
        }

        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .content {
            padding: 2rem;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .price {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .title {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }

        .address {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .features {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            background: var(--bg-gray);
            padding: 1rem;
            border-radius: 8px;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
        }

        .feature-item span:first-child {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .feature-item span:last-child {
            font-weight: 600;
        }

        .description {
            margin-bottom: 2rem;
            white-space: pre-line;
        }

        .private-info {
            background: #fffbeeb0;
            border: 1px solid #fde68a;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1.5rem;
        }

        .private-info h3 {
            color: #b45309;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        .loading, .error {
            text-align: center;
            padding: 4rem;
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .btn-back {
            display: inline-block;
            margin-bottom: 1rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
        }

        .btn-back:hover {
            color: var(--text-dark);
        }
    </style>
</head>
<body>

    <header>
        <strong>Nexo Inmueble</strong>
        <span>
            <a id="compareLink" href="/comparar/">⚖ Comparar</a>
            <a href="/">← Volver al catálogo</a>
        </span>
    </header>

    <div class="container" id="app">
        <div class="loading">Cargando detalles de la propiedad...</div>
    </div>

    <script>
        // Utilidades de Sanitización y Formato
        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function safeURL(url) {
            if (!url) return '';
            try {
                const parsed = new URL(url, window.location.origin);
                if (['http:', 'https:'].includes(parsed.protocol)) {
                    return parsed.href;
                }
            } catch (e) {
                return '';
            }
            return '';
        }

        function formatPrice(val) {
            if (!val) return 'Consultar';
            return new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'USD' }).format(val);
        }

        // Obtener el ID de la propiedad desde la URL (?id=...)
        const urlParams = new URLSearchParams(window.location.search);
        const propertyId = urlParams.get('id');

        const appContainer = document.getElementById('app');

        if (propertyId) {
            document.getElementById('compareLink').href =
                `/comparar/?ids=${encodeURIComponent(propertyId)}`;
        }

        async function fetchPropertyDetails() {
            if (!propertyId) {
                appContainer.innerHTML = '<div class="error">No se especificó ningún ID de propiedad.</div>';
                return;
            }

            try {
                // Ruta relativa a la API centralizada
                const response = await fetch(`/api/properties/${encodeURIComponent(propertyId)}`);

                if (!response.ok) {
                    throw new Error(`Error en la solicitud (${response.status})`);
                }

                const property = await response.json();
                renderProperty(property);

            } catch (err) {
                console.error("Error al obtener la propiedad:", err);
                appContainer.innerHTML = '<div class="error">No se pudo cargar la información de esta propiedad.</div>';
            }
        }

        function renderProperty(prop) {
            // Procesar imágenes
            let photosMarkup = '';
            let photos = [];
            
            try {
                photos = typeof prop.photos === 'string' ? JSON.parse(prop.photos) : (prop.photos || []);
            } catch (e) {
                photos = [];
            }

            if (Array.isArray(photos) && photos.length > 0) {
                const validPhotos = photos.map(safeURL).filter(Boolean);
                if (validPhotos.length > 0) {
                    photosMarkup = `
                        <div class="gallery">
                            ${validPhotos.map(url => `<img src="${url}" alt="${escapeHTML(prop.title || 'Propiedad')}" loading="lazy">`).join('')}
                        </div>
                    `;
                }
            }

            // Datos privados (solo visibles si requireAdmin devolvió true en la API)
            let privateSection = '';
            if (prop.owner_name || prop.owner_phone || prop.notes) {
                privateSection = `
                    <div class="private-info">
                        <h3>Información Privada de Administración</h3>
                        <p><strong>Propietario:</strong> ${escapeHTML(prop.owner_name || 'N/D')}</p>
                        <p><strong>Teléfono:</strong> ${escapeHTML(prop.owner_phone || 'N/D')}</p>
                        <p><strong>Email:</strong> ${escapeHTML(prop.contact_email || 'N/D')}</p>
                        ${prop.notes ? `<p><strong>Notas:</strong> ${escapeHTML(prop.notes)}</p>` : ''}
                    </div>
                `;
            }

            appContainer.innerHTML = `
                <a href="/" class="btn-back">← Volver a la búsqueda</a>
                <div class="card">
                    ${photosMarkup}
                    <div class="content">
                        <div class="header-info">
                            <div>
                                <h1 class="title">${escapeHTML(prop.title || 'Propiedad sin título')}</h1>
                                <p class="address">📍 ${escapeHTML(prop.address || 'Ubicación no especificada')}</p>
                            </div>
                            <div class="price">${formatPrice(prop.price)}</div>
                        </div>

                        <div class="features">
                            <div class="feature-item">
                                <span>Habitaciones</span>
                                <span>${escapeHTML(prop.bedrooms || '-')}</span>
                            </div>
                            <div class="feature-item">
                                <span>Baños</span>
                                <span>${escapeHTML(prop.bathrooms || '-')}</span>
                            </div>
                            <div class="feature-item">
                                <span>Área</span>
                                <span>${escapeHTML(prop.area_sqm ? prop.area_sqm + ' m²' : '-')}</span>
                            </div>
                            <div class="feature-item">
                                <span>Tipo</span>
                                <span>${escapeHTML(prop.property_type || '-')}</span>
                            </div>
                        </div>

                        <div class="description">
                            <h3>Descripción</h3>
                            <br>
                            ${escapeHTML(prop.description || 'Sin descripción disponible.')}
                        </div>

                        ${privateSection}
                    </div>
                </div>
            `;
        }

        // Iniciar carga
        fetchPropertyDetails();
    </script>
</body>
</html>
