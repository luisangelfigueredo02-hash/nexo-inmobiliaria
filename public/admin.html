<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NEXO — Administración</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f5f3;
      color: #171717;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    header {
      padding: 20px 0 30px;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .subtitle {
      color: #777;
      margin-top: 6px;
    }

    .card {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,.05);
    }

    h1 {
      font-size: 26px;
      margin-bottom: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .field {
      margin-bottom: 15px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
      color: #171717;
      font-size: 16px;
      outline: none;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #171717;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      background: #171717;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      margin-top: 16px;
      padding: 13px;
      border-radius: 10px;
      display: none;
      line-height: 1.4;
    }

    .success {
      display: block !important;
      background: #e8f7ed;
      color: #176b35;
    }

    .error {
      display: block !important;
      background: #fdeaea;
      color: #9b1c1c;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <div class="logo">NEXO</div>
      <div class="subtitle">
        Panel de administración
      </div>
    </header>

    <main class="card">

      <h1>Agregar propiedad</h1>

      <form id="propertyForm">

        <div class="grid">

          <div class="field">
            <label for="property_type">
              Tipo de propiedad *
            </label>

            <select id="property_type" required>
              <option value="">
                Seleccionar
              </option>

              <option value="Casa">
                Casa
              </option>

              <option value="Apartamento">
                Apartamento
              </option>

              <option value="Villa">
                Villa
              </option>

              <option value="Terreno">
                Terreno
              </option>

              <option value="Local">
                Local
              </option>

              <option value="Oficina">
                Oficina
              </option>
            </select>
          </div>


          <div class="field">
            <label for="city">
              Ciudad *
            </label>

            <input
              id="city"
              type="text"
              required
            >
          </div>


          <div class="field">
            <label for="neighborhood">
              Zona / Barrio
            </label>

            <input
              id="neighborhood"
              type="text"
            >
          </div>


          <div class="field">
            <label for="address">
              Dirección exacta
            </label>

            <input
              id="address"
              type="text"
            >
          </div>


          <div class="field">
            <label for="bedrooms">
              Habitaciones
            </label>

            <input
              id="bedrooms"
              type="number"
              min="0"
            >
          </div>


          <div class="field">
            <label for="bathrooms">
              Baños
            </label>

            <input
              id="bathrooms"
              type="number"
              min="0"
            >
          </div>


          <div class="field">
            <label for="square_meters">
              Metros cuadrados
            </label>

            <input
              id="square_meters"
              type="number"
              min="0"
            >
          </div>


          <div class="field">
            <label for="price">
              Precio
            </label>

            <input
              id="price"
              type="number"
              min="0"
              step="0.01"
            >
          </div>


          <div class="field full">
            <label for="description">
              Descripción
            </label>

            <textarea
              id="description"
            ></textarea>
          </div>


          <div class="field full">
            <label for="photos">
              Fotos
            </label>

            <input
              id="photos"
              type="text"
              placeholder="URLs de fotos, separadas por coma"
            >
          </div>


          <div class="field">
            <label for="owner_name">
              Nombre del propietario
            </label>

            <input
              id="owner_name"
              type="text"
            >
          </div>


          <div class="field">
            <label for="owner_phone">
              Teléfono del propietario
            </label>

            <input
              id="owner_phone"
              type="tel"
            >
          </div>


          <div class="field full">
            <label for="notes">
              Notas privadas
            </label>

            <textarea
              id="notes"
            ></textarea>
          </div>

        </div>


        <button
          id="submitButton"
          type="submit"
        >
          Añadir propiedad
        </button>

      </form>


      <div id="message"></div>

    </main>

  </div>


  <script>

    const API_URL =
      "https://nexo-inmobiliaria.luisangelfigueredo02.workers.dev";


    const form =
      document.getElementById("propertyForm");

    const message =
      document.getElementById("message");

    const submitButton =
      document.getElementById("submitButton");


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        message.className = "";
        message.style.display = "none";
        message.textContent = "";


        submitButton.disabled = true;
        submitButton.textContent =
          "Guardando...";


        const photosText =
          document.getElementById("photos").value.trim();


        const photos =
          photosText
            ? photosText
                .split(",")
                .map(photo => photo.trim())
                .filter(Boolean)
            : [];


        const data = {

          property_type:
            document.getElementById(
              "property_type"
            ).value,

          city:
            document.getElementById(
              "city"
            ).value,

          neighborhood:
            document.getElementById(
              "neighborhood"
            ).value,

          address:
            document.getElementById(
              "address"
            ).value,

          bedrooms:
            document.getElementById(
              "bedrooms"
            ).value,

          bathrooms:
            document.getElementById(
              "bathrooms"
            ).value,

          square_meters:
            document.getElementById(
              "square_meters"
            ).value,

          price:
            document.getElementById(
              "price"
            ).value,

          description:
            document.getElementById(
              "description"
            ).value,

          photos,

          owner_name:
            document.getElementById(
              "owner_name"
            ).value,

          owner_phone:
            document.getElementById(
              "owner_phone"
            ).value,

          notes:
            document.getElementById(
              "notes"
            ).value,

          status: "available"
        };


        try {

          const response =
            await fetch(
              `${API_URL}/api/properties`,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify(data)
              }
            );


          const result =
            await response.json();


          if (!response.ok ||
              !result.success) {

            throw new Error(
              result.error ||
              "No se pudo crear la propiedad."
            );

          }


          message.className =
            "success";

          message.textContent =
            `Propiedad añadida correctamente a NEXO. ID: ${result.id}`;


          form.reset();


        } catch (error) {

          console.error(
            "NEXO:",
            error
          );


          message.className =
            "error";

          message.textContent =
            error.message ||
            "Ocurrió un error.";

        } finally {

          submitButton.disabled =
            false;

          submitButton.textContent =
            "Añadir propiedad";

        }

      }
    );

  </script>

</body>
</html>
