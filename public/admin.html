<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>{{BRAND_NAME}} — Panel Administrativo</title>
    <link rel="stylesheet" href="/variables.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#faf9f7">
    <!-- Leaflet para la selección de ubicación -->
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
    <style>
        :root { --color-accent: {{BRAND_PRIMARY_COLOR}}; }
        /* Tokens: variables.css */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-ink);
            padding: 24px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Bloque de Login */
        .login-box {
            background: var(--color-surface);
            padding: 32px;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.03);
            border: 1px solid var(--color-border);
            max-width: 400px;
            margin: 100px auto 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Panel Principal */
        .admin-panel {
            display: none;
            flex-direction: column;
            gap: 24px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 16px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .btn {
            background: var(--color-accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }
        .btn.secondary { background: var(--color-ink-muted); }
        .btn.danger { background: var(--danger); }

        /* Dos Columnas */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .workspace { grid-template-columns: 1fr; }
        }

        .panel-card {
            background: var(--color-surface);
            padding: 24px;
            border-radius: 20px;
            border: 1px solid var(--color-border);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Formularios Apple Style */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--color-ink-muted);
        }

        input, select, textarea {
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            outline: none;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--color-accent);
            background: var(--color-surface);
        }

        /* Lista de Inmuebles */
        .prop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-radius: 12px;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
        }

        .prop-item div {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* Gestor de Fotos */
        .photo-manager {
            border: 1px dashed var(--color-border);
            padding: 16px;
            border-radius: 12px;
            background: var(--color-bg);
        }

        .photo-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .photo-thumb {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--color-border);
        }

        .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .photo-thumb .del-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            background: var(--danger);
            color: white;
            border: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            font-size: 11px;
            cursor: pointer;
        }

        /* Dropzone + upload progress + reorder */
        .photo-dropzone {
            border: 2px dashed var(--color-border);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            margin: 8px 0;
            transition: border-color .2s, background .2s;
        }
        .photo-dropzone:hover, .photo-dropzone.dragover {
            border-color: var(--color-accent);
            background: var(--color-accent-subtle, rgba(194,65,12,.06));
        }
        .photo-dropzone p { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
        .photo-dropzone small { font-size: 11px; color: var(--color-ink-muted); }
        .photo-upload-progress { margin: 8px 0; }
        .photo-upload-bar { height: 4px; background: var(--color-border); border-radius: 2px; overflow: hidden; margin-bottom: 4px; }
        .photo-upload-bar span { display: block; height: 100%; background: var(--color-accent); width: 0%; transition: width .3s; }
        .photo-upload-progress > span { font-size: 11px; color: var(--color-ink-muted); }
        .photo-thumb-actions {
            position: absolute; inset: auto 0 0 0; display: flex; justify-content: space-between;
            background: linear-gradient(transparent, rgba(0,0,0,.5)); padding: 2px 2px 1px;
        }
        .photo-thumb-actions button {
            background: rgba(255,255,255,.92); border: none; border-radius: 5px; width: 18px; height: 18px;
            font-size: 11px; cursor: pointer; display: grid; place-items: center; color: #1c1917; line-height: 1;
        }
        .photo-thumb-actions button:disabled { opacity: .35; cursor: default; }

        #admin-map {
            width: 100%;
            height: 200px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Pantalla de Inicio de Sesión -->
        <div class="login-box" id="login-box">
            <h2 style="text-align: center;">{{BRAND_NAME}} Acceso</h2>
            <div class="form-group">
                <label>Token Administrativo</label>
                <input type="password" id="auth-token-input" placeholder="Token de Seguridad">
            </div>
            <button class="btn" id="btn-login" data-action="login">Verificar</button>
        </div>

        <!-- Panel de Administración -->
        <div class="admin-panel" id="admin-panel">
            <header>
                <div>
                    <h1>{{BRAND_NAME}} Control</h1>
                    <span style="font-size: 12px; color: var(--color-ink-muted);">Creador & Administrador de Listados</span>
                </div>
                <button class="btn secondary" id="btn-logout" data-action="logout">Desconectarse</button>
            </header>

            <div class="workspace">
                <!-- Columna de Gestión / Formulario -->
                <section class="panel-card">
                    <h2 id="form-action-title">Crear Propiedad</h2>
                    <form id="prop-form">
                        <input type="hidden" id="edit-id">

                        <div class="form-group">
                            <label>Título Comercial</label>
                            <input type="text" id="p-title" required placeholder="Ej: Penthouse con vista al mar">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Tipo de Inmueble</label>
                                <select id="p-type" required>
                                    <option value="casa">Casa</option>
                                    <option value="apartamento">Apartamento</option>
                                    <option value="terreno">Terreno</option>
                                    <option value="penthouse">Penthouse</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Operación</label>
                                <select id="p-operation" required>
                                    <option value="venta">Venta</option>
                                    <option value="alquiler">Alquiler</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Precio</label>
                                <input type="number" id="p-price" required placeholder="120000">
                            </div>
                            <div class="form-group">
                                <label>Moneda</label>
                                <select id="p-currency">
                                    <option value="">No especificada</option>
                                    <option value="USD">USD</option>
                                    <option value="EUR">EUR</option>
                                    <option value="CUP">CUP</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Área (m²)</label>
                                <input type="number" id="p-area" required placeholder="120">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Habitaciones</label>
                                <input type="number" id="p-beds" value="2">
                            </div>
                            <div class="form-group">
                                <label>Baños</label>
                                <input type="number" id="p-baths" value="1">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Provincia</label>
                                <input type="text" id="p-province" required value="La Habana">
                            </div>
                            <div class="form-group">
                                <label>Municipio / Ciudad</label>
                                <input type="text" id="p-city" required placeholder="Plaza">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Barrio / Zona</label>
                            <input type="text" id="p-neighborhood" required placeholder="Vedado">
                        </div>

                        <div class="form-group">
                            <label>Descripción General</label>
                            <textarea id="p-description" rows="3" placeholder="Detalle las cualidades del inmueble..."></textarea>
                        </div>

                        <!-- Panel de Fotografías Múltiples (Prioridad) -->
                        <div class="photo-manager">
                            <label>Galería de Imágenes</label>
                            <div class="photo-dropzone" id="photo-dropzone" data-action="browse-photos">
                                <p>Arrastra imágenes aquí o haz clic para seleccionar</p>
                                <small>JPG, PNG o WebP · Máx. 5MB c/u · Se suben a R2 automáticamente</small>
                            </div>
                            <input type="file" id="photo-file-input" accept="image/jpeg,image/png,image/webp" multiple hidden>
                            <div class="photo-upload-progress" id="photo-upload-progress" hidden>
                                <div class="photo-upload-bar"><span id="photo-upload-fill"></span></div>
                                <span id="photo-upload-text">Subiendo...</span>
                            </div>
                            <div style="display:flex; gap: 8px; margin-top:8px;">
                                <input type="text" id="p-new-photo" style="flex:1;" placeholder="O pega una URL de imagen (https://...)">
                                <button type="button" class="btn" id="btn-add-photo" data-action="add-photo">Añadir URL</button>
                            </div>
                            <div class="photo-list" id="p-photo-list">
                                <!-- Elementos de foto interactivos -->
                            </div>
                        </div>

                        <!-- 9. Geolocalización e Interfaz de Mapa -->
                        <div class="form-group" style="margin-top: 12px;">
                            <label>Coordenadas (Clic en el mapa)</label>
                            <div class="form-row">
                                <input type="text" id="p-lat" placeholder="Latitud" readonly>
                                <input type="text" id="p-lng" placeholder="Longitud" readonly>
                            </div>
                            <div id="admin-map" style="margin-top:8px;"></div>
                        </div>

                        <!-- Bloque de Privacidad Obligatorio -->
                        <div style="margin-top:16px; border-top: 1px solid var(--color-border); padding-top:16px; display:flex; flex-direction:column; gap:12px;">
                            <h3 style="font-size:13px; color: var(--color-ink);">DATOS PRIVADOS (Exclusivo Administrador)</h3>
                            <div class="form-group">
                                <label>Dirección Exacta</label>
                                <input type="text" id="p-address" placeholder="Calle 23 #456 e/ H e I">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Nombre del Propietario</label>
                                    <input type="text" id="p-owner-name" placeholder="Roberto Gómez">
                                </div>
                                <div class="form-group">
                                    <label>Teléfono de Contacto</label>
                                    <input type="text" id="p-owner-phone" placeholder="+5351234567">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Notas Internas</label>
                                <textarea id="p-notes" placeholder="Detalles de comisión u observaciones del gestor..."></textarea>
                            </div>
                        </div>

                        <div class="form-group" style="margin-top:16px;">
                            <label>Estado de Publicación</label>
                            <select id="p-status">
                                <option value="published">Publicado</option>
                                <option value="draft">Borrador</option>
                            </select>
                        </div>

                        <div style="display:flex; gap:12px; margin-top:20px;">
                            <button type="submit" class="btn" style="flex:1;" id="btn-save-submit">Guardar Propiedad</button>
                            <button type="button" class="btn secondary" style="display:none;" id="btn-cancel-edit" data-action="cancel-edit">Cancelar</button>
                        </div>
                    </form>
                </section>

                <!-- Columna de Propiedades Guardadas -->
                <section class="panel-card">
                    <h2>Inmuebles Almacenados</h2>
                    <div class="bulk-toolbar" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
                        <button type="button" class="btn secondary" style="font-size:12px; padding:8px 12px;" data-action="export-csv">⬇ Exportar CSV</button>
                        <button type="button" class="btn secondary" style="font-size:12px; padding:8px 12px;" data-action="import-csv">⬆ Importar CSV</button>
                        <input type="file" id="csv-file-input" accept=".csv,text/csv" hidden>
                    </div>
                    <div id="csv-feedback" style="font-size:12px; color:var(--color-ink-muted); margin-bottom:8px;"></div>
                    <div style="display:flex; flex-direction:column; gap:12px; max-height: 80vh; overflow-y:auto;" id="admin-properties-list">
                        <!-- Propiedades inyectadas dinámicamente -->
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- Leaflet self-hosted; fallback a CDN si el asset local falla -->
    <script src="/vendor/leaflet/leaflet.js"></script>
    <script>
        if (typeof L === "undefined") {
            document.write('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""><\/script>');
        }
    </script>
    <script>
        let adminProperties = [];
        let imageList = [];
        let mapAdmin = null;
        let selectedMarker = null;

        // Escape de datos de origen D1/input admin antes de interpolar en innerHTML
        const escapeHtml = s => String(s ?? "").replace(/[&<>"']/g,
            c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        // Comprobar credenciales previamente validadas
        window.onload = () => {
            const savedToken = sessionStorage.getItem("nexo_admin_token");
            if (savedToken) {
                verifyTokenAndBootstrap(savedToken);
            }
        };

        async function verifyTokenAndBootstrap(token) {
            try {
                const response = await fetch("/api/admin/verify", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (response.ok) {
                    sessionStorage.setItem("nexo_admin_token", token);
                    document.getElementById("login-box").style.display = "none";
                    document.getElementById("admin-panel").style.display = "flex";
                    initAdminMap();
                    loadAdminProperties();
                } else {
                    alert("Token de acceso denegado o vencido.");
                    logout();
                }
            } catch (err) {
                alert("Falla de red al verificar autenticidad.");
            }
        }

        function attemptLogin() {
            const token = document.getElementById("auth-token-input").value;
            if (token) verifyTokenAndBootstrap(token);
        }

        function logout() {
            sessionStorage.removeItem("nexo_admin_token");
            window.location.reload();
        }

        // 9. Inicialización de mapa para configurar coordenadas con clics de precisión
        async function initAdminMap() {
            // Centro desde /api/config (MARKET CONFIG, 04.7-B); fallback = mercado inicial.
            let center = [23.1136, -82.3666], zoom = 12;
            try {
                const cfg = await fetch("/api/config").then(r => r.ok ? r.json() : null);
                if (cfg && Array.isArray(cfg.map_center) && cfg.map_center.length === 2) center = cfg.map_center;
                if (cfg && cfg.map_zoom) zoom = cfg.map_zoom;
            } catch { /* fallback estático */ }
            mapAdmin = L.map('admin-map').setView(center, zoom);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(mapAdmin);

            mapAdmin.on('click', (e) => {
                const { lat, lng } = e.latlng;
                document.getElementById("p-lat").value = lat.toFixed(6);
                document.getElementById("p-lng").value = lng.toFixed(6);

                if (selectedMarker) {
                    selectedMarker.setLatLng(e.latlng);
                } else {
                    selectedMarker = L.marker(e.latlng).addTo(mapAdmin);
                }
            });
        }

        // Manejador de Galerías (múltiples fotos por propiedad)
        function addPhotoUrl() {
            const input = document.getElementById("p-new-photo");
            const url = input.value.trim();
            if (!url) return;

            imageList.push(url);
            input.value = "";
            renderPhotoThumbs();
        }

        function deletePhoto(index) {
            imageList.splice(index, 1);
            renderPhotoThumbs();
        }

        function movePhoto(index, dir) {
            const newIndex = index + dir;
            if (newIndex < 0 || newIndex >= imageList.length) return;
            const [moved] = imageList.splice(index, 1);
            imageList.splice(newIndex, 0, moved);
            renderPhotoThumbs();
        }

        function renderPhotoThumbs() {
            const list = document.getElementById("p-photo-list");
            list.innerHTML = imageList.map((url, index) => `
                <div class="photo-thumb" data-index="${index}">
                    <img src="${escapeHtml(url)}">
                    <div class="photo-thumb-actions">
                        <button type="button" data-action="move-photo-left" data-photo-index="${index}" ${index === 0 ? "disabled" : ""} aria-label="Mover a la izquierda">‹</button>
                        <button type="button" data-action="move-photo-right" data-photo-index="${index}" ${index === imageList.length - 1 ? "disabled" : ""} aria-label="Mover a la derecha">›</button>
                        <button type="button" class="del-btn" data-action="delete-photo" data-photo-index="${index}" aria-label="Eliminar foto">×</button>
                    </div>
                </div>
            `).join('');
        }

        // ===== Bulk CSV import/export =====
        const CSV_COLS = ["title","type","operation","price","province","city","neighborhood","address","bedrooms","bathrooms","area","description","images","latitude","longitude","status","owner_name","owner_phone","internal_notes"];

        function exportCsv() {
            if (!adminProperties.length) { csvFeedback("No hay inmuebles para exportar."); return; }
            const esc = v => {
                if (v === null || v === undefined) return "";
                const s = String(v);
                return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
            };
            const rows = [CSV_COLS.join(",")].concat(adminProperties.map(p => CSV_COLS.map(c => {
                let val = p[c];
                if (c === "images") val = typeof val === "string" ? val : JSON.stringify(val || []);
                return esc(val);
            }).join(",")));
            const blob = new Blob(["﻿" + rows.join("\n")], { type: "text/csv;charset=utf-8" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `nexo-inmuebles-${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(a.href);
            csvFeedback(`✓ Exportados ${adminProperties.length} inmuebles.`);
        }

        function csvFeedback(msg, isError = false) {
            const el = document.getElementById("csv-feedback");
            el.textContent = msg;
            el.style.color = isError ? "var(--danger)" : "var(--success, #15803d)";
        }

        function parseCsvLine(line) {
            const out = []; let cur = ""; let inQ = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (inQ) {
                    if (ch === '"') { if (line[i+1] === '"') { cur += '"'; i++; } else inQ = false; }
                    else cur += ch;
                } else if (ch === '"') inQ = true;
                else if (ch === ",") { out.push(cur); cur = ""; }
                else cur += ch;
            }
            out.push(cur);
            return out;
        }

        async function importCsv(file) {
            const token = sessionStorage.getItem("nexo_admin_token");
            const text = await file.text();
            const lines = text.replace(/^﻿/, "").split(/\r?\n/).filter(l => l.trim());
            if (lines.length < 2) { csvFeedback("CSV vacío o sin filas de datos.", true); return; }
            const header = parseCsvLine(lines[0]).map(h => h.trim());
            let created = 0, failed = 0;
            csvFeedback(`Importando ${lines.length - 1} inmuebles…`);
            for (let i = 1; i < lines.length; i++) {
                const vals = parseCsvLine(lines[i]);
                const row = {};
                header.forEach((h, idx) => { row[h] = vals[idx] !== undefined ? vals[idx] : ""; });
                const payload = {
                    title: row.title, type: row.type, operation: row.operation,
                    price: parseFloat(row.price) || 0,
                    province: row.province, city: row.city, neighborhood: row.neighborhood,
                    address: row.address || null,
                    bedrooms: parseInt(row.bedrooms) || 0,
                    bathrooms: parseInt(row.bathrooms) || 0,
                    area: parseFloat(row.area) || null,
                    description: row.description || null,
                    images: row.images ? (row.images.startsWith("[") ? JSON.parse(row.images) : [row.images]) : [],
                    latitude: row.latitude ? parseFloat(row.latitude) : null,
                    longitude: row.longitude ? parseFloat(row.longitude) : null,
                    status: row.status || "published",
                    owner_name: row.owner_name || null,
                    owner_phone: row.owner_phone || null,
                    internal_notes: row.internal_notes || null
                };
                if (!payload.title || !payload.type || !payload.price) { failed++; continue; }
                try {
                    const res = await fetch("/api/admin/properties", {
                        method: "POST",
                        headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    if (res.ok) created++; else failed++;
                } catch { failed++; }
            }
            csvFeedback(`✓ ${created} importados${failed ? `, ${failed} con error` : ""}.`);
            loadAdminProperties();
        }

        // Subida de imágenes a R2
        async function uploadPhotos(files) {
            const token = sessionStorage.getItem("nexo_admin_token");
            const progress = document.getElementById("photo-upload-progress");
            const fill = document.getElementById("photo-upload-fill");
            const text = document.getElementById("photo-upload-text");
            progress.hidden = false;
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (!/^image\/(jpeg|png|webp)$/.test(file.type)) { alert(`${file.name}: solo JPG, PNG o WebP`); continue; }
                if (file.size > 5 * 1024 * 1024) { alert(`${file.name}: máximo 5MB`); continue; }
                text.textContent = `Subiendo ${i + 1}/${files.length}: ${file.name}`;
                fill.style.width = `${Math.round(((i) / files.length) * 100)}%`;
                const fd = new FormData();
                fd.append("file", file);
                try {
                    const res = await fetch("/api/admin/upload-image", {
                        method: "POST",
                        headers: { "Authorization": `Bearer ${token}` },
                        body: fd
                    });
                    const data = await res.json();
                    if (res.ok && data.url) imageList.push(data.url);
                    else alert(`Error: ${data.error || res.status}`);
                } catch (e) {
                    alert(`Error de red al subir ${file.name}`);
                }
            }
            fill.style.width = "100%";
            progress.hidden = true;
            fill.style.width = "0%";
            renderPhotoThumbs();
        }

        // Carga de listado completo desde la API Administrativa (incluye datos privados)
        async function loadAdminProperties() {
            const token = sessionStorage.getItem("nexo_admin_token");
            try {
                const response = await fetch("/api/admin/properties", {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                adminProperties = await response.json();
                renderAdminList();
            } catch (err) {
                console.error("Error al obtener listados administrativos", err);
            }
        }

        function renderAdminList() {
            const container = document.getElementById("admin-properties-list");
            if (adminProperties.length === 0) {
                container.innerHTML = `<p style="color:var(--color-ink-muted); text-align:center;">Ningún inmueble creado.</p>`;
                return;
            }

            container.innerHTML = adminProperties.map(p => `
                <div class="prop-item">
                    <div>
                        <strong>${escapeHtml(p.public_code || p.id)} — ${escapeHtml(p.title)}</strong>
                        <span style="font-size:12px; color:var(--color-ink-muted);">${escapeHtml(p.neighborhood)} • ${p.currency ? ({USD:'US$',EUR:'€'}[p.currency] || '') + parseFloat(p.price).toLocaleString() + (p.currency==='CUP'?' CUP':'') : parseFloat(p.price).toLocaleString() + ' (moneda no especificada)'} • Status: <b>${escapeHtml(p.status)}</b></span>
                    </div>
                    <div style="flex-direction:row; gap:8px;">
                        <button class="btn" style="padding:6px 12px; font-size:11px;" data-action="edit-property" data-id="${escapeHtml(p.id)}">Editar</button>
                        <button class="btn danger" style="padding:6px 12px; font-size:11px;" data-action="delete-property" data-id="${escapeHtml(p.id)}">Eliminar</button>
                    </div>
                </div>
            `).join('');
        }

        // Preparar formulario para modo Edición de Inmueble
        function enableEditMode(id) {
            // data-id llega como string; p.id es number → comparación laxa explícita
            const p = adminProperties.find(prop => String(prop.id) === String(id));
            if (!p) return;

            document.getElementById("form-action-title").textContent = `Editar Inmueble ${p.id}`;
            document.getElementById("edit-id").value = p.id;
            document.getElementById("p-title").value = p.title;
            document.getElementById("p-type").value = p.type;
            document.getElementById("p-operation").value = p.operation;
            document.getElementById("p-price").value = p.price;
            document.getElementById("p-currency").value = p.currency || "";
            document.getElementById("p-area").value = p.area;
            document.getElementById("p-beds").value = p.bedrooms;
            document.getElementById("p-baths").value = p.bathrooms;
            document.getElementById("p-province").value = p.province;
            document.getElementById("p-city").value = p.city;
            document.getElementById("p-neighborhood").value = p.neighborhood;
            document.getElementById("p-description").value = p.description;
            document.getElementById("p-address").value = p.address;
            document.getElementById("p-owner-name").value = p.owner_name;
            document.getElementById("p-owner-phone").value = p.owner_phone;
            document.getElementById("p-notes").value = p.internal_notes;
            document.getElementById("p-status").value = p.status;

            imageList = [...p.images];
            renderPhotoThumbs();

            if (p.latitude && p.longitude) {
                document.getElementById("p-lat").value = p.latitude;
                document.getElementById("p-lng").value = p.longitude;
                const coords = [p.latitude, p.longitude];
                mapAdmin.setView(coords, 15);
                if (selectedMarker) selectedMarker.setLatLng(coords);
                else selectedMarker = L.marker(coords).addTo(mapAdmin);
            } else {
                document.getElementById("p-lat").value = "";
                document.getElementById("p-lng").value = "";
                if (selectedMarker) {
                    mapAdmin.removeLayer(selectedMarker);
                    selectedMarker = null;
                }
            }

            document.getElementById("btn-cancel-edit").style.display = "inline-block";
        }

        function cancelEditMode() {
            document.getElementById("form-action-title").textContent = "Crear Propiedad";
            document.getElementById("prop-form").reset();
            document.getElementById("edit-id").value = "";
            document.getElementById("btn-cancel-edit").style.display = "none";
            imageList = [];
            renderPhotoThumbs();
            if (selectedMarker) {
                mapAdmin.removeLayer(selectedMarker);
                selectedMarker = null;
            }
        }

        // Manejador de Registro y Actualización (Previene dobles envíos)
        async function handleFormSubmit(e) {
            e.preventDefault();
            const saveBtn = document.getElementById("btn-save-submit");
            saveBtn.disabled = true;
            saveBtn.textContent = "Guardando...";

            const id = document.getElementById("edit-id").value;
            const token = sessionStorage.getItem("nexo_admin_token");

            const payload = {
                title: document.getElementById("p-title").value,
                type: document.getElementById("p-type").value,
                operation: document.getElementById("p-operation").value,
                price: parseFloat(document.getElementById("p-price").value),
                currency: document.getElementById("p-currency").value || null,
                area: parseFloat(document.getElementById("p-area").value),
                bedrooms: parseInt(document.getElementById("p-beds").value),
                bathrooms: parseInt(document.getElementById("p-baths").value),
                province: document.getElementById("p-province").value,
                city: document.getElementById("p-city").value,
                neighborhood: document.getElementById("p-neighborhood").value,
                description: document.getElementById("p-description").value,
                images: imageList,
                latitude: parseFloat(document.getElementById("p-lat").value) || null,
                longitude: parseFloat(document.getElementById("p-lng").value) || null,
                address: document.getElementById("p-address").value,
                owner_name: document.getElementById("p-owner-name").value,
                owner_phone: document.getElementById("p-owner-phone").value,
                internal_notes: document.getElementById("p-notes").value,
                status: document.getElementById("p-status").value
            };

            const url = id ? `/api/admin/properties/${id}` : "/api/admin/properties";
            const method = id ? "PUT" : "POST";

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("Propiedad procesada exitosamente.");
                    cancelEditMode();
                    loadAdminProperties();
                } else {
                    const err = await response.json();
                    alert(`Error: ${err.error}`);
                }
            } catch (err) {
                alert("Falla del servidor al guardar.");
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = "Guardar Propiedad";
            }
        }

        // Eliminación Segura de Inmuebles
        async function deleteProperty(id) {
            if (!confirm(`¿Está seguro de que desea eliminar la propiedad ${id}? Esta acción es irreversible.`)) return;

            const token = sessionStorage.getItem("nexo_admin_token");
            try {
                const response = await fetch(`/api/admin/properties/${id}`, {
                    method: "DELETE",
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (response.ok) {
                    alert("Propiedad eliminada.");
                    loadAdminProperties();
                } else {
                    alert("Fallo al eliminar propiedad.");
                }
            } catch (err) {
                alert("Error de red.");
            }
        }

        // Delegación sin handlers inline (CSP). Los templates usan data-action.
        document.getElementById("prop-form").addEventListener("submit", handleFormSubmit);

        // Upload: drag & drop + file picker
        const dropzone = document.getElementById("photo-dropzone");
        const fileInput = document.getElementById("photo-file-input");
        dropzone.addEventListener("click", () => fileInput.click());
        fileInput.addEventListener("change", () => { if (fileInput.files.length) uploadPhotos(fileInput.files); fileInput.value = ""; });
        ["dragenter", "dragover"].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add("dragover"); }));
        ["dragleave", "drop"].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove("dragover"); }));
        dropzone.addEventListener("drop", e => { if (e.dataTransfer.files.length) uploadPhotos(e.dataTransfer.files); });

        document.addEventListener("click", e => {
            const t = e.target.closest("[data-action]");
            if (!t) return;
            switch (t.dataset.action) {
                case "login": attemptLogin(); break;
                case "logout": logout(); break;
                case "add-photo": addPhotoUrl(); break;
                case "browse-photos": break;
                case "cancel-edit": cancelEditMode(); break;
                case "delete-photo": deletePhoto(parseInt(t.dataset.photoIndex, 10)); break;
                case "move-photo-left": movePhoto(parseInt(t.dataset.photoIndex, 10), -1); break;
                case "move-photo-right": movePhoto(parseInt(t.dataset.photoIndex, 10), 1); break;
                case "edit-property": enableEditMode(t.dataset.id); break;
                case "delete-property": deleteProperty(t.dataset.id); break;
                case "export-csv": exportCsv(); break;
                case "import-csv": document.getElementById("csv-file-input").click(); break;
            }
        });
        document.getElementById("csv-file-input").addEventListener("change", e => {
            if (e.target.files.length) importCsv(e.target.files[0]);
            e.target.value = "";
        });
    </script>
<script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js").catch(() => {});
        }
    </script>
</body>
</html>
