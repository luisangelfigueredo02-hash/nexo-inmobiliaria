<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Consola de Administración — NEXO</title>
    
    <!-- Enlace al sistema de diseño global -->
    <link rel="stylesheet" href="/variables.css">
    
    <!-- Estilos específicos del panel administrativo (Stripe-like UI) -->
    <style>
        /* Ajuste de cuerpo en la consola */
        body {
            background-color: var(--bg-secondary); /* Fondo gris de precisión */
            min-height: 100vh;
        }

        /* --- ESTADO 1: PANTALLA DE AUTENTICACIÓN (LOGIN CARD) --- */
        .auth-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: var(--space-4);
        }

        .auth-card {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            padding: var(--space-6) var(--space-5);
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
            animation: fadeInCard 0.6s var(--ease-apple);
        }

        @keyframes fadeInCard {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-2);
        }

        .auth-header svg {
            width: 40px;
            height: 40px;
            fill: var(--text-primary);
        }

        .auth-header h1 {
            font-size: var(--text-lg);
            font-weight: var(--weight-bold);
            letter-spacing: -0.03em;
        }

        .auth-header p {
            font-size: var(--text-xs);
            color: var(--text-secondary);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
        }

        .form-group label {
            font-size: var(--text-xs);
            font-weight: var(--weight-semibold);
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input, .form-group select, .form-group textarea {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            padding: var(--space-3);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            color: var(--text-primary);
            outline: none;
            transition: var(--transition-fast);
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--border-focus);
            background-color: var(--bg-primary);
            box-shadow: var(--shadow-focus);
        }

        .login-btn {
            background-color: var(--accent);
            color: var(--text-on-accent);
            padding: var(--space-3);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            font-weight: var(--weight-semibold);
            transition: var(--transition-fast);
            text-align: center;
            margin-top: var(--space-2);
        }

        .login-btn:hover {
            background-color: var(--accent-hover);
        }

        /* --- ESTADO 2: CONSOLA DE ADMINISTRACIÓN ACTIVA --- */
        .admin-layout {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Barra superior de administración */
        .admin-nav {
            height: var(--header-height);
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--space-5);
            position: sticky;
            top: 0;
            z-index: 90;
        }

        .admin-nav .nav-left {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        .admin-nav h2 {
            font-size: var(--text-base);
            font-weight: var(--weight-semibold);
            letter-spacing: -0.02em;
        }

        .admin-nav .badge {
            background-color: var(--bg-secondary);
            color: var(--text-secondary);
            padding: var(--space-1) var(--space-2);
            border-radius: var(--radius-sm);
            font-size: var(--text-xs);
            font-weight: var(--weight-bold);
        }

        .logout-btn {
            font-size: var(--text-xs);
            font-weight: var(--weight-semibold);
            color: var(--text-secondary);
            padding: var(--space-2) var(--space-3);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            transition: var(--transition-fast);
        }

        .logout-btn:hover {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
        }

        /* Espacio de trabajo del administrador */
        .admin-workspace {
            max-width: var(--max-width-content);
            width: 100%;
            margin: 0 auto;
            padding: var(--space-5);
            display: flex;
            flex-direction: column;
            gap: var(--space-5);
        }

        /* Sección de Métricas de Resumen */
        .metrics-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--space-4);
        }

        .metric-card {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
        }

        .metric-card span {
            font-size: var(--text-xs);
            font-weight: var(--weight-semibold);
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric-card strong {
            font-size: var(--text-xl);
            font-weight: var(--weight-bold);
            letter-spacing: -0.03em;
        }

        /* Encabezado del catálogo de administración */
        .workspace-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .create-btn {
            background-color: var(--accent);
            color: var(--text-on-accent);
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            font-weight: var(--weight-semibold);
            display: flex;
            align-items: center;
            gap: var(--space-2);
            transition: var(--transition-fast);
        }

        .create-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Tabla de Gestión de Inventario */
        .table-container {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .admin-table th, .admin-table td {
            padding: var(--space-4);
            border-bottom: 1px solid var(--border-subtle);
            font-size: var(--text-sm);
        }

        .admin-table th {
            background-color: var(--bg-tertiary);
            font-weight: var(--weight-semibold);
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: var(--text-xs);
        }

        .admin-table tr:last-child td {
            border-bottom: none;
        }

        /* Fila de Propiedad */
        .table-img {
            width: 56px;
            height: 40px;
            border-radius: var(--radius-sm);
            background-color: var(--bg-secondary);
            object-fit: cover;
        }

        .prop-info-cell {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        .prop-meta-cell h4 {
            font-weight: var(--weight-semibold);
            font-size: var(--text-sm);
        }

        .prop-meta-cell p {
            color: var(--text-secondary);
            font-size: var(--text-xs);
        }

        /* Acciones de Edición/Eliminación */
        .actions-cell {
            display: flex;
            gap: var(--space-2);
        }

        .action-icon-btn {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-default);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: var(--transition-fast);
        }

        .action-icon-btn:hover {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
        }

        .action-icon-btn.delete:hover {
            background-color: var(--error);
            color: white;
            border-color: var(--error);
        }

        /* --- SLIDE-OVER DRAWER (Formulario Flotante de Alta Fidelidad) --- */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition-normal);
            backdrop-filter: blur(4px);
        }

        .drawer-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .drawer-aside {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 480px;
            height: 100%;
            background-color: var(--bg-primary);
            z-index: 210;
            box-shadow: var(--shadow-lg);
            transform: translateX(100%);
            transition: var(--transition-normal);
            display: flex;
            flex-direction: column;
        }

        .drawer-aside.open {
            transform: translateX(0);
        }

        .drawer-header {
            padding: var(--space-4) var(--space-5);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .drawer-header h3 {
            font-size: var(--text-md);
            font-weight: var(--weight-bold);
            letter-spacing: -0.02em;
        }

        .close-drawer-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-round);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: var(--transition-fast);
        }

        .close-drawer-btn:hover {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
        }

        .drawer-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: var(--space-5);
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
        }

        .drawer-footer {
            padding: var(--space-4) var(--space-5);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            gap: var(--space-2);
        }

        .drawer-footer button {
            flex: 1;
            padding: var(--space-3);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            font-weight: var(--weight-semibold);
            transition: var(--transition-fast);
        }

        .save-btn {
            background-color: var(--accent);
            color: var(--text-on-accent);
        }

        .save-btn:hover {
            background-color: var(--accent-hover);
        }

        .cancel-btn {
            border: 1px solid var(--border-default);
            color: var(--text-secondary);
        }

        .cancel-btn:hover {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
        }

        /* Adaptabilidad Responsiva */
        @media (max-width: 768px) {
            .admin-nav {
                padding: 0 var(--space-4);
            }

            .admin-workspace {
                padding: var(--space-4);
                gap: var(--space-4);
            }

            .admin-table th:nth-child(3), .admin-table td:nth-child(3) {
                display: none; /* Esconder tipo de propiedad en móvil */
            }

            .admin-table th:nth-child(4), .admin-table td:nth-child(4) {
                display: none; /* Esconder precio en móvil si hay poco espacio */
            }
        }
    </style>
</head>
<body>

    <!-- ==========================================================================
       ESTADO 1: VISTA DE AUTENTICACIÓN (LOGIN)
       ========================================================================== -->
    <div class="auth-wrapper" id="auth-view">
        <form class="auth-card" id="login-form" onsubmit="event.preventDefault(); handleLogin();">
            <div class="auth-header">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3L2 12h3v8h14v-8h3L12 3zm2 15h-4v-4h4v4z"/>
                </svg>
                <h1>NEXO Admin</h1>
                <p>Consola interna de gestión inmobiliaria</p>
            </div>
            
            <div class="form-group">
                <label for="admin-email">Usuario</label>
                <input type="email" id="admin-email" placeholder="admin@nexoinmobiliaria.com" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="admin-password">Contraseña</label>
                <input type="password" id="admin-password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="login-btn">Iniciar Sesión</button>
        </form>
    </div>

    <!-- ==========================================================================
       ESTADO 2: CONSOLA DE ADMINISTRACIÓN ACTIVA (HIDDEN BY DEFAULT)
       ========================================================================== -->
    <div class="admin-layout" id="dashboard-view" style="display: none;">
        
        <!-- Navbar Superior Consola -->
        <header class="admin-nav">
            <div class="nav-left">
                <h2>Consola NEXO</h2>
                <span class="badge">PRODUCCIÓN</span>
            </div>
            <button class="logout-btn" onclick="handleLogout()">Cerrar Sesión</button>
        </header>

        <!-- Espacio de trabajo -->
        <main class="admin-workspace">
            
            <!-- KPIs Generales -->
            <section class="metrics-row">
                <div class="metric-card">
                    <span>Total Inventario</span>
                    <strong id="kpi-total">0</strong>
                </div>
                <div class="metric-card">
                    <span>Precio Promedio</span>
                    <strong id="kpi-avg-price">$0 USD</strong>
                </div>
            </section>

            <!-- Encabezado Operativo -->
            <div class="workspace-header">
                <h3>Inventario de Viviendas</h3>
                <button class="create-btn" onclick="openFormDrawer()">
                    <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: currentColor;">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                    Nueva Propiedad
                </button>
            </div>

            <!-- Tabla de datos principal -->
            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Propiedad</th>
                            <th>Ubicación</th>
                            <th>Tipo</th>
                            <th>Precio</th>
                            <th style="width: 100px; text-align: center;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body">
                        <!-- Las filas dinámicas se inyectarán aquí -->
                    </tbody>
                </table>
            </div>

        </main>
    </div>

    <!-- ==========================================================================
       MODAL FORMULARIO DRAWER (SLIDE-OVER DESDE LA DERECHA)
       ========================================================================== -->
    <div class="drawer-overlay" id="drawer-overlay" onclick="closeFormDrawer()"></div>
    
    <aside class="drawer-aside" id="drawer-aside">
        <header class="drawer-header">
            <h3 id="drawer-title">Nueva Propiedad</h3>
            <button class="close-drawer-btn" onclick="closeFormDrawer()" aria-label="Cerrar formulario">
                <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: currentColor;">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
        </header>

        <!-- Contenido scrollable del formulario -->
        <form class="drawer-content" id="property-form" onsubmit="event.preventDefault(); saveProperty();">
            <input type="hidden" id="form-property-id">

            <div class="form-group">
                <label for="form-title">Título de la publicación</label>
                <input type="text" id="form-title" placeholder="Casa moderna con vista al valle" required>
            </div>

            <div class="form-group">
                <label for="form-price">Precio (USD)</label>
                <input type="number" id="form-price" placeholder="185000" required>
            </div>

            <div class="form-group">
                <label for="form-type">Tipo de propiedad</label>
                <select id="form-type" required>
                    <option value="Casa">Casa</option>
                    <option value="Departamento">Departamento</option>
                    <option value="Terreno">Terreno</option>
                </select>
            </div>

            <div class="form-group">
                <label for="form-transaction">Tipo de transacción</label>
                <select id="form-transaction" required>
                    <option value="Venta">Venta</option>
                    <option value="Alquiler">Alquiler</option>
                </select>
            </div>

            <div class="form-group">
                <label for="form-location">Dirección completa</label>
                <input type="text" id="form-location" placeholder="Av. Primavera 123, Miraflores" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3);">
                <div class="form-group">
                    <label for="form-bedrooms">Habitaciones</label>
                    <input type="number" id="form-bedrooms" placeholder="3" required min="0">
                </div>
                <div class="form-group">
                    <label for="form-bathrooms">Baños</label>
                    <input type="number" id="form-bathrooms" placeholder="2" required min="0">
                </div>
            </div>

            <div class="form-group">
                <label for="form-area">Superficie útil (m²)</label>
                <input type="number" id="form-area" placeholder="120" required min="1">
            </div>

            <div class="form-group">
                <label for="form-image">URL de la imagen destacada</label>
                <input type="url" id="form-image" placeholder="https://ejemplo.com/casa.jpg" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3);">
                <div class="form-group">
                    <label for="form-lat">Latitud (Geolocalización)</label>
                    <input type="text" id="form-lat" placeholder="-12.0463">
                </div>
                <div class="form-group">
                    <label for="form-lng">Longitud (Geolocalización)</label>
                    <input type="text" id="form-lng" placeholder="-77.0427">
                </div>
            </div>

            <div class="form-group">
                <label for="form-description">Descripción interna / pública</label>
                <textarea id="form-description" rows="4" placeholder="Describe los beneficios de vivir en este inmueble..."></textarea>
            </div>
        </form>

        <footer class="drawer-footer">
            <button type="button" class="cancel-btn" onclick="closeFormDrawer()">Cancelar</button>
            <button type="submit" form="property-form" class="save-btn">Guardar Propiedad</button>
        </footer>
    </aside>

    <!-- Lógica de Negocio, Seguridad y CRUD (Vanilla Console Engine) -->
    <script>
        const API_ENDPOINT = '/api/properties';
        let propertiesList = [];

        document.addEventListener('DOMContentLoaded', () => {
            evaluateAuthState();
        });

        // 1. Validar el estado de autenticación (Client-side Security State)
        function evaluateAuthState() {
            const token = localStorage.getItem('nexo_admin_token');
            const authView = document.getElementById('auth-view');
            const dashboardView = document.getElementById('dashboard-view');

            if (token === 'valid_admin_session') {
                authView.style.display = 'none';
                dashboardView.style.display = 'flex';
                loadInventory();
            } else {
                authView.style.display = 'flex';
                dashboardView.style.display = 'none';
            }
        }

        // Procesar inicio de sesión
        function handleLogin() {
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;

            // Validación simulación local premium (Fácilmente enlazable a tu Worker /api/login)
            if (email === 'admin@nexoinmobiliaria.com' && password === 'admin123') {
                localStorage.setItem('nexo_admin_token', 'valid_admin_session');
                evaluateAuthState();
            } else {
                alert('Credenciales administrativas incorrectas. Intenta nuevamente.');
            }
        }

        // Procesar cierre de sesión
        function handleLogout() {
            localStorage.removeItem('nexo_admin_token');
            evaluateAuthState();
        }

        // 2. Operaciones CRUD (Consultar Inventario sobre Cloudflare D1)
        async function loadInventory() {
            const tableBody = document.getElementById('admin-table-body');
            
            // Render de skeletons de carga internos de la tabla
            tableBody.innerHTML = `
                <tr><td colspan="5" class="shimmer-effect" style="height: 48px; border-radius: var(--radius-sm);"></td></tr>
                <tr><td colspan="5" class="shimmer-effect" style="height: 48px; border-radius: var(--radius-sm); margin-top: 4px;"></td></tr>
            `;

            try {
                const response = await fetch(API_ENDPOINT);
                if (!response.ok) throw new Error('Fallo de conexión API.');

                propertiesList = await response.json();
                renderInventoryTable(propertiesList, tableBody);
                calculateKPIs(propertiesList);

            } catch (error) {
                console.error(error);
                tableBody.innerHTML = `
                    <tr><td colspan="5" style="text-align: center; color: var(--error); padding: var(--space-4);">
                        Fallo al establecer comunicación con Cloudflare D1. Reintente en unos instantes.
                    </td></tr>
                `;
            }
        }

        // Renderizar dinámicamente las filas de la tabla
        function renderInventoryTable(properties, container) {
            container.innerHTML = '';

            if (properties.length === 0) {
                container.innerHTML = `
                    <tr><td colspan="5" style="text-align: center; color: var(--text-secondary); padding: var(--space-5);">
                        No hay propiedades registradas en el catálogo actual de NEXO.
                    </td></tr>
                `;
                return;
            }

            properties.forEach(property => {
                const row = document.createElement('tr');
                
                const formattedPrice = new Intl.NumberFormat('en-US', {
                    style: 'currency', currency: 'USD', maximumFractionDigits: 0
                }).format(property.price);

                row.innerHTML = `
                    <td>
                        <div class="prop-info-cell">
                            <img class="table-img" src="${property.image_url || 'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=150&q=80'}" alt="${property.title}">
                            <div class="prop-meta-cell">
                                <h4>${property.title}</h4>
                                <p>ID: ${property.id}</p>
                            </div>
                        </div>
                    </td>
                    <td>${property.location || 'No provista'}</td>
                    <td>${property.type || 'Casa'}</td>
                    <td style="font-weight: var(--weight-bold);">${formattedPrice}</td>
                    <td>
                        <div class="actions-cell">
                            <button class="action-icon-btn" aria-label="Editar" onclick="openFormDrawer(${property.id})">
                                <svg viewBox="0 0 24 24" style="width:16px; height:16px; fill:currentColor;">
                                    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                                </svg>
                            </button>
                            <button class="action-icon-btn delete" aria-label="Eliminar" onclick="deleteProperty(${property.id})">
                                <svg viewBox="0 0 24 24" style="width:16px; height:16px; fill:currentColor;">
                                    <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                                </svg>
                            </button>
                        </div>
                    </td>
                `;

                container.appendChild(row);
            });
        }

        // Calcular KPIs en tiempo real de forma dinámica
        function calculateKPIs(properties) {
            document.getElementById('kpi-total').textContent = properties.length;
            
            if (properties.length === 0) {
                document.getElementById('kpi-avg-price').textContent = '$0 USD';
                return;
            }

            const totalSum = properties.reduce((acc, p) => acc + (parseFloat(p.price) || 0), 0);
            const avg = totalSum / properties.length;

            document.getElementById('kpi-avg-price').textContent = new Intl.NumberFormat('en-US', {
                style: 'currency', currency: 'USD', maximumFractionDigits: 0
            }).format(avg);
        }

        // 3. Crear o Modificar Propiedades (API POST/PUT Engine)
        async function saveProperty() {
            const id = document.getElementById('form-property-id').value;
            
            const payload = {
                title: document.getElementById('form-title').value,
                price: parseFloat(document.getElementById('form-price').value),
                type: document.getElementById('form-type').value,
                type_transaction: document.getElementById('form-transaction').value,
                location: document.getElementById('form-location').value,
                bedrooms: parseInt(document.getElementById('form-bedrooms').value),
                bathrooms: parseInt(document.getElementById('form-bathrooms').value),
                area: parseInt(document.getElementById('form-area').value),
                image_url: document.getElementById('form-image').value,
                latitude: document.getElementById('form-lat').value || null,
                longitude: document.getElementById('form-lng').value || null,
                description: document.getElementById('form-description').value
            };

            const method = id ? 'PUT' : 'POST';
            const endpoint = id ? `${API_ENDPOINT}?id=${id}` : API_ENDPOINT;

            try {
                const response = await fetch(endpoint, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('Fallo al guardar.');

                closeFormDrawer();
                loadInventory();

            } catch (error) {
                console.error(error);
                alert('Ocurrió un error al intentar guardar la propiedad en Cloudflare D1.');
            }
        }

        // Eliminar Propiedades (API DELETE Engine)
        async function deleteProperty(id) {
            if (!confirm('¿Estás seguro de que deseas eliminar permanentemente esta propiedad del catálogo de NEXO? This action cannot be undone.')) return;

            try {
                const response = await fetch(`${API_ENDPOINT}?id=${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Fallo al eliminar.');

                loadInventory();

            } catch (error) {
                console.error(error);
                alert('No se pudo eliminar la propiedad. Verifica la conexión.');
            }
        }

        // 4. Gestión del Slide-Over Drawer de Formulario
        function openFormDrawer(id = null) {
            const overlay = document.getElementById('drawer-overlay');
            const drawer = document.getElementById('drawer-aside');
            const title = document.getElementById('drawer-title');

            // Limpiar formulario por defecto
            document.getElementById('property-form').reset();
            document.getElementById('form-property-id').value = '';

            if (id) {
                title.textContent = 'Editar Propiedad';
                const property = propertiesList.find(p => p.id === id);
                if (property) populateForm(property);
            } else {
                title.textContent = 'Nueva Propiedad';
            }

            overlay.classList.add('open');
            drawer.classList.add('open');
        }

        function closeFormDrawer() {
            const overlay = document.getElementById('drawer-overlay');
            const drawer = document.getElementById('drawer-aside');

            overlay.classList.remove('open');
            drawer.classList.remove('open');
        }

        // Rellenar formulario con datos existentes al editar
        function populateForm(property) {
            document.getElementById('form-property-id').value = property.id;
            document.getElementById('form-title').value = property.title || '';
            document.getElementById('form-price').value = property.price || '';
            document.getElementById('form-type').value = property.type || 'Casa';
            document.getElementById('form-transaction').value = property.type_transaction || 'Venta';
            document.getElementById('form-location').value = property.location || '';
            document.getElementById('form-bedrooms').value = property.bedrooms || 0;
            document.getElementById('form-bathrooms').value = property.bathrooms || 0;
            document.getElementById('form-area').value = property.area || 0;
            document.getElementById('form-image').value = property.image_url || '';
            document.getElementById('form-lat').value = property.latitude || '';
            document.getElementById('form-lng').value = property.longitude || '';
            document.getElementById('form-description').value = property.description || '';
        }
    </script>
</body>
</html>
