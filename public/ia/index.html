<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NEXO IA — Tu Asesor Inmobiliario Inteligente</title>
    
    <!-- Enlace al sistema de diseño global -->
    <link rel="stylesheet" href="/variables.css">
    
    <!-- Estilos específicos del espacio conversacional (Premium & Clean) -->
    <style>
        /* Ajuste de cabecera fija */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--space-5);
            transition: var(--transition-normal);
        }

        .logo {
            font-size: var(--text-lg);
            font-weight: var(--weight-bold);
            color: var(--text-primary);
            letter-spacing: -0.03em;
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .logo svg {
            width: 24px;
            height: 24px;
            fill: var(--text-primary);
        }

        nav {
            display: flex;
            align-items: center;
            gap: var(--space-5);
        }

        nav a {
            font-size: var(--text-sm);
            font-weight: var(--weight-medium);
            color: var(--text-secondary);
            padding: var(--space-2) var(--space-3);
            border-radius: var(--radius-sm);
        }

        nav a:hover, nav a.active {
            color: var(--text-primary);
            background-color: var(--bg-secondary);
        }

        /* Área de Trabajo Conversacional Centrada */
        .chat-workspace {
            max-width: 800px;
            margin: 0 auto;
            padding: calc(var(--header-height) + var(--space-4)) var(--space-4) calc(100px + var(--safe-bottom-mobile));
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Pantalla de Introducción Minimalista (Siri/Linear Style) */
        .ai-welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin: auto 0;
            padding: var(--space-6) 0;
            gap: var(--space-4);
            animation: fadeInWelcome 0.8s var(--ease-apple);
        }

        @keyframes fadeInWelcome {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ai-welcome svg.sparkle {
            width: 56px;
            height: 56px;
            fill: var(--text-primary);
            animation: pulseSparkle 3s infinite ease-in-out;
        }

        @keyframes pulseSparkle {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.08) rotate(15deg); opacity: 0.8; }
        }

        .ai-welcome h1 {
            font-size: var(--text-xl);
            font-weight: var(--weight-bold);
            letter-spacing: -0.04em;
            line-height: var(--line-height-tight);
            color: var(--text-primary);
        }

        .ai-welcome p {
            font-size: var(--text-base);
            color: var(--text-secondary);
            max-width: 440px;
            line-height: var(--line-height-normal);
        }

        /* Píldoras de sugerencias rápidas (Glass-Effect) */
        .suggestions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--space-3);
            width: 100%;
            max-width: 600px;
            margin-top: var(--space-4);
        }

        .suggestion-pill {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            padding: var(--space-3);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            font-weight: var(--weight-medium);
            color: var(--text-secondary);
            text-align: left;
            transition: var(--transition-fast);
            cursor: pointer;
        }

        .suggestion-pill:hover {
            border-color: var(--border-default);
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            transform: translateY(-1px);
        }

        /* Registro de Conversación (Log) */
        .chat-log {
            display: flex;
            flex-direction: column;
            gap: var(--space-5);
            width: 100%;
        }

        /* Burbujas de Chat */
        .chat-bubble {
            display: flex;
            gap: var(--space-3);
            width: 100%;
            animation: slideInBubble 0.4s var(--ease-apple);
        }

        @keyframes slideInBubble {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-bubble.user {
            justify-content: flex-end;
        }

        .bubble-avatar {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-round);
            background-color: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid var(--border-subtle);
        }

        .bubble-avatar svg {
            width: 18px;
            height: 18px;
            fill: var(--text-primary);
        }

        .bubble-text {
            max-width: 80%;
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-lg);
            font-size: var(--text-base);
            line-height: var(--line-height-normal);
        }

        /* Estilo de burbuja del Asistente (NEXO IA) */
        .chat-bubble.ai .bubble-text {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border-top-left-radius: var(--radius-sm);
        }

        /* Estilo de burbuja del Usuario */
        .chat-bubble.user .bubble-text {
            background-color: var(--accent);
            color: var(--text-on-accent);
            border-top-right-radius: var(--radius-sm);
        }

        /* Sub-grilla para inyectar propiedades recomendadas dentro del chat */
        .ai-recommendations {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: var(--space-4);
            width: 100%;
            margin-top: var(--space-3);
            padding-left: calc(36px + var(--space-3)); /* Alineado perfectamente con la burbuja de IA */
        }

        /* Indicador de Escritura Orgánico (Pulsing Dots) */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: var(--space-2) var(--space-1);
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background-color: var(--text-secondary);
            border-radius: var(--radius-round);
            display: inline-block;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Barra de Entrada de Mensajes Flotante (Apple Intelligence Style) */
        .input-wrapper {
            position: fixed;
            bottom: var(--space-5);
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - var(--space-5));
            max-width: 760px;
            z-index: 90;
        }

        .input-bar {
            background-color: var(--bg-overlay);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-round);
            padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4);
            display: flex;
            align-items: center;
            gap: var(--space-3);
            box-shadow: var(--shadow-lg);
        }

        .input-bar input {
            flex-grow: 1;
            border: none;
            background: none;
            outline: none;
            font-size: var(--text-base);
            color: var(--text-primary);
        }

        .input-bar input::placeholder {
            color: var(--text-tertiary);
        }

        .send-btn {
            width: 40px;
            height: 40px;
            background-color: var(--accent);
            color: var(--text-on-accent);
            border-radius: var(--radius-round);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-fast);
        }

        .send-btn:hover {
            background-color: var(--accent-hover);
            transform: scale(1.05);
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Adaptabilidad Responsiva */
        @media (max-width: 768px) {
            header {
                padding: 0 var(--space-4);
            }

            nav {
                display: none;
            }

            .chat-workspace {
                padding-bottom: calc(110px + var(--safe-bottom-mobile));
            }

            .bubble-text {
                max-width: 90%;
                font-size: var(--text-sm);
            }

            .ai-recommendations {
                grid-template-columns: 1fr;
                padding-left: 0; /* Menos margen en móviles para ganar espacio */
            }

            .suggestions-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
