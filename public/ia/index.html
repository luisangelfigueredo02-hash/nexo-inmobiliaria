<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NEXO IA — Tu Asesor Inmobiliario Inteligente</title>
    
    <!-- Enlace al sistema de diseño global -->
    <link rel="stylesheet" href="/variables.css">
    
    <!-- Estilos específicos del espacio conversacional (Premium & Clean) -->
    <style>
        /* Ajuste de cabecera fija */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--space-5);
            transition: var(--transition-normal);
        }

        .logo {
            font-size: var(--text-lg);
            font-weight: var(--weight-bold);
            color: var(--text-primary);
            letter-spacing: -0.03em;
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .logo svg {
            width: 24px;
            height: 24px;
            fill: var(--text-primary);
        }

        nav {
            display: flex;
            align-items: center;
            gap: var(--space-5);
        }

        nav a {
            font-size: var(--text-sm);
            font-weight: var(--weight-medium);
            color: var(--text-secondary);
            padding: var(--space-2) var(--space-3);
            border-radius: var(--radius-sm);
        }

        nav a:hover, nav a.active {
            color: var(--text-primary);
            background-color: var(--bg-secondary);
        }

        /* Área de Trabajo Conversacional Centrada */
        .chat-workspace {
            max-width: 800px;
            margin: 0 auto;
            padding: calc(var(--header-height) + var(--space-4)) var(--space-4) calc(100px + var(--safe-bottom-mobile));
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Pantalla de Introducción Minimalista (Siri/Linear Style) */
        .ai-welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin: auto 0;
            padding: var(--space-6) 0;
            gap: var(--space-4);
            animation: fadeInWelcome 0.8s var(--ease-apple);
        }

        @keyframes fadeInWelcome {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ai-welcome svg.sparkle {
            width: 56px;
            height: 56px;
            fill: var(--text-primary);
            animation: pulseSparkle 3s infinite ease-in-out;
        }

        @keyframes pulseSparkle {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.08) rotate(15deg); opacity: 0.8; }
        }

        .ai-welcome h1 {
            font-size: var(--text-xl);
            font-weight: var(--weight-bold);
            letter-spacing: -0.04em;
            line-height: var(--line-height-tight);
            color: var(--text-primary);
        }

        .ai-welcome p {
            font-size: var(--text-base);
            color: var(--text-secondary);
            max-width: 440px;
            line-height: var(--line-height-normal);
        }

        /* Píldoras de sugerencias rápidas (Glass-Effect) */
        .suggestions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--space-3);
            width: 100%;
            max-width: 600px;
            margin-top: var(--space-4);
        }

        .suggestion-pill {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            padding: var(--space-3);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            font-weight: var(--weight-medium);
            color: var(--text-secondary);
            text-align: left;
            transition: var(--transition-fast);
            cursor: pointer;
        }

        .suggestion-pill:hover {
            border-color: var(--border-default);
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            transform: translateY(-1px);
        }

        /* Registro de Conversación (Log) */
        .chat-log {
            display: flex;
            flex-direction: column;
            gap: var(--space-5);
            width: 100%;
        }

        /* Burbujas de Chat */
        .chat-bubble {
            display: flex;
            gap: var(--space-3);
            width: 100%;
            animation: slideInBubble 0.4s var(--ease-apple);
        }

        @keyframes slideInBubble {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-bubble.user {
            justify-content: flex-end;
        }

        .bubble-avatar {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-round);
            background-color: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid var(--border-subtle);
        }

        .bubble-avatar svg {
            width: 18px;
            height: 18px;
            fill: var(--text-primary);
        }

        .bubble-text {
            max-width: 80%;
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-lg);
            font-size: var(--text-base);
            line-height: var(--line-height-normal);
        }

        /* Estilo de burbuja del Asistente (NEXO IA) */
        .chat-bubble.ai .bubble-text {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border-top-left-radius: var(--radius-sm);
        }

        /* Estilo de burbuja del Usuario */
        .chat-bubble.user .bubble-text {
            background-color: var(--accent);
            color: var(--text-on-accent);
            border-top-right-radius: var(--radius-sm);
        }

        /* Sub-grilla para inyectar propiedades recomendadas dentro del chat */
        .ai-recommendations {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: var(--space-4);
            width: 100%;
            margin-top: var(--space-3);
            padding-left: calc(36px + var(--space-3)); /* Alineado perfectamente con la burbuja de IA */
        }

        /* Indicador de Escritura Orgánico (Pulsing Dots) */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: var(--space-2) var(--space-1);
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background-color: var(--text-secondary);
            border-radius: var(--radius-round);
            display: inline-block;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Barra de Entrada de Mensajes Flotante (Apple Intelligence Style) */
        .input-wrapper {
            position: fixed;
            bottom: var(--space-5);
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - var(--space-5));
            max-width: 760px;
            z-index: 90;
        }

        .input-bar {
            background-color: var(--bg-overlay);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-round);
            padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4);
            display: flex;
            align-items: center;
            gap: var(--space-3);
            box-shadow: var(--shadow-lg);
        }

        .input-bar input {
            flex-grow: 1;
            border: none;
            background: none;
            outline: none;
            font-size: var(--text-base);
            color: var(--text-primary);
        }

        .input-bar input::placeholder {
            color: var(--text-tertiary);
        }

        .send-btn {
            width: 40px;
            height: 40px;
            background-color: var(--accent);
            color: var(--text-on-accent);
            border-radius: var(--radius-round);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-fast);
        }

        .send-btn:hover {
            background-color: var(--accent-hover);
            transform: scale(1.05);
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Adaptabilidad Responsiva */
        @media (max-width: 768px) {
            header {
                padding: 0 var(--space-4);
            }

            nav {
                display: none;
            }

            .chat-workspace {
                padding-bottom: calc(110px + var(--safe-bottom-mobile));
            }

            .bubble-text {
                max-width: 90%;
                font-size: var(--text-sm);
            }

            .ai-recommendations {
                grid-template-columns: 1fr;
                padding-left: 0; /* Menos margen en móviles para ganar espacio */
            }

            .suggestions-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Cabecera de Navegación Premium con efecto glass -->
    <header class="glass-effect">
        <a href="/" class="logo">
            <svg viewBox="0 0 24 24">
                <path d="M12 3L2 12h3v8h14v-8h3L12 3zm2 15h-4v-4h4v4z"/>
            </svg>
            NEXO
        </a>
        <nav>
            <a href="/">Propiedades</a>
            <a href="/mapa/index.html">Mapa</a>
            <a href="/comparar/index.html">Comparar</a>
            <a href="/ia/index.html" class="active">Chat IA</a>
            <a href="/admin.html" style="border: 1px solid var(--border-default);">Admin</a>
        </nav>
    </header>

    <!-- Contenedor del Espacio de Conversación -->
    <main class="chat-workspace">

        <!-- Pantalla de Bienvenida Inicial -->
        <div class="ai-welcome" id="welcome-screen">
            <svg class="sparkle" viewBox="0 0 24 24">
                <path d="M12 2l2.4 4.9L19.3 7.6l-3.6 3.5.9 5.3-4.6-2.4-4.6 2.4.9-5.3-3.6-3.5 4.9-.7L12 2zm0 4.5l-1.3 2.7-3 .4 2.2 2.1-.5 3 2.6-1.4 2.6 1.4-.5-3 2.2-2.1-3-.4-1.3-2.7z"/>
            </svg>
            <h1>Hola, soy tu asesor de NEXO IA</h1>
            <p>Dime qué tipo de hogar estás buscando, tu presupuesto o tus preferencias de vida, y encontraré las mejores opciones estructuradas en segundos.</p>
            
            <div class="suggestions-grid">
                <button class="suggestion-pill" onclick="sendSuggestedQuery('Departamentos modernos con terraza')">
                    "Departamentos modernos con terraza"
                </button>
                <button class="suggestion-pill" onclick="sendSuggestedQuery('Casas familiares de menos de $200,000 USD')">
                    "Casas de menos de $200k USD"
                </button>
            </div>
        </div>

        <!-- Registro de Conversación Activa -->
        <section class="chat-log" id="chat-container" style="display: none;"></section>

    </main>

    <!-- Barra de Entrada Flotante -->
    <footer class="input-wrapper">
        <form class="input-bar" id="chat-form" onsubmit="event.preventDefault(); submitMessage();">
            <input type="text" id="chat-input" placeholder="Pregunta a NEXO IA..." autocomplete="off">
            <button type="submit" class="send-btn" aria-label="Enviar mensaje">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </form>
    </footer>

    <!-- Lógica Conversacional Integrada de NEXO IA (Vanilla engine) -->
    <script>
        const chatContainer = document.getElementById('chat-container');
        const welcomeScreen = document.getElementById('welcome-screen');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');

        // Enviar consulta sugerida desde las píldoras
        function sendSuggestedQuery(queryText) {
            chatInput.value = queryText;
            submitMessage();
        }

        // Procesar y enviar el mensaje
        async function submitMessage() {
            const query = chatInput.value.trim();
            if (!query) return;

            // Transición fluida de pantalla de bienvenida a chat log
            if (welcomeScreen.style.display !== 'none') {
                welcomeScreen.style.display = 'none';
                chatContainer.style.display = 'flex';
            }

            // 1. Renderizar mensaje del usuario de forma inmediata (Optimistic UI)
            appendMessage('user', query);
            chatInput.value = ''; // Limpiar barra inmediatamente

            // 2. Renderizar indicador de pensamiento "NEXO IA está pensando..."
            const typingIndicatorId = appendTypingIndicator();

            try {
                // Petición a la API de Workers AI de NEXO
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: query })
                });

                // Remover indicador de escritura
                removeTypingIndicator(typingIndicatorId);

                if (!response.ok) throw new Error('Error al conectar con la API de IA.');

                const data = await response.json();
                
                // 3. Renderizar la respuesta conversacional de la IA
                appendMessage('ai', data.reply || 'Aquí tienes las mejores opciones de NEXO para ti.');

                // 4. Si la IA recomendó propiedades específicas, inyectar el grid de propiedades directamente
                if (data.properties && data.properties.length > 0) {
                    appendPropertiesGrid(data.properties);
                }

            } catch (error) {
                console.error(error);
                removeTypingIndicator(typingIndicatorId);
                appendMessage('ai', 'Lo siento, tuve dificultades al procesar tu consulta con la base de datos de NEXO. ¿Podrías reintentarlo?');
            }
        }

        // Renderizar burbuja de mensaje con semántica premium
        function appendMessage(sender, text) {
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${sender}`;

            // Avatar de Siri/Sparkle si es IA, o avatar genérico si es usuario
            const avatarHtml = sender === 'ai' ? `
                <div class="bubble-avatar">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2l2.4 4.9L19.3 7.6l-3.6 3.5.9 5.3-4.6-2.4-4.6 2.4.9-5.3-3.6-3.5 4.9-.7L12 2z"/>
                    </svg>
                </div>
            ` : '';

            bubble.innerHTML = `
                ${avatarHtml}
                <div class="bubble-text">${text}</div>
            `;

            chatContainer.appendChild(bubble);
            scrollToBottom();
        }

        // Renderizar el indicador animado de escritura
        function appendTypingIndicator() {
            const indicatorId = 'indicator_' + Date.now();
            const bubble = document.createElement('div');
            bubble.className = 'chat-bubble ai';
            bubble.id = indicatorId;

            bubble.innerHTML = `
                <div class="bubble-avatar">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2l2.4 4.9L19.3 7.6l-3.6 3.5.9 5.3-4.6-2.4-4.6 2.4.9-5.3-3.6-3.5 4.9-.7L12 2z"/>
                    </svg>
                </div>
                <div class="bubble-text">
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;

            chatContainer.appendChild(bubble);
            scrollToBottom();
            return indicatorId;
        }

        function removeTypingIndicator(id) {
            const indicator = document.getElementById(id);
            if (indicator) indicator.remove();
        }

        // Renderizar cuadrícula de propiedades en formato .property-card compatible con variables.css
        function appendPropertiesGrid(properties) {
            const grid = document.createElement('div');
            grid.className = 'ai-recommendations';

            properties.forEach(property => {
                const card = document.createElement('article');
                card.className = 'property-card';

                const formattedPrice = new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD',
                    maximumFractionDigits: 0
                }).format(property.price);

                card.innerHTML = `
                    <div class="image-container" style="aspect-ratio: 16/10;">
                        <span class="badge" style="font-size: 10px; padding: 2px 6px;">${property.type_transaction || 'Venta'}</span>
                        <img src="${property.image_url || 'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=600&q=80'}" alt="${property.title}" loading="lazy">
                    </div>
                    <div class="details-container" style="padding: var(--space-3); gap: 4px;">
                        <div class="price" style="font-size: var(--text-base);">${formattedPrice}</div>
                        <h4 class="title" style="font-size: var(--text-sm);">${property.title}</h4>
                        <div class="location" style="font-size: var(--text-xs);">${property.location || 'Ubicación no disponible'}</div>
                    </div>
                `;

                // Clic directo a la propiedad desde el chat de IA
                card.style.cursor = 'pointer';
                card.addEventListener('click', () => {
                    window.location.href = `/property.html?id=${property.id}`;
                });

                grid.appendChild(card);
            });

            chatContainer.appendChild(grid);
            scrollToBottom();
        }

        // Scroll de vista automático suave
        function scrollToBottom() {
            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: 'smooth'
            });
        }
    </script>
</body>
</html>
