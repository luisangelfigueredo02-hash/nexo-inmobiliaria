<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f5f5f7">

  <title>NEXO — Mapa</title>

  <!-- =====================================================
       MAPBOX GL JS
       ===================================================== -->

  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css"
    rel="stylesheet"
  >

  <script
    src="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js"
  ></script>

  <style>

    :root {
      --bg: #f5f5f7;
      --white: #ffffff;
      --black: #111111;
      --text: #171717;
      --muted: #777777;
      --border: rgba(0,0,0,.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Inter,
        system-ui,
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    /* =====================================================
       MAPA
       ===================================================== */

    #map {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 1;
    }

    /* =====================================================
       BARRA SUPERIOR
       ===================================================== */

    .topbar {

      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      z-index: 100;

      padding:
        calc(12px + env(safe-area-inset-top, 0px))
        14px
        10px;

      pointer-events: none;
    }

    .topbar-inner {

      width: min(760px, 100%);

      margin: auto;

      display: flex;

      align-items: center;

      gap: 9px;

      pointer-events: auto;
    }

    .brand {

      flex: 0 0 auto;

      padding: 12px 15px;

      border-radius: 16px;

      background:
        rgba(255,255,255,.94);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        0 8px 30px rgba(0,0,0,.12);

      font-size: 17px;

      font-weight: 850;

      letter-spacing: -.06em;
    }

    .search {

      flex: 1;

      min-width: 0;

      display: flex;

      align-items: center;

      overflow: hidden;

      border-radius: 16px;

      background:
        rgba(255,255,255,.95);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        0 8px 30px rgba(0,0,0,.12);
    }

    .search-icon {

      padding-left: 14px;

      font-size: 16px;
    }

    .search input {

      width: 100%;

      min-width: 0;

      padding: 13px 10px;

      border: 0;

      outline: 0;

      background: transparent;

      color: #111;

      font-size: 13px;
    }

    .clear-search {

      display: none;

      flex: 0 0 auto;

      width: 35px;
      height: 35px;

      margin-right: 4px;

      border-radius: 50%;

      background: #eeeeef;

      color: #555;

      font-size: 16px;
    }

    .clear-search.show {
      display: block;
    }

    /* =====================================================
       FILTROS
       ===================================================== */

    .filters {

      position: fixed;

      top:
        calc(70px + env(safe-area-inset-top, 0px));

      left: 0;
      right: 0;

      z-index: 90;

      padding: 0 14px;

      pointer-events: none;
    }

    .filters-inner {

      width: min(760px, 100%);

      margin: auto;

      display: flex;

      gap: 8px;

      overflow-x: auto;

      scrollbar-width: none;

      pointer-events: auto;
    }

    .filters-inner::-webkit-scrollbar {
      display: none;
    }

    .filter {

      flex: 0 0 auto;

      padding: 10px 13px;

      border-radius: 999px;

      border:
        1px solid rgba(0,0,0,.07);

      background:
        rgba(255,255,255,.94);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      color: #444;

      font-size: 11px;

      font-weight: 750;

      box-shadow:
        0 5px 20px rgba(0,0,0,.08);
    }

    .filter.active {

      background: #111;

      color: #fff;
    }

    /* =====================================================
       SELECTOR DE MAPA
       ===================================================== */

    .map-style {

      position: fixed;

      right: 14px;

      top:
        calc(
          128px +
          env(safe-area-inset-top, 0px)
        );

      z-index: 95;

      display: flex;

      flex-direction: column;

      gap: 6px;

      padding: 5px;

      border-radius: 15px;

      background:
        rgba(255,255,255,.94);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 8px 30px rgba(0,0,0,.13);
    }

    .style-button {

      padding: 9px 11px;

      border-radius: 11px;

      background: transparent;

      color: #555;

      font-size: 10px;

      font-weight: 800;
    }

    .style-button.active {

      background: #111;

      color: #fff;
    }

    /* =====================================================
       CONTADOR
       ===================================================== */

    .counter {

      position: fixed;

      left: 14px;

      bottom:
        calc(
          18px +
          env(safe-area-inset-bottom, 0px)
        );

      z-index: 100;

      padding: 10px 14px;

      border-radius: 999px;

      background:
        rgba(255,255,255,.94);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 8px 30px rgba(0,0,0,.12);

      font-size: 11px;

      font-weight: 750;
    }

    /* =====================================================
       BOTONES
       ===================================================== */

    .map-buttons {

      position: fixed;

      right: 14px;

      bottom:
        calc(
          18px +
          env(safe-area-inset-bottom, 0px)
        );

      z-index: 100;

      display: flex;

      flex-direction: column;

      gap: 8px;
    }

    .map-button {

      width: 44px;
      height: 44px;

      border-radius: 15px;

      background:
        rgba(255,255,255,.95);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      box-shadow:
        0 8px 30px rgba(0,0,0,.12);

      font-size: 18px;
    }

    .map-button:active {

      transform: scale(.94);
    }

    /* =====================================================
       ESTADO
       ===================================================== */

    .status {

      position: fixed;

      left: 50%;
      top: 50%;

      z-index: 200;

      transform:
        translate(-50%, -50%);

      width:
        min(320px, calc(100% - 40px));

      padding: 20px;

      border-radius: 20px;

      background:
        rgba(255,255,255,.96);

      box-shadow:
        0 20px 60px rgba(0,0,0,.18);

      text-align: center;

      font-size: 13px;

      line-height: 1.5;
    }

    .status.hidden {
      display: none;
    }

    .status-title {

      margin-bottom: 5px;

      font-weight: 800;
    }

    .status-text {

      color: #777;
    }

    /* =====================================================
       MARKER NEXO
       ===================================================== */

    .nexo-marker {

      width: 38px;
      height: 38px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #111;

      border: 3px solid #fff;

      box-shadow:
        0 5px 18px rgba(0,0,0,.35);

      color: #fff;

      font-size: 10px;

      font-weight: 900;

      letter-spacing: -.04em;
    }

    .nexo-marker::after {

      content: "";

      position: absolute;

      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #fff;
    }

    /* =====================================================
       POPUP
       ===================================================== */

    .mapboxgl-popup {

      max-width:
        min(330px, 82vw) !important;
    }

    .mapboxgl-popup-content {

      padding: 0;

      overflow: hidden;

      border-radius: 20px;

      box-shadow:
        0 18px 55px rgba(0,0,0,.22);
    }

    .mapboxgl-popup-close-button {

      z-index: 5;

      width: 32px;
      height: 32px;

      margin: 7px;

      border-radius: 50%;

      background:
        rgba(255,255,255,.90);

      color: #111;

      font-size: 20px;

      line-height: 30px;
    }

    .property-card {

      overflow: hidden;

      background: #fff;
    }

    .property-image {

      width: 100%;
      height: 155px;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          145deg,
          #e8e8ea,
          #d5d5d8
        );

      color: #999;

      font-size: 11px;
    }

    .property-image img {

      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }

    .property-content {

      padding: 15px;
    }

    .property-type {

      color: #888;

      font-size: 9px;

      font-weight: 800;

      text-transform: uppercase;

      letter-spacing: .1em;
    }

    .property-title {

      margin-top: 5px;

      font-size: 18px;

      font-weight: 800;

      letter-spacing: -.045em;
    }

    .property-price {

      margin-top: 7px;

      font-size: 19px;

      font-weight: 800;
    }

    .property-location {

      margin-top: 6px;

      color: #777;

      font-size: 11px;

      line-height: 1.45;
    }

    .property-stats {

      display: flex;

      flex-wrap: wrap;

      gap: 6px;

      margin-top: 12px;
    }

    .property-stat {

      padding: 6px 8px;

      border-radius: 999px;

      background: #f1f1f3;

      color: #555;

      font-size: 9px;

      font-weight: 700;
    }

    .property-address {

      margin-top: 11px;

      color: #666;

      font-size: 10px;

      line-height: 1.4;
    }

    .view-property {

      width: 100%;

      margin-top: 13px;

      padding: 11px;

      border-radius: 12px;

      background: #111;

      color: #fff;

      font-size: 11px;

      font-weight: 750;
    }

    /* =====================================================
       MAPBOX CONTROLS
       ===================================================== */

    .mapboxgl-ctrl-bottom-left {

      bottom:
        calc(
          8px +
          env(safe-area-inset-bottom, 0px)
        );
    }

    .mapboxgl-ctrl-bottom-right {

      bottom:
        calc(
          8px +
          env(safe-area-inset-bottom, 0px)
        );
    }

    /* =====================================================
       MÓVIL
       ===================================================== */

    @media(max-width:600px) {

      .brand {

        padding: 11px 13px;

        font-size: 16px;
      }

      .search input {

        font-size: 12px;
      }

      .filters {

        top:
          calc(
            65px +
            env(safe-area-inset-top, 0px)
          );
      }

      .map-style {

        top:
          calc(
            122px +
            env(safe-area-inset-top, 0px)
          );
      }

      .property-image {

        height: 145px;
      }

    }

  </style>

</head>

<body>

  <!-- =====================================================
       MAPA
       ===================================================== -->

  <div id="map"></div>


  <!-- =====================================================
       BARRA SUPERIOR
       ===================================================== -->

  <div class="topbar">

    <div class="topbar-inner">

      <div class="brand">
        NEXO
      </div>

      <div class="search">

        <span class="search-icon">
          🔎
        </span>

        <input
          id="searchInput"
          type="search"
          placeholder="Buscar ciudad, zona o dirección"
          autocomplete="off"
        >

        <button
          id="clearSearch"
          class="clear-search"
          type="button"
        >
          ×
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       FILTROS
       ===================================================== -->

  <div class="filters">

    <div class="filters-inner">

      <button
        class="filter active"
        data-type="all"
        type="button"
      >
        Todas
      </button>

      <button
        class="filter"
        data-type="Casa"
        type="button"
      >
        Casas
      </button>

      <button
        class="filter"
        data-type="Apartamento"
        type="button"
      >
        Apartamentos
      </button>

      <button
        class="filter"
        data-type="Villa"
        type="button"
      >
        Villas
      </button>

      <button
        class="filter"
        data-type="Terreno"
        type="button"
      >
        Terrenos
      </button>

      <button
        class="filter"
        data-type="Local"
        type="button"
      >
        Locales
      </button>

    </div>

  </div>


  <!-- =====================================================
       ESTILOS DE MAPA
       ===================================================== -->

  <div class="map-style">

    <button
      class="style-button active"
      data-style="streets"
      type="button"
    >
      🗺️ Mapa
    </button>

    <button
      class="style-button"
      data-style="satellite"
      type="button"
    >
      🛰️ Satélite
    </button>

    <button
      class="style-button"
      data-style="hybrid"
      type="button"
    >
      🌎 Híbrido
    </button>

  </div>


  <!-- =====================================================
       CONTADOR
       ===================================================== -->

  <div
    id="counter"
    class="counter"
  >
    Cargando propiedades...
  </div>


  <!-- =====================================================
       BOTONES
       ===================================================== -->

  <div class="map-buttons">

    <button
      id="fitButton"
      class="map-button"
      type="button"
      title="Mostrar propiedades"
      aria-label="Mostrar propiedades"
    >
      ⛶
    </button>

    <button
      id="locationButton"
      class="map-button"
      type="button"
      title="Mi ubicación"
      aria-label="Mi ubicación"
    >
      ⊙
    </button>

  </div>


  <!-- =====================================================
       ESTADO
       ===================================================== -->

  <div
    id="status"
    class="status"
  >

    <div
      id="statusTitle"
      class="status-title"
    >
      Cargando NEXO...
    </div>

    <div
      id="statusText"
      class="status-text"
    >
      Conectando con las propiedades.
    </div>

  </div>


  <script>

    "use strict";


    /* =====================================================
       CONFIGURACIÓN MAPBOX
       ===================================================== */

    const MAPBOX_TOKEN =
      "1NdLFdUeZVfKpdAWdd6K";


    mapboxgl.accessToken =
      MAPBOX_TOKEN;


    /* =====================================================
       ESTILOS
       ===================================================== */

    const MAP_STYLES = {

      streets:
        "mapbox://styles/mapbox/streets-v12",

      satellite:
        "mapbox://styles/mapbox/satellite-v9",

      hybrid:
        "mapbox://styles/mapbox/satellite-streets-v12"

    };


    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const mapElement =
      document.getElementById("map");

    const searchInput =
      document.getElementById("searchInput");

    const clearSearch =
      document.getElementById("clearSearch");

    const counter =
      document.getElementById("counter");

    const status =
      document.getElementById("status");

    const statusTitle =
      document.getElementById("statusTitle");

    const statusText =
      document.getElementById("statusText");

    const fitButton =
      document.getElementById("fitButton");

    const locationButton =
      document.getElementById("locationButton");


    /* =====================================================
       ESTADO
       ===================================================== */

    let allProperties = [];

    let filteredProperties = [];

    let activeType = "all";

    let currentStyle = "streets";

    let markers = [];

    let userMarker = null;


    /* =====================================================
       MAPA
       ===================================================== */

    const map =
      new mapboxgl.Map({

        container: mapElement,

        style:
          MAP_STYLES.streets,

        center:
          [-82.3666, 23.1136],

        zoom: 10.8,

        minZoom: 3,

        maxZoom: 20,

        attributionControl: true,

        antialias: true,

        dragRotate: false,

        touchPitch: false,

        cooperativeGestures: false

      });


    /* =====================================================
       CONTROLES
       ===================================================== */

    map.addControl(
      new mapboxgl.NavigationControl({
        showCompass: false,
        visualizePitch: false
      }),
      "bottom-right"
    );


    map.addControl(
      new mapboxgl.ScaleControl({
        maxWidth: 100,
        unit: "metric"
      }),
      "bottom-left"
    );


    /* =====================================================
       UTILIDADES
       ===================================================== */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function money(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {

        return "$0";
      }

      const number =
        Number(
          String(value)
            .replace(/[$,\s]/g, "")
        );

      if (
        !Number.isFinite(number)
      ) {

        return String(value);
      }

      return "$" +
        number.toLocaleString(
          "en-US",
          {
            maximumFractionDigits: 0
          }
        );
    }


    function normalize(value) {

      return String(value ?? "")
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        )
        .toLowerCase()
        .trim();
    }


    function parsePhotos(property) {

      if (
        Array.isArray(
          property.photos
        )
      ) {

        return property.photos
          .filter(Boolean);
      }


      if (
        typeof property.photos ===
        "string"
      ) {

        try {

          const parsed =
            JSON.parse(
              property.photos
            );

          if (
            Array.isArray(parsed)
          ) {

            return parsed
              .filter(Boolean);
          }

        } catch (error) {

          console.warn(
            "NEXO: fotografías inválidas",
            error
          );

        }

      }

      return [];
    }


    function getCoordinates(
      property
    ) {

      const latitude =
        Number(
          property.latitude
        );

      const longitude =
        Number(
          property.longitude
        );


      if (
        !Number.isFinite(latitude) ||
        !Number.isFinite(longitude)
      ) {

        return null;
      }


      if (
        latitude < -90 ||
        latitude > 90 ||
        longitude < -180 ||
        longitude > 180
      ) {

        return null;
      }


      return [
        longitude,
        latitude
      ];
    }


    /* =====================================================
       ESTADO VISUAL
       ===================================================== */

    function showStatus(
      title,
      text
    ) {

      statusTitle.textContent =
        title;

      statusText.textContent =
        text;

      status.classList.remove(
        "hidden"
      );
    }


    function hideStatus() {

      status.classList.add(
        "hidden"
      );
    }


    /* =====================================================
       TARJETA
       ===================================================== */

    function buildPropertyCard(
      property
    ) {

      const photos =
        parsePhotos(property);

      const image =
        photos.length
          ? photos[0]
          : "";


      const title =
        property.title ||
        property.property_type ||
        "Propiedad";


      const location =
        [
          property.neighborhood,
          property.city
        ]
          .filter(Boolean)
          .join(" · ");


      const stats = [];


      if (
        property.bedrooms !== null &&
        property.bedrooms !== undefined &&
        property.bedrooms !== ""
      ) {

        stats.push(
          `🛏 ${escapeHTML(
            property.bedrooms
          )}`
        );
      }


      if (
        property.bathrooms !== null &&
        property.bathrooms !== undefined &&
        property.bathrooms !== ""
      ) {

        stats.push(
          `🚿 ${escapeHTML(
            property.bathrooms
          )}`
        );
      }


      if (
        property.square_meters !== null &&
        property.square_meters !== undefined &&
        property.square_meters !== ""
      ) {

        stats.push(
          `${escapeHTML(
            property.square_meters
          )} m²`
        );
      }


      const statsHTML =
        stats.length
          ? `
            <div class="property-stats">
              ${stats
                .map(
                  item =>
                    `<span class="property-stat">${item}</span>`
                )
                .join("")}
            </div>
          `
          : "";


      const imageHTML =
        image
          ? `
            <div class="property-image">

              <img
                src="${escapeHTML(image)}"
                alt="${escapeHTML(title)}"
                loading="lazy"
                onerror="
                  this.style.display='none';
                  this.parentElement.textContent='Sin fotografía';
                "
              >

            </div>
          `
          : `
            <div class="property-image">
              Sin fotografía
            </div>
          `;


      const addressHTML =
        property.address
          ? `
            <div class="property-address">
              📍 ${escapeHTML(
                property.address
              )}
            </div>
          `
          : "";


      return `
        <div class="property-card">

          ${imageHTML}

          <div class="property-content">

            <div class="property-type">

              ${escapeHTML(
                property.property_type ||
                "Propiedad"
              )}

            </div>


            <div class="property-title">

              ${escapeHTML(title)}

            </div>


            <div class="property-price">

              ${money(property.price)}

            </div>


            ${
              location
                ? `
                  <div class="property-location">
                    ${escapeHTML(location)}
                  </div>
                `
                : ""
            }


            ${statsHTML}


            ${addressHTML}


            <button
              type="button"
              class="view-property"
              data-property-id="${Number(
                property.id
              )}"
            >
              Centrar propiedad
            </button>

          </div>

        </div>
      `;
    }


    /* =====================================================
       CENTRAR PROPIEDAD
       ===================================================== */

    function centerProperty(
      property
    ) {

      const coordinates =
        getCoordinates(
          property
        );

      if (!coordinates) {

        return;
      }


      map.flyTo({

        center:
          coordinates,

        zoom:
          Math.max(
            map.getZoom(),
            16
          ),

        speed: 1.1,

        curve: 1.2,

        essential: true

      });
    }


    /* =====================================================
       MARCADORES
       ===================================================== */

    function clearMarkers() {

      markers.forEach(
        marker => marker.remove()
      );

      markers = [];
    }


    function createMarker(
      property
    ) {

      const coordinates =
        getCoordinates(
          property
        );

      if (!coordinates) {

        return null;
      }


      const element =
        document.createElement(
          "div"
        );


      element.className =
        "nexo-marker";


      element.innerHTML =
        "N";


      element.setAttribute(
        "role",
        "button"
      );


      element.setAttribute(
        "aria-label",
        property.property_type ||
        "Propiedad"
      );


      const popup =
        new mapboxgl.Popup({

          closeButton: true,

          closeOnClick: true,

          offset: 24,

          maxWidth:
            "330px"

        })
          .setHTML(
            buildPropertyCard(
              property
            )
          );


      popup.on(
        "open",
        () => {

          const button =
            popup
              .getElement()
              ?.querySelector(
                ".view-property"
              );


          if (!button) {
            return;
          }


          button.addEventListener(
            "click",
            () => {

              centerProperty(
                property
              );

            }
          );

        }
      );


      const marker =
        new mapboxgl.Marker({

          element,

          anchor: "bottom",

          pitchAlignment:
            "viewport",

          rotationAlignment:
            "viewport"

        })
          .setLngLat(
            coordinates
          )
          .setPopup(
            popup
          )
          .addTo(map);


      element.addEventListener(
        "click",
        () => {

          map.flyTo({

            center:
              coordinates,

            zoom:
              Math.max(
                map.getZoom(),
                15
              ),

            speed: 1.0,

            essential: true

          });

        }
      );


      return marker;
    }


    function renderMarkers() {

      clearMarkers();


      filteredProperties.forEach(
        property => {

          const marker =
            createMarker(
              property
            );


          if (marker) {

            markers.push(
              marker
            );
          }

        }
      );


      updateCounter();

    }


    /* =====================================================
       AJUSTAR MAPA
       ===================================================== */

    function fitVisibleProperties() {

      const coordinates =
        filteredProperties
          .map(
            getCoordinates
          )
          .filter(Boolean);


      if (!coordinates.length) {

        map.flyTo({

          center:
            [-82.3666, 23.1136],

          zoom: 10.8,

          essential: true

        });

        return;
      }


      if (
        coordinates.length === 1
      ) {

        map.flyTo({

          center:
            coordinates[0],

          zoom: 15,

          essential: true

        });

        return;
      }


      const bounds =
        new mapboxgl.LngLatBounds();


      coordinates.forEach(
        coordinate => {

          bounds.extend(
            coordinate
          );

        }
      );


      map.fitBounds(
        bounds,
        {

          padding: {

            top: 180,

            bottom: 110,

            left: 35,

            right: 35

          },

          maxZoom: 16,

          duration: 1200,

          essential: true

        }
      );

    }


    /* =====================================================
       CONTADOR
       ===================================================== */

    function updateCounter() {

      const total =
        filteredProperties.length;


      const located =
        filteredProperties.filter(
          property =>
            Boolean(
              getCoordinates(
                property
              )
            )
        ).length;


      if (
        total === located
      ) {

        counter.textContent =
          `${total} ${
            total === 1
              ? "propiedad"
              : "propiedades"
          }`;

      } else {

        counter.textContent =
          `${total} propiedades · ${located} ubicadas`;

      }

    }


    /* =====================================================
       FILTROS
       ===================================================== */

    function applyFilters() {

      const search =
        normalize(
          searchInput.value
        );


      filteredProperties =
        allProperties.filter(
          property => {


            if (
              activeType !==
              "all"
            ) {

              if (
                normalize(
                  property.property_type
                ) !==
                normalize(
                  activeType
                )
              ) {

                return false;
              }

            }


            if (!search) {

              return true;
            }


            const searchable =
              [

                property.property_type,

                property.title,

                property.city,

                property.neighborhood,

                property.address,

                property.description

              ]
                .filter(Boolean)
                .map(normalize)
                .join(" ");


            return searchable.includes(
              search
            );

          }
        );


      renderMarkers();


      fitVisibleProperties();


      if (
        !filteredProperties.length
      ) {

        showStatus(
          "Sin resultados",
          "No encontramos propiedades con esos criterios."
        );

      } else {

        hideStatus();

      }

    }


    /* =====================================================
       FILTROS BOTONES
       ===================================================== */

    document
      .querySelectorAll(
        ".filter"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              document
                .querySelectorAll(
                  ".filter"
                )
                .forEach(
                  item =>
                    item.classList.remove(
                      "active"
                    )
                );


              button.classList.add(
                "active"
              );


              activeType =
                button.dataset.type ||
                "all";


              applyFilters();

            }
          );

        }
      );


    /* =====================================================
       BUSCADOR
       ===================================================== */

    searchInput.addEventListener(
      "input",
      () => {

        clearSearch.classList.toggle(
          "show",
          Boolean(
            searchInput.value.trim()
          )
        );


        applyFilters();

      }
    );


    clearSearch.addEventListener(
      "click",
      () => {

        searchInput.value =
          "";

        clearSearch.classList.remove(
          "show"
        );

        applyFilters();

        searchInput.focus();

      }
    );


    /* =====================================================
       CAMBIAR MAPA
       ===================================================== */

    document
      .querySelectorAll(
        ".style-button"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              const style =
                button.dataset.style;


              if (
                !MAP_STYLES[style]
              ) {

                return;
              }


              document
                .querySelectorAll(
                  ".style-button"
                )
                .forEach(
                  item =>
                    item.classList.remove(
                      "active"
                    )
                );


              button.classList.add(
                "active"
              );


              currentStyle =
                style;


              map.setStyle(
                MAP_STYLES[
                  style
                ]
              );


              /*
               * Los marcadores HTML
               * no forman parte del estilo
               * y permanecen sobre el mapa.
               */

            }
          );

        }
      );


    /* =====================================================
       BOTÓN AJUSTAR
       ===================================================== */

    fitButton.addEventListener(
      "click",
      () => {

        fitVisibleProperties();

      }
    );


    /* =====================================================
       UBICACIÓN DEL USUARIO
       ===================================================== */

    locationButton.addEventListener(
      "click",
      () => {

        if (
          !navigator.geolocation
        ) {

          alert(
            "Tu dispositivo no permite obtener la ubicación."
          );

          return;
        }


        locationButton.disabled =
          true;


        navigator.geolocation.getCurrentPosition(

          position => {

            const coordinates = [

              position.coords.longitude,

              position.coords.latitude

            ];


            if (userMarker) {

              userMarker.remove();
            }


            const element =
              document.createElement(
                "div"
              );


            element.style.width =
              "18px";

            element.style.height =
              "18px";

            element.style.borderRadius =
              "50%";

            element.style.background =
              "#111";

            element.style.border =
              "4px solid white";

            element.style.boxShadow =
              "0 3px 12px rgba(0,0,0,.3)";


            userMarker =
              new mapboxgl.Marker({
                element
              })
                .setLngLat(
                  coordinates
                )
                .setPopup(
                  new mapboxgl.Popup({
                    offset: 15
                  })
                    .setText(
                      "Tu ubicación"
                    )
                )
                .addTo(map);


            map.flyTo({

              center:
                coordinates,

              zoom: 15,

              speed: 1.1,

              essential: true

            });


            locationButton.disabled =
              false;

          },


          error => {

            console.warn(
              "NEXO ubicación:",
              error
            );


            alert(
              "No se pudo obtener tu ubicación."
            );


            locationButton.disabled =
              false;

          },


          {

            enableHighAccuracy:
              true,

            timeout:
              10000,

            maximumAge:
              60000

          }

        );

      }
    );


    /* =====================================================
       CARGAR PROPIEDADES
       ===================================================== */

    async function loadProperties() {

      showStatus(
        "Cargando propiedades",
        "Conectando con NEXO..."
      );


      try {

        const response =
          await fetch(
            "/api/properties",
            {

              method:
                "GET",

              headers: {

                "Accept":
                  "application/json"

              },

              cache:
                "no-store"

            }
          );


        const text =
          await response.text();


        let data;


        try {

          data =
            JSON.parse(text);

        } catch {

          throw new Error(
            "La respuesta del servidor no es JSON."
          );

        }


        if (
          !response.ok ||
          data.success === false
        ) {

          throw new Error(
            data.error ||
            `HTTP ${response.status}`
          );

        }


        allProperties =
          Array.isArray(
            data.properties
          )
            ? data.properties
            : [];


        allProperties =
          allProperties.filter(
            property =>
              !property.status ||
              property.status ===
                "available"
          );


        filteredProperties =
          [
            ...allProperties
          ];


        renderMarkers();


        hideStatus();


        const located =
          allProperties.filter(
            property =>
              Boolean(
                getCoordinates(
                  property
                )
              )
          );


        if (
          located.length
        ) {

          fitVisibleProperties();

        } else {

          map.flyTo({

            center:
              [-82.3666, 23.1136],

            zoom: 10.8,

            essential: true

          });

        }

      } catch (error) {

        console.error(
          "NEXO MAP:",
          error
        );


        showStatus(
          "No se pudieron cargar las propiedades",
          error.message ||
          "Comprueba la conexión con NEXO."
        );


        counter.textContent =
          "Error";

      }

    }


    /* =====================================================
       MAPA LISTO
       ===================================================== */

    map.on(
      "load",
      () => {

        loadProperties();

      }
    );


    /* =====================================================
       REDIMENSIONAMIENTO
       ===================================================== */

    window.addEventListener(
      "resize",
      () => {

        map.resize();

      }
    );


    /* =====================================================
       ORIENTACIÓN DEL TELÉFONO
       ===================================================== */

    window.addEventListener(
      "orientationchange",
      () => {

        setTimeout(
          () => {

            map.resize();

          },
          300
        );

      }
    );

  </script>

</body>
</html>
