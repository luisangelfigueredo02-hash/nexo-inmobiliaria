<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f5f5f7">

  <title>NEXO — Mapa de propiedades</title>

  <!-- =====================================================
       LEAFLET
       ===================================================== -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    :root {
      --nexo-bg: #f5f5f7;
      --nexo-white: rgba(255,255,255,.94);
      --nexo-black: #111111;
      --nexo-text: #171717;
      --nexo-muted: #777777;
      --nexo-border: rgba(0,0,0,.07);
      --nexo-shadow:
        0 10px 35px rgba(0,0,0,.11);
      --nexo-radius: 18px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Inter,
        system-ui,
        sans-serif;

      background: var(--nexo-bg);
      color: var(--nexo-text);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    /* =====================================================
       MAPA
       ===================================================== */

    #map {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: #e9edf1;
    }

    .leaflet-container {
      font-family: inherit;
      background: #e9edf1;
    }

    /*
     * Pequeño refinamiento visual del mapa.
     * No exageramos el filtro para evitar perder
     * nitidez en teléfonos.
     */

    .leaflet-tile-pane {
      filter:
        saturate(.88)
        contrast(1.02)
        brightness(1.015);
    }

    /* =====================================================
       CONTROLES LEAFLET
       ===================================================== */

    .leaflet-control-zoom {
      border: 0 !important;
      box-shadow: none !important;
    }

    .leaflet-control-zoom a {
      width: 42px !important;
      height: 42px !important;

      line-height: 42px !important;

      border: 0 !important;

      background:
        rgba(255,255,255,.94) !important;

      color: #222 !important;

      box-shadow:
        0 8px 25px rgba(0,0,0,.12);

      font-size: 20px !important;
    }

    .leaflet-control-zoom a:first-child {
      border-radius: 14px 14px 5px 5px !important;
    }

    .leaflet-control-zoom a:last-child {
      margin-top: 3px;
      border-radius: 5px 5px 14px 14px !important;
    }

    .leaflet-control-attribution {
      margin: 0 !important;

      padding:
        3px 7px !important;

      border-radius:
        8px 0 0 0;

      background:
        rgba(255,255,255,.72) !important;

      backdrop-filter:
        blur(8px);

      -webkit-backdrop-filter:
        blur(8px);

      color: #666 !important;

      font-size: 8px !important;
    }

    .leaflet-control-attribution a {
      color: #555 !important;
    }

    /* =====================================================
       BARRA SUPERIOR
       ===================================================== */

    .topbar {
      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      z-index: 1000;

      padding:
        calc(12px + env(safe-area-inset-top, 0px))
        14px
        10px;

      pointer-events: none;
    }

    .topbar-inner {
      width: min(760px, 100%);
      margin: auto;

      display: flex;
      align-items: center;

      gap: 9px;

      pointer-events: auto;
    }

    .brand {

      flex: 0 0 auto;

      padding:
        12px 15px;

      border-radius: 16px;

      background:
        rgba(255,255,255,.94);

      backdrop-filter:
        blur(22px);

      -webkit-backdrop-filter:
        blur(22px);

      box-shadow:
        0 9px 30px rgba(0,0,0,.11);

      color: #111;

      font-size: 17px;
      font-weight: 850;

      letter-spacing:
        -.07em;
    }

    .search {

      flex: 1;

      min-width: 0;

      display: flex;
      align-items: center;

      background:
        rgba(255,255,255,.95);

      border-radius: 16px;

      overflow: hidden;

      box-shadow:
        0 9px 30px rgba(0,0,0,.11);

      backdrop-filter:
        blur(22px);

      -webkit-backdrop-filter:
        blur(22px);
    }

    .search-icon {

      flex: 0 0 auto;

      padding-left: 14px;

      color: #777;

      font-size: 15px;
    }

    .search input {

      width: 100%;

      padding:
        13px 11px;

      border: 0;
      outline: 0;

      background: transparent;

      color: #111;

      font-size: 13px;
    }

    .search input::placeholder {
      color: #929292;
    }

    .clear-search {

      display: none;

      width: 35px;
      height: 35px;

      margin-right: 4px;

      border-radius: 50%;

      background: #eeeeef;

      color: #555;

      font-size: 17px;
    }

    .clear-search.show {
      display: block;
    }

    /* =====================================================
       FILTROS
       ===================================================== */

    .filters {

      position: fixed;

      top:
        calc(70px + env(safe-area-inset-top, 0px));

      left: 0;
      right: 0;

      z-index: 999;

      padding:
        0 14px;

      pointer-events: none;
    }

    .filters-inner {

      width: min(760px, 100%);

      margin: auto;

      display: flex;

      gap: 8px;

      overflow-x: auto;

      scrollbar-width: none;

      pointer-events: auto;
    }

    .filters-inner::-webkit-scrollbar {
      display: none;
    }

    .filter {

      flex:
        0 0 auto;

      padding:
        10px 14px;

      border-radius: 999px;

      border:
        1px solid
        rgba(0,0,0,.055);

      background:
        rgba(255,255,255,.94);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      color: #444;

      font-size: 11px;

      font-weight: 700;

      box-shadow:
        0 6px 20px rgba(0,0,0,.075);
    }

    .filter.active {

      background:
        #111;

      color:
        #fff;

      border-color:
        #111;

      box-shadow:
        0 7px 22px rgba(0,0,0,.18);
    }

    /* =====================================================
       CONTADOR
       ===================================================== */

    .counter {

      position: fixed;

      left: 14px;

      bottom:
        calc(18px + env(safe-area-inset-bottom, 0px));

      z-index: 1000;

      padding:
        10px 14px;

      border-radius: 999px;

      background:
        rgba(255,255,255,.95);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      box-shadow:
        0 9px 30px rgba(0,0,0,.12);

      color: #222;

      font-size: 11px;

      font-weight: 750;
    }

    /* =====================================================
       BOTONES
       ===================================================== */

    .map-buttons {

      position: fixed;

      right: 14px;

      bottom:
        calc(18px + env(safe-area-inset-bottom, 0px));

      z-index: 1000;

      display: flex;

      flex-direction: column;

      gap: 8px;
    }

    .map-button {

      width: 44px;
      height: 44px;

      border-radius: 15px;

      background:
        rgba(255,255,255,.95);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      box-shadow:
        0 9px 30px rgba(0,0,0,.12);

      color: #222;

      font-size: 17px;

      transition:
        transform .15s ease;
    }

    .map-button:active {
      transform:
        scale(.93);
    }

    .map-button:disabled {
      opacity: .55;
    }

    /* =====================================================
       ESTADO
       ===================================================== */

    .status {

      position: fixed;

      left: 50%;
      top: 50%;

      z-index: 2000;

      transform:
        translate(-50%, -50%);

      width:
        min(320px, calc(100% - 40px));

      padding:
        20px;

      border-radius:
        20px;

      background:
        rgba(255,255,255,.96);

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);

      box-shadow:
        0 20px 60px rgba(0,0,0,.16);

      text-align:
        center;

      font-size:
        13px;

      line-height:
        1.5;
    }

    .status.hidden {
      display: none;
    }

    .status-title {
      margin-bottom: 5px;
      font-weight: 800;
    }

    .status-text {
      color: #777;
    }

    /* =====================================================
       POPUP
       ===================================================== */

    .leaflet-popup-content-wrapper {

      padding: 0;

      border-radius:
        20px;

      overflow:
        hidden;

      box-shadow:
        0 18px 55px rgba(0,0,0,.18);
    }

    .leaflet-popup-content {

      margin: 0;

      width:
        min(300px, 76vw) !important;
    }

    .leaflet-popup-tip {
      box-shadow: none;
    }

    .leaflet-popup-close-button {

      z-index: 5;

      width: 32px !important;
      height: 32px !important;

      right: 7px !important;
      top: 7px !important;

      border-radius: 50%;

      background:
        rgba(255,255,255,.9) !important;

      color: #222 !important;

      font-size: 20px !important;

      line-height: 29px !important;

      text-align: center;
    }

    /* =====================================================
       TARJETA
       ===================================================== */

    .property-card {

      overflow: hidden;

      background: #fff;
    }

    .property-image {

      width: 100%;
      height: 155px;

      display: flex;

      align-items:
        center;

      justify-content:
        center;

      background:
        linear-gradient(
          145deg,
          #ececef,
          #d9d9dd
        );

      color: #999;

      font-size: 11px;
    }

    .property-image img {

      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }

    .property-content {

      padding:
        15px;
    }

    .property-type {

      color: #888;

      font-size: 9px;

      font-weight: 800;

      text-transform:
        uppercase;

      letter-spacing:
        .1em;
    }

    .property-title {

      margin-top: 5px;

      font-size: 18px;

      font-weight: 800;

      letter-spacing:
        -.045em;
    }

    .property-price {

      margin-top: 7px;

      font-size: 19px;

      font-weight: 800;
    }

    .property-location {

      margin-top: 6px;

      color: #777;

      font-size: 11px;

      line-height: 1.45;
    }

    .property-stats {

      display: flex;

      flex-wrap: wrap;

      gap: 6px;

      margin-top: 12px;
    }

    .property-stat {

      padding:
        6px 8px;

      border-radius:
        999px;

      background:
        #f1f1f3;

      color: #555;

      font-size: 9px;

      font-weight: 700;
    }

    .property-address {

      margin-top: 11px;

      color: #666;

      font-size: 10px;

      line-height: 1.4;
    }

    .view-property {

      width: 100%;

      margin-top: 13px;

      padding: 11px;

      border-radius: 12px;

      background: #111;

      color: #fff;

      font-size: 11px;

      font-weight: 750;
    }

    /* =====================================================
       MARCADOR NEXO
       ===================================================== */

    .nexo-marker-wrap {

      width: 42px;
      height: 50px;

      position: relative;
    }

    .nexo-marker {

      position: absolute;

      left: 4px;
      top: 2px;

      width: 34px;
      height: 34px;

      border-radius:
        50% 50% 50% 0;

      background:
        #111;

      border:
        3px solid #fff;

      transform:
        rotate(-45deg);

      box-shadow:
        0 6px 17px rgba(0,0,0,.27);
    }

    .nexo-marker::after {

      content: "";

      position: absolute;

      width: 9px;
      height: 9px;

      left: 9px;
      top: 9px;

      border-radius: 50%;

      background: #fff;
    }

    /* =====================================================
       PULSO SUTIL AL MARCADOR
       ===================================================== */

    .nexo-marker-wrap::after {

      content: "";

      position: absolute;

      left: 14px;
      top: 13px;

      width: 14px;
      height: 14px;

      border-radius: 50%;

      background:
        rgba(17,17,17,.14);

      transform:
        translate(-50%, -50%);

      opacity: 0;

      pointer-events: none;
    }

    /* =====================================================
       MÓVIL
       ===================================================== */

    @media(max-width:600px) {

      .brand {
        padding:
          11px 13px;

        font-size: 16px;
      }

      .search input {
        font-size: 12px;
      }

      .filters {
        top:
          calc(
            65px +
            env(safe-area-inset-top, 0px)
          );
      }

      .property-image {
        height: 145px;
      }

    }

  </style>

</head>

<body>

  <!-- =====================================================
       MAPA
       ===================================================== -->

  <div id="map"></div>

  <!-- =====================================================
       BARRA SUPERIOR
       ===================================================== -->

  <div class="topbar">

    <div class="topbar-inner">

      <div class="brand">
        NEXO
      </div>

      <div class="search">

        <span class="search-icon">
          ⌕
        </span>

        <input
          id="searchInput"
          type="search"
          placeholder="Buscar ciudad, zona o dirección"
          autocomplete="off"
        >

        <button
          id="clearSearch"
          class="clear-search"
          type="button"
          aria-label="Limpiar búsqueda"
        >
          ×
        </button>

      </div>

    </div>

  </div>

  <!-- =====================================================
       FILTROS
       ===================================================== -->

  <div class="filters">

    <div class="filters-inner">

      <button
        class="filter active"
        data-type="all"
        type="button"
      >
        Todas
      </button>

      <button
        class="filter"
        data-type="Casa"
        type="button"
      >
        Casas
      </button>

      <button
        class="filter"
        data-type="Apartamento"
        type="button"
      >
        Apartamentos
      </button>

      <button
        class="filter"
        data-type="Villa"
        type="button"
      >
        Villas
      </button>

      <button
        class="filter"
        data-type="Terreno"
        type="button"
      >
        Terrenos
      </button>

      <button
        class="filter"
        data-type="Local"
        type="button"
      >
        Locales
      </button>

    </div>

  </div>

  <!-- =====================================================
       CONTADOR
       ===================================================== -->

  <div
    id="counter"
    class="counter"
  >
    Cargando propiedades...
  </div>

  <!-- =====================================================
       BOTONES DEL MAPA
       ===================================================== -->

  <div class="map-buttons">

    <button
      id="fitButton"
      class="map-button"
      type="button"
      title="Mostrar propiedades"
      aria-label="Mostrar propiedades"
    >
      ⛶
    </button>

    <button
      id="locationButton"
      class="map-button"
      type="button"
      title="Mi ubicación"
      aria-label="Mi ubicación"
    >
      ⊙
    </button>

  </div>

  <!-- =====================================================
       ESTADO
       ===================================================== -->

  <div
    id="status"
    class="status"
  >

    <div
      id="statusTitle"
      class="status-title"
    >
      Cargando NEXO...
    </div>

    <div
      id="statusText"
      class="status-text"
    >
      Buscando propiedades.
    </div>

  </div>

  <!-- =====================================================
       LEAFLET
       ===================================================== -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <script>

    "use strict";

    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const mapElement =
      document.getElementById("map");

    const searchInput =
      document.getElementById("searchInput");

    const clearSearch =
      document.getElementById("clearSearch");

    const counter =
      document.getElementById("counter");

    const status =
      document.getElementById("status");

    const statusTitle =
      document.getElementById("statusTitle");

    const statusText =
      document.getElementById("statusText");

    const fitButton =
      document.getElementById("fitButton");

    const locationButton =
      document.getElementById("locationButton");


    /* =====================================================
       ESTADO
       ===================================================== */

    let allProperties = [];

    let filteredProperties = [];

    let activeType = "all";


    /* =====================================================
       MAPA
       ===================================================== */

    const map =
      L.map(
        mapElement,
        {
          zoomControl: false,

          preferCanvas: true,

          zoomSnap: 0.5,

          zoomDelta: 0.5,

          wheelPxPerZoomLevel: 90,

          worldCopyJump: false,

          maxBoundsViscosity: 0.85
        }
      );


    /*
     * Controles de zoom personalizados.
     */

    L.control.zoom({
      position: "bottomright"
    }).addTo(map);


    /*
     * Cuba como vista inicial.
     *
     * MUY IMPORTANTE:
     * No utilizamos zoom 1 ni 2 porque eso provoca
     * que al abrir aparezca prácticamente el mundo entero.
     */

    map.setView(
      [21.8, -79.5],
      6
    );


    /* =====================================================
       CARTO VOYAGER
       ===================================================== */

    const voyagerLayer =
      L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
        {
          subdomains:
            "abcd",

          maxZoom: 20,

          minZoom: 2,

          tileSize: 256,

          detectRetina: true,

          updateWhenZooming: false,

          updateWhenIdle: true,

          keepBuffer: 2,

          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>'
        }
      );

    voyagerLayer.addTo(map);


    /* =====================================================
       CAPA DE MARCADORES
       ===================================================== */

    const markerLayer =
      L.layerGroup().addTo(map);


    /* =====================================================
       UTILIDADES
       ===================================================== */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function money(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {

        return "$0";

      }

      const number =
        Number(
          String(value)
            .replace(/[$,\s]/g, "")
        );

      if (
        !Number.isFinite(number)
      ) {

        return String(value);

      }

      return "$" +
        number.toLocaleString(
          "en-US",
          {
            maximumFractionDigits: 0
          }
        );
    }


    function normalize(value) {

      return String(value ?? "")
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        )
        .toLowerCase()
        .trim();
    }


    function parsePhotos(property) {

      if (
        Array.isArray(
          property.photos
        )
      ) {

        return property.photos
          .filter(Boolean);

      }


      if (
        typeof property.photos ===
        "string"
      ) {

        try {

          const parsed =
            JSON.parse(
              property.photos
            );

          if (
            Array.isArray(parsed)
          ) {

            return parsed
              .filter(Boolean);

          }

        } catch (error) {

          console.warn(
            "NEXO: fotografías inválidas",
            error
          );

        }

      }

      return [];
    }


    /* =====================================================
       ESTADO
       ===================================================== */

    function showStatus(
      title,
      text
    ) {

      statusTitle.textContent =
        title;

      statusText.textContent =
        text;

      status.classList.remove(
        "hidden"
      );
    }


    function hideStatus() {

      status.classList.add(
        "hidden"
      );
    }


    /* =====================================================
       ICONO NEXO
       ===================================================== */

    const nexoIcon =
      L.divIcon({

        className: "",

        html: `
          <div class="nexo-marker-wrap">
            <div class="nexo-marker"></div>
          </div>
        `,

        iconSize:
          [42, 50],

        iconAnchor:
          [21, 50],

        popupAnchor:
          [0, -46]
      });


    /* =====================================================
       TARJETA
       ===================================================== */

    function buildPropertyCard(
      property
    ) {

      const photos =
        parsePhotos(
          property
        );

      const image =
        photos.length
          ? photos[0]
          : "";


      const title =
        property.title ||
        property.property_type ||
        "Propiedad";


      const location =
        [
          property.neighborhood,
          property.city
        ]
          .filter(Boolean)
          .join(" · ");


      const stats = [];


      if (
        property.bedrooms !== null &&
        property.bedrooms !== undefined &&
        property.bedrooms !== ""
      ) {

        stats.push(
          `🛏 ${escapeHTML(
            property.bedrooms
          )}`
        );

      }


      if (
        property.bathrooms !== null &&
        property.bathrooms !== undefined &&
        property.bathrooms !== ""
      ) {

        stats.push(
          `🚿 ${escapeHTML(
            property.bathrooms
          )}`
        );

      }


      if (
        property.square_meters !== null &&
        property.square_meters !== undefined &&
        property.square_meters !== ""
      ) {

        stats.push(
          `${escapeHTML(
            property.square_meters
          )} m²`
        );

      }


      const statsHTML =
        stats.length
          ? `
            <div class="property-stats">
              ${stats
                .map(
                  item =>
                    `<span class="property-stat">${item}</span>`
                )
                .join("")}
            </div>
          `
          : "";


      const imageHTML =
        image
          ? `
            <div class="property-image">

              <img
                src="${escapeHTML(image)}"
                alt="${escapeHTML(title)}"
                loading="lazy"
                onerror="
                  this.style.display='none';
                  this.parentElement.textContent='Sin fotografía';
                "
              >

            </div>
          `
          : `
            <div class="property-image">
              Sin fotografía
            </div>
          `;


      const addressHTML =
        property.address
          ? `
            <div class="property-address">
              📍 ${escapeHTML(
                property.address
              )}
            </div>
          `
          : "";


      return `
        <div class="property-card">

          ${imageHTML}

          <div class="property-content">

            <div class="property-type">
              ${escapeHTML(
                property.property_type ||
                "Propiedad"
              )}
            </div>

            <div class="property-title">
              ${escapeHTML(title)}
            </div>

            <div class="property-price">
              ${money(
                property.price
              )}
            </div>

            ${
              location
                ? `
                  <div class="property-location">
                    ${escapeHTML(
                      location
                    )}
                  </div>
                `
                : ""
            }

            ${statsHTML}

            ${addressHTML}

            <button
              type="button"
              class="view-property"
              onclick="
                window.openProperty(
                  ${Number(property.id)}
                )
              "
            >
              Ver propiedad
            </button>

          </div>

        </div>
      `;
    }


    /* =====================================================
       ABRIR PROPIEDAD
       ===================================================== */

    window.openProperty =
      function(id) {

        const property =
          allProperties.find(
            item =>
              Number(item.id) ===
              Number(id)
          );

        if (!property) {
          return;
        }


        const latitude =
          Number(
            property.latitude
          );

        const longitude =
          Number(
            property.longitude
          );


        if (
          !Number.isFinite(latitude) ||
          !Number.isFinite(longitude)
        ) {

          return;

        }


        map.setView(
          [
            latitude,
            longitude
          ],
          Math.max(
            map.getZoom(),
            16
          ),
          {
            animate: true
          }
        );

      };


    /* =====================================================
       MARCADORES
       ===================================================== */

    function renderMarkers() {

      markerLayer.clearLayers();


      filteredProperties.forEach(
        property => {

          const latitude =
            Number(
              property.latitude
            );

          const longitude =
            Number(
              property.longitude
            );


          /*
           * Jamás colocamos un pin
           * con coordenadas inválidas.
           */

          if (
            !Number.isFinite(latitude) ||
            !Number.isFinite(longitude)
          ) {

            return;

          }


          const marker =
            L.marker(
              [
                latitude,
                longitude
              ],
              {
                icon:
                  nexoIcon,

                riseOnHover:
                  true
              }
            );


          marker.bindPopup(
            buildPropertyCard(
              property
            ),
            {
              maxWidth: 320,

              closeButton:
                true,

              autoPan:
                true,

              autoPanPaddingTopLeft:
                [25, 140],

              autoPanPaddingBottomRight:
                [25, 80]
            }
          );


          marker.addTo(
            markerLayer
          );

        }
      );


      updateCounter();

    }


    /* =====================================================
       AJUSTAR MAPA
       ===================================================== */

    function fitVisibleProperties() {

      const coordinates =
        filteredProperties
          .map(
            property => {

              const latitude =
                Number(
                  property.latitude
                );

              const longitude =
                Number(
                  property.longitude
                );


              if (
                !Number.isFinite(latitude) ||
                !Number.isFinite(longitude)
              ) {

                return null;

              }


              return [
                latitude,
                longitude
              ];

            }
          )
          .filter(Boolean);


      if (
        !coordinates.length
      ) {

        /*
         * Si no hay coordenadas:
         * volvemos a Cuba.
         */

        map.setView(
          [21.8, -79.5],
          6,
          {
            animate: true
          }
        );

        return;
      }


      if (
        coordinates.length === 1
      ) {

        map.setView(
          coordinates[0],
          15,
          {
            animate: true
          }
        );

        return;
      }


      const bounds =
        L.latLngBounds(
          coordinates
        );


      map.fitBounds(
        bounds,
        {
          paddingTopLeft:
            [30, 150],

          paddingBottomRight:
            [30, 110],

          maxZoom:
            16,

          animate:
            true
        }
      );

    }


    /* =====================================================
       CONTADOR
       ===================================================== */

    function updateCounter() {

      const valid =
        filteredProperties.filter(
          property => {

            const lat =
              Number(
                property.latitude
              );

            const lng =
              Number(
                property.longitude
              );

            return (
              Number.isFinite(lat) &&
              Number.isFinite(lng)
            );

          }
        ).length;


      const total =
        filteredProperties.length;


      if (
        total === valid
      ) {

        counter.textContent =
          `${total} ${
            total === 1
              ? "propiedad"
              : "propiedades"
          }`;

      } else {

        counter.textContent =
          `${total} propiedades · ${valid} ubicadas`;

      }

    }


    /* =====================================================
       FILTROS
       ===================================================== */

    function applyFilters() {

      const search =
        normalize(
          searchInput.value
        );


      filteredProperties =
        allProperties.filter(
          property => {

            if (
              activeType !== "all" &&
              normalize(
                property.property_type
              ) !==
              normalize(
                activeType
              )
            ) {

              return false;

            }


            if (!search) {
              return true;
            }


            const searchable =
              [
                property.property_type,
                property.title,
                property.city,
                property.neighborhood,
                property.address,
                property.description
              ]
                .filter(Boolean)
                .map(normalize)
                .join(" ");


            return searchable.includes(
              search
            );

          }
        );


      renderMarkers();


      fitVisibleProperties();


      if (
        filteredProperties.length ===
        0
      ) {

        showStatus(
          "Sin resultados",
          "No encontramos propiedades con esos criterios."
        );

      } else {

        hideStatus();

      }

    }


    /* =====================================================
       BOTONES DE FILTRO
       ===================================================== */

    document
      .querySelectorAll(
        ".filter"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              document
                .querySelectorAll(
                  ".filter"
                )
                .forEach(
                  item =>
                    item.classList.remove(
                      "active"
                    )
                );


              button.classList.add(
                "active"
              );


              activeType =
                button.dataset.type ||
                "all";


              applyFilters();

            }
          );

        }
      );


    /* =====================================================
       BUSCADOR
       ===================================================== */

    searchInput.addEventListener(
      "input",
      () => {

        clearSearch.classList.toggle(
          "show",
          Boolean(
            searchInput.value.trim()
          )
        );


        applyFilters();

      }
    );


    clearSearch.addEventListener(
      "click",
      () => {

        searchInput.value =
          "";

        clearSearch.classList.remove(
          "show"
        );

        applyFilters();

        searchInput.focus();

      }
    );


    /* =====================================================
       BOTÓN AJUSTAR
       ===================================================== */

    fitButton.addEventListener(
      "click",
      () => {

        fitVisibleProperties();

      }
    );


    /* =====================================================
       UBICACIÓN DEL USUARIO
       ===================================================== */

    let userLocationMarker =
      null;


    locationButton.addEventListener(
      "click",
      () => {

        if (
          !navigator.geolocation
        ) {

          alert(
            "Tu dispositivo no permite obtener la ubicación."
          );

          return;

        }


        locationButton.disabled =
          true;


        navigator.geolocation.getCurrentPosition(

          position => {

            const latitude =
              position.coords.latitude;

            const longitude =
              position.coords.longitude;


            if (
              userLocationMarker
            ) {

              map.removeLayer(
                userLocationMarker
              );

            }


            userLocationMarker =
              L.circleMarker(
                [
                  latitude,
                  longitude
                ],
                {
                  radius: 8,

                  weight: 3,

                  fillOpacity: .9
                }
              )
                .addTo(map)
                .bindPopup(
                  "Tu ubicación"
                );


            map.setView(
              [
                latitude,
                longitude
              ],
              15,
              {
                animate: true
              }
            );


            locationButton.disabled =
              false;

          },

          error => {

            console.warn(
              "NEXO ubicación:",
              error
            );


            alert(
              "No se pudo obtener tu ubicación."
            );


            locationButton.disabled =
              false;

          },

          {
            enableHighAccuracy:
              true,

            timeout:
              10000,

            maximumAge:
              60000
          }

        );

      }
    );


    /* =====================================================
       CARGAR PROPIEDADES
       ===================================================== */

    async function loadProperties() {

      showStatus(
        "Cargando propiedades",
        "Conectando con NEXO..."
      );


      try {

        const response =
          await fetch(
            "/api/properties",
            {
              method:
                "GET",

              headers:
                {
                  "Accept":
                    "application/json"
                },

              /*
               * No usamos Cache-Control:
               * no-cache aquí porque el mapa
               * debe poder aprovechar la caché
               * del navegador.
               */

              cache:
                "default"
            }
          );


        const text =
          await response.text();


        let data;


        try {

          data =
            JSON.parse(
              text
            );

        } catch {

          throw new Error(
            "La respuesta del servidor no es JSON."
          );

        }


        if (
          !response.ok ||
          data.success === false
        ) {

          throw new Error(
            data.error ||
            `HTTP ${response.status}`
          );

        }


        allProperties =
          Array.isArray(
            data.properties
          )
            ? data.properties
            : [];


        /*
         * Solo propiedades disponibles.
         */

        allProperties =
          allProperties.filter(
            property =>
              !property.status ||
              property.status ===
                "available"
          );


        filteredProperties =
          [
            ...allProperties
          ];


        renderMarkers();


        hideStatus();


        /*
         * Solo ajustamos automáticamente
         * si existen coordenadas válidas.
         */

        const located =
          allProperties.filter(
            property => {

              const lat =
                Number(
                  property.latitude
                );

              const lng =
                Number(
                  property.longitude
                );

              return (
                Number.isFinite(lat) &&
                Number.isFinite(lng)
              );

            }
          );


        if (
          located.length
        ) {

          fitVisibleProperties();

        } else {

          map.setView(
            [21.8, -79.5],
            6
          );

        }

      } catch (error) {

        console.error(
          "NEXO MAP:",
          error
        );


        showStatus(
          "No se pudieron cargar las propiedades",
          error.message ||
          "Comprueba la conexión con NEXO."
        );


        counter.textContent =
          "Error";

      }

    }


    /* =====================================================
       INICIO
       ===================================================== */

    loadProperties();


    /*
     * Leaflet necesita recalcular
     * el tamaño después de cargar.
     */

    setTimeout(
      () => {

        map.invalidateSize(
          true
        );

      },
      350
    );


    window.addEventListener(
      "resize",
      () => {

        map.invalidateSize(
          true
        );

      }
    );


    /*
     * iPhone / Safari:
     * recalcular después de cambiar
     * orientación o volver a la página.
     */

    window.addEventListener(
      "orientationchange",
      () => {

        setTimeout(
          () => {

            map.invalidateSize(
              true
            );

          },
          350
        );

      }
    );


  </script>

</body>
</html>
