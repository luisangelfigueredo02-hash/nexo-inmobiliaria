<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mapa Interactivo de Propiedades — {{BRAND_NAME}}</title>
    <meta name="description" content="Explora casas, apartamentos y terrenos en un mapa interactivo. Ubicación, precio y detalles de cada propiedad en {{BRAND_NAME}}.">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="theme-color" content="#faf9f7">

    <!-- Preconnect a terceros del mapa: reduce latencia TLS/DNS al iniciar -->
    <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin>

    <!-- Sistema de diseño global -->
    <link rel="stylesheet" href="/variables.css">

    <!-- Leaflet self-hosted (sin dependencia de CDN tercero) -->
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />

    <style>
        :root { --color-accent: {{BRAND_PRIMARY_COLOR}}; }

        /* Header del mapa: fijo para no restar viewport al mapa */
        .nx-header { position: fixed; left: 0; right: 0; }

        /* Contenedor de pantalla dividida */
        .map-split-view {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            height: 100dvh;
            padding-top: var(--header-height);
            overflow: hidden;
            width: 100%;
        }

        .map-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        #fullscreen-map {
            width: 100%;
            height: 100%;
            background-color: var(--color-image-placeholder);
        }

        /* Panel lateral de tarjetas (desktop) */
        .sidebar-list {
            height: 100%;
            overflow-y: auto;
            background-color: var(--color-surface);
            border-left: 1px solid var(--color-border);
            padding: var(--space-5);
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
        }

        .sidebar-header h1 {
            font-size: var(--text-heading);
            font-weight: var(--weight-bold);
            letter-spacing: var(--tracking-tight);
        }

        .sidebar-header p {
            font-size: var(--text-label);
            color: var(--color-ink-secondary);
        }

        .list-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr));
            gap: var(--space-4);
        }

        /* Preview flotante móvil (oculta en desktop) */
        .mobile-preview-container { display: none; }

        /* Banner de estado sobre el mapa (tiles caídos, etc.) */
        .map-status {
            position: absolute;
            z-index: 800;
            top: var(--space-4);
            left: 50%;
            transform: translateX(-50%);
            background: var(--color-surface);
            color: var(--color-ink-secondary);
            border: 1px solid var(--color-border);
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-full);
            font-size: var(--text-caption);
            box-shadow: var(--shadow-2);
            max-width: calc(100% - var(--space-6));
            text-align: center;
        }

        /* Estado de mapa vacío (sin coordenadas en el inventario) */
        .map-empty {
            position: absolute;
            inset: 0;
            z-index: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-6);
            background: var(--color-bg);
        }
        .map-empty[hidden] { display: none; }

        /* Adaptabilidad móvil */
        @media (max-width: 992px) {
            .map-split-view { grid-template-columns: 1fr; }
            .sidebar-list { display: none; }

            .mobile-preview-container {
                display: block;
                position: absolute;
                bottom: calc(76px + var(--safe-bottom));
                left: var(--space-4);
                right: var(--space-4);
                z-index: 450;
                pointer-events: none;
                transform: translateY(150%);
                transition: transform var(--duration-normal) var(--ease-out-expo);
            }

            .mobile-preview-container.visible {
                transform: translateY(0);
                pointer-events: auto;
            }

            .mobile-preview-container .nx-card {
                pointer-events: auto;
                flex-direction: row;
                box-shadow: var(--shadow-3);
                max-width: 480px;
                margin: 0 auto;
                height: 120px;
            }

            .mobile-preview-container .nx-card__media {
                width: 120px;
                height: 100%;
                aspect-ratio: auto;
                flex-shrink: 0;
            }

            .mobile-preview-container .nx-card__body {
                padding: var(--space-3);
                gap: 2px;
                justify-content: center;
                overflow: hidden;
            }

            .mobile-preview-container .nx-card__specs {
                margin-top: var(--space-1);
                padding-top: var(--space-1);
                gap: var(--space-2);
            }

            .close-preview-btn {
                position: absolute;
                top: -12px;
                right: -12px;
                width: 32px;
                height: 32px;
                background-color: var(--color-accent);
                color: var(--color-ink-on-accent);
                border-radius: var(--radius-full);
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: var(--shadow-2);
                z-index: 460;
                pointer-events: auto;
            }
        }
    </style>
</head>
<body>
    <script src="/demo-banner.js"></script>

    <header class="nx-header">
        <a href="/" class="nx-logo">NE<em>X</em>O</a>
        <nav class="nx-header__nav" aria-label="Navegación principal">
            <a href="/">Explorar</a>
            <a href="/mapa/index.html" class="active">Mapa</a>
            <a href="/comparar/index.html">Comparar</a>
            <a href="/ia/index.html">IA</a>
            <a href="/cuenta/" class="account-link">Entrar</a>
        </nav>
    </header>

    <main class="map-split-view">
        <section class="map-wrapper">
            <div id="fullscreen-map" role="application" aria-label="Mapa interactivo de propiedades"></div>

            <div class="map-empty" id="map-empty" hidden>
                <div class="nx-state">
                    <div class="nx-state__icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    </div>
                    <h2 id="map-empty-title">Mapa sin ubicaciones todavía</h2>
                    <p id="map-empty-text">Las propiedades actuales no tienen coordenadas registradas. Explora el listado mientras se geolocalizan.</p>
                    <a class="nx-btn nx-btn--primary" href="/">Explorar catálogo</a>
                </div>
            </div>

            <div class="mobile-preview-container" id="mobile-preview">
                <button class="close-preview-btn" data-action="close-preview" aria-label="Cerrar previsualización">
                    <svg viewBox="0 0 24 24" style="width: 14px; height: 14px; fill: currentColor;" aria-hidden="true">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
                <div id="mobile-card-slot"></div>
            </div>
        </section>

        <aside class="sidebar-list">
            <div class="sidebar-header">
                <h1>Propiedades en el mapa</h1>
                <p id="visible-properties-count" role="status" aria-live="polite">Consultando catálogo…</p>
            </div>
            <div class="list-grid" id="properties-sidebar-grid">
                <div class="nx-card" aria-hidden="true">
                    <div class="nx-card__media nx-skeleton"></div>
                    <div class="nx-card__body">
                        <div class="nx-skeleton" style="height:22px; width:45%;"></div>
                        <div class="nx-skeleton" style="height:16px; width:85%;"></div>
                        <div class="nx-skeleton" style="height:13px; width:60%;"></div>
                    </div>
                </div>
                <div class="nx-card" aria-hidden="true">
                    <div class="nx-card__media nx-skeleton"></div>
                    <div class="nx-card__body">
                        <div class="nx-skeleton" style="height:22px; width:45%;"></div>
                        <div class="nx-skeleton" style="height:16px; width:85%;"></div>
                        <div class="nx-skeleton" style="height:13px; width:60%;"></div>
                    </div>
                </div>
            </div>
        </aside>
    </main>

    <nav class="nx-bottomnav" aria-label="Navegación inferior">
        <a href="/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            Explorar
        </a>
        <a href="/mapa/index.html" class="active" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            Mapa
        </a>
        <a href="/comparar/index.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3m8-18h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3M12 1v22"/></svg>
            Comparar
        </a>
        <a href="/ia/index.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3z"/></svg>
            IA
        </a>
        <a href="/cuenta/" class="account-tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
            Cuenta
        </a>
    </nav>

    <!-- Leaflet self-hosted; fallback a CDN si el asset local falla -->
    <script src="/vendor/leaflet/leaflet.js"></script>
    <script>
        // Si el asset self-hosted no cargó (despliegue parcial), fallback a CDN.
        if (typeof L === "undefined") {
            document.write('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>');
        }
    </script>

    <script>
        let map;
        let globalProperties = [];
        let markersGroup = [];
        const API_ENDPOINT = '/api/properties';
        const FALLBACK_IMG = "/icons/placeholder.svg";

        // Escape de datos provenientes de la API antes de inyectar en innerHTML
        const escapeHtml = s => String(s ?? "").replace(/[&<>"']/g,
            c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        // srcset responsive: solo para rutas /media/* (R2) con variantes -wXXX.webp
        function responsiveSrcSet(url) {
            const m = url && url.match(/^(\/media\/.+)\.(jpe?g|png)$/i);
            if (!m) return "";
            return `${m[1]}-w400.webp 400w, ${m[1]}-w800.webp 800w, ${m[1]}-w1200.webp 1200w`;
        }

        // Centro/zoom del mapa desde /api/config (MARKET CONFIG, 04.7-B).
        const MARKET = { mapCenter: [23.1136, -82.3666], mapZoom: 12 };

        // Sesión: reflejar estado autenticado en el header
        fetch("/api/session/status", { credentials: "same-origin" })
            .then(r => r.ok ? r.json() : null)
            .then(s => {
                if (!s || !s.authenticated) return;
                const link = document.querySelector(".account-link");
                if (link) { link.textContent = "Cuenta"; link.classList.add("logged"); }
            })
            .catch(() => {});

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const cfg = await fetch('/api/config').then(r => r.ok ? r.json() : null);
                if (cfg) {
                    if (Array.isArray(cfg.map_center) && cfg.map_center.length === 2) MARKET.mapCenter = cfg.map_center;
                    if (cfg.map_zoom) MARKET.mapZoom = cfg.map_zoom;
                }
            } catch { /* fallback estático */ }
            initializeMap();
            loadMapData();
        });

        // Watchdog: el estado "Consultando catálogo…" nunca debe persistir.
        window.addEventListener('load', () => {
            setTimeout(() => {
                const el = document.getElementById('visible-properties-count');
                if (el && el.textContent.trim() === 'Consultando catálogo…') {
                    el.textContent = 'No se pudo cargar el mapa';
                    const grid = document.getElementById('properties-sidebar-grid');
                    if (grid) grid.innerHTML = `
                        <div class="nx-state" style="grid-column:1/-1;">
                            <h2>El mapa no está disponible ahora</h2>
                            <p>Explora el listado principal mientras restablecemos la conexión.</p>
                            <a class="nx-btn nx-btn--primary" href="/">Explorar catálogo</a>
                        </div>`;
                }
            }, 5000);
        });

        function initializeMap() {
            map = L.map('fullscreen-map', {
                scrollWheelZoom: false,
                touchZoom: true
            }).setView(MARKET.mapCenter, MARKET.mapZoom);

            const tiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
            }).addTo(map);

            // Aviso honesto si el proveedor de tiles falla (3G/bloqueo/caída).
            let tileErrors = 0;
            tiles.on('tileerror', () => {
                tileErrors += 1;
                if (tileErrors === 8 && !document.getElementById('tiles-fallback-notice')) {
                    const notice = document.createElement('div');
                    notice.id = 'tiles-fallback-notice';
                    notice.className = 'map-status';
                    notice.textContent = 'El mapa base no está disponible. Los marcadores siguen activos.';
                    document.getElementById('fullscreen-map').appendChild(notice);
                }
            });

            map.on('moveend', filterSidebarProperties);
        }

        async function loadMapData() {
            try {
                const response = await fetch(API_ENDPOINT);
                if (!response.ok) throw new Error('Error al conectar con el catálogo.');

                globalProperties = await response.json();

                const withCoords = globalProperties.filter(p => parseFloat(p.latitude) && parseFloat(p.longitude));

                if (withCoords.length === 0) {
                    // Estado honesto: inventario sin geolocalización (o vacío).
                    // Jamás se inventan coordenadas.
                    showNoCoordsState(globalProperties.length === 0);
                    document.getElementById('visible-properties-count').textContent =
                        globalProperties.length === 0 ? 'Sin propiedades publicadas' : '0 propiedades con ubicación';
                    renderSidebarProperties([]);
                    return;
                }

                // Encuadrar TODAS las propiedades geolocalizadas
                const bounds = withCoords.map(p => [parseFloat(p.latitude), parseFloat(p.longitude)]);
                if (bounds.length === 1) map.setView(bounds[0], 14);
                else map.fitBounds(bounds, { padding: [48, 48], maxZoom: 13 });

                renderMarkers(withCoords);
                filterSidebarProperties();
            } catch (error) {
                console.error(error);
                document.getElementById('visible-properties-count').textContent = 'Error al cargar propiedades';
                const grid = document.getElementById('properties-sidebar-grid');
                if (grid) grid.innerHTML = `
                    <div class="nx-state" style="grid-column:1/-1;">
                        <h2>No pudimos cargar el mapa</h2>
                        <p>Tu conexión parece lenta o intermitente.</p>
                        <button class="nx-btn nx-btn--primary" data-action="retry-map">Reintentar</button>
                    </div>`;
            }
        }

        // Estado "sin coordenadas" (14D): nombre canónico showNoCoordsState.
        function showNoCoordsState(noInventory) {
            const el = document.getElementById('map-empty');
            document.getElementById('map-empty-title').textContent =
                noInventory ? 'Aún no hay propiedades publicadas' : 'Mapa sin ubicaciones todavía';
            document.getElementById('map-empty-text').textContent =
                noInventory
                    ? 'Cuando se publique el primer inmueble aparecerá aquí geolocalizado.'
                    : 'Las propiedades actuales no tienen coordenadas registradas. Explora el listado mientras se geolocalizan.';
            el.hidden = false;
        }

        const fmtPrice = (n, currency) => {
            const num = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 }).format(n);
            if (currency === 'USD') return `US$${num}`;
            if (currency === 'EUR') return `€${num}`;
            if (currency === 'CUP') return `${num} CUP`;
            return num;
        };
        const compactPrice = (n, currency) => {
            const num = n >= 1e6 ? `${(n/1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n/1e3)}k` : `${n}`;
            if (currency === 'USD') return `$${num}`;
            if (currency === 'EUR') return `€${num}`;
            if (currency === 'CUP') return `${num} CUP`;
            return num;
        };

        function renderMarkers(properties) {
            markersGroup.forEach(m => map.removeLayer(m));
            markersGroup = [];

            properties.forEach(property => {
                const lat = parseFloat(property.latitude), lng = parseFloat(property.longitude);
                const icon = L.divIcon({
                    className: '',
                    html: `<div class="nx-price-marker" id="marker-${escapeHtml(property.id)}">${compactPrice(property.price, property.currency)}</div>`,
                    iconSize: [64, 32],
                    iconAnchor: [32, 16]
                });
                const marker = L.marker([lat, lng], { icon }).addTo(map);
                marker.on('click', () => handleMarkerClick(property));
                markersGroup.push(marker);
            });
        }

        function filterSidebarProperties() {
            if (!map || globalProperties.length === 0) return;
            const bounds = map.getBounds();
            const visible = globalProperties.filter(p => {
                const lat = parseFloat(p.latitude), lng = parseFloat(p.longitude);
                return lat && lng && bounds.contains([lat, lng]);
            });
            document.getElementById('visible-properties-count').textContent =
                `${visible.length} propiedad${visible.length !== 1 ? 'es' : ''} visible${visible.length !== 1 ? 's' : ''}`;
            renderSidebarProperties(visible);
        }

        function renderSidebarProperties(properties) {
            const container = document.getElementById('properties-sidebar-grid');
            container.innerHTML = '';

            if (properties.length === 0) {
                container.innerHTML = `
                    <div class="nx-state" style="grid-column:1/-1;">
                        <h2>Nada por aquí</h2>
                        <p>Desplaza el mapa o aleja el zoom para descubrir propiedades en otras zonas.</p>
                    </div>`;
                return;
            }

            properties.forEach(property => {
                const card = document.createElement('article');
                card.className = 'nx-card';

                const cardImg = escapeHtml((property.images && property.images[0]) || FALLBACK_IMG);
                const cardLocation = [property.neighborhood, property.city].filter(Boolean).join(', ') || 'Ubicación';
                const cardOperation = escapeHtml((property.operation || 'venta'));
                const canonicalId = encodeURIComponent(property.public_code || property.id);

                card.innerHTML = `
                    <div class="nx-card__media">
                        <span class="nx-card__badge">${cardOperation}</span>
                        <img src="${cardImg}" srcset="${responsiveSrcSet(cardImg)}" sizes="(max-width: 768px) 100vw, 400px" alt="${escapeHtml(property.title)}" loading="lazy" decoding="async" data-fallback-src="${FALLBACK_IMG}">
                    </div>
                    <div class="nx-card__body">
                        <div class="nx-card__price" style="font-size: var(--text-subhead);">${fmtPrice(property.price, property.currency)}</div>
                        <div class="nx-card__title">
                            <a href="/property.html?id=${canonicalId}" class="nx-card__link">${escapeHtml(property.title)}</a>
                        </div>
                        <div class="nx-card__location">${escapeHtml(cardLocation)}</div>
                    </div>
                `;

                card.addEventListener('mouseenter', () => highlightMarker(property.id, true));
                card.addEventListener('mouseleave', () => highlightMarker(property.id, false));

                container.appendChild(card);
            });
        }

        function highlightMarker(id, isActive) {
            const element = document.getElementById(`marker-${id}`);
            if (!element) return;
            element.classList.toggle('active-marker', isActive);
        }

        function handleMarkerClick(property) {
            document.querySelectorAll('.nx-price-marker').forEach(el => el.classList.remove('active-marker'));
            highlightMarker(property.id, true);

            const isMobile = window.innerWidth <= 992;
            if (isMobile) {
                const mobileSlot = document.getElementById('mobile-card-slot');
                const previewImg = escapeHtml((property.images && property.images[0]) || FALLBACK_IMG);
                const previewId = encodeURIComponent(property.public_code || property.id);

                mobileSlot.innerHTML = `
                    <article class="nx-card" data-href="/property.html?id=${previewId}" tabindex="0" role="link" aria-label="Ver ${escapeHtml(property.title)}">
                        <div class="nx-card__media">
                            <img src="${previewImg}" srcset="${responsiveSrcSet(previewImg)}" sizes="120px" alt="${escapeHtml(property.title)}" decoding="async" data-fallback-src="${FALLBACK_IMG}">
                        </div>
                        <div class="nx-card__body">
                            <div class="nx-card__price" style="font-size: var(--text-body);">${fmtPrice(property.price, property.currency)}</div>
                            <div class="nx-card__title">${escapeHtml(property.title)}</div>
                            <div class="nx-card__specs">
                                ${Number(property.bedrooms) > 0 ? `<span>${escapeHtml(property.bedrooms)} hab</span>` : ''}
                                ${property.area ? `<span>${escapeHtml(property.area)} m²</span>` : ''}
                            </div>
                        </div>
                    </article>
                `;

                document.getElementById('mobile-preview').classList.add('visible');
            } else {
                const cards = document.querySelectorAll('#properties-sidebar-grid .nx-card');
                cards.forEach(card => {
                    if (card.innerHTML.includes(property.title)) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        card.style.borderColor = 'var(--color-accent)';
                        setTimeout(() => card.style.borderColor = '', 2000);
                    }
                });
            }
        }

        function closeMobilePreview() {
            document.getElementById('mobile-preview').classList.remove('visible');
            document.querySelectorAll('.nx-price-marker').forEach(el => el.classList.remove('active-marker'));
        }

        // Delegación sin handlers inline (CSP)
        document.addEventListener("click", e => {
            const close = e.target.closest('[data-action="close-preview"]');
            if (close) { closeMobilePreview(); return; }
            const retry = e.target.closest('[data-action="retry-map"]');
            if (retry) { loadMapData(); return; }
            const nav = e.target.closest("[data-href]");
            if (nav) { window.location.href = nav.dataset.href; }
        });
        document.addEventListener("keydown", e => {
            if (e.key !== "Enter" && e.key !== " ") return;
            const nav = e.target.closest("[data-href]");
            if (nav) { e.preventDefault(); window.location.href = nav.dataset.href; }
        });
        // Fallback de imágenes sin onerror inline
        document.addEventListener("error", e => {
            const img = e.target;
            if (img && img.tagName === "IMG" && img.dataset.fallbackSrc && !img.dataset.fallbackDone) {
                img.dataset.fallbackDone = "1";
                img.src = img.dataset.fallbackSrc;
            }
        }, true);
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js").catch(() => {});
        }
    </script>
</body>
</html>
