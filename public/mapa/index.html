<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f7f7f5">

  <title>NEXO — Mapa</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >

  <style>
    :root {
      --bg: #f7f7f5;
      --white: #fff;
      --text: #111;
      --muted: #777;
      --line: rgba(0,0,0,.08);
      --shadow: 0 12px 35px rgba(0,0,0,.12);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Inter,
        system-ui,
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    /* =====================================================
       MAPA
       ===================================================== */

    #map {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: #e8e8e6;
    }

    .leaflet-container {
      width: 100%;
      height: 100%;
      font-family: inherit;
      background: #e8e8e6;
    }

    .leaflet-tile {
      image-rendering: auto;
    }

    .leaflet-control-attribution {
      font-size: 8px !important;

      padding: 2px 5px !important;

      background:
        rgba(255,255,255,.72) !important;

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      border-radius: 6px 0 0 0;
    }

    .leaflet-control-zoom {
      border: 0 !important;
      box-shadow: none !important;
    }

    .leaflet-control-zoom a {
      width: 40px !important;
      height: 40px !important;
      line-height: 40px !important;

      margin-top: 7px;

      border: 0 !important;
      border-radius: 14px !important;

      background:
        rgba(255,255,255,.95) !important;

      color: #111 !important;

      box-shadow:
        0 8px 25px rgba(0,0,0,.12);

      font-size: 19px !important;
    }

    .leaflet-control-zoom a:active {
      transform: scale(.94);
    }

    /* =====================================================
       BARRA SUPERIOR
       ===================================================== */

    .top-area {
      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      z-index: 1000;

      padding:
        calc(12px + env(safe-area-inset-top, 0px))
        14px
        0;

      pointer-events: none;
    }

    .top-inner {
      width: min(820px, 100%);
      margin: auto;

      pointer-events: auto;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    /* =====================================================
       NEXO
       ===================================================== */

    .brand {
      flex: 0 0 auto;

      height: 46px;

      display: flex;
      align-items: center;

      padding: 0 15px;

      border-radius: 16px;

      background:
        rgba(255,255,255,.95);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 8px 28px rgba(0,0,0,.11);

      color: #111;

      font-size: 17px;
      font-weight: 900;

      letter-spacing: -.08em;
    }

    /* =====================================================
       BUSCADOR
       ===================================================== */

    .search {
      flex: 1;
      min-width: 0;

      height: 46px;

      display: flex;
      align-items: center;

      border-radius: 16px;

      background:
        rgba(255,255,255,.95);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 8px 28px rgba(0,0,0,.11);

      overflow: hidden;
    }

    .search-symbol {
      flex: 0 0 auto;

      padding-left: 14px;

      color: #777;

      font-size: 16px;
    }

    .search input {
      width: 100%;
      height: 100%;

      padding: 0 11px;

      border: 0;
      outline: 0;

      background: transparent;

      color: #111;

      font-size: 13px;
    }

    .search input::placeholder {
      color: #999;
    }

    .clear {
      display: none;

      flex: 0 0 auto;

      width: 32px;
      height: 32px;

      margin-right: 6px;

      border-radius: 50%;

      background: #ededed;

      color: #555;

      font-size: 18px;
      line-height: 1;
    }

    .clear.visible {
      display: block;
    }

    /* =====================================================
       FILTROS
       ===================================================== */

    .filters {
      margin-top: 9px;

      display: flex;
      gap: 7px;

      overflow-x: auto;

      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter {
      flex: 0 0 auto;

      padding: 9px 13px;

      border: 1px solid rgba(0,0,0,.055);

      border-radius: 999px;

      background:
        rgba(255,255,255,.92);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      color: #444;

      font-size: 10px;
      font-weight: 750;

      box-shadow:
        0 5px 18px rgba(0,0,0,.07);

      transition:
        transform .18s ease,
        background .18s ease,
        color .18s ease;
    }

    .filter:active {
      transform: scale(.95);
    }

    .filter.active {
      background: #111;
      color: #fff;
    }

    /* =====================================================
       CONTADOR
       ===================================================== */

    .counter {
      position: fixed;

      left: 14px;

      bottom:
        calc(16px + env(safe-area-inset-bottom, 0px));

      z-index: 1000;

      padding: 9px 13px;

      border-radius: 999px;

      background:
        rgba(255,255,255,.94);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 8px 28px rgba(0,0,0,.12);

      color: #222;

      font-size: 10px;
      font-weight: 750;
    }

    /* =====================================================
       HERRAMIENTAS
       ===================================================== */

    .map-tools {
      position: fixed;

      right: 14px;

      bottom:
        calc(16px + env(safe-area-inset-bottom, 0px));

      z-index: 1000;

      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tool {
      width: 44px;
      height: 44px;

      border-radius: 15px;

      background:
        rgba(255,255,255,.95);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 8px 28px rgba(0,0,0,.12);

      color: #111;

      font-size: 17px;

      transition:
        transform .18s ease,
        opacity .18s ease;
    }

    .tool:active {
      transform: scale(.92);
    }

    .tool:disabled {
      opacity: .5;
    }

    /* =====================================================
       ESTADO
       ===================================================== */

    .status {
      position: fixed;

      left: 50%;
      top: 50%;

      z-index: 3000;

      width:
        min(320px, calc(100% - 40px));

      transform:
        translate(-50%, -50%);

      padding: 20px;

      border-radius: 20px;

      background:
        rgba(255,255,255,.96);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 20px 60px rgba(0,0,0,.17);

      text-align: center;
    }

    .status.hidden {
      display: none;
    }

    .status-title {
      margin-bottom: 5px;

      font-size: 14px;
      font-weight: 850;
    }

    .status-text {
      color: #777;

      font-size: 11px;
      line-height: 1.5;
    }

    /* =====================================================
       PIN NEXO
       ===================================================== */

    .nexo-pin {
      position: relative;

      width: 38px;
      height: 38px;

      border-radius:
        50% 50% 50% 0;

      background: #111;

      border: 3px solid #fff;

      transform: rotate(-45deg);

      box-shadow:
        0 7px 18px rgba(0,0,0,.28);
    }

    .nexo-pin::after {
      content: "";

      position: absolute;

      width: 10px;
      height: 10px;

      left: 11px;
      top: 11px;

      border-radius: 50%;

      background: #fff;
    }

    .nexo-pin::before {
      content: "";

      position: absolute;

      width: 5px;
      height: 5px;

      left: 14px;
      top: 14px;

      border-radius: 50%;

      background: #111;

      z-index: 2;
    }

    /* =====================================================
       POPUP
       ===================================================== */

    .leaflet-popup {
      margin-bottom: 10px;
    }

    .leaflet-popup-content-wrapper {
      padding: 0 !important;

      border-radius: 22px !important;

      overflow: hidden;

      background: #fff;

      box-shadow:
        0 18px 55px rgba(0,0,0,.18);
    }

    .leaflet-popup-content {
      width:
        min(310px, 78vw) !important;

      margin: 0 !important;
    }

    .leaflet-popup-tip {
      box-shadow: none !important;
    }

    .leaflet-popup-close-button {
      top: 10px !important;
      right: 10px !important;

      z-index: 10;

      width: 30px !important;
      height: 30px !important;

      border-radius: 50%;

      background:
        rgba(255,255,255,.92);

      color: #111 !important;

      font-size: 20px !important;
      line-height: 27px !important;

      box-shadow:
        0 4px 15px rgba(0,0,0,.12);
    }

    /* =====================================================
       TARJETA DE PROPIEDAD
       ===================================================== */

    .property-card {
      width: 100%;
      overflow: hidden;
      background: #fff;
    }

    .property-photo {
      position: relative;

      width: 100%;
      height: 170px;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          #e9e9e7,
          #d8d8d6
        );
    }

    .property-photo img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }

    .photo-placeholder {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #999;

      font-size: 10px;
    }

    .photo-gradient {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      height: 60px;

      background:
        linear-gradient(
          transparent,
          rgba(0,0,0,.28)
        );

      pointer-events: none;
    }

    .property-body {
      padding: 16px;
    }

    .property-type {
      color: #888;

      font-size: 9px;
      font-weight: 850;

      text-transform: uppercase;

      letter-spacing: .12em;
    }

    .property-title {
      margin-top: 5px;

      color: #111;

      font-size: 19px;
      font-weight: 850;

      letter-spacing: -.055em;

      line-height: 1.05;
    }

    .property-price {
      margin-top: 8px;

      color: #111;

      font-size: 20px;
      font-weight: 850;

      letter-spacing: -.04em;
    }

    .property-location {
      margin-top: 6px;

      color: #777;

      font-size: 10px;
      line-height: 1.4;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;

      gap: 6px;

      margin-top: 12px;
    }

    .stat {
      padding: 6px 8px;

      border-radius: 999px;

      background: #f1f1ef;

      color: #555;

      font-size: 9px;
      font-weight: 750;
    }

    .address {
      margin-top: 11px;

      color: #777;

      font-size: 10px;
      line-height: 1.4;
    }

    .view-button {
      width: 100%;

      margin-top: 13px;

      padding: 12px;

      border-radius: 13px;

      background: #111;

      color: #fff;

      font-size: 11px;
      font-weight: 800;

      transition:
        transform .18s ease,
        opacity .18s ease;
    }

    .view-button:active {
      transform: scale(.98);
      opacity: .85;
    }

    /* =====================================================
       MÓVIL
       ===================================================== */

    @media (max-width: 600px) {

      .top-area {
        padding-left: 12px;
        padding-right: 12px;
      }

      .brand {
        height: 44px;
        padding: 0 13px;

        font-size: 16px;
      }

      .search {
        height: 44px;
      }

      .search input {
        font-size: 12px;
      }

      .property-photo {
        height: 155px;
      }
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <!-- =====================================================
       CABECERA
       ===================================================== -->

  <div class="top-area">

    <div class="top-inner">

      <div class="header">

        <div class="brand">
          NEXO
        </div>

        <div class="search">

          <span class="search-symbol">
            ⌕
          </span>

          <input
            id="searchInput"
            type="search"
            placeholder="Buscar ciudad, zona o dirección"
            autocomplete="off"
          >

          <button
            id="clearSearch"
            class="clear"
            type="button"
            aria-label="Limpiar búsqueda"
          >
            ×
          </button>

        </div>

      </div>

      <div class="filters">

        <button
          class="filter active"
          data-type="all"
          type="button"
        >
          Todas
        </button>

        <button
          class="filter"
          data-type="Casa"
          type="button"
        >
          Casas
        </button>

        <button
          class="filter"
          data-type="Apartamento"
          type="button"
        >
          Apartamentos
        </button>

        <button
          class="filter"
          data-type="Villa"
          type="button"
        >
          Villas
        </button>

        <button
          class="filter"
          data-type="Terreno"
          type="button"
        >
          Terrenos
        </button>

        <button
          class="filter"
          data-type="Local"
          type="button"
        >
          Locales
        </button>

      </div>

    </div>

  </div>

  <!-- =====================================================
       CONTADOR
       ===================================================== -->

  <div
    id="counter"
    class="counter"
  >
    Cargando propiedades...
  </div>

  <!-- =====================================================
       HERRAMIENTAS
       ===================================================== -->

  <div class="map-tools">

    <button
      id="fitButton"
      class="tool"
      type="button"
      aria-label="Mostrar propiedades"
      title="Mostrar propiedades"
    >
      ⛶
    </button>

    <button
      id="locationButton"
      class="tool"
      type="button"
      aria-label="Mi ubicación"
      title="Mi ubicación"
    >
      ⊙
    </button>

  </div>

  <!-- =====================================================
       ESTADO
       ===================================================== -->

  <div
    id="status"
    class="status"
  >

    <div
      id="statusTitle"
      class="status-title"
    >
      Cargando NEXO...
    </div>

    <div
      id="statusText"
      class="status-text"
    >
      Buscando propiedades.
    </div>

  </div>

  <!-- =====================================================
       LEAFLET
       ===================================================== -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <script>
    "use strict";

    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const mapElement =
      document.getElementById("map");

    const searchInput =
      document.getElementById("searchInput");

    const clearSearch =
      document.getElementById("clearSearch");

    const counter =
      document.getElementById("counter");

    const status =
      document.getElementById("status");

    const statusTitle =
      document.getElementById("statusTitle");

    const statusText =
      document.getElementById("statusText");

    const fitButton =
      document.getElementById("fitButton");

    const locationButton =
      document.getElementById("locationButton");


    /* =====================================================
       ESTADO
       ===================================================== */

    let allProperties = [];
    let filteredProperties = [];
    let activeType = "all";

    let userLocationLayer = null;


    /* =====================================================
       CONFIGURACIÓN GEOGRÁFICA
       ===================================================== */

    const DEFAULT_CENTER =
      [23.1136, -82.3666];

    const DEFAULT_ZOOM = 11;

    /*
     * Límites razonables del planeta.
     *
     * Evitan que datos corruptos como
     * latitude = 999999 o longitude = -999999
     * puedan romper el mapa.
     */

    const MIN_LAT = -90;
    const MAX_LAT = 90;

    const MIN_LNG = -180;
    const MAX_LNG = 180;


    /* =====================================================
       MAPA
       ===================================================== */

    const map =
      L.map(
        mapElement,
        {
          zoomControl: false,

          /*
           * Canvas no es necesario para
           * nuestros pocos marcadores.
           */
          preferCanvas: false,

          worldCopyJump: false,

          minZoom: 2,

          maxZoom: 19,

          /*
           * Evita que Leaflet haga
           * movimientos exagerados.
           */
          inertia: true,

          zoomAnimation: true,

          fadeAnimation: true,

          markerZoomAnimation: true
        }
      );


    L.control.zoom({
      position: "bottomright"
    }).addTo(map);


    /*
     * IMPORTANTE:
     *
     * El mapa comienza en Cuba.
     * Nunca comenzamos mostrando
     * el mundo entero.
     */

    map.setView(
      DEFAULT_CENTER,
      DEFAULT_ZOOM,
      {
        animate: false
      }
    );


    /* =====================================================
       MAPA BASE
       ===================================================== */

    const baseLayer =
      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          minZoom: 2,
          maxZoom: 19,

          updateWhenZooming: false,

          updateWhenIdle: true,

          keepBuffer: 3,

          attribution:
            '&copy; OpenStreetMap contributors'
        }
      );


    baseLayer.addTo(map);


    /* =====================================================
       CAPA DE PROPIEDADES
       ===================================================== */

    const markerLayer =
      L.layerGroup().addTo(map);


    /* =====================================================
       VALIDACIÓN DE COORDENADAS
       ===================================================== */

    function getValidCoordinates(
      property
    ) {

      if (!property) {
        return null;
      }


      /*
       * Admitimos latitude / longitude
       * como números o strings.
       */

      const latitude =
        Number(
          property.latitude
        );

      const longitude =
        Number(
          property.longitude
        );


      /*
       * NaN / Infinity.
       */

      if (
        !Number.isFinite(latitude) ||
        !Number.isFinite(longitude)
      ) {
        return null;
      }


      /*
       * Rango geográfico.
       */

      if (
        latitude < MIN_LAT ||
        latitude > MAX_LAT ||
        longitude < MIN_LNG ||
        longitude > MAX_LNG
      ) {
        return null;
      }


      /*
       * 0,0 es el punto del Atlántico.
       *
       * Para NEXO no tiene sentido como
       * coordenada inmobiliaria.
       */

      if (
        latitude === 0 &&
        longitude === 0
      ) {
        return null;
      }


      return [
        latitude,
        longitude
      ];
    }


    /* =====================================================
       UTILIDADES
       ===================================================== */

    function escapeHTML(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }


    function normalize(
      value
    ) {

      return String(
        value ?? ""
      )
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        )
        .toLowerCase()
        .trim();
    }


    function money(
      value
    ) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return "$0";
      }


      const number =
        Number(
          String(value)
            .replace(
              /[$,\s]/g,
              ""
            )
        );


      if (
        !Number.isFinite(number)
      ) {
        return String(value);
      }


      return "$" +
        number.toLocaleString(
          "en-US",
          {
            maximumFractionDigits: 0
          }
        );
    }


    /* =====================================================
       FOTOGRAFÍAS
       ===================================================== */

    function parsePhotos(
      property
    ) {

      if (
        Array.isArray(
          property.photos
        )
      ) {

        return property.photos
          .filter(Boolean);
      }


      if (
        typeof property.photos ===
        "string"
      ) {

        const raw =
          property.photos.trim();


        if (!raw) {
          return [];
        }


        /*
         * Intentar JSON.
         */

        try {

          const parsed =
            JSON.parse(raw);


          if (
            Array.isArray(parsed)
          ) {

            return parsed
              .filter(Boolean);
          }

        } catch {
          /*
           * No era JSON.
           */
        }


        /*
         * Una URL única.
         */

        if (
          raw.startsWith("http://") ||
          raw.startsWith("https://")
        ) {

          return [raw];
        }
      }


      /*
       * Compatibilidad con
       * nombres antiguos.
       */

      return [
        property.image,
        property.image_url,
        property.photo,
        property.photo_url,
        property.cover_image,
        property.cover
      ]
        .filter(
          item =>
            typeof item === "string" &&
            item.trim()
        );
    }


    /* =====================================================
       ESTADO
       ===================================================== */

    function showStatus(
      title,
      text
    ) {

      statusTitle.textContent =
        title;

      statusText.textContent =
        text;

      status.classList.remove(
        "hidden"
      );
    }


    function hideStatus() {

      status.classList.add(
        "hidden"
      );
    }


    /* =====================================================
       ICONO NEXO
       ===================================================== */

    const nexoIcon =
      L.divIcon({
        className: "",

        html:
          '<div class="nexo-pin"></div>',

        iconSize:
          [38, 38],

        iconAnchor:
          [19, 38],

        popupAnchor:
          [0, -35]
      });


    /* =====================================================
       TARJETA DE PROPIEDAD
       ===================================================== */

    function buildPropertyCard(
      property
    ) {

      const photos =
        parsePhotos(property);


      const image =
        photos.length
          ? photos[0]
          : "";


      const title =
        property.title ||
        property.name ||
        property.property_type ||
        "Propiedad";


      const location =
        [
          property.neighborhood,
          property.city
        ]
          .filter(Boolean)
          .join(" · ");


      const stats = [];


      if (
        property.bedrooms !== null &&
        property.bedrooms !== undefined &&
        property.bedrooms !== ""
      ) {

        stats.push(
          `🛏 ${escapeHTML(
            property.bedrooms
          )}`
        );
      }


      if (
        property.bathrooms !== null &&
        property.bathrooms !== undefined &&
        property.bathrooms !== ""
      ) {

        stats.push(
          `🚿 ${escapeHTML(
            property.bathrooms
          )}`
        );
      }


      if (
        property.square_meters !== null &&
        property.square_meters !== undefined &&
        property.square_meters !== ""
      ) {

        stats.push(
          `${escapeHTML(
            property.square_meters
          )} m²`
        );
      }


      const statsHTML =
        stats.length
          ? `
            <div class="stats">
              ${stats
                .map(
                  item =>
                    `<span class="stat">${item}</span>`
                )
                .join("")}
            </div>
          `
          : "";


      const photoHTML =
        image
          ? `
            <div class="property-photo">

              <img
                src="${escapeHTML(image)}"
                alt="${escapeHTML(title)}"
                loading="lazy"
                onerror="
                  this.style.display='none';
                  this.nextElementSibling.style.display='flex';
                "
              >

              <div
                class="photo-placeholder"
                style="display:none"
              >
                Sin fotografía
              </div>

              <div class="photo-gradient"></div>

            </div>
          `
          : `
            <div class="property-photo">

              <div class="photo-placeholder">
                Sin fotografía
              </div>

            </div>
          `;


      const addressHTML =
        property.address
          ? `
            <div class="address">
              📍 ${escapeHTML(
                property.address
              )}
            </div>
          `
          : "";


      const safeId =
        Number(property.id);


      return `
        <div class="property-card">

          ${photoHTML}

          <div class="property-body">

            <div class="property-type">
              ${escapeHTML(
                property.property_type ||
                "Propiedad"
              )}
            </div>

            <div class="property-title">
              ${escapeHTML(title)}
            </div>

            <div class="property-price">
              ${money(property.price)}
            </div>

            ${
              location
                ? `
                  <div class="property-location">
                    ${escapeHTML(
                      location
                    )}
                  </div>
                `
                : ""
            }

            ${statsHTML}

            ${addressHTML}

            ${
              Number.isFinite(safeId)
                ? `
                  <button
                    class="view-button"
                    type="button"
                    onclick="openProperty(${safeId})"
                  >
                    Ver propiedad
                  </button>
                `
                : ""
            }

          </div>

        </div>
      `;
    }


    /* =====================================================
       ABRIR PROPIEDAD
       ===================================================== */

    window.openProperty =
      function(id) {

        const property =
          allProperties.find(
            item =>
              Number(item.id) ===
              Number(id)
          );


        if (!property) {
          return;
        }


        const coordinates =
          getValidCoordinates(
            property
          );


        if (!coordinates) {
          return;
        }


        map.closePopup();


        map.flyTo(
          coordinates,
          Math.max(
            map.getZoom(),
            16
          ),
          {
            animate: true,
            duration: .7
          }
        );
      };


    /* =====================================================
       MARCADORES
       ===================================================== */

    function renderMarkers() {

      markerLayer.clearLayers();


      filteredProperties.forEach(
        property => {

          const coordinates =
            getValidCoordinates(
              property
            );


          /*
           * Coordenadas inválidas:
           * no dibujar pin.
           */

          if (!coordinates) {
            return;
          }


          const marker =
            L.marker(
              coordinates,
              {
                icon: nexoIcon,
                keyboard: true
              }
            );


          marker.bindPopup(
            buildPropertyCard(
              property
            ),
            {
              maxWidth: 320,

              closeButton: true,

              autoPan: true,

              autoPanPaddingTopLeft:
                [25, 130],

              autoPanPaddingBottomRight:
                [25, 90]
            }
          );


          marker.addTo(
            markerLayer
          );
        }
      );


      updateCounter();
    }


    /* =====================================================
       OBTENER COORDENADAS VISIBLES
       ===================================================== */

    function getVisibleCoordinates() {

      return filteredProperties
        .map(
          property =>
            getValidCoordinates(
              property
            )
        )
        .filter(Boolean);
    }


    /* =====================================================
       AJUSTAR MAPA
       ===================================================== */

    function fitVisibleProperties() {

      const coordinates =
        getVisibleCoordinates();


      /*
       * SIN PROPIEDADES UBICADAS:
       * volvemos a Cuba.
       */

      if (
        coordinates.length === 0
      ) {

        map.setView(
          DEFAULT_CENTER,
          DEFAULT_ZOOM,
          {
            animate: true
          }
        );

        return;
      }


      /*
       * UNA SOLA PROPIEDAD.
       */

      if (
        coordinates.length === 1
      ) {

        map.flyTo(
          coordinates[0],
          15,
          {
            animate: true,
            duration: .7
          }
        );

        return;
      }


      /*
       * VARIAS PROPIEDADES.
       */

      const bounds =
        L.latLngBounds(
          coordinates
        );


      /*
       * Protección adicional:
       * comprobamos que el bounds sea válido.
       */

      if (
        !bounds.isValid()
      ) {

        map.setView(
          DEFAULT_CENTER,
          DEFAULT_ZOOM
        );

        return;
      }


      map.fitBounds(
        bounds,
        {
          paddingTopLeft:
            [30, 150],

          paddingBottomRight:
            [30, 110],

          /*
           * Evita que el mapa se
           * aleje demasiado.
           */

          maxZoom: 16,

          animate: true,

          duration: .7
        }
      );
    }


    /* =====================================================
       CONTADOR
       ===================================================== */

    function updateCounter() {

      const total =
        filteredProperties.length;


      const located =
        filteredProperties.filter(
          property =>
            Boolean(
              getValidCoordinates(
                property
              )
            )
        ).length;


      if (
        total === 0
      ) {

        counter.textContent =
          "0 propiedades";

        return;
      }


      if (
        total === located
      ) {

        counter.textContent =
          `${total} ${
            total === 1
              ? "propiedad"
              : "propiedades"
          }`;

      } else {

        counter.textContent =
          `${total} propiedades · ${located} ubicadas`;
      }
    }


    /* =====================================================
       FILTROS
       ===================================================== */

    function applyFilters() {

      const query =
        normalize(
          searchInput.value
        );


      filteredProperties =
        allProperties.filter(
          property => {

            /*
             * TIPO
             */

            if (
              activeType !== "all" &&
              normalize(
                property.property_type
              ) !==
              normalize(
                activeType
              )
            ) {

              return false;
            }


            /*
             * BÚSQUEDA
             */

            if (!query) {
              return true;
            }


            const searchable =
              [
                property.title,
                property.name,
                property.property_type,
                property.city,
                property.neighborhood,
                property.address,
                property.description
              ]
                .filter(Boolean)
                .map(normalize)
                .join(" ");


            return searchable.includes(
              query
            );
          }
        );


      renderMarkers();


      /*
       * Si hay resultados,
       * centramos únicamente en ellos.
       */

      if (
        filteredProperties.length
      ) {

        hideStatus();

        fitVisibleProperties();

      } else {

        showStatus(
          "Sin resultados",
          "No encontramos propiedades con esos criterios."
        );

        /*
         * NO movemos el mapa.
         */
      }
    }


    /* =====================================================
       FILTROS — EVENTOS
       ===================================================== */

    document
      .querySelectorAll(".filter")
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              document
                .querySelectorAll(
                  ".filter"
                )
                .forEach(
                  item =>
                    item.classList.remove(
                      "active"
                    )
                );


              button.classList.add(
                "active"
              );


              activeType =
                button.dataset.type ||
                "all";


              applyFilters();
            }
          );
        }
      );


    /* =====================================================
       BUSCADOR
       ===================================================== */

    searchInput.addEventListener(
      "input",
      () => {

        clearSearch.classList.toggle(
          "visible",
          Boolean(
            searchInput.value.trim()
          )
        );


        applyFilters();
      }
    );


    clearSearch.addEventListener(
      "click",
      () => {

        searchInput.value = "";

        clearSearch.classList.remove(
          "visible"
        );


        applyFilters();

        searchInput.focus();
      }
    );


    /* =====================================================
       BOTÓN MOSTRAR PROPIEDADES
       ===================================================== */

    fitButton.addEventListener(
      "click",
      () => {

        /*
         * Este botón SIEMPRE trabaja
         * con las propiedades actuales.
         */

        if (
          filteredProperties.length
        ) {

          fitVisibleProperties();

        } else {

          /*
           * Si no hay filtro válido,
           * volvemos a Cuba.
           */

          map.setView(
            DEFAULT_CENTER,
            DEFAULT_ZOOM,
            {
              animate: true
            }
          );
        }
      }
    );


    /* =====================================================
       UBICACIÓN DEL USUARIO
       ===================================================== */

    locationButton.addEventListener(
      "click",
      () => {

        if (
          !navigator.geolocation
        ) {

          alert(
            "Tu dispositivo no permite obtener la ubicación."
          );

          return;
        }


        locationButton.disabled =
          true;


        navigator.geolocation.getCurrentPosition(

          position => {

            const lat =
              Number(
                position.coords.latitude
              );

            const lng =
              Number(
                position.coords.longitude
              );


            if (
              !Number.isFinite(lat) ||
              !Number.isFinite(lng)
            ) {

              locationButton.disabled =
                false;

              return;
            }


            /*
             * Eliminar ubicación anterior.
             */

            if (
              userLocationLayer
            ) {

              map.removeLayer(
                userLocationLayer
              );
            }


            userLocationLayer =
              L.circleMarker(
                [lat, lng],
                {
                  radius: 8,
                  weight: 3
                }
              )
                .addTo(map)
                .bindPopup(
                  "Tu ubicación"
                );


            map.flyTo(
              [lat, lng],
              15,
              {
                animate: true,
                duration: .7
              }
            );


            locationButton.disabled =
              false;
          },


          error => {

            console.warn(
              "NEXO ubicación:",
              error
            );


            alert(
              "No se pudo obtener tu ubicación."
            );


            locationButton.disabled =
              false;
          },


          {
            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 60000
          }
        );
      }
    );


    /* =====================================================
       CARGAR PROPIEDADES
       ===================================================== */

    async function loadProperties() {

      showStatus(
        "Cargando NEXO",
        "Buscando propiedades..."
      );


      try {

        const response =
          await fetch(
            "/api/properties",
            {
              method: "GET",

              headers: {
                "Accept":
                  "application/json"
              },

              cache:
                "no-store"
            }
          );


        const text =
          await response.text();


        let data;


        try {

          data =
            JSON.parse(text);

        } catch {

          throw new Error(
            "La respuesta del servidor no es JSON."
          );
        }


        if (
          !response.ok ||
          data.success === false
        ) {

          throw new Error(
            data.error ||
            `HTTP ${response.status}`
          );
        }


        /*
         * Cargar propiedades.
         */

        allProperties =
          Array.isArray(
            data.properties
          )
            ? data.properties
            : [];


        /*
         * Solo disponibles.
         */

        allProperties =
          allProperties.filter(
            property => {

              const statusValue =
                normalize(
                  property.status
                );


              return (
                !statusValue ||
                statusValue ===
                  "available"
              );
            }
          );


        /*
         * Copia inicial.
         */

        filteredProperties =
          [
            ...allProperties
          ];


        /*
         * Crear pins.
         */

        renderMarkers();


        /*
         * Propiedades con coordenadas
         * realmente válidas.
         */

        const located =
          allProperties.filter(
            property =>
              Boolean(
                getValidCoordinates(
                  property
                )
              )
          );


        /*
         * Si hay propiedades:
         * mostrar SOLO sus ubicaciones.
         */

        if (
          located.length > 0
        ) {

          fitVisibleProperties();

        } else {

          /*
           * Si ninguna tiene coordenadas,
           * permanecer en Cuba.
           */

          map.setView(
            DEFAULT_CENTER,
            DEFAULT_ZOOM,
            {
              animate: false
            }
          );
        }


        hideStatus();


      } catch (error) {

        console.error(
          "NEXO MAP:",
          error
        );


        counter.textContent =
          "Error";


        showStatus(
          "No se pudieron cargar las propiedades",
          error.message ||
          "Comprueba la conexión con NEXO."
        );
      }
    }


    /* =====================================================
       TAMAÑO DEL MAPA
       ===================================================== */

    function refreshMapSize() {

      /*
       * Pequeño retraso para que
       * Safari termine de actualizar
       * el viewport.
       */

      requestAnimationFrame(
        () => {

          map.invalidateSize({
            pan: false,
            animate: false
          });
        }
      );
    }


    /* =====================================================
       INICIO
       ===================================================== */

    refreshMapSize();

    loadProperties();


    /*
     * Segundo ajuste después de cargar.
     */

    setTimeout(
      refreshMapSize,
      350
    );


    setTimeout(
      refreshMapSize,
      1000
    );


    /* =====================================================
       RESIZE
       ===================================================== */

    window.addEventListener(
      "resize",
      refreshMapSize
    );


    window.addEventListener(
      "orientationchange",
      () => {

        setTimeout(
          refreshMapSize,
          350
        );
      }
    );


    /*
     * Safari/iOS puede cambiar
     * visualViewport sin disparar
     * exactamente resize.
     */

    if (
      window.visualViewport
    ) {

      window.visualViewport.addEventListener(
        "resize",
        refreshMapSize
      );
    }

  </script>

</body>
