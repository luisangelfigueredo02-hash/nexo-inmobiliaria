<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f7f7f5">

  <title>NEXO — Propiedades</title>

  <!-- =====================================================
       MAPTILER SDK / MAPLIBRE
       ===================================================== -->

  <link
    rel="stylesheet"
    href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css"
  >

  <script
    src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"
  ></script>

  <style>

    /* =====================================================
       NEXO — DESIGN SYSTEM
       ===================================================== */

    :root {

      --nexo-black: #111111;
      --nexo-white: #ffffff;

      --nexo-bg: #f7f7f5;

      --nexo-text: #171717;
      --nexo-muted: #777777;

      --nexo-line: rgba(0,0,0,.08);

      --nexo-shadow:
        0 12px 40px rgba(0,0,0,.12);

      --nexo-shadow-large:
        0 22px 70px rgba(0,0,0,.18);

      --radius-small: 14px;
      --radius-medium: 18px;
      --radius-large: 24px;

    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Inter,
        system-ui,
        sans-serif;

      background: var(--nexo-bg);
      color: var(--nexo-text);

    }

    body {
      overscroll-behavior: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    /* =====================================================
       MAPA
       ===================================================== */

    #map {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      background: #e9e9e6;

    }

    .maplibregl-map {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        Inter,
        system-ui,
        sans-serif;

    }

    /* =====================================================
       CAPA SUPERIOR DE NEXO
       ===================================================== */

    .nexo-top {

      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      z-index: 20;

      padding:
        calc(12px + env(safe-area-inset-top, 0px))
        14px
        10px;

      pointer-events: none;

    }

    .nexo-top-inner {

      width: min(920px, 100%);

      margin: 0 auto;

      display: flex;

      align-items: center;

      gap: 10px;

      pointer-events: auto;

    }

    /* =====================================================
       LOGO
       ===================================================== */

    .nexo-logo {

      flex: 0 0 auto;

      height: 48px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 0 17px;

      border-radius: 17px;

      background:
        rgba(255,255,255,.94);

      backdrop-filter:
        blur(24px);

      -webkit-backdrop-filter:
        blur(24px);

      box-shadow:
        var(--nexo-shadow);

      color:
        var(--nexo-black);

      font-size: 17px;

      font-weight: 900;

      letter-spacing: -.06em;

    }

    /* =====================================================
       BUSCADOR
       ===================================================== */

    .nexo-search {

      flex: 1;

      min-width: 0;

      height: 48px;

      display: flex;

      align-items: center;

      border-radius: 17px;

      background:
        rgba(255,255,255,.95);

      backdrop-filter:
        blur(24px);

      -webkit-backdrop-filter:
        blur(24px);

      box-shadow:
        var(--nexo-shadow);

      overflow: hidden;

    }

    .search-symbol {

      flex: 0 0 auto;

      width: 42px;

      display: flex;

      justify-content: center;

      align-items: center;

      color: #777;

      font-size: 16px;

    }

    .nexo-search input {

      width: 100%;

      height: 100%;

      border: 0;

      outline: 0;

      background: transparent;

      color: var(--nexo-text);

      font-size: 13px;

      font-weight: 500;

    }

    .nexo-search input::placeholder {
      color: #999;
    }

    .clear-search {

      display: none;

      flex: 0 0 auto;

      width: 32px;
      height: 32px;

      margin-right: 8px;

      border-radius: 50%;

      background: #eeeeed;

      color: #555;

      font-size: 18px;

      line-height: 1;

    }

    .clear-search.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =====================================================
       FILTROS
       ===================================================== */

    .nexo-filters {

      position: fixed;

      top:
        calc(
          70px +
          env(safe-area-inset-top, 0px)
        );

      left: 0;
      right: 0;

      z-index: 19;

      padding:
        0 14px;

      pointer-events: none;

    }

    .nexo-filter-scroll {

      width: min(920px, 100%);

      margin: 0 auto;

      display: flex;

      gap: 8px;

      overflow-x: auto;

      scrollbar-width: none;

      pointer-events: auto;

      padding-bottom: 4px;

    }

    .nexo-filter-scroll::-webkit-scrollbar {
      display: none;
    }

    .nexo-filter {

      flex: 0 0 auto;

      min-height: 37px;

      padding:
        0 15px;

      border-radius: 999px;

      background:
        rgba(255,255,255,.94);

      border:
        1px solid rgba(0,0,0,.05);

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);

      box-shadow:
        0 7px 25px rgba(0,0,0,.08);

      color: #444;

      font-size: 11px;

      font-weight: 750;

      transition:
        .18s ease;

    }

    .nexo-filter.active {

      background:
        #111;

      color:
        #fff;

      border-color:
        #111;

      box-shadow:
        0 8px 25px rgba(0,0,0,.18);

    }

    .nexo-filter:active {
      transform: scale(.96);
    }

    /* =====================================================
       CONTADOR
       ===================================================== */

    .nexo-counter {

      position: fixed;

      left: 14px;

      bottom:
        calc(
          18px +
          env(safe-area-inset-bottom, 0px)
        );

      z-index: 20;

      min-height: 38px;

      padding:
        0 14px;

      display: flex;

      align-items: center;

      border-radius: 999px;

      background:
        rgba(255,255,255,.95);

      backdrop-filter:
        blur(22px);

      -webkit-backdrop-filter:
        blur(22px);

      box-shadow:
        var(--nexo-shadow);

      color:
        #222;

      font-size: 11px;

      font-weight: 750;

    }

    /* =====================================================
       CONTROLES NEXO
       ===================================================== */

    .nexo-controls {

      position: fixed;

      right: 14px;

      bottom:
        calc(
          18px +
          env(safe-area-inset-bottom, 0px)
        );

      z-index: 20;

      display: flex;

      flex-direction: column;

      gap: 8px;

    }

    .nexo-control {

      width: 45px;
      height: 45px;

      border-radius: 15px;

      background:
        rgba(255,255,255,.96);

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);

      box-shadow:
        var(--nexo-shadow);

      color:
        #171717;

      font-size: 18px;

      display: flex;

      align-items: center;

      justify-content: center;

      transition:
        transform .15s ease;

    }

    .nexo-control:active {

      transform:
        scale(.92);

    }

    /* =====================================================
       ESTADO
       ===================================================== */

    .nexo-status {

      position: fixed;

      z-index: 100;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      width:
        min(330px, calc(100% - 40px));

      padding:
        23px;

      border-radius:
        var(--radius-large);

      background:
        rgba(255,255,255,.96);

      backdrop-filter:
        blur(25px);

      -webkit-backdrop-filter:
        blur(25px);

      box-shadow:
        var(--nexo-shadow-large);

      text-align: center;

    }

    .nexo-status.hidden {
      display: none;
    }

    .status-spinner {

      width: 24px;
      height: 24px;

      margin:
        0 auto 13px;

      border:
        2px solid #ddd;

      border-top-color:
        #111;

      border-radius:
        50%;

      animation:
        nexo-spin .8s linear infinite;

    }

    @keyframes nexo-spin {

      to {
        transform: rotate(360deg);
      }

    }

    .status-title {

      font-size: 14px;

      font-weight: 850;

    }

    .status-text {

      margin-top: 5px;

      color: #777;

      font-size: 11px;

      line-height: 1.5;

    }

    /* =====================================================
       MARCADORES NEXO
       ===================================================== */

    .nexo-marker-wrapper {

      width: 42px;
      height: 42px;

      display: flex;

      align-items: center;

      justify-content: center;

    }

    .nexo-marker {

      position: relative;

      width: 35px;
      height: 35px;

      border-radius:
        50% 50% 50% 7px;

      transform:
        rotate(-45deg);

      background:
        #111;

      border:
        3px solid #fff;

      box-shadow:
        0 7px 18px rgba(0,0,0,.28);

      transition:
        transform .18s ease,
        box-shadow .18s ease;

    }

    .nexo-marker::after {

      content: "";

      position: absolute;

      width: 8px;
      height: 8px;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      background:
        #fff;

    }

    .nexo-marker-wrapper:hover
    .nexo-marker {

      transform:
        rotate(-45deg)
        scale(1.12);

      box-shadow:
        0 10px 26px rgba(0,0,0,.32);

    }

    /* =====================================================
       POPUP
       ===================================================== */

    .maplibregl-popup {

      max-width:
        min(330px, 88vw) !important;

    }

    .maplibregl-popup-content {

      padding: 0;

      overflow: hidden;

      border-radius:
        23px;

      box-shadow:
        var(--nexo-shadow-large);

    }

    .maplibregl-popup-close-button {

      z-index: 5;

      width: 31px;
      height: 31px;

      margin: 8px;

      border-radius: 50%;

      background:
        rgba(255,255,255,.94);

      color:
        #222;

      font-size: 20px;

      line-height: 28px;

      box-shadow:
        0 5px 18px rgba(0,0,0,.13);

    }

    .maplibregl-popup-tip {

      border-top-color:
        #fff;

      border-bottom-color:
        #fff;

    }

    /* =====================================================
       TARJETA PROPIEDAD
       ===================================================== */

    .property-card {

      width: min(320px, 82vw);

      background:
        #fff;

      overflow: hidden;

    }

    .property-image {

      position: relative;

      width: 100%;

      height: 175px;

      background:
        linear-gradient(
          145deg,
          #ededeb,
          #dcdcd8
        );

      display: flex;

      align-items: center;

      justify-content: center;

      color:
        #999;

      font-size: 11px;

      overflow: hidden;

    }

    .property-image::after {

      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          transparent 60%,
          rgba(0,0,0,.10)
        );

    }

    .property-image img {

      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

    }

    .property-content {

      padding:
        17px;

    }

    .property-type {

      font-size: 9px;

      font-weight: 850;

      letter-spacing:
        .13em;

      text-transform:
        uppercase;

      color:
        #8a8a8a;

    }

    .property-title {

      margin-top:
        5px;

      color:
        #151515;

      font-size:
        19px;

      font-weight:
        850;

      letter-spacing:
        -.045em;

      line-height:
        1.12;

    }

    .property-price {

      margin-top:
        8px;

      font-size:
        19px;

      font-weight:
        850;

      letter-spacing:
        -.025em;

    }

    .property-location {

      margin-top:
        7px;

      color:
        #777;

      font-size:
        11px;

      line-height:
        1.45;

    }

    .property-stats {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        6px;

      margin-top:
        13px;

    }

    .property-stat {

      padding:
        6px 8px;

      border-radius:
        999px;

      background:
        #f2f2f0;

      color:
        #555;

      font-size:
        9px;

      font-weight:
        750;

    }

    .property-address {

      margin-top:
        11px;

      padding-top:
        10px;

      border-top:
        1px solid #eeeeec;

      color:
        #777;

      font-size:
        10px;

      line-height:
        1.45;

    }

    .view-property {

      width:
        100%;

      margin-top:
        14px;

      padding:
        12px;

      border-radius:
        13px;

      background:
        #111;

      color:
        #fff;

      font-size:
        11px;

      font-weight:
        800;

      transition:
        transform .15s ease,
        opacity .15s ease;

    }

    .view-property:active {

      transform:
        scale(.98);

      opacity:
        .85;

    }

    /* =====================================================
       ATRIBUCIÓN
       ===================================================== */

    .maplibregl-ctrl-attrib {

      border-radius:
        10px 0 0 0 !important;

      background:
        rgba(255,255,255,.78) !important;

      backdrop-filter:
        blur(12px);

      -webkit-backdrop-filter:
        blur(12px);

    }

    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 600px) {

      .nexo-logo {

        height:
          45px;

        padding:
          0 14px;

        font-size:
          16px;

      }

      .nexo-search {

        height:
          45px;

      }

      .nexo-filters {

        top:
          calc(
            65px +
            env(safe-area-inset-top, 0px)
          );

      }

      .nexo-filter {

        min-height:
          35px;

        padding:
          0 13px;

      }

      .property-image {

        height:
          155px;

      }

    }

  </style>
</head>

<body>

  <!-- =====================================================
       MAPA
       ===================================================== -->

  <div id="map"></div>

  <!-- =====================================================
       CABECERA NEXO
       ===================================================== -->

  <header class="nexo-top">

    <div class="nexo-top-inner">

      <div class="nexo-logo">
        NEXO
      </div>

      <div class="nexo-search">

        <div class="search-symbol">
          ⌕
        </div>

        <input
          id="searchInput"
          type="search"
          autocomplete="off"
          placeholder="Buscar ciudad, zona o dirección"
        >

        <button
          id="clearSearch"
          class="clear-search"
          type="button"
          aria-label="Limpiar búsqueda"
        >
          ×
        </button>

      </div>

    </div>

  </header>

  <!-- =====================================================
       FILTROS
       ===================================================== -->

  <div class="nexo-filters">

    <div class="nexo-filter-scroll">

      <button
        class="nexo-filter active"
        data-type="all"
        type="button"
      >
        Todas
      </button>

      <button
        class="nexo-filter"
        data-type="Casa"
        type="button"
      >
        Casas
      </button>

      <button
        class="nexo-filter"
        data-type="Apartamento"
        type="button"
      >
        Apartamentos
      </button>

      <button
        class="nexo-filter"
        data-type="Villa"
        type="button"
      >
        Villas
      </button>

      <button
        class="nexo-filter"
        data-type="Terreno"
        type="button"
      >
        Terrenos
      </button>

      <button
        class="nexo-filter"
        data-type="Local"
        type="button"
      >
        Locales
      </button>

    </div>

  </div>

  <!-- =====================================================
       CONTADOR
       ===================================================== -->

  <div
    id="counter"
    class="nexo-counter"
  >
    Cargando...
  </div>

  <!-- =====================================================
       CONTROLES
       ===================================================== -->

  <div class="nexo-controls">

    <button
      id="fitButton"
      class="nexo-control"
      type="button"
      aria-label="Mostrar propiedades"
      title="Mostrar propiedades"
    >
      ⛶
    </button>

    <button
      id="locationButton"
      class="nexo-control"
      type="button"
      aria-label="Mi ubicación"
      title="Mi ubicación"
    >
      ⊙
    </button>

  </div>

  <!-- =====================================================
       ESTADO
       ===================================================== -->

  <div
    id="status"
    class="nexo-status"
  >

    <div
      id="statusSpinner"
      class="status-spinner"
    ></div>

    <div
      id="statusTitle"
      class="status-title"
    >
      Cargando NEXO
    </div>

    <div
      id="statusText"
      class="status-text"
    >
      Buscando propiedades...
    </div>

  </div>


  <script>

    "use strict";

    /* =====================================================
       CONFIGURACIÓN
       ===================================================== */

    const MAPTILER_KEY =
      "1NdLFdUeZVfKpdAWdd6K";

    /*
     * Cuba:
     *
     * MapLibre usa [LONGITUD, LATITUD]
     */

    const CUBA_CENTER = [
      -79.5199,
      22.0550
    ];

    const CUBA_ZOOM = 6.3;

    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const mapElement =
      document.getElementById("map");

    const searchInput =
      document.getElementById("searchInput");

    const clearSearch =
      document.getElementById("clearSearch");

    const counter =
      document.getElementById("counter");

    const status =
      document.getElementById("status");

    const statusSpinner =
      document.getElementById("statusSpinner");

    const statusTitle =
      document.getElementById("statusTitle");

    const statusText =
      document.getElementById("statusText");

    const fitButton =
      document.getElementById("fitButton");

    const locationButton =
      document.getElementById("locationButton");

    /* =====================================================
       ESTADO
       ===================================================== */

    let allProperties = [];

    let filteredProperties = [];

    let activeType = "all";

    let markers = [];

    let userLocationMarker = null;

    /* =====================================================
       UTILIDADES
       ===================================================== */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

    function normalize(value) {

      return String(value ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();

    }

    function money(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return "Consultar precio";
      }

      const number =
        Number(
          String(value)
            .replace(/[$,\s]/g, "")
        );

      if (!Number.isFinite(number)) {
        return String(value);
      }

      return "$" +
        number.toLocaleString(
          "en-US",
          {
            maximumFractionDigits: 0
          }
        );

    }

    function parsePhotos(property) {

      if (
        Array.isArray(property.photos)
      ) {

        return property.photos
          .filter(Boolean);

      }

      if (
        typeof property.photos === "string"
      ) {

        try {

          const parsed =
            JSON.parse(property.photos);

          if (
            Array.isArray(parsed)
          ) {

            return parsed
              .filter(Boolean);

          }

        } catch (error) {

          console.warn(
            "NEXO: fotos inválidas",
            error
          );

        }

      }

      return [];

    }

    /* =====================================================
       ESTADO VISUAL
       ===================================================== */

    function showStatus(
      title,
      text,
      loading = true
    ) {

      statusTitle.textContent =
        title;

      statusText.textContent =
        text;

      statusSpinner.style.display =
        loading
          ? "block"
          : "none";

      status.classList.remove(
        "hidden"
      );

    }

    function hideStatus() {

      status.classList.add(
        "hidden"
      );

    }

    /* =====================================================
       MAPA
       ===================================================== */

    maptilersdk.config.apiKey =
      MAPTILER_KEY;

    /*
     * BACKDROP LIGHT:
     *
     * Lo usamos como base porque es mucho
     * más limpio y editorial que un mapa
     * de calles tradicional.
     *
     * Después podremos crear un estilo
     * NEXO todavía más personalizado
     * desde MapTiler.
     */

    const map =
      new maptilersdk.Map({

        container:
          "map",

        style:
          maptilersdk.MapStyle.BACKDROP.LIGHT,

        center:
          CUBA_CENTER,

        zoom:
          CUBA_ZOOM,

        minZoom:
          4.5,

        maxZoom:
          19,

        pitch:
          0,

        bearing:
          0,

        attributionControl:
          true,

        navigationControl:
          false,

        geolocateControl:
          false,

        dragRotate:
          false,

        touchPitch:
          false,

        cooperativeGestures:
          false

      });

    /* =====================================================
       CONTROLES MAPA
       ===================================================== */

    map.addControl(
      new maptilersdk.NavigationControl({
        showCompass: false,
        visualizePitch: false
      }),
      "bottom-right"
    );

    /* =====================================================
       MARCADOR NEXO
       ===================================================== */

    function createNexoMarker() {

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "nexo-marker-wrapper";

      wrapper.innerHTML = `
        <div class="nexo-marker"></div>
      `;

      return wrapper;

    }

    /* =====================================================
       TARJETA
       ===================================================== */

    function buildPropertyCard(
      property
    ) {

      const photos =
        parsePhotos(property);

      const image =
        photos.length
          ? photos[0]
          : "";

      const title =
        property.title ||
        property.property_type ||
        "Propiedad";

      const location =
        [
          property.neighborhood,
          property.city
        ]
          .filter(Boolean)
          .join(" · ");

      const stats = [];

      if (
        property.bedrooms !== null &&
        property.bedrooms !== undefined &&
        property.bedrooms !== ""
      ) {

        stats.push(
          `🛏 ${escapeHTML(property.bedrooms)}`
        );

      }

      if (
        property.bathrooms !== null &&
        property.bathrooms !== undefined &&
        property.bathrooms !== ""
      ) {

        stats.push(
          `🚿 ${escapeHTML(property.bathrooms)}`
        );

      }

      if (
        property.square_meters !== null &&
        property.square_meters !== undefined &&
        property.square_meters !== ""
      ) {

        stats.push(
          `${escapeHTML(property.square_meters)} m²`
        );

      }

      const statsHTML =
        stats.length
          ? `
            <div class="property-stats">

              ${stats
                .map(
                  item =>
                    `<span class="property-stat">${item}</span>`
                )
                .join("")}

            </div>
          `
          : "";

      const imageHTML =
        image
          ? `
            <div class="property-image">

              <img
                src="${escapeHTML(image)}"
                alt="${escapeHTML(title)}"
                loading="lazy"
                onerror="
                  this.style.display='none';
                  this.parentElement.innerHTML='Sin fotografía';
                "
              >

            </div>
          `
          : `
            <div class="property-image">
              Sin fotografía
            </div>
          `;

      const addressHTML =
        property.address
          ? `
            <div class="property-address">
              📍 ${escapeHTML(property.address)}
            </div>
          `
          : "";

      return `
        <div class="property-card">

          ${imageHTML}

          <div class="property-content">

            <div class="property-type">
              ${escapeHTML(
                property.property_type ||
                "Propiedad"
              )}
            </div>

            <div class="property-title">
              ${escapeHTML(title)}
            </div>

            <div class="property-price">
              ${money(property.price)}
            </div>

            ${
              location
                ? `
                  <div class="property-location">
                    ${escapeHTML(location)}
                  </div>
                `
                : ""
            }

            ${statsHTML}

            ${addressHTML}

            <button
              class="view-property"
              type="button"
              data-property-id="${Number(property.id)}"
            >
              Ver propiedad
            </button>

          </div>

        </div>
      `;

    }

    /* =====================================================
       ABRIR PROPIEDAD
       ===================================================== */

    window.openProperty =
      function(id) {

        const property =
          allProperties.find(
            item =>
              Number(item.id) ===
              Number(id)
          );

        if (!property) {
          return;
        }

        const latitude =
          Number(property.latitude);

        const longitude =
          Number(property.longitude);

        if (
          !Number.isFinite(latitude) ||
          !Number.isFinite(longitude)
        ) {

          return;

        }

        map.flyTo({

          center: [
            longitude,
            latitude
          ],

          zoom:
            Math.max(
              map.getZoom(),
              16
            ),

          speed:
            0.8,

          curve:
            1.2,

          essential:
            true

        });

      };

    /* =====================================================
       EVENTO TARJETA
       ===================================================== */

    document.addEventListener(
      "click",
      event => {

        const button =
          event.target.closest(
            ".view-property"
          );

        if (!button) {
          return;
        }

        const id =
          Number(
            button.dataset.propertyId
          );

        if (
          Number.isFinite(id)
        ) {

          window.openProperty(id);

        }

      }
    );

    /* =====================================================
       ELIMINAR MARCADORES
       ===================================================== */

    function clearMarkers() {

      markers.forEach(
        marker => marker.remove()
      );

      markers = [];

    }

    /* =====================================================
       CREAR MARCADORES
       ===================================================== */

    function renderMarkers() {

      clearMarkers();

      filteredProperties.forEach(
        property => {

          const latitude =
            Number(property.latitude);

          const longitude =
            Number(property.longitude);

          if (
            !Number.isFinite(latitude) ||
            !Number.isFinite(longitude)
          ) {

            return;

          }

          const markerElement =
            createNexoMarker();

          const popup =
            new maptilersdk.Popup({
              offset: 25,
              closeButton: true,
              closeOnClick: false,
              maxWidth:
                "330px"
            })
              .setHTML(
                buildPropertyCard(property)
              );

          const marker =
            new maptilersdk.Marker({
              element:
                markerElement,
              anchor:
                "bottom"
            })
              .setLngLat([
                longitude,
                latitude
              ])
              .setPopup(popup)
              .addTo(map);

          markers.push(marker);

        }
      );

      updateCounter();

    }

    /* =====================================================
       PROPIEDADES CON COORDENADAS
       ===================================================== */

    function getLocatedProperties() {

      return filteredProperties
        .filter(property => {

          const latitude =
            Number(property.latitude);

          const longitude =
            Number(property.longitude);

          return (
            Number.isFinite(latitude) &&
            Number.isFinite(longitude)
          );

        });

    }

    /* =====================================================
       AJUSTAR MAPA
       ===================================================== */

    function fitVisibleProperties() {

      const located =
        getLocatedProperties();

      if (!located.length) {

        map.flyTo({

          center:
            CUBA_CENTER,

          zoom:
            CUBA_ZOOM,

          speed:
            0.8,

          essential:
            true

        });

        return;

      }

      if (located.length === 1) {

        const property =
          located[0];

        map.flyTo({

          center: [
            Number(property.longitude),
            Number(property.latitude)
          ],

          zoom:
            15,

          speed:
            0.8,

          essential:
            true

        });

        return;

      }

      const bounds =
        new maptilersdk.LngLatBounds();

      located.forEach(
        property => {

          bounds.extend([

            Number(property.longitude),

            Number(property.latitude)

          ]);

        }
      );

      map.fitBounds(
        bounds,
        {

          padding: {

            top:
              180,

            bottom:
              120,

            left:
              45,

            right:
              45

          },

          maxZoom:
            15.5,

          duration:
            900

        }
      );

    }

    /* =====================================================
       CONTADOR
       ===================================================== */

    function updateCounter() {

      const total =
        filteredProperties.length;

      const located =
        getLocatedProperties().length;

      if (!total) {

        counter.textContent =
          "Sin propiedades";

        return;

      }

      if (
        total === located
      ) {

        counter.textContent =
          `${total} ${
            total === 1
              ? "propiedad"
              : "propiedades"
          }`;

      } else {

        counter.textContent =
          `${total} propiedades · ${located} ubicadas`;

      }

    }

    /* =====================================================
       FILTROS
       ===================================================== */

    function applyFilters() {

      const search =
        normalize(
          searchInput.value
        );

      filteredProperties =
        allProperties.filter(
          property => {

            if (
              activeType !== "all" &&
              normalize(
                property.property_type
              ) !==
              normalize(activeType)
            ) {

              return false;

            }

            if (!search) {
              return true;
            }

            const searchable =
              [

                property.property_type,

                property.title,

                property.city,

                property.neighborhood,

                property.address,

                property.description

              ]
                .filter(Boolean)
                .map(normalize)
                .join(" ");

            return searchable.includes(
              search
            );

          }
        );

      renderMarkers();

      if (
        filteredProperties.length
      ) {

        hideStatus();

        fitVisibleProperties();

      } else {

        showStatus(
          "Sin resultados",
          "No encontramos propiedades con esos criterios.",
          false
        );

        map.flyTo({

          center:
            CUBA_CENTER,

          zoom:
            CUBA_ZOOM,

          speed:
            0.7,

          essential:
            true

        });

      }

    }

    /* =====================================================
       BOTONES DE FILTRO
       ===================================================== */

    document
      .querySelectorAll(".nexo-filter")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(".nexo-filter")
              .forEach(
                item =>
                  item.classList.remove(
                    "active"
                  )
              );

            button.classList.add(
              "active"
            );

            activeType =
              button.dataset.type ||
              "all";

            applyFilters();

          }
        );

      });

    /* =====================================================
       BUSCADOR
       ===================================================== */

    searchInput.addEventListener(
      "input",
      () => {

        clearSearch.classList.toggle(
          "show",
          Boolean(
            searchInput.value.trim()
          )
        );

        applyFilters();

      }
    );

    clearSearch.addEventListener(
      "click",
      () => {

        searchInput.value = "";

        clearSearch.classList.remove(
          "show"
        );

        applyFilters();

        searchInput.focus();

      }
    );

    /* =====================================================
       BOTÓN AJUSTAR
       ===================================================== */

    fitButton.addEventListener(
      "click",
      () => {

        if (
          filteredProperties.length
        ) {

          fitVisibleProperties();

        } else {

          map.flyTo({

            center:
              CUBA_CENTER,

            zoom:
              CUBA_ZOOM,

            speed:
              0.8,

            essential:
              true

          });

        }

      }
    );

    /* =====================================================
       MI UBICACIÓN
       ===================================================== */

    locationButton.addEventListener(
      "click",
      () => {

        if (
          !navigator.geolocation
        ) {

          alert(
            "Tu dispositivo no permite obtener la ubicación."
          );

          return;

        }

        locationButton.disabled =
          true;

        navigator.geolocation.getCurrentPosition(

          position => {

            const latitude =
              position.coords.latitude;

            const longitude =
              position.coords.longitude;

            if (
              userLocationMarker
            ) {

              userLocationMarker.remove();

            }

            const element =
              document.createElement(
                "div"
              );

            element.style.width =
              "18px";

            element.style.height =
              "18px";

            element.style.borderRadius =
              "50%";

            element.style.background =
              "#111";

            element.style.border =
              "4px solid #fff";

            element.style.boxShadow =
              "0 3px 14px rgba(0,0,0,.3)";

            userLocationMarker =
              new maptilersdk.Marker({
                element
              })
                .setLngLat([
                  longitude,
                  latitude
                ])
                .addTo(map);

            map.flyTo({

              center: [
                longitude,
                latitude
              ],

              zoom:
                15,

              speed:
                0.8,

              essential:
                true

            });

            locationButton.disabled =
              false;

          },

          error => {

            console.warn(
              "NEXO ubicación:",
              error
            );

            alert(
              "No se pudo obtener tu ubicación."
            );

            locationButton.disabled =
              false;

          },

          {

            enableHighAccuracy:
              true,

            timeout:
              10000,

            maximumAge:
              60000

          }

        );

      }
    );

    /* =====================================================
       CARGAR PROPIEDADES
       ===================================================== */

    async function loadProperties() {

      showStatus(
        "Cargando NEXO",
        "Buscando propiedades disponibles...",
        true
      );

      try {

        const response =
          await fetch(
            "/api/properties",
            {

              method:
                "GET",

              headers: {

                "Accept":
                  "application/json"

              },

              cache:
                "no-store"

            }
          );

        const text =
          await response.text();

        let data;

        try {

          data =
            JSON.parse(text);

        } catch {

          throw new Error(
            "La respuesta del servidor no es JSON."
          );

        }

        if (
          !response.ok ||
          data.success === false
        ) {

          throw new Error(
            data.error ||
            `HTTP ${response.status}`
          );

        }

        allProperties =
          Array.isArray(
            data.properties
          )
            ? data.properties
            : [];

        allProperties =
          allProperties.filter(
            property =>
              !property.status ||
              property.status ===
                "available"
          );

        filteredProperties =
          [...allProperties];

        renderMarkers();

        hideStatus();

        /*
         * Si existen propiedades
         * geolocalizadas, las mostramos.
         *
         * Si no existen, Cuba permanece
         * como vista inicial.
         */

        if (
          getLocatedProperties().length
        ) {

          fitVisibleProperties();

        } else {

          map.flyTo({

            center:
              CUBA_CENTER,

            zoom:
              CUBA_ZOOM,

            speed:
              0.7,

            essential:
              true

          });

        }

      } catch (error) {

        console.error(
          "NEXO MAP:",
          error
        );

        showStatus(
          "No se pudieron cargar las propiedades",
          error.message ||
          "Comprueba la conexión con NEXO.",
          false
        );

        counter.textContent =
          "Error";

      }

    }

    /* =====================================================
       CUANDO EL MAPA TERMINA DE CARGAR
       ===================================================== */

    map.on(
      "load",
      () => {

        /*
         * Dejamos que el estilo vectorial
         * termine de renderizar antes de
         * cargar los datos de NEXO.
         */

        setTimeout(
          () => {

            loadProperties();

          },
          250
        );

      }
    );

    /* =====================================================
       RECUPERACIÓN DE ERRORES DEL MAPA
       ===================================================== */

    map.on(
      "error",
      event => {

        console.warn(
          "NEXO MAP TILE ERROR:",
          event
        );

      }
    );

  </script>

</body>
</html>
