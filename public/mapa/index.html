<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f4f4f2">

  <title>NEXO — Mapa</title>

  <!-- =====================================================
       LEAFLET
       Sin integrity para evitar que el navegador bloquee
       accidentalmente los archivos por un hash incorrecto.
       ===================================================== -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    :root {
      --bg: #f4f4f2;
      --white: #ffffff;
      --black: #111111;
      --text: #171717;
      --muted: #777777;
      --soft: #f1f1ef;
      --border: rgba(0,0,0,.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Inter,
        system-ui,
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    /* =====================================================
       MAPA
       ===================================================== */

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #e8e8e6;
    }

    .leaflet-container {
      width: 100%;
      height: 100%;
      background: #e8e8e6;
      font-family: inherit;
    }

    .leaflet-control-attribution {
      font-size: 9px;
      opacity: .72;
    }

    /* =====================================================
       BARRA SUPERIOR
       ===================================================== */

    .topbar {
      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      z-index: 1000;

      padding:
        calc(12px + env(safe-area-inset-top, 0px))
        14px
        10px;

      pointer-events: none;
    }

    .topbar-inner {
      width: min(760px, 100%);
      margin: 0 auto;

      display: flex;
      align-items: center;
      gap: 9px;

      pointer-events: auto;
    }

    .brand {
      flex: 0 0 auto;

      padding: 12px 15px;

      border-radius: 16px;

      background: rgba(255,255,255,.94);

      box-shadow:
        0 8px 30px rgba(0,0,0,.12);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      color: #111;

      font-size: 17px;
      font-weight: 850;

      letter-spacing: -.07em;
    }

    .search {
      flex: 1;
      min-width: 0;

      display: flex;
      align-items: center;

      border-radius: 16px;

      background: rgba(255,255,255,.95);

      box-shadow:
        0 8px 30px rgba(0,0,0,.12);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      overflow: hidden;
    }

    .search-icon {
      padding-left: 14px;
      font-size: 15px;
    }

    .search input {
      width: 100%;

      padding: 13px 10px;

      border: 0;
      outline: 0;

      background: transparent;

      color: #111;
      font-size: 13px;
    }

    .clear-search {
      display: none;

      width: 34px;
      height: 34px;

      margin-right: 4px;

      border-radius: 50%;

      background: #eeeeee;
      color: #555;

      font-size: 18px;
    }

    .clear-search.show {
      display: block;
    }

    /* =====================================================
       FILTROS
       ===================================================== */

    .filters {
      position: fixed;

      top:
        calc(68px + env(safe-area-inset-top, 0px));

      left: 0;
      right: 0;

      z-index: 999;

      padding: 0 14px;

      pointer-events: none;
    }

    .filters-inner {
      width: min(760px, 100%);
      margin: 0 auto;

      display: flex;
      gap: 8px;

      overflow-x: auto;

      scrollbar-width: none;

      pointer-events: auto;
    }

    .filters-inner::-webkit-scrollbar {
      display: none;
    }

    .filter {
      flex: 0 0 auto;

      padding: 10px 14px;

      border-radius: 999px;

      background: rgba(255,255,255,.94);

      border: 1px solid rgba(0,0,0,.06);

      color: #444;

      font-size: 11px;
      font-weight: 750;

      box-shadow:
        0 5px 20px rgba(0,0,0,.08);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .filter.active {
      background: #111;
      color: #fff;
    }

    /* =====================================================
       CONTADOR
       ===================================================== */

    .counter {
      position: fixed;

      left: 14px;

      bottom:
        calc(18px + env(safe-area-inset-bottom, 0px));

      z-index: 1000;

      padding: 10px 14px;

      border-radius: 999px;

      background: rgba(255,255,255,.95);

      box-shadow:
        0 8px 30px rgba(0,0,0,.13);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      color: #222;

      font-size: 11px;
      font-weight: 750;
    }

    /* =====================================================
       BOTONES
       ===================================================== */

    .map-buttons {
      position: fixed;

      right: 14px;

      bottom:
        calc(18px + env(safe-area-inset-bottom, 0px));

      z-index: 1000;

      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .map-button {
      width: 44px;
      height: 44px;

      border-radius: 15px;

      background: rgba(255,255,255,.95);

      box-shadow:
        0 8px 30px rgba(0,0,0,.13);

      color: #111;

      font-size: 18px;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .map-button:active {
      transform: scale(.94);
    }

    /* =====================================================
       ESTADO
       ===================================================== */

    .status {
      position: fixed;

      left: 50%;
      top: 50%;

      z-index: 2000;

      width: min(330px, calc(100% - 40px));

      transform: translate(-50%, -50%);

      padding: 20px;

      border-radius: 20px;

      background: rgba(255,255,255,.97);

      box-shadow:
        0 20px 60px rgba(0,0,0,.18);

      text-align: center;

      font-size: 13px;
      line-height: 1.5;
    }

    .status.hidden {
      display: none;
    }

    .status-title {
      margin-bottom: 5px;

      font-weight: 850;
    }

    .status-text {
      color: #777;
    }

    .status-retry {
      display: none;

      width: 100%;

      margin-top: 14px;

      padding: 11px;

      border-radius: 12px;

      background: #111;
      color: white;

      font-size: 12px;
      font-weight: 750;
    }

    .status.error .status-retry {
      display: block;
    }

    /* =====================================================
       POPUP
       ===================================================== */

    .leaflet-popup-content-wrapper {
      padding: 0;

      border-radius: 20px;

      overflow: hidden;

      box-shadow:
        0 15px 45px rgba(0,0,0,.18);
    }

    .leaflet-popup-content {
      width: min(300px, 76vw) !important;
      margin: 0;
    }

    .leaflet-popup-tip {
      box-shadow: none;
    }

    .property-card {
      overflow: hidden;
      background: #fff;
    }

    .property-image {
      width: 100%;
      height: 155px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          145deg,
          #e8e8e8,
          #d6d6d6
        );

      color: #999;

      font-size: 11px;
    }

    .property-image img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }

    .property-content {
      padding: 15px;
    }

    .property-type {
      color: #888;

      font-size: 9px;
      font-weight: 800;

      letter-spacing: .1em;

      text-transform: uppercase;
    }

    .property-title {
      margin-top: 5px;

      color: #111;

      font-size: 18px;
      font-weight: 800;

      letter-spacing: -.045em;
    }

    .property-price {
      margin-top: 7px;

      color: #111;

      font-size: 19px;
      font-weight: 800;
    }

    .property-location {
      margin-top: 6px;

      color: #777;

      font-size: 11px;
      line-height: 1.45;
    }

    .property-stats {
      display: flex;
      flex-wrap: wrap;

      gap: 6px;

      margin-top: 12px;
    }

    .property-stat {
      padding: 6px 8px;

      border-radius: 999px;

      background: #f1f1f3;

      color: #555;

      font-size: 9px;
      font-weight: 700;
    }

    .property-address {
      margin-top: 11px;

      color: #666;

      font-size: 10px;
      line-height: 1.4;
    }

    .view-property {
      width: 100%;

      margin-top: 13px;

      padding: 11px;

      border-radius: 12px;

      background: #111;
      color: white;

      font-size: 11px;
      font-weight: 750;
    }

    /* =====================================================
       MARCADOR NEXO
       ===================================================== */

    .nexo-marker {
      position: relative;

      width: 34px;
      height: 34px;

      border-radius:
        50% 50% 50% 0;

      background: #111;

      border: 3px solid white;

      transform: rotate(-45deg);

      box-shadow:
        0 5px 15px rgba(0,0,0,.25);
    }

    .nexo-marker::after {
      content: "";

      position: absolute;

      width: 9px;
      height: 9px;

      left: 9px;
      top: 9px;

      border-radius: 50%;

      background: white;
    }

    /* =====================================================
       MENSAJE SI NO HAY COORDENADAS
       ===================================================== */

    .map-note {
      position: fixed;

      left: 50%;
      bottom:
        calc(75px + env(safe-area-inset-bottom, 0px));

      z-index: 1000;

      transform: translateX(-50%);

      display: none;

      max-width: calc(100% - 40px);

      padding: 9px 13px;

      border-radius: 999px;

      background: rgba(255,255,255,.94);

      box-shadow:
        0 8px 25px rgba(0,0,0,.12);

      color: #666;

      font-size: 10px;

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .map-note.show {
      display: block;
    }

    /* =====================================================
       MÓVIL
       ===================================================== */

    @media (max-width: 600px) {

      .brand {
        padding: 11px 13px;
        font-size: 16px;
      }

      .search input {
        font-size: 12px;
      }

      .filters {
        top:
          calc(64px + env(safe-area-inset-top, 0px));
      }

      .property-image {
        height: 145px;
      }
    }

  </style>
</head>

<body>

  <div id="map"></div>

  <!-- =====================================================
       BARRA SUPERIOR
       ===================================================== -->

  <div class="topbar">

    <div class="topbar-inner">

      <div class="brand">
        NEXO
      </div>

      <div class="search">

        <span class="search-icon">⌕</span>

        <input
          id="searchInput"
          type="search"
          placeholder="Buscar ciudad, zona o dirección"
          autocomplete="off"
        >

        <button
          id="clearSearch"
          class="clear-search"
          type="button"
          aria-label="Limpiar"
        >
          ×
        </button>

      </div>

    </div>

  </div>

  <!-- =====================================================
       FILTROS
       ===================================================== -->

  <div class="filters">

    <div class="filters-inner">

      <button
        class="filter active"
        data-type="all"
        type="button"
      >
        Todas
      </button>

      <button
        class="filter"
        data-type="Casa"
        type="button"
      >
        Casas
      </button>

      <button
        class="filter"
        data-type="Apartamento"
        type="button"
      >
        Apartamentos
      </button>

      <button
        class="filter"
        data-type="Villa"
        type="button"
      >
        Villas
      </button>

      <button
        class="filter"
        data-type="Terreno"
        type="button"
      >
        Terrenos
      </button>

      <button
        class="filter"
        data-type="Local"
        type="button"
      >
        Locales
      </button>

    </div>

  </div>

  <!-- =====================================================
       CONTADOR
       ===================================================== -->

  <div
    id="counter"
    class="counter"
  >
    Conectando...
  </div>

  <!-- =====================================================
       BOTONES
       ===================================================== -->

  <div class="map-buttons">

    <button
      id="fitButton"
      class="map-button"
      type="button"
      aria-label="Mostrar propiedades"
      title="Mostrar propiedades"
    >
      ⛶
    </button>

    <button
      id="locationButton"
      class="map-button"
      type="button"
      aria-label="Mi ubicación"
      title="Mi ubicación"
    >
      ⊙
    </button>

  </div>

  <!-- =====================================================
       AVISO
       ===================================================== -->

  <div
    id="mapNote"
    class="map-note"
  >
    Algunas propiedades todavía no tienen ubicación.
  </div>

  <!-- =====================================================
       ESTADO
       ===================================================== -->

  <div
    id="status"
    class="status"
  >

    <div
      id="statusTitle"
      class="status-title"
    >
      Cargando NEXO...
    </div>

    <div
      id="statusText"
      class="status-text"
    >
      Preparando el mapa.
    </div>

    <button
      id="retryButton"
      class="status-retry"
      type="button"
    >
      Reintentar
    </button>

  </div>

  <!-- =====================================================
       LEAFLET
       ===================================================== -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <script>

    "use strict";

    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const mapElement =
      document.getElementById("map");

    const searchInput =
      document.getElementById("searchInput");

    const clearSearch =
      document.getElementById("clearSearch");

    const counter =
      document.getElementById("counter");

    const status =
      document.getElementById("status");

    const statusTitle =
      document.getElementById("statusTitle");

    const statusText =
      document.getElementById("statusText");

    const retryButton =
      document.getElementById("retryButton");

    const fitButton =
      document.getElementById("fitButton");

    const locationButton =
      document.getElementById("locationButton");

    const mapNote =
      document.getElementById("mapNote");

    /* =====================================================
       ESTADO
       ===================================================== */

    let map = null;

    let markerLayer = null;

    let allProperties = [];

    let filteredProperties = [];

    let activeType = "all";

    let userLocationMarker = null;

    /* =====================================================
       CENTRO INICIAL
       ===================================================== */

    const DEFAULT_CENTER = [
      23.1136,
      -82.3666
    ];

    const DEFAULT_ZOOM = 11;

    /* =====================================================
       UTILIDADES
       ===================================================== */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

    function normalize(value) {

      return String(value ?? "")
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        )
        .toLowerCase()
        .trim();

    }

    function money(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return "$0";
      }

      const number =
        Number(
          String(value)
            .replace(
              /[$,\s]/g,
              ""
            )
        );

      if (
        !Number.isFinite(number)
      ) {
        return String(value);
      }

      return "$" +
        number.toLocaleString(
          "en-US",
          {
            maximumFractionDigits: 0
          }
        );

    }

    function parsePhotos(property) {

      if (
        Array.isArray(
          property.photos
        )
      ) {

        return property.photos
          .filter(Boolean);

      }

      if (
        typeof property.photos ===
        "string"
      ) {

        try {

          const parsed =
            JSON.parse(
              property.photos
            );

          if (
            Array.isArray(parsed)
          ) {
            return parsed
              .filter(Boolean);
          }

        } catch (error) {

          console.warn(
            "NEXO: fotografías inválidas",
            error
          );

        }

      }

      return [];

    }

    /* =====================================================
       ESTADO VISUAL
       ===================================================== */

    function showStatus(
      title,
      text,
      isError = false
    ) {

      statusTitle.textContent =
        title;

      statusText.textContent =
        text;

      status.classList.toggle(
        "error",
        isError
      );

      status.classList.remove(
        "hidden"
      );

    }

    function hideStatus() {

      status.classList.remove(
        "error"
      );

      status.classList.add(
        "hidden"
      );

    }

    /* =====================================================
       INICIALIZAR MAPA
       ===================================================== */

    function initializeMap() {

      if (
        typeof L ===
        "undefined"
      ) {

        showStatus(
          "No se pudo cargar el mapa",
          "Leaflet no pudo iniciarse. Comprueba la conexión e inténtalo nuevamente.",
          true
        );

        return false;

      }

      try {

        map =
          L.map(
            mapElement,
            {
              zoomControl: false,

              preferCanvas: true,

              attributionControl:
                true
            }
          );

        L.control.zoom({
          position:
            "bottomright"
        }).addTo(map);

        /*
         * Vista inicial:
         * Cuba, no el mundo.
         */

        map.setView(
          DEFAULT_CENTER,
          DEFAULT_ZOOM
        );

        /*
         * Capa cartográfica.
         */

        L.tileLayer(
          "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
          {
            maxZoom: 19,

            minZoom: 3,

            tileSize: 256,

            updateWhenZooming: false,

            updateWhenIdle: true,

            keepBuffer: 2,

            attribution:
              "&copy; OpenStreetMap contributors"
          }
        ).addTo(map);

        markerLayer =
          L.layerGroup()
            .addTo(map);

        /*
         * Leaflet puede calcular mal el tamaño
         * si el mapa se inicializa mientras la
         * página todavía está entrando.
         */

        requestAnimationFrame(
          () => {

            map.invalidateSize(
              true
            );

          }
        );

        setTimeout(
          () => {

            if (map) {
              map.invalidateSize(
                true
              );
            }

          },
          500
        );

        return true;

      } catch (error) {

        console.error(
          "NEXO MAP INIT:",
          error
        );

        showStatus(
          "Error al iniciar el mapa",
          error.message ||
          "No se pudo inicializar el mapa.",
          true
        );

        return false;

      }

    }

    /* =====================================================
       ICONO
       ===================================================== */

    const nexoIcon =
      typeof L !==
      "undefined"
        ? L.divIcon({

            className: "",

            html:
              '<div class="nexo-marker"></div>',

            iconSize:
              [34, 34],

            iconAnchor:
              [17, 34],

            popupAnchor:
              [0, -32]

          })
        : null;

    /* =====================================================
       TARJETA
       ===================================================== */

    function buildPropertyCard(
      property
    ) {

      const photos =
        parsePhotos(
          property
        );

      const image =
        photos.length
          ? photos[0]
          : "";

      const title =
        property.title ||
        property.property_type ||
        "Propiedad";

      const location =
        [
          property.neighborhood,
          property.city
        ]
          .filter(Boolean)
          .join(" · ");

      const stats = [];

      if (
        property.bedrooms !==
          null &&
        property.bedrooms !==
          undefined &&
        property.bedrooms !== ""
      ) {

        stats.push(
          `🛏 ${escapeHTML(
            property.bedrooms
          )}`
        );

      }

      if (
        property.bathrooms !==
          null &&
        property.bathrooms !==
          undefined &&
        property.bathrooms !== ""
      ) {

        stats.push(
          `🚿 ${escapeHTML(
            property.bathrooms
          )}`
        );

      }

      if (
        property.square_meters !==
          null &&
        property.square_meters !==
          undefined &&
        property.square_meters !== ""
      ) {

        stats.push(
          `${escapeHTML(
            property.square_meters
          )} m²`
        );

      }

      const statsHTML =
        stats.length
          ? `
              <div class="property-stats">
                ${stats
                  .map(
                    item =>
                      `<span class="property-stat">${item}</span>`
                  )
                  .join("")}
              </div>
            `
          : "";

      const imageHTML =
        image
          ? `
              <div class="property-image">
                <img
                  src="${escapeHTML(image)}"
                  alt="${escapeHTML(title)}"
                  onerror="
                    this.style.display='none';
                    this.parentElement.textContent='Sin fotografía';
                  "
                >
              </div>
            `
          : `
              <div class="property-image">
                Sin fotografía
              </div>
            `;

      const addressHTML =
        property.address
          ? `
              <div class="property-address">
                📍 ${escapeHTML(
                  property.address
                )}
              </div>
            `
          : "";

      return `
        <div class="property-card">

          ${imageHTML}

          <div class="property-content">

            <div class="property-type">
              ${escapeHTML(
                property.property_type ||
                "Propiedad"
              )}
            </div>

            <div class="property-title">
              ${escapeHTML(title)}
            </div>

            <div class="property-price">
              ${money(property.price)}
            </div>

            ${
              location
                ? `
                    <div class="property-location">
                      ${escapeHTML(location)}
                    </div>
                  `
                : ""
            }

            ${statsHTML}

            ${addressHTML}

            <button
              type="button"
              class="view-property"
              data-property-id="${Number(
                property.id
              )}"
            >
              Ver propiedad
            </button>

          </div>

        </div>
      `;

    }

    /* =====================================================
       ABRIR PROPIEDAD
       ===================================================== */

    function openProperty(id) {

      const property =
        allProperties.find(
          item =>
            Number(item.id) ===
            Number(id)
        );

      if (!property || !map) {
        return;
      }

      const latitude =
        Number(
          property.latitude
        );

      const longitude =
        Number(
          property.longitude
        );

      if (
        !Number.isFinite(latitude) ||
        !Number.isFinite(longitude)
      ) {

        return;

      }

      map.setView(
        [
          latitude,
          longitude
        ],
        Math.max(
          map.getZoom(),
          16
        ),
        {
          animate: true
        }
      );

    }

    window.openProperty =
      openProperty;

    /* =====================================================
       EVENTO TARJETA
       ===================================================== */

    document.addEventListener(
      "click",
      event => {

        const button =
          event.target.closest(
            ".view-property"
          );

        if (!button) {
          return;
        }

        const id =
          Number(
            button.dataset.propertyId
          );

        openProperty(id);

      }
    );

    /* =====================================================
       RENDER MARCADORES
       ===================================================== */

    function renderMarkers() {

      if (
        !map ||
        !markerLayer
      ) {
        return;
      }

      markerLayer.clearLayers();

      let locatedCount = 0;

      filteredProperties.forEach(
        property => {

          const latitude =
            Number(
              property.latitude
            );

          const longitude =
            Number(
              property.longitude
            );

          if (
            !Number.isFinite(
              latitude
            ) ||
            !Number.isFinite(
              longitude
            )
          ) {

            return;

          }

          locatedCount++;

          const marker =
            L.marker(
              [
                latitude,
                longitude
              ],
              {
                icon:
                  nexoIcon
              }
            );

          marker.bindPopup(
            buildPropertyCard(
              property
            ),
            {
              maxWidth: 320,

              closeButton:
                true,

              autoPan:
                true,

              autoPanPadding:
                [30, 120]
            }
          );

          marker.addTo(
            markerLayer
          );

        }
      );

      updateCounter();

      mapNote.classList.toggle(
        "show",
        filteredProperties.length >
          locatedCount
      );

    }

    /* =====================================================
       AJUSTAR MAPA
       ===================================================== */

    function fitVisibleProperties() {

      if (!map) {
        return;
      }

      const coordinates =
        filteredProperties
          .map(
            property => {

              const latitude =
                Number(
                  property.latitude
                );

              const longitude =
                Number(
                  property.longitude
                );

              if (
                !Number.isFinite(
                  latitude
                ) ||
                !Number.isFinite(
                  longitude
                )
              ) {

                return null;

              }

              return [
                latitude,
                longitude
              ];

            }
          )
          .filter(Boolean);

      /*
       * SIN COORDENADAS:
       * volvemos a Cuba.
       */

      if (
        !coordinates.length
      ) {

        map.setView(
          DEFAULT_CENTER,
          DEFAULT_ZOOM,
          {
            animate: true
          }
        );

        return;

      }

      /*
       * UNA SOLA PROPIEDAD.
       */

      if (
        coordinates.length === 1
      ) {

        map.setView(
          coordinates[0],
          15,
          {
            animate: true
          }
        );

        return;

      }

      /*
       * VARIAS PROPIEDADES.
       */

      const bounds =
        L.latLngBounds(
          coordinates
        );

      if (
        !bounds.isValid()
      ) {

        map.setView(
          DEFAULT_CENTER,
          DEFAULT_ZOOM
        );

        return;

      }

      map.fitBounds(
        bounds,
        {
          paddingTopLeft:
            [25, 160],

          paddingBottomRight:
            [25, 110],

          maxZoom: 16,

          animate: true
        }
      );

    }

    /* =====================================================
       CONTADOR
       ===================================================== */

    function updateCounter() {

      const total =
        filteredProperties.length;

      const located =
        filteredProperties.filter(
          property => {

            const latitude =
              Number(
                property.latitude
              );

            const longitude =
              Number(
                property.longitude
              );

            return (
              Number.isFinite(
                latitude
              ) &&
              Number.isFinite(
                longitude
              )
            );

          }
        ).length;

      if (
        total === 0
      ) {

        counter.textContent =
          "0 propiedades";

        return;

      }

      if (
        total === located
      ) {

        counter.textContent =
          `${total} ${
            total === 1
              ? "propiedad"
              : "propiedades"
          }`;

      } else {

        counter.textContent =
          `${total} propiedades · ${located} ubicadas`;

      }

    }

    /* =====================================================
       FILTROS
       ===================================================== */

    function applyFilters() {

      const search =
        normalize(
          searchInput.value
        );

      filteredProperties =
        allProperties.filter(
          property => {

            if (
              activeType !==
                "all"
            ) {

              if (
                normalize(
                  property.property_type
                ) !==
                normalize(
                  activeType
                )
              ) {

                return false;

              }

            }

            if (!search) {
              return true;
            }

            const searchable =
              [
                property.property_type,
                property.title,
                property.city,
                property.neighborhood,
                property.address,
                property.description
              ]
                .filter(Boolean)
                .map(normalize)
                .join(" ");

            return searchable.includes(
              search
            );

          }
        );

      renderMarkers();

      if (
        filteredProperties.length
      ) {

        hideStatus();

        fitVisibleProperties();

      } else {

        showStatus(
          "Sin resultados",
          "No encontramos propiedades con esos criterios."
        );

        if (map) {

          map.setView(
            DEFAULT_CENTER,
            DEFAULT_ZOOM
          );

        }

      }

    }

    /* =====================================================
       BOTONES DE TIPO
       ===================================================== */

    document
      .querySelectorAll(".filter")
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              document
                .querySelectorAll(
                  ".filter"
                )
                .forEach(
                  item =>
                    item.classList.remove(
                      "active"
                    )
                );

              button.classList.add(
                "active"
              );

              activeType =
                button.dataset.type ||
                "all";

              applyFilters();

            }
          );

        }
      );

    /* =====================================================
       BUSCADOR
       ===================================================== */

    searchInput.addEventListener(
      "input",
      () => {

        clearSearch.classList.toggle(
          "show",
          Boolean(
            searchInput.value.trim()
          )
        );

        applyFilters();

      }
    );

    clearSearch.addEventListener(
      "click",
      () => {

        searchInput.value = "";

        clearSearch.classList.remove(
          "show"
        );

        applyFilters();

        searchInput.focus();

      }
    );

    /* =====================================================
       BOTÓN AJUSTAR
       ===================================================== */

    fitButton.addEventListener(
      "click",
      () => {

        if (!map) {
          return;
        }

        fitVisibleProperties();

      }
    );

    /* =====================================================
       UBICACIÓN DEL USUARIO
       ===================================================== */

    locationButton.addEventListener(
      "click",
      () => {

        if (
          !navigator.geolocation
        ) {

          alert(
            "Tu dispositivo no permite obtener la ubicación."
          );

          return;

        }

        if (!map) {
          return;
        }

        locationButton.disabled =
          true;

        navigator.geolocation.getCurrentPosition(

          position => {

            const latitude =
              position.coords.latitude;

            const longitude =
              position.coords.longitude;

            if (
              userLocationMarker
            ) {

              map.removeLayer(
                userLocationMarker
              );

            }

            userLocationMarker =
              L.circleMarker(
                [
                  latitude,
                  longitude
                ],
                {
                  radius: 8,

                  weight: 3
                }
              )
                .addTo(map)
                .bindPopup(
                  "Tu ubicación"
                )
                .openPopup();

            map.setView(
              [
                latitude,
                longitude
              ],
              15,
              {
                animate: true
              }
            );

            locationButton.disabled =
              false;

          },

          error => {

            console.warn(
              "NEXO ubicación:",
              error
            );

            alert(
              "No se pudo obtener tu ubicación."
            );

            locationButton.disabled =
              false;

          },

          {
            enableHighAccuracy:
              true,

            timeout:
              10000,

            maximumAge:
              60000
          }

        );

      }
    );

    /* =====================================================
       CARGAR PROPIEDADES
       ===================================================== */

    async function loadProperties() {

      showStatus(
        "Cargando NEXO...",
        "Buscando propiedades."
      );

      counter.textContent =
        "Conectando...";

      try {

        /*
         * IMPORTANTE:
         * Usamos la misma ruta del Worker.
         */

        const response =
          await fetch(
            "/api/properties",
            {
              method: "GET",

              headers: {
                "Accept":
                  "application/json"
              },

              cache:
                "no-store",

              credentials:
                "same-origin"
            }
          );

        const text =
          await response.text();

        /*
         * Si el Worker devuelve HTML
         * en vez de JSON, lo mostramos
         * claramente.
         */

        let data = null;

        try {

          data =
            JSON.parse(
              text
            );

        } catch (error) {

          console.error(
            "NEXO API respondió:",
            text
          );

          throw new Error(
            "El servidor no devolvió JSON."
          );

        }

        if (
          !response.ok
        ) {

          throw new Error(
            data?.error ||
            `Error HTTP ${response.status}`
          );

        }

        if (
          data &&
          data.success === false
        ) {

          throw new Error(
            data.error ||
            "NEXO rechazó la solicitud."
          );

        }

        allProperties =
          Array.isArray(
            data?.properties
          )
            ? data.properties
            : [];

        /*
         * Solo propiedades disponibles.
         */

        allProperties =
          allProperties.filter(
            property =>
              !property.status ||
              property.status ===
                "available"
          );

        filteredProperties =
          [...allProperties];

        renderMarkers();

        /*
         * El mapa ya está cargado.
         */

        hideStatus();

        updateCounter();

        /*
         * Si existen coordenadas,
         * centramos automáticamente.
         */

        const located =
          allProperties.filter(
            property => {

              const latitude =
                Number(
                  property.latitude
                );

              const longitude =
                Number(
                  property.longitude
                );

              return (
                Number.isFinite(
                  latitude
                ) &&
                Number.isFinite(
                  longitude
                )
              );

            }
          );

        if (
          located.length
        ) {

          fitVisibleProperties();

        } else {

          map.setView(
            DEFAULT_CENTER,
            DEFAULT_ZOOM
          );

        }

        /*
         * Recalcular tamaño.
         */

        setTimeout(
          () => {

            if (map) {

              map.invalidateSize(
                true
              );

            }

          },
          250
        );

      } catch (error) {

        console.error(
          "NEXO MAP API:",
          error
        );

        /*
         * MUY IMPORTANTE:
         * Aunque falle la API,
         * el mapa NO desaparece.
         */

        counter.textContent =
          "Sin conexión";

        showStatus(
          "No se pudieron cargar las propiedades",
          error.message ||
          "Comprueba la conexión con NEXO.",
          true
        );

        /*
         * El mapa sigue visible
         * centrado en Cuba.
         */

        if (map) {

          map.setView(
            DEFAULT_CENTER,
            DEFAULT_ZOOM
          );

        }

      }

    }

    /* =====================================================
       REINTENTAR
       ===================================================== */

    retryButton.addEventListener(
      "click",
      () => {

        loadProperties();

      }
    );

    /* =====================================================
       INICIO
       ===================================================== */

    const mapReady =
      initializeMap();

    if (mapReady) {

      loadProperties();

    }

    /* =====================================================
       RESIZE
       ===================================================== */

    window.addEventListener(
      "resize",
      () => {

        if (map) {

          setTimeout(
            () => {

              map.invalidateSize(
                true
              );

            },
            100
          );

        }

      }
    );

    /* =====================================================
       ORIENTACIÓN DEL TELÉFONO
       ===================================================== */

    window.addEventListener(
      "orientationchange",
      () => {

        setTimeout(
          () => {

            if (map) {

              map.invalidateSize(
                true
              );

            }

          },
          400
        );

      }
    );

  </script>

</body>
