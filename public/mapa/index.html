<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f5f5f3">

  <title>NEXO — Mapa</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >

  <style>
    :root {
      --nexo-black: #111111;
      --nexo-white: #ffffff;
      --nexo-bg: #f5f5f3;
      --nexo-gray: #737373;
      --nexo-light: #eeeeec;

      --glass: rgba(255,255,255,.90);
      --glass-strong: rgba(255,255,255,.96);

      --shadow-soft:
        0 8px 30px rgba(0,0,0,.10);

      --shadow-card:
        0 18px 55px rgba(0,0,0,.18);

      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Inter,
        system-ui,
        sans-serif;

      background: var(--nexo-bg);
      color: var(--nexo-black);
    }

    body {
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      outline: 0;
      cursor: pointer;
    }

    /* =====================================================
       MAPA
       ===================================================== */

    #map {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: #e7e7e4;
    }

    .leaflet-container {
      background: #e7e7e4;
      font-family: inherit;
    }

    /*
     * Suaviza visualmente el mapa sin alterar
     * la resolución de las teselas.
     */

    .leaflet-tile {
      filter:
        saturate(.72)
        contrast(.96)
        brightness(1.025);
    }

    .leaflet-control-attribution {
      padding: 2px 5px !important;

      border-radius: 8px 0 0 0;

      background: rgba(255,255,255,.68) !important;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      color: #777 !important;

      font-size: 7px !important;
    }

    .leaflet-control-attribution a {
      color: #666 !important;
    }

    /* =====================================================
       ZOOM
       ===================================================== */

    .leaflet-control-zoom {
      border: 0 !important;
      box-shadow: none !important;
    }

    .leaflet-control-zoom a {
      width: 42px !important;
      height: 42px !important;

      margin-top: 7px;

      border: 0 !important;
      border-radius: 15px !important;

      background: rgba(255,255,255,.94) !important;

      color: #111 !important;

      box-shadow:
        0 8px 28px rgba(0,0,0,.12);

      font-size: 19px !important;

      transition:
        transform .18s ease,
        background .18s ease;
    }

    .leaflet-control-zoom a:active {
      transform: scale(.93);
      background: #fff !important;
    }

    /* =====================================================
       CAPA SUPERIOR
       ===================================================== */

    .top-area {
      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      z-index: 1000;

      padding:
        calc(12px + env(safe-area-inset-top, 0px))
        13px
        0;

      pointer-events: none;
    }

    .top-inner {
      width: min(850px, 100%);
      margin: auto;

      pointer-events: auto;
    }

    /* =====================================================
       HEADER NEXO
       ===================================================== */

    .header {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand {
      position: relative;

      flex: 0 0 auto;

      height: 48px;

      display: flex;
      align-items: center;

      padding: 0 16px;

      border-radius: 17px;

      background: var(--glass-strong);

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      box-shadow:
        0 8px 30px rgba(0,0,0,.12);

      font-size: 17px;
      font-weight: 900;

      letter-spacing: -.09em;
    }

    .brand::after {
      content: "";

      position: absolute;

      right: 8px;
      top: 8px;

      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: #111;
    }

    /* =====================================================
       BUSCADOR
       ===================================================== */

    .search {
      flex: 1;
      min-width: 0;

      height: 48px;

      display: flex;
      align-items: center;

      border-radius: 17px;

      background: var(--glass-strong);

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      box-shadow:
        0 8px 30px rgba(0,0,0,.12);

      overflow: hidden;
    }

    .search-icon {
      flex: 0 0 auto;

      width: 42px;

      display: flex;
      justify-content: center;
      align-items: center;

      color: #666;

      font-size: 17px;
    }

    .search input {
      width: 100%;
      height: 100%;

      padding: 0 5px 0 0;

      border: 0;
      outline: 0;

      background: transparent;

      color: #111;

      font-size: 13px;

      -webkit-appearance: none;
    }

    .search input::placeholder {
      color: #999;
    }

    .search input::-webkit-search-cancel-button {
      display: none;
    }

    .clear {
      display: none;

      flex: 0 0 auto;

      width: 32px;
      height: 32px;

      margin-right: 7px;

      border-radius: 50%;

      background: #ededeb;

      color: #555;

      font-size: 18px;

      line-height: 1;
    }

    .clear.visible {
      display: block;
    }

    /* =====================================================
       FILTROS
       ===================================================== */

    .filters {
      margin-top: 10px;

      display: flex;
      gap: 7px;

      overflow-x: auto;

      scrollbar-width: none;

      padding-bottom: 2px;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter {
      flex: 0 0 auto;

      min-height: 35px;

      padding: 0 14px;

      border: 1px solid rgba(0,0,0,.055);

      border-radius: 999px;

      background: rgba(255,255,255,.88);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      color: #4d4d4d;

      font-size: 10px;
      font-weight: 750;

      box-shadow:
        0 5px 20px rgba(0,0,0,.07);

      transition:
        transform .18s ease,
        background .18s ease,
        color .18s ease,
        box-shadow .18s ease;
    }

    .filter.active {
      background: #111;
      color: #fff;

      border-color: #111;

      box-shadow:
        0 7px 22px rgba(0,0,0,.18);
    }

    .filter:active {
      transform: scale(.95);
    }

    /* =====================================================
       CONTADOR
       ===================================================== */

    .counter {
      position: fixed;

      left: 14px;

      bottom:
        calc(17px + env(safe-area-inset-bottom, 0px));

      z-index: 1000;

      min-height: 36px;

      display: flex;
      align-items: center;

      padding: 0 13px;

      border-radius: 999px;

      background: rgba(255,255,255,.91);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        0 8px 30px rgba(0,0,0,.12);

      color: #222;

      font-size: 10px;
      font-weight: 750;

      white-space: nowrap;
    }

    /* =====================================================
       HERRAMIENTAS
       ===================================================== */

    .map-tools {
      position: fixed;

      right: 14px;

      bottom:
        calc(17px + env(safe-area-inset-bottom, 0px));

      z-index: 1000;

      display: flex;
      flex-direction: column;

      gap: 8px;
    }

    .tool {
      width: 45px;
      height: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 15px;

      background: rgba(255,255,255,.94);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        0 8px 30px rgba(0,0,0,.12);

      color: #111;

      font-size: 18px;

      transition:
        transform .18s ease,
        background .18s ease;
    }

    .tool:active {
      transform: scale(.92);
      background: #fff;
    }

    .tool:disabled {
      opacity: .55;
      cursor: default;
    }

    /* =====================================================
       ESTADO
       ===================================================== */

    .status {
      position: fixed;

      left: 50%;
      top: 50%;

      z-index: 3000;

      width: min(320px, calc(100% - 40px));

      transform: translate(-50%, -50%);

      padding: 21px;

      border-radius: 22px;

      background: rgba(255,255,255,.96);

      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      box-shadow:
        0 25px 70px rgba(0,0,0,.18);

      text-align: center;
    }

    .status.hidden {
      display: none;
    }

    .status-title {
      margin-bottom: 6px;

      font-size: 14px;
      font-weight: 850;

      letter-spacing: -.02em;
    }

    .status-text {
      color: #777;

      font-size: 11px;
      line-height: 1.5;
    }

    /* =====================================================
       PIN NEXO
       ===================================================== */

    .nexo-pin-wrapper {
      position: relative;

      width: 42px;
      height: 50px;
    }

    .nexo-pin {
      position: absolute;

      left: 2px;
      top: 0;

      width: 38px;
      height: 38px;

      border-radius: 50% 50% 50% 0;

      background: #111;

      border: 3px solid #fff;

      transform: rotate(-45deg);

      box-shadow:
        0 7px 18px rgba(0,0,0,.28);
    }

    .nexo-pin::before {
      content: "";

      position: absolute;

      left: 11px;
      top: 11px;

      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: #fff;
    }

    .nexo-pin::after {
      content: "";

      position: absolute;

      left: 14px;
      top: 14px;

      width: 4px;
      height: 4px;

      border-radius: 50%;

      background: #111;
    }

    /* =====================================================
       POPUP
       ===================================================== */

    .leaflet-popup {
      margin-bottom: 13px;
    }

    .leaflet-popup-content-wrapper {
      padding: 0 !important;

      border-radius: 23px !important;

      overflow: hidden;

      background: #fff;

      box-shadow:
        var(--shadow-card);
    }

    .leaflet-popup-content {
      width: min(315px, 80vw) !important;

      margin: 0 !important;
    }

    .leaflet-popup-tip {
      box-shadow: none !important;
    }

    .leaflet-popup-close-button {
      top: 11px !important;
      right: 11px !important;

      z-index: 20;

      width: 31px !important;
      height: 31px !important;

      display: flex !important;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: rgba(255,255,255,.93);

      color: #111 !important;

      font-size: 19px !important;
      line-height: 1 !important;

      box-shadow:
        0 4px 16px rgba(0,0,0,.12);
    }

    /* =====================================================
       TARJETA PROPIEDAD
       ===================================================== */

    .property-card {
      width: 100%;
      overflow: hidden;

      background: #fff;
    }

    .property-photo {
      position: relative;

      width: 100%;
      height: 178px;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          #e8e8e6,
          #d7d7d5
        );
    }

    .property-photo img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      transition:
        transform .5s ease;
    }

    .photo-placeholder {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #999;

      font-size: 10px;
    }

    .photo-gradient {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      height: 75px;

      background:
        linear-gradient(
          transparent,
          rgba(0,0,0,.22)
        );

      pointer-events: none;
    }

    .property-body {
      padding: 17px;
    }

    .property-type {
      color: #8a8a8a;

      font-size: 9px;
      font-weight: 850;

      text-transform: uppercase;

      letter-spacing: .13em;
    }

    .property-title {
      margin-top: 6px;

      color: #111;

      font-size: 20px;
      font-weight: 850;

      letter-spacing: -.055em;

      line-height: 1.04;
    }

    .property-price {
      margin-top: 8px;

      color: #111;

      font-size: 21px;
      font-weight: 850;

      letter-spacing: -.045em;
    }

    .property-location {
      margin-top: 7px;

      color: #777;

      font-size: 10px;

      line-height: 1.45;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;

      gap: 6px;

      margin-top: 13px;
    }

    .stat {
      min-height: 27px;

      display: flex;
      align-items: center;

      padding: 0 9px;

      border-radius: 999px;

      background: #f1f1ef;

      color: #555;

      font-size: 9px;
      font-weight: 750;
    }

    .address {
      margin-top: 12px;

      color: #777;

      font-size: 10px;

      line-height: 1.45;
    }

    .view-button {
      width: 100%;

      margin-top: 14px;

      min-height: 43px;

      border-radius: 14px;

      background: #111;

      color: #fff;

      font-size: 11px;
      font-weight: 800;

      box-shadow:
        0 8px 20px rgba(0,0,0,.14);

      transition:
        transform .18s ease,
        opacity .18s ease;
    }

    .view-button:active {
      transform: scale(.98);
      opacity: .86;
    }

    /* =====================================================
       UBICACIÓN DEL USUARIO
       ===================================================== */

    .user-location-pulse {
      width: 16px;
      height: 16px;

      border-radius: 50%;

      background: #111;

      border: 4px solid #fff;

      box-shadow:
        0 0 0 7px rgba(17,17,17,.12),
        0 4px 14px rgba(0,0,0,.22);
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 600px) {

      .top-area {
        padding-left: 11px;
        padding-right: 11px;
      }

      .brand {
        height: 44px;
        padding: 0 14px;

        font-size: 16px;
      }

      .search {
        height: 44px;
      }

      .search input {
        font-size: 12px;
      }

      .filter {
        min-height: 34px;

        padding: 0 13px;

        font-size: 10px;
      }

      .property-photo {
        height: 158px;
      }

      .leaflet-control-zoom a {
        width: 40px !important;
        height: 40px !important;
        line-height: 40px !important;
      }
    }

    /* =====================================================
       PANTALLAS MUY PEQUEÑAS
       ===================================================== */

    @media (max-width: 380px) {

      .brand {
        padding: 0 12px;
      }

      .search-icon {
        width: 36px;
      }

      .search input {
        font-size: 11px;
      }

      .property-body {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <div class="top-area">

    <div class="top-inner">

      <div class="header">

        <div class="brand">
          NEXO
        </div>

        <div class="search">

          <div class="search-icon">
            ⌕
          </div>

          <input
            id="searchInput"
            type="search"
            placeholder="Buscar ciudad, zona o dirección"
            autocomplete="off"
            enterkeyhint="search"
          >

          <button
            id="clearSearch"
            class="clear"
            type="button"
            aria-label="Limpiar búsqueda"
          >
            ×
          </button>

        </div>

      </div>

      <!-- ===================================================
           FILTROS
           =================================================== -->

      <div class="filters">

        <button
          class="filter active"
          data-type="all"
          type="button"
        >
          Todas
        </button>

        <button
          class="filter"
          data-type="Casa"
          type="button"
        >
          Casas
        </button>

        <button
          class="filter"
          data-type="Apartamento"
          type="button"
        >
          Apartamentos
        </button>

        <button
          class="filter"
          data-type="Villa"
          type="button"
        >
          Villas
        </button>

        <button
          class="filter"
          data-type="Terreno"
          type="button"
        >
          Terrenos
        </button>

        <button
          class="filter"
          data-type="Local"
          type="button"
        >
          Locales
        </button>

      </div>

    </div>

  </div>

  <!-- =====================================================
       CONTADOR
       ===================================================== -->

  <div
    id="counter"
    class="counter"
  >
    Cargando propiedades...
  </div>

  <!-- =====================================================
       HERRAMIENTAS
       ===================================================== -->

  <div class="map-tools">

    <button
      id="fitButton"
      class="tool"
      type="button"
      aria-label="Mostrar propiedades"
      title="Mostrar propiedades"
    >
      ⛶
    </button>

    <button
      id="locationButton"
      class="tool"
      type="button"
      aria-label="Mi ubicación"
      title="Mi ubicación"
    >
      ⊙
    </button>

  </div>

  <!-- =====================================================
       ESTADO
       ===================================================== -->

  <div
    id="status"
    class="status"
  >

    <div
      id="statusTitle"
      class="status-title"
    >
      Cargando NEXO...
    </div>

    <div
      id="statusText"
      class="status-text"
    >
      Buscando propiedades.
    </div>

  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <script>
    "use strict";

    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const mapElement =
      document.getElementById("map");

    const searchInput =
      document.getElementById("searchInput");

    const clearSearch =
      document.getElementById("clearSearch");

    const counter =
      document.getElementById("counter");

    const status =
      document.getElementById("status");

    const statusTitle =
      document.getElementById("statusTitle");

    const statusText =
      document.getElementById("statusText");

    const fitButton =
      document.getElementById("fitButton");

    const locationButton =
      document.getElementById("locationButton");


    /* =====================================================
       ESTADO
       ===================================================== */

    let allProperties = [];

    let filteredProperties = [];

    let activeType = "all";

    let userLocationLayer = null;


    /* =====================================================
       CONFIGURACIÓN MAPA
       ===================================================== */

    const DEFAULT_CENTER =
      [23.1136, -82.3666];

    const DEFAULT_ZOOM =
      11;


    /* =====================================================
       MAPA
       ===================================================== */

    const map =
      L.map(
        mapElement,
        {
          zoomControl: false,

          preferCanvas: false,

          worldCopyJump: false,

          minZoom: 3,

          maxZoom: 19
        }
      );


    map.setView(
      DEFAULT_CENTER,
      DEFAULT_ZOOM,
      {
        animate: false
      }
    );


    /* =====================================================
       ZOOM
       ===================================================== */

    L.control.zoom({
      position: "bottomright"
    }).addTo(map);


    /* =====================================================
       MAPA BASE
       ===================================================== */

    const baseLayer =
      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19,

          updateWhenZooming: true,

          updateWhenIdle: true,

          keepBuffer: 4,

          attribution:
            '&copy; OpenStreetMap contributors'
        }
      );


    baseLayer.addTo(map);


    /* =====================================================
       MARCADORES
       ===================================================== */

    const markerLayer =
      L.layerGroup().addTo(map);


    /* =====================================================
       UTILIDADES
       ===================================================== */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function normalize(value) {

      return String(value ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }


    function money(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return "$0";
      }

      const number =
        Number(
          String(value)
            .replace(/[$,\s]/g, "")
        );


      if (!Number.isFinite(number)) {
        return String(value);
      }


      return "$" +
        number.toLocaleString(
          "en-US",
          {
            maximumFractionDigits: 0
          }
        );
    }


    function parsePhotos(property) {

      if (
        Array.isArray(property.photos)
      ) {

        return property.photos
          .filter(Boolean);
      }


      if (
        typeof property.photos === "string"
      ) {

        try {

          const parsed =
            JSON.parse(property.photos);

          if (
            Array.isArray(parsed)
          ) {

            return parsed
              .filter(Boolean);
          }

        } catch {

          if (
            property.photos
              .trim()
              .startsWith("http")
          ) {

            return [
              property.photos.trim()
            ];
          }
        }
      }


      return [
        property.image,
        property.image_url,
        property.photo,
        property.photo_url,
        property.cover_image,
        property.cover
      ]
        .filter(
          item =>
            typeof item === "string" &&
            item.trim()
        );
    }


    /* =====================================================
       ESTADO
       ===================================================== */

    function showStatus(
      title,
      text
    ) {

      statusTitle.textContent =
        title;

      statusText.textContent =
        text;

      status.classList.remove(
        "hidden"
      );
    }


    function hideStatus() {

      status.classList.add(
        "hidden"
      );
    }


    /* =====================================================
       ICONO NEXO
       ===================================================== */

    const nexoIcon =
      L.divIcon({

        className: "",

        html:
          `
            <div class="nexo-pin-wrapper">
              <div class="nexo-pin"></div>
            </div>
          `,

        iconSize:
          [42, 50],

        iconAnchor:
          [21, 48],

        popupAnchor:
          [0, -44]
      });


    /* =====================================================
       TARJETA
       ===================================================== */

    function buildPropertyCard(
      property
    ) {

      const photos =
        parsePhotos(property);


      const image =
        photos.length
          ? photos[0]
          : "";


      const title =
        property.title ||
        property.name ||
        property.property_type ||
        "Propiedad";


      const location =
        [
          property.neighborhood,
          property.city
        ]
          .filter(Boolean)
          .join(" · ");


      const stats = [];


      if (
        property.bedrooms !== null &&
        property.bedrooms !== undefined &&
        property.bedrooms !== ""
      ) {

        stats.push(
          `🛏 ${escapeHTML(property.bedrooms)}`
        );
      }


      if (
        property.bathrooms !== null &&
        property.bathrooms !== undefined &&
        property.bathrooms !== ""
      ) {

        stats.push(
          `🚿 ${escapeHTML(property.bathrooms)}`
        );
      }


      if (
        property.square_meters !== null &&
        property.square_meters !== undefined &&
        property.square_meters !== ""
      ) {

        stats.push(
          `${escapeHTML(property.square_meters)} m²`
        );
      }


      const statsHTML =
        stats.length
          ? `
            <div class="stats">
              ${stats
                .map(
                  item =>
                    `<span class="stat">${item}</span>`
                )
                .join("")}
            </div>
          `
          : "";


      const photoHTML =
        image
          ? `
            <div class="property-photo">

              <img
                src="${escapeHTML(image)}"
                alt="${escapeHTML(title)}"
                loading="lazy"
                onerror="
                  this.style.display='none';
                  this.nextElementSibling.style.display='flex';
                "
              >

              <div
                class="photo-placeholder"
                style="display:none"
              >
                Sin fotografía
              </div>

              <div class="photo-gradient"></div>

            </div>
          `
          : `
            <div class="property-photo">

              <div class="photo-placeholder">
                Sin fotografía
              </div>

            </div>
          `;


      const addressHTML =
        property.address
          ? `
            <div class="address">
              📍 ${escapeHTML(property.address)}
            </div>
          `
          : "";


      return `
        <div class="property-card">

          ${photoHTML}

          <div class="property-body">

            <div class="property-type">
              ${escapeHTML(
                property.property_type ||
                "Propiedad"
              )}
            </div>

            <div class="property-title">
              ${escapeHTML(title)}
            </div>

            <div class="property-price">
              ${money(property.price)}
            </div>

            ${
              location
                ? `
                  <div class="property-location">
                    ${escapeHTML(location)}
                  </div>
                `
                : ""
            }

            ${statsHTML}

            ${addressHTML}

            <button
              class="view-button"
              type="button"
              onclick="openProperty(${Number(property.id)})"
            >
              Ver propiedad
            </button>

          </div>

        </div>
      `;
    }


    /* =====================================================
       ABRIR PROPIEDAD
       ===================================================== */

    window.openProperty =
      function(id) {

        const property =
          allProperties.find(
            item =>
              Number(item.id) ===
              Number(id)
          );


        if (!property) {
          return;
        }


        const lat =
          Number(property.latitude);

        const lng =
          Number(property.longitude);


        if (
          !Number.isFinite(lat) ||
          !Number.isFinite(lng)
        ) {
          return;
        }


        map.closePopup();


        map.flyTo(
          [lat, lng],
          Math.max(
            map.getZoom(),
            16
          ),
          {
            animate: true,
            duration: .65
          }
        );
      };


    /* =====================================================
       RENDER MARCADORES
       ===================================================== */

    function renderMarkers() {

      markerLayer.clearLayers();


      filteredProperties.forEach(
        property => {

          const lat =
            Number(property.latitude);

          const lng =
            Number(property.longitude);


          if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lng)
          ) {
            return;
          }


          const marker =
            L.marker(
              [lat, lng],
              {
                icon: nexoIcon,
                keyboard: true
              }
            );


          marker.bindPopup(
            buildPropertyCard(property),
            {
              maxWidth: 320,

              closeButton: true,

              autoPan: true,

              autoPanPaddingTopLeft:
                [25, 145],

              autoPanPaddingBottomRight:
                [25, 95]
            }
          );


          marker.addTo(
            markerLayer
          );
        }
      );


      updateCounter();
    }


    /* =====================================================
       AJUSTAR PROPIEDADES
       ===================================================== */

    function fitVisibleProperties() {

      const coordinates =
        filteredProperties
          .map(
            property => {

              const lat =
                Number(property.latitude);

              const lng =
                Number(property.longitude);


              if (
                !Number.isFinite(lat) ||
                !Number.isFinite(lng)
              ) {
                return null;
              }


              return [lat, lng];
            }
          )
          .filter(Boolean);


      if (!coordinates.length) {

        map.setView(
          DEFAULT_CENTER,
          DEFAULT_ZOOM,
          {
            animate: true
          }
        );

        return;
      }


      if (
        coordinates.length === 1
      ) {

        map.flyTo(
          coordinates[0],
          15,
          {
            animate: true,
            duration: .65
          }
        );

        return;
      }


      const bounds =
        L.latLngBounds(
          coordinates
        );


      map.fitBounds(
        bounds,
        {
          paddingTopLeft:
            [35, 155],

          paddingBottomRight:
            [35, 115],

          maxZoom: 16,

          animate: true,

          duration: .65
        }
      );
    }


    /* =====================================================
       CONTADOR
       ===================================================== */

    function updateCounter() {

      const total =
        filteredProperties.length;


      const located =
        filteredProperties.filter(
          property => {

            const lat =
              Number(property.latitude);

            const lng =
              Number(property.longitude);


            return (
              Number.isFinite(lat) &&
              Number.isFinite(lng)
            );
          }
        ).length;


      if (total === 0) {

        counter.textContent =
          "0 propiedades";

        return;
      }


      if (
        total === located
      ) {

        counter.textContent =
          `${total} ${
            total === 1
              ? "propiedad"
              : "propiedades"
          }`;

      } else {

        counter.textContent =
          `${total} propiedades · ${located} ubicadas`;
      }
    }


    /* =====================================================
       FILTROS + BÚSQUEDA
       ===================================================== */

    function applyFilters() {

      const query =
        normalize(
          searchInput.value
        );


      filteredProperties =
        allProperties.filter(
          property => {

            if (
              activeType !== "all" &&
              normalize(
                property.property_type
              ) !==
              normalize(activeType)
            ) {

              return false;
            }


            if (!query) {
              return true;
            }


            const searchable =
              [
                property.title,
                property.name,
                property.property_type,
                property.city,
                property.neighborhood,
                property.address,
                property.description
              ]
                .filter(Boolean)
                .map(normalize)
                .join(" ");


            return searchable.includes(
              query
            );
          }
        );


      renderMarkers();


      if (
        filteredProperties.length
      ) {

        hideStatus();

        fitVisibleProperties();

      } else {

        showStatus(
          "Sin resultados",
          "No encontramos propiedades con esos criterios."
        );
      }
    }


    /* =====================================================
       FILTROS
       ===================================================== */

    document
      .querySelectorAll(".filter")
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              document
                .querySelectorAll(".filter")
                .forEach(
                  item =>
                    item.classList.remove(
                      "active"
                    )
                );


              button.classList.add(
                "active"
              );


              activeType =
                button.dataset.type ||
                "all";


              applyFilters();
            }
          );
        }
      );


    /* =====================================================
       BUSCADOR
       ===================================================== */

    searchInput.addEventListener(
      "input",
      () => {

        clearSearch.classList.toggle(
          "visible",
          Boolean(
            searchInput.value.trim()
          )
        );


        applyFilters();
      }
    );


    clearSearch.addEventListener(
      "click",
      () => {

        searchInput.value = "";

        clearSearch.classList.remove(
          "visible"
        );


        applyFilters();

        searchInput.focus();
      }
    );


    /* =====================================================
       BOTÓN MOSTRAR PROPIEDADES
       ===================================================== */

    fitButton.addEventListener(
      "click",
      () => {

        fitVisibleProperties();
      }
    );


    /* =====================================================
       MI UBICACIÓN
       ===================================================== */

    locationButton.addEventListener(
      "click",
      () => {

        if (
          !navigator.geolocation
        ) {

          alert(
            "Tu dispositivo no permite obtener la ubicación."
          );

          return;
        }


        locationButton.disabled =
          true;


        navigator.geolocation.getCurrentPosition(
          position => {

            const lat =
              position.coords.latitude;

            const lng =
              position.coords.longitude;


            if (
              userLocationLayer
            ) {

              map.removeLayer(
                userLocationLayer
              );
            }


            userLocationLayer =
              L.marker(
                [lat, lng],
                {
                  icon:
                    L.divIcon({
                      className: "",

                      html:
                        `
                          <div
                            class="user-location-pulse"
                          ></div>
                        `,

                      iconSize:
                        [16, 16],

                      iconAnchor:
                        [8, 8]
                    })
                }
              )
                .addTo(map)
                .bindPopup(
                  "Tu ubicación"
                );


            map.flyTo(
              [lat, lng],
              15,
              {
                animate: true,
                duration: .65
              }
            );


            locationButton.disabled =
              false;
          },


          error => {

            console.warn(
              "NEXO ubicación:",
              error
            );


            alert(
              "No se pudo obtener tu ubicación."
            );


            locationButton.disabled =
              false;
          },


          {
            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 60000
          }
        );
      }
    );


    /* =====================================================
       CARGAR PROPIEDADES
       ===================================================== */

    async function loadProperties() {

      showStatus(
        "Cargando NEXO",
        "Buscando propiedades..."
      );


      try {

        const response =
          await fetch(
            "/api/properties",
            {
              method: "GET",

              headers: {
                "Accept":
                  "application/json"
              },

              cache: "no-store"
            }
          );


        const text =
          await response.text();


        let data;


        try {

          data =
            JSON.parse(text);

        } catch {

          throw new Error(
            "La respuesta del servidor no es JSON."
          );
        }


        if (
          !response.ok ||
          data.success === false
        ) {

          throw new Error(
            data.error ||
            `HTTP ${response.status}`
          );
        }


        allProperties =
          Array.isArray(
            data.properties
          )
            ? data.properties
            : [];


        /*
         * Solo propiedades disponibles.
         */

        allProperties =
          allProperties.filter(
            property =>
              !property.status ||
              normalize(property.status) ===
                "available"
          );


        filteredProperties =
          [...allProperties];


        renderMarkers();


        hideStatus();


        const located =
          allProperties.filter(
            property => {

              const lat =
                Number(property.latitude);

              const lng =
                Number(property.longitude);


              return (
                Number.isFinite(lat) &&
                Number.isFinite(lng)
              );
            }
          );


        if (
          located.length
        ) {

          fitVisibleProperties();

        } else {

          map.setView(
            DEFAULT_CENTER,
            DEFAULT_ZOOM,
            {
              animate: false
            }
          );
        }


      } catch (error) {

        console.error(
          "NEXO MAP:",
          error
        );


        counter.textContent =
          "Error";


        showStatus(
          "No se pudieron cargar las propiedades",
          error.message ||
          "Comprueba la conexión con NEXO."
        );
      }
    }


    /* =====================================================
       INICIALIZACIÓN
       ===================================================== */

    loadProperties();


    /*
     * Recalcular tamaño de Leaflet.
     */

    requestAnimationFrame(
      () => {

        map.invalidateSize(
          true
        );
      }
    );


    setTimeout(
      () => {

        map.invalidateSize(
          true
        );
      },
      500
    );


    window.addEventListener(
      "resize",
      () => {

        map.invalidateSize(
          true
        );
      }
    );


    window.addEventListener(
      "orientationchange",
      () => {

        setTimeout(
          () => {

            map.invalidateSize(
              true
            );

          },
          350
        );
      }
    );

  </script>

</body>
</html>
