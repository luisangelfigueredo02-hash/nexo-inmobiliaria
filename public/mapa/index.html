<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f5f5f7">

  <title>NEXO — Mapa de propiedades</title>

  <!-- MAPTILER SDK -->
  <link
    href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css"
    rel="stylesheet"
  >

  <style>

    :root {
      --bg: #f5f5f7;
      --white: #fff;
      --black: #111;
      --text: #171717;
      --muted: #777;
      --border: rgba(0,0,0,.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Inter,
        system-ui,
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    /* =====================================================
       MAPA
       ===================================================== */

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* =====================================================
       BARRA SUPERIOR
       ===================================================== */

    .topbar {
      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      z-index: 1000;

      padding:
        calc(12px + env(safe-area-inset-top, 0px))
        14px
        10px;

      pointer-events: none;
    }

    .topbar-inner {
      width: min(760px, 100%);
      margin: auto;

      display: flex;
      align-items: center;

      gap: 10px;

      pointer-events: auto;
    }

    .brand {
      flex: 0 0 auto;

      padding: 12px 15px;

      border-radius: 16px;

      background:
        rgba(255,255,255,.94);

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);

      box-shadow:
        0 8px 30px rgba(0,0,0,.10);

      font-size: 17px;
      font-weight: 850;
      letter-spacing: -.07em;
    }

    .search {
      flex: 1;

      min-width: 0;

      display: flex;
      align-items: center;

      background:
        rgba(255,255,255,.94);

      border-radius: 16px;

      box-shadow:
        0 8px 30px rgba(0,0,0,.10);

      overflow: hidden;
    }

    .search-icon {
      padding-left: 14px;
      font-size: 16px;
    }

    .search input {
      width: 100%;

      padding: 13px 12px;

      border: 0;
      outline: 0;

      background: transparent;

      color: #111;

      font-size: 13px;
    }

    .clear-search {
      display: none;

      width: 36px;
      height: 36px;

      margin-right: 4px;

      border-radius: 50%;

      background: #eeeeef;

      color: #555;

      font-size: 15px;
    }

    .clear-search.show {
      display: block;
    }

    /* =====================================================
       FILTROS
       ===================================================== */

    .filters {
      position: fixed;

      top:
        calc(70px + env(safe-area-inset-top, 0px));

      left: 0;
      right: 0;

      z-index: 999;

      padding: 0 14px;

      pointer-events: none;
    }

    .filters-inner {
      width: min(760px, 100%);
      margin: auto;

      display: flex;
      gap: 8px;

      overflow-x: auto;

      scrollbar-width: none;

      pointer-events: auto;
    }

    .filters-inner::-webkit-scrollbar {
      display: none;
    }

    .filter {
      flex: 0 0 auto;

      padding: 10px 13px;

      border-radius: 999px;

      border:
        1px solid rgba(0,0,0,.06);

      background:
        rgba(255,255,255,.93);

      backdrop-filter:
        blur(15px);

      -webkit-backdrop-filter:
        blur(15px);

      color: #444;

      font-size: 11px;
      font-weight: 700;

      box-shadow:
        0 5px 20px rgba(0,0,0,.07);
    }

    .filter.active {
      background: #111;
      color: #fff;
    }

    /* =====================================================
       CONTROLES DE MAPA NEXO
       ===================================================== */

    .map-style-controls {
      position: fixed;

      right: 14px;

      top:
        calc(140px + env(safe-area-inset-top, 0px));

      z-index: 1000;

      display: flex;
      flex-direction: column;

      gap: 7px;
    }

    .style-button {
      min-width: 78px;

      padding: 10px 12px;

      border-radius: 13px;

      background:
        rgba(255,255,255,.95);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      box-shadow:
        0 7px 25px rgba(0,0,0,.12);

      color: #222;

      font-size: 10px;
      font-weight: 800;

      text-align: center;
    }

    .style-button.active {
      background: #111;
      color: #fff;
    }

    .style-button:active {
      transform: scale(.95);
    }

    /* =====================================================
       BOTONES INFERIORES
       ===================================================== */

    .map-buttons {
      position: fixed;

      right: 14px;

      bottom:
        calc(18px + env(safe-area-inset-bottom, 0px));

      z-index: 1000;

      display: flex;
      flex-direction: column;

      gap: 8px;
    }

    .map-button {
      width: 46px;
      height: 46px;

      border-radius: 15px;

      background:
        rgba(255,255,255,.95);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      box-shadow:
        0 8px 30px rgba(0,0,0,.12);

      font-size: 18px;
    }

    .map-button.active {
      background: #111;
      color: #fff;
    }

    .map-button:active {
      transform: scale(.94);
    }

    /* =====================================================
       CONTADOR
       ===================================================== */

    .counter {
      position: fixed;

      left: 14px;

      bottom:
        calc(18px + env(safe-area-inset-bottom, 0px));

      z-index: 1000;

      padding: 10px 14px;

      border-radius: 999px;

      background:
        rgba(255,255,255,.94);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      box-shadow:
        0 8px 30px rgba(0,0,0,.12);

      font-size: 11px;
      font-weight: 750;
    }

    /* =====================================================
       ESTADO
       ===================================================== */

    .status {
      position: fixed;

      left: 50%;
      top: 50%;

      z-index: 2000;

      transform:
        translate(-50%, -50%);

      width:
        min(320px, calc(100% - 40px));

      padding: 20px;

      border-radius: 20px;

      background:
        rgba(255,255,255,.97);

      box-shadow:
        0 20px 60px rgba(0,0,0,.16);

      text-align: center;

      font-size: 13px;
      line-height: 1.5;
    }

    .status.hidden {
      display: none;
    }

    .status-title {
      font-weight: 800;
      margin-bottom: 5px;
    }

    .status-text {
      color: #777;
    }

    /* =====================================================
       POPUP
       ===================================================== */

    .maplibregl-popup-content {
      padding: 0 !important;

      border-radius: 20px;

      overflow: hidden;

      box-shadow:
        0 15px 45px rgba(0,0,0,.16);
    }

    .maplibregl-popup {
      max-width:
        min(330px, 86vw);
    }

    .property-card {
      overflow: hidden;

      width:
        min(300px, 76vw);

      background: #fff;
    }

    .property-image {
      width: 100%;
      height: 155px;

      background:
        linear-gradient(
          145deg,
          #e8e8ea,
          #d5d5d8
        );

      display: flex;
      align-items: center;
      justify-content: center;

      color: #999;

      font-size: 11px;
    }

    .property-image img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }

    .property-content {
      padding: 15px;
    }

    .property-type {
      color: #888;

      font-size: 9px;
      font-weight: 800;

      text-transform: uppercase;

      letter-spacing: .1em;
    }

    .property-title {
      margin-top: 5px;

      font-size: 18px;
      font-weight: 800;

      letter-spacing: -.045em;
    }

    .property-price {
      margin-top: 7px;

      font-size: 19px;
      font-weight: 800;
    }

    .property-location {
      margin-top: 6px;

      color: #777;

      font-size: 11px;
      line-height: 1.45;
    }

    .property-stats {
      display: flex;
      flex-wrap: wrap;

      gap: 6px;

      margin-top: 12px;
    }

    .property-stat {
      padding: 6px 8px;

      border-radius: 999px;

      background: #f1f1f3;

      color: #555;

      font-size: 9px;
      font-weight: 700;
    }

    .property-address {
      margin-top: 11px;

      color: #666;

      font-size: 10px;
      line-height: 1.4;
    }

    .view-property {
      width: 100%;

      margin-top: 13px;

      padding: 11px;

      border-radius: 12px;

      background: #111;
      color: #fff;

      font-size: 11px;
      font-weight: 750;
    }

    /* =====================================================
       MARCADOR NEXO
       ===================================================== */

    .nexo-marker {
      width: 38px;
      height: 38px;

      border-radius:
        50% 50% 50% 0;

      background: #111;

      border:
        3px solid #fff;

      transform:
        rotate(-45deg);

      box-shadow:
        0 6px 18px rgba(0,0,0,.30);

      position: relative;
    }

    .nexo-marker::after {
      content: "";

      position: absolute;

      width: 10px;
      height: 10px;

      left: 11px;
      top: 11px;

      border-radius: 50%;

      background: #fff;
    }

    /* =====================================================
       LOGO MAPTILER / CONTROLES
       ===================================================== */

    .maplibregl-ctrl-bottom-left,
    .maplibregl-ctrl-bottom-right {
      z-index: 20;
    }

    .maplibregl-ctrl-group {
      border-radius: 12px !important;
      overflow: hidden;
      box-shadow:
        0 5px 20px rgba(0,0,0,.12) !important;
    }

    /* =====================================================
       MÓVIL
       ===================================================== */

    @media(max-width:600px) {

      .brand {
        padding: 11px 13px;
        font-size: 16px;
      }

      .search input {
        font-size: 12px;
      }

      .filters {
        top:
          calc(65px + env(safe-area-inset-top, 0px));
      }

      .map-style-controls {
        top:
          calc(125px + env(safe-area-inset-top, 0px));

        right: 10px;
      }

      .style-button {
        min-width: 70px;
        padding: 9px 10px;
      }

      .property-image {
        height: 145px;
      }

    }

  </style>
</head>

<body>

  <!-- =====================================================
       MAPA
       ===================================================== -->

  <div id="map"></div>


  <!-- =====================================================
       BARRA SUPERIOR
       ===================================================== -->

  <div class="topbar">

    <div class="topbar-inner">

      <div class="brand">
        NEXO
      </div>

      <div class="search">

        <span class="search-icon">
          🔎
        </span>

        <input
          id="searchInput"
          type="search"
          placeholder="Buscar ciudad, zona o dirección"
          autocomplete="off"
        >

        <button
          id="clearSearch"
          class="clear-search"
          type="button"
          aria-label="Limpiar búsqueda"
        >
          ×
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       FILTROS
       ===================================================== -->

  <div class="filters">

    <div class="filters-inner">

      <button
        class="filter active"
        data-type="all"
        type="button"
      >
        Todas
      </button>

      <button
        class="filter"
        data-type="Casa"
        type="button"
      >
        Casas
      </button>

      <button
        class="filter"
        data-type="Apartamento"
        type="button"
      >
        Apartamentos
      </button>

      <button
        class="filter"
        data-type="Villa"
        type="button"
      >
        Villas
      </button>

      <button
        class="filter"
        data-type="Terreno"
        type="button"
      >
        Terrenos
      </button>

      <button
        class="filter"
        data-type="Local"
        type="button"
      >
        Locales
      </button>

    </div>

  </div>


  <!-- =====================================================
       CAMBIO DE VISTA
       ===================================================== -->

  <div class="map-style-controls">

    <button
      id="streetsButton"
      class="style-button active"
      type="button"
    >
      🗺️ Mapa
    </button>

    <button
      id="hybridButton"
      class="style-button"
      type="button"
    >
      🌍 Híbrido
    </button>

    <button
      id="satelliteButton"
      class="style-button"
      type="button"
    >
      🛰️ Satélite
    </button>

    <button
      id="terrainButton"
      class="style-button"
      type="button"
    >
      🧊 3D
    </button>

  </div>


  <!-- =====================================================
       CONTADOR
       ===================================================== -->

  <div
    id="counter"
    class="counter"
  >
    Cargando propiedades...
  </div>


  <!-- =====================================================
       BOTONES
       ===================================================== -->

  <div class="map-buttons">

    <button
      id="fitButton"
      class="map-button"
      type="button"
      title="Mostrar propiedades"
      aria-label="Mostrar propiedades"
    >
      ⛶
    </button>

    <button
      id="locationButton"
      class="map-button"
      type="button"
      title="Mi ubicación"
      aria-label="Mi ubicación"
    >
      ⊙
    </button>

  </div>


  <!-- =====================================================
       ESTADO
       ===================================================== -->

  <div
    id="status"
    class="status"
  >

    <div
      id="statusTitle"
      class="status-title"
    >
      Cargando NEXO...
    </div>

    <div
      id="statusText"
      class="status-text"
    >
      Conectando con las propiedades.
    </div>

  </div>


  <!-- =====================================================
       MAPTILER SDK
       ===================================================== -->

  <script
    src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"
  ></script>


  <script>

    "use strict";


    /* =====================================================
       CONFIGURACIÓN
       ===================================================== */

    /*
     * CLAVE MAPTILER
     *
     * Sustituye el texto entre comillas por tu Default key.
     *
     * La clave que me proporcionaste debe ir aquí.
     */

    const MAPTILER_KEY =
      "1NdLFdUeZVfKpdAWdd6K";


    maptilersdk.config.apiKey =
      MAPTILER_KEY;


    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const searchInput =
      document.getElementById(
        "searchInput"
      );

    const clearSearch =
      document.getElementById(
        "clearSearch"
      );

    const counter =
      document.getElementById(
        "counter"
      );

    const status =
      document.getElementById(
        "status"
      );

    const statusTitle =
      document.getElementById(
        "statusTitle"
      );

    const statusText =
      document.getElementById(
        "statusText"
      );

    const fitButton =
      document.getElementById(
        "fitButton"
      );

    const locationButton =
      document.getElementById(
        "locationButton"
      );

    const streetsButton =
      document.getElementById(
        "streetsButton"
      );

    const hybridButton =
      document.getElementById(
        "hybridButton"
      );

    const satelliteButton =
      document.getElementById(
        "satelliteButton"
      );

    const terrainButton =
      document.getElementById(
        "terrainButton"
      );


    /* =====================================================
       ESTADO
       ===================================================== */

    let allProperties = [];

    let filteredProperties = [];

    let activeType = "all";

    let currentStyle = "streets";

    let terrainEnabled = false;

    let userMarker = null;


    /* =====================================================
       MAPA
       ===================================================== */

    const map =
      new maptilersdk.Map({

        container: "map",

        style:
          maptilersdk.MapStyle.STREETS,

        center: [
          -82.3666,
          23.1136
        ],

        zoom: 11,

        pitch: 0,

        maxPitch: 85,

        attributionControl: true,

        navigationControl: false,

        geolocateControl: false

      });


    /* =====================================================
       CONTROLES NATIVOS
       ===================================================== */

    map.addControl(
      new maptilersdk.NavigationControl({
        visualizePitch: true
      }),
      "bottom-right"
    );


    /* =====================================================
       UTILIDADES
       ===================================================== */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    function money(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return "$0";
      }

      const number =
        Number(
          String(value)
            .replace(
              /[$,\s]/g,
              ""
            )
        );

      if (
        !Number.isFinite(number)
      ) {
        return String(value);
      }

      return "$" +
        number.toLocaleString(
          "en-US",
          {
            maximumFractionDigits: 0
          }
        );

    }


    function normalize(value) {

      return String(value ?? "")
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        )
        .toLowerCase()
        .trim();

    }


    function parsePhotos(property) {

      if (
        Array.isArray(
          property.photos
        )
      ) {

        return property.photos
          .filter(Boolean);

      }


      if (
        typeof property.photos ===
        "string"
      ) {

        try {

          const parsed =
            JSON.parse(
              property.photos
            );

          if (
            Array.isArray(parsed)
          ) {

            return parsed
              .filter(Boolean);

          }

        } catch (error) {

          console.warn(
            "NEXO: fotografías inválidas",
            error
          );

        }

      }

      return [];

    }


    /* =====================================================
       ESTADO
       ===================================================== */

    function showStatus(
      title,
      text
    ) {

      statusTitle.textContent =
        title;

      statusText.textContent =
        text;

      status.classList.remove(
        "hidden"
      );

    }


    function hideStatus() {

      status.classList.add(
        "hidden"
      );

    }


    /* =====================================================
       MARCADORES
       ===================================================== */

    const markers = new Map();


    function clearMarkers() {

      markers.forEach(
        marker => {
          marker.remove();
        }
      );

      markers.clear();

    }


    /* =====================================================
       TARJETA
       ===================================================== */

    function buildPropertyCard(
      property
    ) {

      const photos =
        parsePhotos(property);

      const image =
        photos.length
          ? photos[0]
          : "";


      const title =
        property.title ||
        property.property_type ||
        "Propiedad";


      const location =
        [
          property.neighborhood,
          property.city
        ]
          .filter(Boolean)
          .join(" · ");


      const stats = [];


      if (
        property.bedrooms !== null &&
        property.bedrooms !== undefined &&
        property.bedrooms !== ""
      ) {

        stats.push(
          `🛏 ${escapeHTML(
            property.bedrooms
          )}`
        );

      }


      if (
        property.bathrooms !== null &&
        property.bathrooms !== undefined &&
        property.bathrooms !== ""
      ) {

        stats.push(
          `🚿 ${escapeHTML(
            property.bathrooms
          )}`
        );

      }


      if (
        property.square_meters !== null &&
        property.square_meters !== undefined &&
        property.square_meters !== ""
      ) {

        stats.push(
          `${escapeHTML(
            property.square_meters
          )} m²`
        );

      }


      const statsHTML =
        stats.length
          ? `
            <div class="property-stats">

              ${stats
                .map(
                  item =>
                    `
                    <span
                      class="property-stat"
                    >
                      ${item}
                    </span>
                    `
                )
                .join("")}

            </div>
          `
          : "";


      const imageHTML =
        image
          ? `
            <div
              class="property-image"
            >

              <img
                src="${escapeHTML(
                  image
                )}"
                alt="${escapeHTML(
                  title
                )}"
                onerror="
                  this.style.display='none';
                  this.parentElement.textContent='Sin fotografía';
                "
              >

            </div>
          `
          : `
            <div
              class="property-image"
            >
              Sin fotografía
            </div>
          `;


      const addressHTML =
        property.address
          ? `
            <div
              class="property-address"
            >
              📍 ${escapeHTML(
                property.address
              )}
            </div>
          `
          : "";


      return `
        <div
          class="property-card"
        >

          ${imageHTML}

          <div
            class="property-content"
          >

            <div
              class="property-type"
            >
              ${escapeHTML(
                property.property_type ||
                "Propiedad"
              )}
            </div>

            <div
              class="property-title"
            >
              ${escapeHTML(title)}
            </div>

            <div
              class="property-price"
            >
              ${money(
                property.price
              )}
            </div>

            ${
              location
                ? `
                  <div
                    class="property-location"
                  >
                    ${escapeHTML(
                      location
                    )}
                  </div>
                `
                : ""
            }

            ${statsHTML}

            ${addressHTML}

            <button
              type="button"
              class="view-property"
              data-property-id="${Number(
                property.id
              )}"
            >
              Ver propiedad
            </button>

          </div>

        </div>
      `;

    }


    /* =====================================================
       CREAR MARCADOR
       ===================================================== */

    function createMarker(
      property
    ) {

      const latitude =
        Number(
          property.latitude
        );

      const longitude =
        Number(
          property.longitude
        );


      if (
        !Number.isFinite(
          latitude
        ) ||
        !Number.isFinite(
          longitude
        )
      ) {

        return null;

      }


      const element =
        document.createElement(
          "div"
        );


      element.className =
        "nexo-marker";


      const marker =
        new maptilersdk.Marker({
          element,
          anchor: "bottom"
        })
          .setLngLat([
            longitude,
            latitude
          ])
          .setPopup(
            new maptilersdk.Popup({
              offset: 30,
              closeButton: true,
              closeOnClick: true,
              maxWidth: "330px"
            })
              .setHTML(
                buildPropertyCard(
                  property
                )
              )
          )
          .addTo(map);


      markers.set(
        Number(property.id),
        marker
      );


      return marker;

    }


    /* =====================================================
       RENDER MARCADORES
       ===================================================== */

    function renderMarkers() {

      clearMarkers();


      filteredProperties.forEach(
        property => {

          createMarker(
            property
          );

        }
      );


      updateCounter();

    }


    /* =====================================================
       CONTADOR
       ===================================================== */

    function updateCounter() {

      const located =
        filteredProperties.filter(
          property => {

            const lat =
              Number(
                property.latitude
              );

            const lng =
              Number(
                property.longitude
              );

            return (
              Number.isFinite(lat) &&
              Number.isFinite(lng)
            );

          }
        ).length;


      const total =
        filteredProperties.length;


      if (
        total === located
      ) {

        counter.textContent =
          `${total} ${
            total === 1
              ? "propiedad"
              : "propiedades"
          }`;

      } else {

        counter.textContent =
          `${total} propiedades · ${located} ubicadas`;

      }

    }


    /* =====================================================
       AJUSTAR MAPA
       ===================================================== */

    function fitVisibleProperties() {

      const coordinates =
        filteredProperties
          .map(
            property => {

              const lat =
                Number(
                  property.latitude
                );

              const lng =
                Number(
                  property.longitude
                );


              if (
                !Number.isFinite(lat) ||
                !Number.isFinite(lng)
              ) {

                return null;

              }


              return [
                lng,
                lat
              ];

            }
          )
          .filter(Boolean);


      if (
        coordinates.length === 0
      ) {

        map.flyTo({
          center: [
            -82.3666,
            23.1136
          ],
          zoom: 11,
          pitch:
            terrainEnabled
              ? 45
              : 0,
          duration: 900
        });

        return;

      }


      if (
        coordinates.length === 1
      ) {

        map.flyTo({
          center:
            coordinates[0],
          zoom: 15,
          pitch:
            terrainEnabled
              ? 45
              : 0,
          duration: 900
        });

        return;

      }


      const bounds =
        new maptilersdk.LngLatBounds();


      coordinates.forEach(
        coordinate => {

          bounds.extend(
            coordinate
          );

        }
      );


      map.fitBounds(
        bounds,
        {
          padding: {
            top: 170,
            bottom: 120,
            left: 40,
            right: 100
          },

          maxZoom: 16,

          duration: 1000
        }
      );

    }


    /* =====================================================
       FILTROS
       ===================================================== */

    function applyFilters() {

      const search =
        normalize(
          searchInput.value
        );


      filteredProperties =
        allProperties.filter(
          property => {


            if (
              activeType !== "all" &&
              normalize(
                property.property_type
              ) !==
              normalize(
                activeType
              )
            ) {

              return false;

            }


            if (
              !search
            ) {

              return true;

            }


            const searchable =
              [
                property.property_type,
                property.title,
                property.city,
                property.neighborhood,
                property.address,
                property.description
              ]
                .filter(Boolean)
                .map(normalize)
                .join(" ");


            return searchable.includes(
              search
            );

          }
        );


      renderMarkers();


      if (
        filteredProperties.length ===
        0
      ) {

        showStatus(
          "Sin resultados",
          "No encontramos propiedades con esos criterios."
        );

      } else {

        hideStatus();

      }


      fitVisibleProperties();

    }


    /* =====================================================
       BOTONES DE FILTRO
       ===================================================== */

    document
      .querySelectorAll(".filter")
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              document
                .querySelectorAll(
                  ".filter"
                )
                .forEach(
                  item =>
                    item.classList.remove(
                      "active"
                    )
                );


              button.classList.add(
                "active"
              );


              activeType =
                button.dataset.type ||
                "all";


              applyFilters();

            }
          );

        }
      );


    /* =====================================================
       BUSCADOR
       ===================================================== */

    searchInput.addEventListener(
      "input",
      () => {

        clearSearch.classList.toggle(
          "show",
          Boolean(
            searchInput.value.trim()
          )
        );


        applyFilters();

      }
    );


    clearSearch.addEventListener(
      "click",
      () => {

        searchInput.value = "";

        clearSearch.classList.remove(
          "show"
        );

        applyFilters();

        searchInput.focus();

      }
    );


    /* =====================================================
       CAMBIO DE VISTA
       ===================================================== */

    function updateStyleButtons() {

      streetsButton.classList.toggle(
        "active",
        currentStyle === "streets"
      );

      hybridButton.classList.toggle(
        "active",
        currentStyle === "hybrid"
      );

      satelliteButton.classList.toggle(
        "active",
        currentStyle === "satellite"
      );

      terrainButton.classList.toggle(
        "active",
        terrainEnabled
      );

    }


    function changeStyle(
      style
    ) {

      currentStyle =
        style;


      if (
        style === "streets"
      ) {

        map.setStyle(
          maptilersdk.MapStyle.STREETS
        );

      }


      if (
        style === "hybrid"
      ) {

        map.setStyle(
          maptilersdk.MapStyle.HYBRID
        );

      }


      if (
        style === "satellite"
      ) {

        map.setStyle(
          maptilersdk.MapStyle.SATELLITE
        );

      }


      updateStyleButtons();

    }


    streetsButton.addEventListener(
      "click",
      () => {

        changeStyle(
          "streets"
        );

      }
    );


    hybridButton.addEventListener(
      "click",
      () => {

        changeStyle(
          "hybrid"
        );

      }
    );


    satelliteButton.addEventListener(
      "click",
      () => {

        changeStyle(
          "satellite"
        );

      }
    );


    /* =====================================================
       TERRENO 3D
       ===================================================== */

    function setupTerrain() {

      if (
        !map.getSource(
          "nexo-terrain"
        )
      ) {

        map.addSource(
          "nexo-terrain",
          {
            type: "raster-dem",

            url:
              `https://api.maptiler.com/tiles/terrain-rgb-v2/tiles.json?key=${MAPTILER_KEY}`,

            tileSize: 512,

            maxzoom: 14
          }
        );

      }


      map.setTerrain({
        source:
          "nexo-terrain",

        exaggeration: 1.15
      });

    }


    function removeTerrain() {

      try {

        map.setTerrain(
          null
        );

      } catch (
        error
      ) {

        console.warn(
          "NEXO: no se pudo quitar el terreno",
          error
        );

      }

    }


    function toggleTerrain() {

      terrainEnabled =
        !terrainEnabled;


      if (
        terrainEnabled
      ) {

        /*
         * El terreno se configura
         * después de cargar el estilo.
         */

        if (
          map.isStyleLoaded()
        ) {

          setupTerrain();

        }


        map.easeTo({
          pitch: 55,
          bearing: -15,
          duration: 900
        });

      } else {

        removeTerrain();


        map.easeTo({
          pitch: 0,
          bearing: 0,
          duration: 900
        });

      }


      updateStyleButtons();

    }


    terrainButton.addEventListener(
      "click",
      () => {

        toggleTerrain();

      }
    );


    /* =====================================================
       CUANDO CAMBIA EL ESTILO
       ===================================================== */

    map.on(
      "style.load",
      () => {

        if (
          terrainEnabled
        ) {

          setupTerrain();

          map.easeTo({
            pitch: 55,
            bearing: -15,
            duration: 700
          });

        }

      }
    );


    /* =====================================================
       BOTÓN AJUSTAR
       ===================================================== */

    fitButton.addEventListener(
      "click",
      () => {

        fitVisibleProperties();

      }
    );


    /* =====================================================
       MI UBICACIÓN
       ===================================================== */

    locationButton.addEventListener(
      "click",
      () => {

        if (
          !navigator.geolocation
        ) {

          alert(
            "Tu dispositivo no permite obtener la ubicación."
          );

          return;

        }


        locationButton.disabled =
          true;


        navigator.geolocation.getCurrentPosition(

          position => {

            const latitude =
              position.coords.latitude;

            const longitude =
              position.coords.longitude;


            if (
              userMarker
            ) {

              userMarker.remove();

            }


            const element =
              document.createElement(
                "div"
              );


            element.style.width =
              "18px";

            element.style.height =
              "18px";

            element.style.borderRadius =
              "50%";

            element.style.background =
              "#111";

            element.style.border =
              "4px solid white";

            element.style.boxShadow =
              "0 3px 15px rgba(0,0,0,.35)";


            userMarker =
              new maptilersdk.Marker({
                element
              })
                .setLngLat([
                  longitude,
                  latitude
                ])
                .setPopup(
                  new maptilersdk.Popup({
                    offset: 12
                  })
                    .setText(
                      "Tu ubicación"
                    )
                )
                .addTo(map);


            map.flyTo({

              center: [
                longitude,
                latitude
              ],

              zoom: 15,

              pitch:
                terrainEnabled
                  ? 50
                  : 0,

              duration: 1000

            });


            locationButton.disabled =
              false;

          },

          error => {

            console.warn(
              "NEXO ubicación:",
              error
            );


            alert(
              "No se pudo obtener tu ubicación."
            );


            locationButton.disabled =
              false;

          },

          {
            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 60000

          }

        );

      }
    );


    /* =====================================================
       CARGAR PROPIEDADES
       ===================================================== */

    async function loadProperties() {

      showStatus(
        "Cargando propiedades",
        "Conectando con NEXO..."
      );


      try {

        const response =
          await fetch(
            "/api/properties",
            {
              method: "GET",

              headers: {
                "Accept":
                  "application/json"
              },

              cache:
                "no-store"
            }
          );


        const text =
          await response.text();


        let data;


        try {

          data =
            JSON.parse(text);

        } catch {

          throw new Error(
            "La respuesta del servidor no es JSON."
          );

        }


        if (
          !response.ok ||
          data.success === false
        ) {

          throw new Error(
            data.error ||
            `HTTP ${response.status}`
          );

        }


        allProperties =
          Array.isArray(
            data.properties
          )
            ? data.properties
            : [];


        allProperties =
          allProperties.filter(
            property =>
              !property.status ||
              property.status ===
                "available"
          );


        filteredProperties =
          [...allProperties];


        renderMarkers();


        hideStatus();


        const located =
          allProperties.filter(
            property => {

              const lat =
                Number(
                  property.latitude
                );

              const lng =
                Number(
                  property.longitude
                );


              return (
                Number.isFinite(lat) &&
                Number.isFinite(lng)
              );

            }
          );


        if (
          located.length
        ) {

          fitVisibleProperties();

        } else {

          map.flyTo({
            center: [
              -82.3666,
              23.1136
            ],
            zoom: 11,
            duration: 700
          });

        }


      } catch (
        error
      ) {

        console.error(
          "NEXO MAP:",
          error
        );


        showStatus(
          "No se pudieron cargar las propiedades",
          error.message ||
          "Comprueba la conexión con NEXO."
        );


        counter.textContent =
          "Error";

      }

    }


    /* =====================================================
       CLICK EN "VER PROPIEDAD"
       ===================================================== */

    document.addEventListener(
      "click",
      event => {

        const button =
          event.target.closest(
            ".view-property"
          );


        if (
          !button
        ) {

          return;

        }


        const id =
          Number(
            button.dataset.propertyId
          );


        const property =
          allProperties.find(
            item =>
              Number(item.id) ===
              id
          );


        if (
          !property
        ) {

          return;

        }


        const lat =
          Number(
            property.latitude
          );

        const lng =
          Number(
            property.longitude
          );


        if (
          !Number.isFinite(lat) ||
          !Number.isFinite(lng)
        ) {

          return;

        }


        map.flyTo({

          center: [
            lng,
            lat
          ],

          zoom: 17,

          pitch:
            terrainEnabled
              ? 55
              : 0,

          duration: 900

        });

      }
    );


    /* =====================================================
       INICIO
       ===================================================== */

    map.once(
      "load",
      () => {

        loadProperties();

      }
    );


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    window.addEventListener(
      "resize",
      () => {

        map.resize();

      }
    );


  </script>

</body>
