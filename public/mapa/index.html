<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f4f4f2">

  <title>NEXO — Explorar propiedades</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >

  <style>
    :root {
      --bg: #f4f4f2;
      --white: #ffffff;
      --black: #111111;
      --text: #171717;
      --muted: #777777;
      --soft: #f0f0ee;
      --line: rgba(0,0,0,.08);
      --shadow: 0 12px 40px rgba(0,0,0,.12);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Inter,
        system-ui,
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }

    body {
      overscroll-behavior: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    /* =====================================================
       MAPA
       ===================================================== */

    #map {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: #e6e7e5;
    }

    .leaflet-container {
      font-family: inherit;
      background: #e6e7e5;
    }

    .leaflet-control-zoom {
      border: 0 !important;
      box-shadow: var(--shadow) !important;
      overflow: hidden;
      border-radius: 14px !important;
    }

    .leaflet-control-zoom a {
      width: 40px !important;
      height: 40px !important;
      line-height: 40px !important;

      border: 0 !important;

      background: rgba(255,255,255,.95) !important;
      color: #171717 !important;
    }

    /* =====================================================
       TOPBAR
       ===================================================== */

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;

      z-index: 1000;

      padding:
        calc(12px + env(safe-area-inset-top, 0px))
        14px
        0;

      pointer-events: none;
    }

    .topbar-inner {
      width: min(760px, 100%);
      margin: 0 auto;

      display: flex;
      align-items: center;
      gap: 9px;

      pointer-events: auto;
    }

    .brand {
      flex: 0 0 auto;

      height: 47px;

      display: flex;
      align-items: center;

      padding: 0 16px;

      border-radius: 16px;

      background: rgba(255,255,255,.94);

      border: 1px solid rgba(255,255,255,.7);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 10px 35px rgba(0,0,0,.12);

      color: #111;

      font-size: 18px;
      font-weight: 900;
      letter-spacing: -.08em;
    }

    .search {
      min-width: 0;
      flex: 1;

      height: 47px;

      display: flex;
      align-items: center;

      border-radius: 16px;

      background: rgba(255,255,255,.95);

      border: 1px solid rgba(255,255,255,.7);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 10px 35px rgba(0,0,0,.12);

      overflow: hidden;
    }

    .search-icon {
      width: 42px;

      display: flex;
      justify-content: center;
      align-items: center;

      color: #555;

      font-size: 16px;
    }

    .search input {
      flex: 1;

      width: 100%;
      min-width: 0;

      height: 100%;

      border: 0;
      outline: 0;

      background: transparent;

      color: #111;

      font-size: 13px;
      font-weight: 500;
    }

    .search input::placeholder {
      color: #888;
    }

    .clear-search {
      display: none;

      width: 34px;
      height: 34px;

      margin-right: 6px;

      border-radius: 50%;

      background: #eeeeec;

      color: #555;

      font-size: 18px;
      line-height: 1;
    }

    .clear-search.show {
      display: block;
    }

    /* =====================================================
       FILTROS
       ===================================================== */

    .filters {
      position: fixed;

      top:
        calc(70px + env(safe-area-inset-top, 0px));

      left: 0;
      right: 0;

      z-index: 999;

      padding: 0 14px;

      pointer-events: none;
    }

    .filters-inner {
      width: min(760px, 100%);
      margin: auto;

      display: flex;
      gap: 8px;

      overflow-x: auto;

      padding: 2px 1px 8px;

      scrollbar-width: none;

      pointer-events: auto;
    }

    .filters-inner::-webkit-scrollbar {
      display: none;
    }

    .filter {
      flex: 0 0 auto;

      height: 36px;

      padding: 0 14px;

      border-radius: 999px;

      background: rgba(255,255,255,.94);

      border: 1px solid rgba(0,0,0,.05);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 6px 22px rgba(0,0,0,.08);

      color: #4b4b4b;

      font-size: 11px;
      font-weight: 750;

      transition:
        transform .18s ease,
        background .18s ease,
        color .18s ease;
    }

    .filter:active {
      transform: scale(.95);
    }

    .filter.active {
      background: #111;
      color: #fff;

      border-color: #111;
    }

    /* =====================================================
       CONTADOR
       ===================================================== */

    .counter {
      position: fixed;

      left: 14px;

      bottom:
        calc(18px + env(safe-area-inset-bottom, 0px));

      z-index: 1000;

      padding: 10px 14px;

      border-radius: 999px;

      background: rgba(255,255,255,.94);

      border: 1px solid rgba(255,255,255,.75);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 10px 32px rgba(0,0,0,.12);

      color: #222;

      font-size: 11px;
      font-weight: 800;
    }

    /* =====================================================
       BOTONES
       ===================================================== */

    .map-buttons {
      position: fixed;

      right: 14px;

      bottom:
        calc(18px + env(safe-area-inset-bottom, 0px));

      z-index: 1000;

      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .map-button {
      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 15px;

      background: rgba(255,255,255,.95);

      border: 1px solid rgba(255,255,255,.8);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 10px 32px rgba(0,0,0,.12);

      color: #111;

      font-size: 17px;

      transition:
        transform .18s ease;
    }

    .map-button:active {
      transform: scale(.92);
    }

    .map-button:disabled {
      opacity: .5;
    }

    /* =====================================================
       ESTADO
       ===================================================== */

    .status {
      position: fixed;

      left: 50%;
      top: 50%;

      z-index: 3000;

      width: min(320px, calc(100% - 40px));

      transform: translate(-50%, -50%);

      padding: 22px;

      border-radius: 22px;

      background: rgba(255,255,255,.96);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        0 25px 70px rgba(0,0,0,.18);

      text-align: center;
    }

    .status.hidden {
      display: none;
    }

    .status-title {
      margin-bottom: 6px;

      color: #111;

      font-size: 14px;
      font-weight: 850;
    }

    .status-text {
      color: #777;

      font-size: 12px;
      line-height: 1.5;
    }

    /* =====================================================
       MARCADOR PREMIUM NEXO
       ===================================================== */

    .nexo-pin-wrapper {
      background: transparent !important;
      border: 0 !important;
    }

    .nexo-pin {
      position: relative;

      min-width: 72px;
      height: 34px;

      padding: 0 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111;

      border: 2px solid rgba(255,255,255,.98);

      border-radius: 999px;

      color: #fff;

      font-size: 11px;
      font-weight: 850;

      letter-spacing: -.02em;

      box-shadow:
        0 7px 20px rgba(0,0,0,.28);

      white-space: nowrap;

      transform: translateY(0);

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .nexo-pin::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: -7px;

      width: 13px;
      height: 13px;

      background: #111;

      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;

      transform:
        translateX(-50%)
        rotate(45deg);
    }

    .nexo-pin.selected {
      transform: translateY(-5px) scale(1.05);

      box-shadow:
        0 12px 30px rgba(0,0,0,.34);
    }

    /* =====================================================
       POPUP
       ===================================================== */

    .leaflet-popup {
      margin-bottom: 14px;
    }

    .leaflet-popup-content-wrapper {
      padding: 0;

      border-radius: 22px;

      overflow: hidden;

      background: #fff;

      box-shadow:
        0 18px 55px rgba(0,0,0,.18);
    }

    .leaflet-popup-content {
      width: min(310px, 78vw) !important;

      margin: 0;
    }

    .leaflet-popup-tip {
      box-shadow: none;
    }

    .leaflet-popup-close-button {
      z-index: 10;

      width: 32px !important;
      height: 32px !important;

      top: 9px !important;
      right: 9px !important;

      display: flex !important;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: rgba(255,255,255,.92);

      color: #111 !important;

      font-size: 19px !important;
      line-height: 1 !important;

      box-shadow:
        0 5px 15px rgba(0,0,0,.12);
    }

    /* =====================================================
       TARJETA
       ===================================================== */

    .property-card {
      width: 100%;

      overflow: hidden;

      background: #fff;
    }

    .property-image {
      position: relative;

      width: 100%;
      height: 170px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          #ededeb,
          #d8d8d5
        );

      color: #999;

      font-size: 11px;
    }

    .property-image::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          to top,
          rgba(0,0,0,.16),
          transparent 45%
        );
    }

    .property-image img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }

    .property-content {
      padding: 16px;
    }

    .property-type {
      color: #888;

      font-size: 9px;
      font-weight: 850;

      text-transform: uppercase;

      letter-spacing: .13em;
    }

    .property-title {
      margin-top: 5px;

      color: #111;

      font-size: 20px;
      font-weight: 850;

      letter-spacing: -.055em;

      line-height: 1.05;
    }

    .property-price {
      margin-top: 8px;

      color: #111;

      font-size: 20px;
      font-weight: 850;

      letter-spacing: -.04em;
    }

    .property-location {
      margin-top: 6px;

      color: #777;

      font-size: 11px;

      line-height: 1.45;
    }

    .property-stats {
      display: flex;
      flex-wrap: wrap;

      gap: 6px;

      margin-top: 13px;
    }

    .property-stat {
      padding: 7px 9px;

      border-radius: 999px;

      background: #f1f1ef;

      color: #555;

      font-size: 9px;
      font-weight: 750;
    }

    .property-address {
      margin-top: 11px;

      color: #666;

      font-size: 10px;

      line-height: 1.45;
    }

    .view-property {
      width: 100%;

      margin-top: 14px;

      padding: 12px;

      border-radius: 13px;

      background: #111;

      color: #fff;

      font-size: 11px;
      font-weight: 800;

      transition:
        transform .18s ease;
    }

    .view-property:active {
      transform: scale(.98);
    }

    /* =====================================================
       SIN RESULTADOS
       ===================================================== */

    .empty-marker-message {
      padding: 10px 14px;

      border-radius: 999px;

      background: rgba(255,255,255,.94);

      box-shadow:
        0 10px 30px rgba(0,0,0,.12);

      font-size: 11px;
      font-weight: 750;
    }

    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 600px) {

      .brand {
        height: 45px;
        padding: 0 14px;
        font-size: 17px;
      }

      .search {
        height: 45px;
      }

      .search input {
        font-size: 12px;
      }

      .filters {
        top:
          calc(66px + env(safe-area-inset-top, 0px));
      }

      .property-image {
        height: 150px;
      }

      .leaflet-popup-content {
        width: min(300px, 80vw) !important;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       MAPA
       ===================================================== -->

  <div id="map"></div>

  <!-- =====================================================
       BARRA SUPERIOR
       ===================================================== -->

  <div class="topbar">

    <div class="topbar-inner">

      <div class="brand">
        NEXO
      </div>

      <div class="search">

        <span class="search-icon">
          ⌕
        </span>

        <input
          id="searchInput"
          type="search"
          placeholder="Buscar ciudad, zona o dirección"
          autocomplete="off"
          enterkeyhint="search"
        >

        <button
          id="clearSearch"
          class="clear-search"
          type="button"
          aria-label="Limpiar búsqueda"
        >
          ×
        </button>

      </div>

    </div>

  </div>

  <!-- =====================================================
       FILTROS
       ===================================================== -->

  <div class="filters">

    <div class="filters-inner">

      <button
        class="filter active"
        data-type="all"
        type="button"
      >
        Todas
      </button>

      <button
        class="filter"
        data-type="Casa"
        type="button"
      >
        Casas
      </button>

      <button
        class="filter"
        data-type="Apartamento"
        type="button"
      >
        Apartamentos
      </button>

      <button
        class="filter"
        data-type="Villa"
        type="button"
      >
        Villas
      </button>

      <button
        class="filter"
        data-type="Terreno"
        type="button"
      >
        Terrenos
      </button>

      <button
        class="filter"
        data-type="Local"
        type="button"
      >
        Locales
      </button>

    </div>

  </div>

  <!-- =====================================================
       CONTADOR
       ===================================================== -->

  <div
    id="counter"
    class="counter"
  >
    Cargando...
  </div>

  <!-- =====================================================
       BOTONES
       ===================================================== -->

  <div class="map-buttons">

    <button
      id="fitButton"
      class="map-button"
      type="button"
      title="Mostrar propiedades"
      aria-label="Mostrar propiedades"
    >
      ⛶
    </button>

    <button
      id="locationButton"
      class="map-button"
      type="button"
      title="Mi ubicación"
      aria-label="Mi ubicación"
    >
      ◎
    </button>

  </div>

  <!-- =====================================================
       ESTADO
       ===================================================== -->

  <div
    id="status"
    class="status"
  >

    <div
      id="statusTitle"
      class="status-title"
    >
      Cargando NEXO...
    </div>

    <div
      id="statusText"
      class="status-text"
    >
      Buscando propiedades.
    </div>

  </div>

  <!-- =====================================================
       LEAFLET
       ===================================================== -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <script>
    "use strict";

    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const mapElement =
      document.getElementById("map");

    const searchInput =
      document.getElementById("searchInput");

    const clearSearch =
      document.getElementById("clearSearch");

    const counter =
      document.getElementById("counter");

    const status =
      document.getElementById("status");

    const statusTitle =
      document.getElementById("statusTitle");

    const statusText =
      document.getElementById("statusText");

    const fitButton =
      document.getElementById("fitButton");

    const locationButton =
      document.getElementById("locationButton");

    /* =====================================================
       ESTADO
       ===================================================== */

    let allProperties = [];
    let filteredProperties = [];

    let activeType = "all";

    let selectedMarker = null;

    /* =====================================================
       MAPA
       ===================================================== */

    const map =
      L.map(
        mapElement,
        {
          zoomControl: false,
          preferCanvas: true,

          /*
           * Evita que Leaflet intente
           * alejar demasiado el mapa.
           */

          minZoom: 6,
          maxZoom: 19
        }
      );

    L.control.zoom({
      position: "bottomright"
    }).addTo(map);

    /*
     * IMPORTANTE:
     * NEXO inicia en Cuba.
     *
     * No hacemos fitBounds() antes
     * de tener propiedades válidas.
     */

    map.setView(
      [23.1136, -82.3666],
      11
    );

    const tileLayer =
      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19,

          attribution:
            '&copy; OpenStreetMap contributors'
        }
      );

    tileLayer.addTo(map);

    /* =====================================================
       CAPA DE MARCADORES
       ===================================================== */

    const markerLayer =
      L.layerGroup().addTo(map);

    /* =====================================================
       UTILIDADES
       ===================================================== */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function normalize(value) {

      return String(value ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    function money(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return "$0";
      }

      const number =
        Number(
          String(value)
            .replace(/[$,\s]/g, "")
        );

      if (!Number.isFinite(number)) {
        return String(value);
      }

      return "$" +
        number.toLocaleString(
          "en-US",
          {
            maximumFractionDigits: 0
          }
        );
    }

    function shortMoney(value) {

      const number =
        Number(
          String(value ?? "")
            .replace(/[$,\s]/g, "")
        );

      if (!Number.isFinite(number)) {
        return "";
      }

      if (number >= 1000000) {

        return "$" +
          (number / 1000000)
            .toFixed(
              number % 1000000 === 0
                ? 0
                : 1
            ) +
          "M";
      }

      if (number >= 1000) {

        return "$" +
          (number / 1000)
            .toFixed(
              number % 1000 === 0
                ? 0
                : 0
            ) +
          "K";
      }

      return "$" +
        number.toLocaleString(
          "en-US"
        );
    }

    function parsePhotos(property) {

      if (
        Array.isArray(property.photos)
      ) {

        return property.photos
          .filter(Boolean);

      }

      if (
        typeof property.photos ===
        "string"
      ) {

        try {

          const parsed =
            JSON.parse(
              property.photos
            );

          if (
            Array.isArray(parsed)
          ) {

            return parsed
              .filter(Boolean);

          }

        } catch (error) {

          console.warn(
            "NEXO: fotografías inválidas",
            error
          );

        }
      }

      return [];
    }

    function hasCoordinates(property) {

      const latitude =
        Number(property.latitude);

      const longitude =
        Number(property.longitude);

      return (
        Number.isFinite(latitude) &&
        Number.isFinite(longitude)
      );
    }

    /* =====================================================
       ESTADO
       ===================================================== */

    function showStatus(
      title,
      text
    ) {

      statusTitle.textContent =
        title;

      statusText.textContent =
        text;

      status.classList.remove(
        "hidden"
      );
    }

    function hideStatus() {

      status.classList.add(
        "hidden"
      );
    }

    /* =====================================================
       ICONO PREMIUM
       ===================================================== */

    function createNexoIcon(property) {

      const price =
        shortMoney(property.price);

      const label =
        price ||
        "NEXO";

      return L.divIcon({

        className:
          "nexo-pin-wrapper",

        html:
          `
          <div class="nexo-pin">
            ${escapeHTML(label)}
          </div>
          `,

        iconSize:
          [90, 46],

        iconAnchor:
          [45, 40],

        popupAnchor:
          [0, -38]
      });
    }

    /* =====================================================
       TARJETA
       ===================================================== */

    function buildPropertyCard(
      property
    ) {

      const photos =
        parsePhotos(property);

      const image =
        photos.length
          ? photos[0]
          : "";

      const title =
        property.title ||
        property.property_type ||
        "Propiedad";

      const location =
        [
          property.neighborhood,
          property.city
        ]
          .filter(Boolean)
          .join(" · ");

      const stats = [];

      if (
        property.bedrooms !== null &&
        property.bedrooms !== undefined &&
        property.bedrooms !== ""
      ) {

        stats.push(
          `🛏 ${escapeHTML(property.bedrooms)}`
        );

      }

      if (
        property.bathrooms !== null &&
        property.bathrooms !== undefined &&
        property.bathrooms !== ""
      ) {

        stats.push(
          `🚿 ${escapeHTML(property.bathrooms)}`
        );

      }

      if (
        property.square_meters !== null &&
        property.square_meters !== undefined &&
        property.square_meters !== ""
      ) {

        stats.push(
          `${escapeHTML(property.square_meters)} m²`
        );

      }

      const statsHTML =
        stats.length
          ? `
            <div class="property-stats">
              ${
                stats
                  .map(
                    item =>
                      `
                      <span class="property-stat">
                        ${item}
                      </span>
                      `
                  )
                  .join("")
              }
            </div>
          `
          : "";

      const imageHTML =
        image
          ? `
            <div class="property-image">

              <img
                src="${escapeHTML(image)}"
                alt="${escapeHTML(title)}"
                loading="lazy"
                onerror="
                  this.style.display='none';
                  this.parentElement.textContent='Sin fotografía';
                "
              >

            </div>
          `
          : `
            <div class="property-image">
              Sin fotografía
            </div>
          `;

      const addressHTML =
        property.address
          ? `
            <div class="property-address">
              📍 ${escapeHTML(property.address)}
            </div>
          `
          : "";

      return `
        <div class="property-card">

          ${imageHTML}

          <div class="property-content">

            <div class="property-type">
              ${escapeHTML(
                property.property_type ||
                "Propiedad"
              )}
            </div>

            <div class="property-title">
              ${escapeHTML(title)}
            </div>

            <div class="property-price">
              ${money(property.price)}
            </div>

            ${
              location
                ? `
                  <div class="property-location">
                    ${escapeHTML(location)}
                  </div>
                `
                : ""
            }

            ${statsHTML}

            ${addressHTML}

            <button
              type="button"
              class="view-property"
              onclick="openProperty(${Number(property.id)})"
            >
              Ver propiedad
            </button>

          </div>

        </div>
      `;
    }

    /* =====================================================
       ABRIR PROPIEDAD
       ===================================================== */

    window.openProperty =
      function(id) {

        const property =
          allProperties.find(
            item =>
              Number(item.id) ===
              Number(id)
          );

        if (!property) {
          return;
        }

        if (!hasCoordinates(property)) {
          return;
        }

        const latitude =
          Number(property.latitude);

        const longitude =
          Number(property.longitude);

        map.setView(
          [latitude, longitude],
          Math.max(
            map.getZoom(),
            16
          ),
          {
            animate: true
          }
        );

        /*
         * Buscar el marcador correspondiente
         * y abrirlo.
         */

        markerLayer.eachLayer(
          marker => {

            if (
              Number(marker.propertyId) ===
              Number(id)
            ) {

              selectedMarker =
                marker;

              marker.openPopup();

            }

          }
        );
      };

    /* =====================================================
       MARCADORES
       ===================================================== */

    function renderMarkers() {

      markerLayer.clearLayers();

      selectedMarker = null;

      let validCount = 0;

      filteredProperties.forEach(
        property => {

          if (
            !hasCoordinates(property)
          ) {
            return;
          }

          validCount++;

          const latitude =
            Number(property.latitude);

          const longitude =
            Number(property.longitude);

          const marker =
            L.marker(
              [
                latitude,
                longitude
              ],
              {
                icon:
                  createNexoIcon(
                    property
                  ),
                riseOnHover: true
              }
            );

          marker.propertyId =
            Number(property.id);

          marker.bindPopup(
            buildPropertyCard(
              property
            ),
            {
              maxWidth: 320,
              closeButton: true,
              autoPan: true,
              autoPanPaddingTopLeft:
                [25, 145],
              autoPanPaddingBottomRight:
                [25, 100]
            }
          );

          marker.on(
            "click",
            () => {

              selectedMarker =
                marker;

            }
          );

          marker.on(
            "popupclose",
            () => {

              if (
                selectedMarker ===
                marker
              ) {

                selectedMarker =
                  null;

              }

            }
          );

          marker.addTo(
            markerLayer
          );

        }
      );

      updateCounter(
        filteredProperties.length,
        validCount
      );

    }

    /* =====================================================
       AJUSTAR MAPA
       ===================================================== */

    function fitVisibleProperties() {

      const coordinates =
        filteredProperties
          .map(property => {

            if (
              !hasCoordinates(property)
            ) {
              return null;
            }

            return [
              Number(property.latitude),
              Number(property.longitude)
            ];

          })
          .filter(Boolean);

      /*
       * Nunca hacemos fitBounds()
       * con cero coordenadas.
       */

      if (
        coordinates.length === 0
      ) {

        map.setView(
          [23.1136, -82.3666],
          11,
          {
            animate: true
          }
        );

        return;
      }

      /*
       * Una sola propiedad.
       */

      if (
        coordinates.length === 1
      ) {

        map.setView(
          coordinates[0],
          15,
          {
            animate: true
          }
        );

        return;
      }

      /*
       * Varias propiedades.
       */

      const bounds =
        L.latLngBounds(
          coordinates
        );

      map.fitBounds(
        bounds,
        {
          paddingTopLeft:
            [30, 155],

          paddingBottomRight:
            [30, 115],

          maxZoom: 15,

          animate: true
        }
      );

    }

    /* =====================================================
       CONTADOR
       ===================================================== */

    function updateCounter(
      total,
      located
    ) {

      if (
        total === located
      ) {

        counter.textContent =
          `${total} ${
            total === 1
              ? "propiedad"
              : "propiedades"
          }`;

        return;
      }

      counter.textContent =
        `${total} ${
          total === 1
            ? "propiedad"
            : "propiedades"
        } · ${located} ubicadas`;
    }

    /* =====================================================
       FILTROS
       ===================================================== */

    function applyFilters() {

      const search =
        normalize(
          searchInput.value
        );

      filteredProperties =
        allProperties.filter(
          property => {

            /*
             * TIPO
             */

            if (
              activeType !== "all" &&
              normalize(
                property.property_type
              ) !==
              normalize(activeType)
            ) {

              return false;

            }

            /*
             * BUSCADOR
             */

            if (!search) {
              return true;
            }

            const searchable =
              [
                property.property_type,
                property.title,
                property.city,
                property.neighborhood,
                property.address,
                property.description
              ]
                .filter(Boolean)
                .map(normalize)
                .join(" ");

            return searchable.includes(
              search
            );

          }
        );

      renderMarkers();

      /*
       * Si no hay resultados,
       * no alteramos innecesariamente
       * la posición del mapa.
       */

      if (
        filteredProperties.length === 0
      ) {

        showStatus(
          "Sin resultados",
          "No encontramos propiedades con esos criterios."
        );

        return;
      }

      hideStatus();

      fitVisibleProperties();

    }

    /* =====================================================
       FILTROS DE TIPO
       ===================================================== */

    document
      .querySelectorAll(".filter")
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              document
                .querySelectorAll(".filter")
                .forEach(
                  item =>
                    item.classList.remove(
                      "active"
                    )
                );

              button.classList.add(
                "active"
              );

              activeType =
                button.dataset.type ||
                "all";

              applyFilters();

            }
          );

        }
      );

    /* =====================================================
       BUSCADOR
       ===================================================== */

    searchInput.addEventListener(
      "input",
      () => {

        clearSearch.classList.toggle(
          "show",
          Boolean(
            searchInput.value.trim()
          )
        );

        applyFilters();

      }
    );

    clearSearch.addEventListener(
      "click",
      () => {

        searchInput.value = "";

        clearSearch.classList.remove(
          "show"
        );

        applyFilters();

        searchInput.focus();

      }
    );

    /* =====================================================
       BOTÓN AJUSTAR
       ===================================================== */

    fitButton.addEventListener(
      "click",
      () => {

        /*
         * Si no existen propiedades,
         * volvemos simplemente a Cuba.
         */

        if (
          !filteredProperties.length
        ) {

          map.setView(
            [23.1136, -82.3666],
            11,
            {
              animate: true
            }
          );

          return;
        }

        fitVisibleProperties();

      }
    );

    /* =====================================================
       UBICACIÓN DEL USUARIO
       ===================================================== */

    let userLocationMarker =
      null;

    locationButton.addEventListener(
      "click",
      () => {

        if (
          !navigator.geolocation
        ) {

          alert(
            "Tu dispositivo no permite obtener la ubicación."
          );

          return;
        }

        locationButton.disabled =
          true;

        navigator.geolocation.getCurrentPosition(

          position => {

            const latitude =
              position.coords.latitude;

            const longitude =
              position.coords.longitude;

            /*
             * Eliminar ubicación anterior.
             */

            if (
              userLocationMarker
            ) {

              map.removeLayer(
                userLocationMarker
              );

            }

            userLocationMarker =
              L.circleMarker(
                [
                  latitude,
                  longitude
                ],
                {
                  radius: 8,
                  weight: 3
                }
              )
                .addTo(map)
                .bindPopup(
                  "Tu ubicación"
                );

            map.setView(
              [
                latitude,
                longitude
              ],
              15,
              {
                animate: true
              }
            );

            userLocationMarker.openPopup();

            locationButton.disabled =
              false;

          },

          error => {

            console.warn(
              "NEXO ubicación:",
              error
            );

            alert(
              "No se pudo obtener tu ubicación."
            );

            locationButton.disabled =
              false;

          },

          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 60000
          }

        );

      }
    );

    /* =====================================================
       CARGAR PROPIEDADES
       ===================================================== */

    async function loadProperties() {

      showStatus(
        "Cargando NEXO",
        "Conectando con las propiedades..."
      );

      try {

        const response =
          await fetch(
            "/api/properties",
            {
              method: "GET",

              headers: {
                "Accept":
                  "application/json"
              },

              cache:
                "no-store"
            }
          );

        const text =
          await response.text();

        let data;

        try {

          data =
            JSON.parse(text);

        } catch {

          throw new Error(
            "La respuesta del servidor no es JSON."
          );

        }

        if (
          !response.ok ||
          data.success === false
        ) {

          throw new Error(
            data.error ||
            `HTTP ${response.status}`
          );

        }

        allProperties =
          Array.isArray(
            data.properties
          )
            ? data.properties
            : [];

        /*
         * Solo propiedades disponibles.
         */

        allProperties =
          allProperties.filter(
            property =>
              !property.status ||
              property.status ===
                "available"
          );

        filteredProperties =
          [
            ...allProperties
          ];

        renderMarkers();

        /*
         * Ocultamos el estado.
         */

        hideStatus();

        /*
         * Buscar propiedades con
         * coordenadas válidas.
         */

        const located =
          allProperties.filter(
            property =>
              hasCoordinates(property)
          );

        /*
         * Si existen coordenadas:
         *
         * - una propiedad: acercar;
         * - varias: encuadrar;
         *
         * Si no existen:
         * permanecer en Cuba.
         */

        if (
          located.length > 0
        ) {

          fitVisibleProperties();

        } else {

          map.setView(
            [23.1136, -82.3666],
            11
          );

        }

      } catch (error) {

        console.error(
          "NEXO MAP:",
          error
        );

        counter.textContent =
          "Error";

        showStatus(
          "No se pudieron cargar las propiedades",
          error.message ||
          "Comprueba la conexión con NEXO."
        );

      }

    }

    /* =====================================================
       INICIO
       ===================================================== */

    loadProperties();

    /*
     * Leaflet puede calcular mal el tamaño
     * si el contenedor acaba de aparecer.
     */

    setTimeout(
      () => {

        map.invalidateSize(
          true
        );

      },
      300
    );

    setTimeout(
      () => {

        map.invalidateSize(
          true
        );

      },
      1000
    );

    window.addEventListener(
      "resize",
      () => {

        map.invalidateSize(
          true
        );

      }
    );

  </script>

</body>
</html>
