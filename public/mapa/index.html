<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f5f5f7">

  <title>NEXO — Mapa</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >

  <style>
    :root {
      --bg: #f5f5f7;
      --white: #ffffff;
      --black: #111111;
      --text: #171717;
      --muted: #777777;
      --border: rgba(0,0,0,.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Inter,
        system-ui,
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    /* =====================================================
       MAPA
       ===================================================== */

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #e9ecef;
    }

    .leaflet-container {
      width: 100%;
      height: 100%;
      font-family: inherit;
      background: #e9ecef;
    }

    .leaflet-control-attribution {
      font-size: 8px;
      opacity: .75;
    }

    /* =====================================================
       BARRA SUPERIOR
       ===================================================== */

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;

      z-index: 1000;

      padding:
        calc(12px + env(safe-area-inset-top, 0px))
        14px
        12px;

      pointer-events: none;
    }

    .topbar-inner {
      width: min(760px, 100%);
      margin: auto;

      display: flex;
      align-items: center;
      gap: 10px;

      pointer-events: auto;
    }

    .brand {
      flex: 0 0 auto;

      padding: 12px 15px;

      border-radius: 16px;

      background: rgba(255,255,255,.94);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        0 8px 30px rgba(0,0,0,.10);

      font-size: 17px;
      font-weight: 850;
      letter-spacing: -.06em;
    }

    .search {
      flex: 1;
      min-width: 0;

      display: flex;
      align-items: center;

      background: rgba(255,255,255,.95);

      border-radius: 16px;

      box-shadow:
        0 8px 30px rgba(0,0,0,.10);

      overflow: hidden;
    }

    .search-icon {
      padding-left: 14px;
      font-size: 16px;
    }

    .search input {
      width: 100%;

      padding: 13px 12px;

      border: 0;
      outline: 0;

      background: transparent;

      color: #111;
      font-size: 13px;
    }

    .clear-search {
      display: none;

      width: 36px;
      height: 36px;

      margin-right: 4px;

      border-radius: 50%;

      background: #eeeeef;

      color: #555;

      font-size: 15px;
    }

    .clear-search.show {
      display: block;
    }

    /* =====================================================
       FILTROS
       ===================================================== */

    .filters {
      position: fixed;

      top:
        calc(70px + env(safe-area-inset-top, 0px));

      left: 0;
      right: 0;

      z-index: 999;

      padding: 0 14px;

      pointer-events: none;
    }

    .filters-inner {
      width: min(760px, 100%);
      margin: auto;

      display: flex;
      gap: 8px;

      overflow-x: auto;

      scrollbar-width: none;

      pointer-events: auto;
    }

    .filters-inner::-webkit-scrollbar {
      display: none;
    }

    .filter {
      flex: 0 0 auto;

      padding: 10px 13px;

      border-radius: 999px;

      border: 1px solid rgba(0,0,0,.06);

      background: rgba(255,255,255,.94);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      color: #444;

      font-size: 11px;
      font-weight: 700;

      box-shadow:
        0 5px 20px rgba(0,0,0,.07);
    }

    .filter.active {
      background: #111;
      color: #fff;
    }

    /* =====================================================
       CONTADOR
       ===================================================== */

    .counter {
      position: fixed;

      left: 14px;

      bottom:
        calc(18px + env(safe-area-inset-bottom, 0px));

      z-index: 1000;

      padding: 10px 14px;

      border-radius: 999px;

      background: rgba(255,255,255,.95);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 8px 30px rgba(0,0,0,.12);

      font-size: 11px;
      font-weight: 750;
    }

    /* =====================================================
       BOTONES
       ===================================================== */

    .map-buttons {
      position: fixed;

      right: 14px;

      bottom:
        calc(18px + env(safe-area-inset-bottom, 0px));

      z-index: 1000;

      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .map-button {
      width: 44px;
      height: 44px;

      border-radius: 15px;

      background: rgba(255,255,255,.96);

      box-shadow:
        0 8px 30px rgba(0,0,0,.12);

      font-size: 17px;

      transition:
        transform .15s ease,
        opacity .15s ease;
    }

    .map-button:active {
      transform: scale(.94);
    }

    .map-button:disabled {
      opacity: .5;
    }

    /* =====================================================
       ESTADO
       ===================================================== */

    .status {
      position: fixed;

      left: 50%;
      top: 50%;

      z-index: 2000;

      transform: translate(-50%, -50%);

      width: min(320px, calc(100% - 40px));

      padding: 20px;

      border-radius: 20px;

      background: rgba(255,255,255,.97);

      box-shadow:
        0 20px 60px rgba(0,0,0,.16);

      text-align: center;

      font-size: 13px;
      line-height: 1.5;
    }

    .status.hidden {
      display: none;
    }

    .status-title {
      font-weight: 800;
      margin-bottom: 5px;
    }

    .status-text {
      color: #777;
    }

    /* =====================================================
       POPUP
       ===================================================== */

    .leaflet-popup-content-wrapper {
      padding: 0;

      border-radius: 20px;

      overflow: hidden;

      box-shadow:
        0 15px 45px rgba(0,0,0,.16);
    }

    .leaflet-popup-content {
      margin: 0;
      width: min(300px, 76vw) !important;
    }

    .leaflet-popup-tip {
      box-shadow: none;
    }

    .property-card {
      overflow: hidden;
      background: #fff;
    }

    .property-image {
      width: 100%;
      height: 155px;

      background:
        linear-gradient(
          145deg,
          #e8e8ea,
          #d5d5d8
        );

      display: flex;
      align-items: center;
      justify-content: center;

      color: #999;
      font-size: 11px;
    }

    .property-image img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }

    .property-content {
      padding: 15px;
    }

    .property-type {
      color: #888;

      font-size: 9px;
      font-weight: 800;

      text-transform: uppercase;

      letter-spacing: .1em;
    }

    .property-title {
      margin-top: 5px;

      font-size: 18px;
      font-weight: 800;

      letter-spacing: -.045em;
    }

    .property-price {
      margin-top: 7px;

      font-size: 19px;
      font-weight: 800;
    }

    .property-location {
      margin-top: 6px;

      color: #777;

      font-size: 11px;
      line-height: 1.45;
    }

    .property-stats {
      display: flex;
      flex-wrap: wrap;

      gap: 6px;

      margin-top: 12px;
    }

    .property-stat {
      padding: 6px 8px;

      border-radius: 999px;

      background: #f1f1f3;

      color: #555;

      font-size: 9px;
      font-weight: 700;
    }

    .property-address {
      margin-top: 11px;

      color: #666;

      font-size: 10px;
      line-height: 1.4;
    }

    .view-property {
      width: 100%;

      margin-top: 13px;

      padding: 11px;

      border-radius: 12px;

      background: #111;
      color: #fff;

      font-size: 11px;
      font-weight: 750;
    }

    /* =====================================================
       MARCADOR NEXO
       ===================================================== */

    .nexo-marker {
      position: relative;

      width: 34px;
      height: 34px;

      border-radius:
        50% 50% 50% 0;

      background: #111;

      border: 3px solid #fff;

      transform: rotate(-45deg);

      box-shadow:
        0 5px 15px rgba(0,0,0,.25);
    }

    .nexo-marker::after {
      content: "";

      position: absolute;

      width: 9px;
      height: 9px;

      left: 9px;
      top: 9px;

      border-radius: 50%;

      background: #fff;
    }

    /* =====================================================
       MÓVIL
       ===================================================== */

    @media(max-width:600px) {

      .brand {
        padding: 11px 13px;
        font-size: 16px;
      }

      .search input {
        font-size: 12px;
      }

      .filters {
        top:
          calc(65px + env(safe-area-inset-top, 0px));
      }

      .property-image {
        height: 145px;
      }
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <!-- =====================================================
       BARRA SUPERIOR
       ===================================================== -->

  <div class="topbar">

    <div class="topbar-inner">

      <div class="brand">
        NEXO
      </div>

      <div class="search">

        <span class="search-icon">
          🔎
        </span>

        <input
          id="searchInput"
          type="search"
          placeholder="Buscar ciudad, zona o dirección"
          autocomplete="off"
        >

        <button
          id="clearSearch"
          class="clear-search"
          type="button"
          aria-label="Limpiar búsqueda"
        >
          ×
        </button>

      </div>

    </div>

  </div>

  <!-- =====================================================
       FILTROS
       ===================================================== -->

  <div class="filters">

    <div class="filters-inner">

      <button
        class="filter active"
        data-type="all"
        type="button"
      >
        Todas
      </button>

      <button
        class="filter"
        data-type="Casa"
        type="button"
      >
        Casas
      </button>

      <button
        class="filter"
        data-type="Apartamento"
        type="button"
      >
        Apartamentos
      </button>

      <button
        class="filter"
        data-type="Villa"
        type="button"
      >
        Villas
      </button>

      <button
        class="filter"
        data-type="Terreno"
        type="button"
      >
        Terrenos
      </button>

      <button
        class="filter"
        data-type="Local"
        type="button"
      >
        Locales
      </button>

    </div>

  </div>

  <!-- =====================================================
       CONTADOR
       ===================================================== -->

  <div
    id="counter"
    class="counter"
  >
    Cargando...
  </div>

  <!-- =====================================================
       BOTONES
       ===================================================== -->

  <div class="map-buttons">

    <button
      id="fitButton"
      class="map-button"
      type="button"
      title="Mostrar propiedades"
      aria-label="Mostrar propiedades"
    >
      ⛶
    </button>

    <button
      id="locationButton"
      class="map-button"
      type="button"
      title="Mi ubicación"
      aria-label="Mi ubicación"
    >
      ⊙
    </button>

  </div>

  <!-- =====================================================
       ESTADO
       ===================================================== -->

  <div
    id="status"
    class="status"
  >

    <div
      id="statusTitle"
      class="status-title"
    >
      Cargando NEXO...
    </div>

    <div
      id="statusText"
      class="status-text"
    >
      Buscando propiedades.
    </div>

  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <script>
    "use strict";

    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const mapElement =
      document.getElementById("map");

    const searchInput =
      document.getElementById("searchInput");

    const clearSearch =
      document.getElementById("clearSearch");

    const counter =
      document.getElementById("counter");

    const status =
      document.getElementById("status");

    const statusTitle =
      document.getElementById("statusTitle");

    const statusText =
      document.getElementById("statusText");

    const fitButton =
      document.getElementById("fitButton");

    const locationButton =
      document.getElementById("locationButton");


    /* =====================================================
       ESTADO
       ===================================================== */

    let allProperties = [];

    let filteredProperties = [];

    let activeType = "all";

    let userLocationMarker = null;


    /* =====================================================
       CONFIGURACIÓN INICIAL
       ===================================================== */

    /*
     * IMPORTANTE:
     *
     * Esta es la posición inicial.
     *
     * El mapa NO hará ningún fitBounds automático
     * al cargar la página.
     *
     * Esto evita que Leaflet termine mostrando
     * solamente el océano.
     */

    const NEXO_INITIAL_CENTER = [
      23.1136,
      -82.3666
    ];

    const NEXO_INITIAL_ZOOM = 11;


    /* =====================================================
       CREAR MAPA
       ===================================================== */

    const map =
      L.map(
        mapElement,
        {
          zoomControl: false,
          preferCanvas: true,
          worldCopyJump: false,
          minZoom: 6,
          maxZoom: 19
        }
      );


    L.control.zoom({
      position: "bottomright"
    }).addTo(map);


    /*
     * POSICIÓN INICIAL FIJA.
     */

    map.setView(
      NEXO_INITIAL_CENTER,
      NEXO_INITIAL_ZOOM,
      {
        animate: false
      }
    );


    /* =====================================================
       MAPA BASE
       ===================================================== */

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,

        minZoom: 6,

        noWrap: true,

        attribution:
          "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);


    /* =====================================================
       CAPA DE MARCADORES
       ===================================================== */

    const markerLayer =
      L.layerGroup().addTo(map);


    /* =====================================================
       UTILIDADES
       ===================================================== */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function normalize(value) {

      return String(value ?? "")
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        )
        .toLowerCase()
        .trim();

    }


    function money(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return "$0";
      }

      const number =
        Number(
          String(value)
            .replace(
              /[$,\s]/g,
              ""
            )
        );

      if (
        !Number.isFinite(number)
      ) {
        return String(value);
      }

      return "$" +
        number.toLocaleString(
          "en-US",
          {
            maximumFractionDigits: 0
          }
        );

    }


    function validCoordinate(value) {

      return (
        value !== null &&
        value !== undefined &&
        value !== "" &&
        Number.isFinite(
          Number(value)
        )
      );

    }


    function validPropertyCoordinates(
      property
    ) {

      if (!property) {
        return false;
      }

      const lat =
        Number(property.latitude);

      const lng =
        Number(property.longitude);

      /*
       * Validación geográfica.
       *
       * Evita que un dato corrupto
       * mande el mapa a otra parte.
       */

      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
      ) {
        return false;
      }

      if (
        lat < -90 ||
        lat > 90
      ) {
        return false;
      }

      if (
        lng < -180 ||
        lng > 180
      ) {
        return false;
      }

      return true;

    }


    function parsePhotos(property) {

      if (
        Array.isArray(
          property.photos
        )
      ) {

        return property.photos
          .filter(Boolean);

      }


      if (
        typeof property.photos ===
        "string"
      ) {

        try {

          const parsed =
            JSON.parse(
              property.photos
            );

          if (
            Array.isArray(parsed)
          ) {

            return parsed
              .filter(Boolean);

          }

        } catch (error) {

          console.warn(
            "NEXO: fotografías inválidas",
            error
          );

        }

      }

      return [];

    }


    /* =====================================================
       ESTADO VISUAL
       ===================================================== */

    function showStatus(
      title,
      text
    ) {

      statusTitle.textContent =
        title;

      statusText.textContent =
        text;

      status.classList.remove(
        "hidden"
      );

    }


    function hideStatus() {

      status.classList.add(
        "hidden"
      );

    }


    /* =====================================================
       ICONO NEXO
       ===================================================== */

    const nexoIcon =
      L.divIcon(
        {
          className: "",

          html:
            '<div class="nexo-marker"></div>',

          iconSize: [
            34,
            34
          ],

          iconAnchor: [
            17,
            34
          ],

          popupAnchor: [
            0,
            -32
          ]
        }
      );


    /* =====================================================
       TARJETA
       ===================================================== */

    function buildPropertyCard(
      property
    ) {

      const photos =
        parsePhotos(property);

      const image =
        photos.length
          ? photos[0]
          : "";

      const title =
        property.title ||
        property.property_type ||
        "Propiedad";


      const location =
        [
          property.neighborhood,
          property.city
        ]
          .filter(Boolean)
          .join(" · ");


      const stats = [];


      if (
        property.bedrooms !== null &&
        property.bedrooms !== undefined &&
        property.bedrooms !== ""
      ) {

        stats.push(
          `🛏 ${escapeHTML(
            property.bedrooms
          )}`
        );

      }


      if (
        property.bathrooms !== null &&
        property.bathrooms !== undefined &&
        property.bathrooms !== ""
      ) {

        stats.push(
          `🚿 ${escapeHTML(
            property.bathrooms
          )}`
        );

      }


      if (
        property.square_meters !== null &&
        property.square_meters !== undefined &&
        property.square_meters !== ""
      ) {

        stats.push(
          `${escapeHTML(
            property.square_meters
          )} m²`
        );

      }


      const statsHTML =
        stats.length
          ? `
            <div class="property-stats">
              ${stats
                .map(
                  item =>
                    `<span class="property-stat">${item}</span>`
                )
                .join("")}
            </div>
          `
          : "";


      const imageHTML =
        image
          ? `
            <div class="property-image">

              <img
                src="${escapeHTML(image)}"
                alt="${escapeHTML(title)}"
                loading="lazy"
                onerror="
                  this.style.display='none';
                  this.parentElement.textContent='Sin fotografía';
                "
              >

            </div>
          `
          : `
            <div class="property-image">
              Sin fotografía
            </div>
          `;


      const addressHTML =
        property.address
          ? `
            <div class="property-address">
              📍 ${escapeHTML(
                property.address
              )}
            </div>
          `
          : "";


      return `
        <div class="property-card">

          ${imageHTML}

          <div class="property-content">

            <div class="property-type">
              ${escapeHTML(
                property.property_type ||
                "Propiedad"
              )}
            </div>

            <div class="property-title">
              ${escapeHTML(title)}
            </div>

            <div class="property-price">
              ${money(property.price)}
            </div>

            ${
              location
                ? `
                  <div class="property-location">
                    ${escapeHTML(
                      location
                    )}
                  </div>
                `
                : ""
            }

            ${statsHTML}

            ${addressHTML}

            <button
              type="button"
              class="view-property"
              data-property-id="${Number(
                property.id
              )}"
            >
              Ver propiedad
            </button>

          </div>

        </div>
      `;

    }


    /* =====================================================
       ABRIR PROPIEDAD
       ===================================================== */

    window.openProperty =
      function(id) {

        const property =
          allProperties.find(
            item =>
              Number(item.id) ===
              Number(id)
          );

        if (!property) {
          return;
        }

        if (
          !validPropertyCoordinates(
            property
          )
        ) {

          alert(
            "Esta propiedad todavía no tiene una ubicación válida en el mapa."
          );

          return;
        }


        const latitude =
          Number(
            property.latitude
          );

        const longitude =
          Number(
            property.longitude
          );


        map.setView(
          [
            latitude,
            longitude
          ],
          Math.max(
            map.getZoom(),
            16
          ),
          {
            animate: true
          }
        );

      };


    /* =====================================================
       CLICK EN VER PROPIEDAD
       ===================================================== */

    document.addEventListener(
      "click",
      function(event) {

        const button =
          event.target.closest(
            ".view-property"
          );

        if (!button) {
          return;
        }

        const id =
          Number(
            button.dataset.propertyId
          );

        if (
          Number.isFinite(id)
        ) {

          window.openProperty(id);

        }

      }
    );


    /* =====================================================
       MARCADORES
       ===================================================== */

    function renderMarkers() {

      markerLayer.clearLayers();


      filteredProperties.forEach(
        property => {

          if (
            !validPropertyCoordinates(
              property
            )
          ) {

            return;

          }


          const latitude =
            Number(
              property.latitude
            );

          const longitude =
            Number(
              property.longitude
            );


          const marker =
            L.marker(
              [
                latitude,
                longitude
              ],
              {
                icon: nexoIcon
              }
            );


          marker.bindPopup(
            buildPropertyCard(
              property
            ),
            {
              maxWidth: 320,

              closeButton: true,

              autoPan: true,

              autoPanPaddingTopLeft:
                [20, 120],

              autoPanPaddingBottomRight:
                [20, 80]
            }
          );


          marker.addTo(
            markerLayer
          );

        }
      );


      updateCounter();

    }


    /* =====================================================
       CONTADOR
       ===================================================== */

    function updateCounter() {

      const total =
        filteredProperties.length;


      const located =
        filteredProperties.filter(
          validPropertyCoordinates
        ).length;


      if (total === 0) {

        counter.textContent =
          "0 propiedades";

        return;

      }


      if (
        total === located
      ) {

        counter.textContent =
          `${total} ${
            total === 1
              ? "propiedad"
              : "propiedades"
          }`;

      } else {

        counter.textContent =
          `${total} propiedades · ${located} ubicadas`;

      }

    }


    /* =====================================================
       AJUSTAR A PROPIEDADES
       ===================================================== */

    function fitVisibleProperties() {

      const coordinates =
        filteredProperties
          .filter(
            validPropertyCoordinates
          )
          .map(
            property => [
              Number(
                property.latitude
              ),
              Number(
                property.longitude
              )
            ]
          );


      /*
       * NO HAY COORDENADAS
       *
       * Volvemos a Cuba.
       */

      if (
        coordinates.length === 0
      ) {

        map.setView(
          NEXO_INITIAL_CENTER,
          NEXO_INITIAL_ZOOM,
          {
            animate: true
          }
        );

        return;

      }


      /*
       * UNA SOLA PROPIEDAD
       */

      if (
        coordinates.length === 1
      ) {

        map.setView(
          coordinates[0],
          15,
          {
            animate: true
          }
        );

        return;

      }


      /*
       * VARIAS PROPIEDADES
       */

      const bounds =
        L.latLngBounds(
          coordinates
        );


      if (
        !bounds.isValid()
      ) {

        map.setView(
          NEXO_INITIAL_CENTER,
          NEXO_INITIAL_ZOOM,
          {
            animate: true
          }
        );

        return;

      }


      /*
       * Calculamos el centro y los límites.
       */

      const center =
        bounds.getCenter();


      /*
       * Protección adicional:
       *
       * NEXO actualmente trabaja en Cuba.
       * Si por error alguna coordenada corrupta
       * aparece fuera de una zona razonable,
       * NO permitimos que el mapa se vaya
       * al otro lado del mundo.
       */

      const cubaLatMin = 19;
      const cubaLatMax = 24.5;

      const cubaLngMin = -85;
      const cubaLngMax = -73;


      const centerLooksCuban =
        center.lat >= cubaLatMin &&
        center.lat <= cubaLatMax &&
        center.lng >= cubaLngMin &&
        center.lng <= cubaLngMax;


      if (
        !centerLooksCuban
      ) {

        /*
         * Si los datos no parecen corresponder
         * a Cuba, dejamos el mapa en Cuba.
         */

        map.setView(
          NEXO_INITIAL_CENTER,
          NEXO_INITIAL_ZOOM,
          {
            animate: true
          }
        );

        return;

      }


      /*
       * Ajustamos los límites.
       */

      map.fitBounds(
        bounds,
        {
          paddingTopLeft:
            [25, 150],

          paddingBottomRight:
            [25, 100],

          maxZoom: 15,

          animate: true
        }
      );

    }


    /* =====================================================
       FILTROS
       ===================================================== */

    function applyFilters() {

      const search =
        normalize(
          searchInput.value
        );


      filteredProperties =
        allProperties.filter(
          property => {

            /*
             * TIPO
             */

            if (
              activeType !== "all" &&
              normalize(
                property.property_type
              ) !==
              normalize(
                activeType
              )
            ) {

              return false;

            }


            /*
             * BÚSQUEDA
             */

            if (!search) {
              return true;
            }


            const searchable =
              [
                property.property_type,
                property.title,
                property.city,
                property.neighborhood,
                property.address,
                property.description
              ]
                .filter(Boolean)
                .map(normalize)
                .join(" ");


            return searchable.includes(
              search
            );

          }
        );


      renderMarkers();


      /*
       * IMPORTANTE:
       *
       * Solo movemos el mapa cuando el usuario
       * realmente aplica una búsqueda/filtro.
       *
       * NO se ejecuta durante la carga inicial.
       */

      if (
        search ||
        activeType !== "all"
      ) {

        fitVisibleProperties();

      }


      if (
        filteredProperties.length === 0
      ) {

        showStatus(
          "Sin resultados",
          "No encontramos propiedades con esos criterios."
        );

      } else {

        hideStatus();

      }

    }


    /* =====================================================
       BOTONES DE FILTRO
       ===================================================== */

    document
      .querySelectorAll(".filter")
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              document
                .querySelectorAll(
                  ".filter"
                )
                .forEach(
                  item =>
                    item.classList.remove(
                      "active"
                    )
                );


              button.classList.add(
                "active"
              );


              activeType =
                button.dataset.type ||
                "all";


              applyFilters();

            }
          );

        }
      );


    /* =====================================================
       BUSCADOR
       ===================================================== */

    searchInput.addEventListener(
      "input",
      () => {

        clearSearch.classList.toggle(
          "show",
          Boolean(
            searchInput.value.trim()
          )
        );


        applyFilters();

      }
    );


    clearSearch.addEventListener(
      "click",
      () => {

        searchInput.value = "";

        clearSearch.classList.remove(
          "show"
        );

        activeType = "all";


        document
          .querySelectorAll(
            ".filter"
          )
          .forEach(
            item =>
              item.classList.remove(
                "active"
              )
          );


        const allButton =
          document.querySelector(
            '.filter[data-type="all"]'
          );


        if (allButton) {
          allButton.classList.add(
            "active"
          );
        }


        filteredProperties =
          [...allProperties];


        renderMarkers();


        /*
         * Al limpiar la búsqueda
         * regresamos a la posición inicial
         * de Cuba, no al océano.
         */

        map.setView(
          NEXO_INITIAL_CENTER,
          NEXO_INITIAL_ZOOM,
          {
            animate: true
          }
        );


        hideStatus();

        searchInput.focus();

      }
    );


    /* =====================================================
       BOTÓN ⛶
       ===================================================== */

    fitButton.addEventListener(
      "click",
      () => {

        /*
         * Este es el ÚNICO botón que ejecuta
         * el ajuste general.
         */

        fitVisibleProperties();

      }
    );


    /* =====================================================
       MI UBICACIÓN
       ===================================================== */

    locationButton.addEventListener(
      "click",
      () => {

        if (
          !navigator.geolocation
        ) {

          alert(
            "Tu dispositivo no permite obtener la ubicación."
          );

          return;

        }


        locationButton.disabled =
          true;


        navigator.geolocation.getCurrentPosition(

          position => {

            const latitude =
              Number(
                position.coords.latitude
              );

            const longitude =
              Number(
                position.coords.longitude
              );


            if (
              !Number.isFinite(
                latitude
              ) ||
              !Number.isFinite(
                longitude
              )
            ) {

              locationButton.disabled =
                false;

              return;

            }


            /*
             * Si ya existe un marcador
             * de ubicación, lo eliminamos.
             */

            if (
              userLocationMarker
            ) {

              map.removeLayer(
                userLocationMarker
              );

            }


            userLocationMarker =
              L.circleMarker(
                [
                  latitude,
                  longitude
                ],
                {
                  radius: 8,
                  weight: 3
                }
              )
                .addTo(map);


            userLocationMarker.bindPopup(
              "Tu ubicación"
            );


            map.setView(
              [
                latitude,
                longitude
              ],
              15,
              {
                animate: true
              }
            );


            locationButton.disabled =
              false;

          },


          error => {

            console.warn(
              "NEXO ubicación:",
              error
            );


            let message =
              "No se pudo obtener tu ubicación.";


            if (
              error.code ===
              error.PERMISSION_DENIED
            ) {

              message =
                "Permite el acceso a tu ubicación para usar esta función.";

            }


            alert(message);


            locationButton.disabled =
              false;

          },


          {
            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 60000
          }

        );

      }
    );


    /* =====================================================
       CARGAR PROPIEDADES
       ===================================================== */

    async function loadProperties() {

      showStatus(
        "Cargando propiedades",
        "Conectando con NEXO..."
      );


      try {

        const response =
          await fetch(
            "/api/properties",
            {
              method: "GET",

              headers: {
                "Accept":
                  "application/json"
              },

              cache: "no-store"
            }
          );


        const text =
          await response.text();


        let data;


        try {

          data =
            JSON.parse(text);

        } catch {

          throw new Error(
            "La respuesta del servidor no es JSON."
          );

        }


        if (
          !response.ok ||
          data.success === false
        ) {

          throw new Error(
            data.error ||
            `HTTP ${response.status}`
          );

        }


        allProperties =
          Array.isArray(
            data.properties
          )
            ? data.properties
            : [];


        /*
         * Solo propiedades disponibles.
         */

        allProperties =
          allProperties.filter(
            property =>
              !property.status ||
              property.status ===
                "available"
          );


        filteredProperties =
          [
            ...allProperties
          ];


        renderMarkers();


        /*
         * MUY IMPORTANTE:
         *
         * Aquí NO llamamos a fitVisibleProperties().
         *
         * La primera apertura siempre permanece
         * centrada en Cuba.
         */

        map.setView(
          NEXO_INITIAL_CENTER,
          NEXO_INITIAL_ZOOM,
          {
            animate: false
          }
        );


        hideStatus();


        updateCounter();

      } catch (error) {

        console.error(
          "NEXO MAP:",
          error
        );


        /*
         * Aunque falle la API,
         * el mapa permanece en Cuba.
         */

        map.setView(
          NEXO_INITIAL_CENTER,
          NEXO_INITIAL_ZOOM,
          {
            animate: false
          }
        );


        showStatus(
          "No se pudieron cargar las propiedades",
          error.message ||
          "Comprueba la conexión con NEXO."
        );


        counter.textContent =
          "Error";

      }

    }


    /* =====================================================
       INICIALIZACIÓN SEGURA DE LEAFLET
       ===================================================== */

    function refreshMapSize() {

      requestAnimationFrame(
        () => {

          map.invalidateSize(
            {
              pan: false,
              debounceMoveend: true
            }
          );

        }
      );

    }


    /*
     * Primer ajuste después de que
     * el navegador haya pintado el mapa.
     */

    setTimeout(
      refreshMapSize,
      100
    );


    setTimeout(
      refreshMapSize,
      500
    );


    setTimeout(
      refreshMapSize,
      1000
    );


    window.addEventListener(
      "resize",
      refreshMapSize
    );


    window.addEventListener(
      "orientationchange",
      () => {

        setTimeout(
          refreshMapSize,
          250
        );

      }
    );


    /* =====================================================
       ARRANQUE
       ===================================================== */

    loadProperties();

  </script>

</body>
