<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#f5f5f7">
  <title>NEXO — Propiedades</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    :root {
      --bg: #f5f5f7;
      --white: rgba(255,255,255,.94);
      --black: #111;
      --text: #171717;
      --muted: #777;
      --line: rgba(0,0,0,.07);
      --shadow: 0 12px 35px rgba(0,0,0,.12);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Inter,
        system-ui,
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    /* =====================================================
       MAPA
       ===================================================== */

    #map {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .leaflet-container {
      background: #e8eaec;
      font-family: inherit;
    }

    .leaflet-control-zoom {
      display: none;
    }

    .leaflet-control-attribution {
      background: rgba(255,255,255,.72) !important;
      backdrop-filter: blur(10px);
      font-size: 8px;
      border-radius: 8px 0 0 0;
    }

    /* =====================================================
       HEADER
       ===================================================== */

    .header {
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      right: 0;
      padding:
        calc(12px + env(safe-area-inset-top))
        14px
        10px;
      pointer-events: none;
    }

    .header-inner {
      width: min(760px, 100%);
      margin: auto;
      pointer-events: auto;
    }

    .top-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand {
      flex: 0 0 auto;
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      border-radius: 17px;
      background: var(--white);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: var(--shadow);
      font-size: 17px;
      font-weight: 900;
      letter-spacing: .16em;
    }

    .search {
      min-width: 0;
      flex: 1;
      height: 48px;
      display: flex;
      align-items: center;
      border-radius: 17px;
      background: var(--white);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: var(--shadow);
    }

    .search-icon {
      padding-left: 14px;
      color: #777;
      font-size: 16px;
    }

    .search input {
      min-width: 0;
      width: 100%;
      height: 100%;
      padding: 0 10px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #111;
      font-size: 13px;
    }

    .search input::placeholder {
      color: #8b8b8b;
    }

    .clear {
      display: none;
      width: 30px;
      height: 30px;
      margin-right: 8px;
      border-radius: 50%;
      background: #ededee;
      color: #666;
      font-size: 17px;
    }

    .clear.show {
      display: block;
    }

    /* =====================================================
       FILTROS
       ===================================================== */

    .filters {
      margin-top: 9px;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter {
      flex: 0 0 auto;
      padding: 9px 13px;
      border-radius: 999px;
      background: rgba(255,255,255,.91);
      border: 1px solid var(--line);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 6px 20px rgba(0,0,0,.07);
      color: #444;
      font-size: 11px;
      font-weight: 750;
      transition:
        transform .18s ease,
        background .18s ease;
    }

    .filter:active {
      transform: scale(.95);
    }

    .filter.active {
      background: #111;
      color: white;
    }

    /* =====================================================
       CONTROLES
       ===================================================== */

    .controls {
      position: fixed;
      z-index: 1000;
      right: 14px;
      bottom:
        calc(18px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      background: rgba(255,255,255,.95);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      color: #222;
      font-size: 18px;
      transition: transform .18s ease;
    }

    .control:active {
      transform: scale(.91);
    }

    /* =====================================================
       CONTADOR
       ===================================================== */

    .counter {
      position: fixed;
      z-index: 1000;
      left: 14px;
      bottom:
        calc(19px + env(safe-area-inset-bottom));
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.95);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      font-size: 11px;
      font-weight: 800;
    }

    /* =====================================================
       CARGANDO
       ===================================================== */

    .status {
      position: fixed;
      z-index: 2000;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(310px, calc(100% - 40px));
      padding: 22px;
      border-radius: 22px;
      background: rgba(255,255,255,.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 25px 70px rgba(0,0,0,.18);
      text-align: center;
    }

    .status.hidden {
      display: none;
    }

    .status-title {
      font-size: 15px;
      font-weight: 850;
    }

    .status-text {
      margin-top: 6px;
      color: #777;
      font-size: 12px;
      line-height: 1.45;
    }

    /* =====================================================
       MARCADOR PREMIUM
       ===================================================== */

    .nexo-pin-wrap {
      background: transparent;
      border: 0;
    }

    .nexo-pin {
      position: relative;
      width: 42px;
      height: 42px;
      transform: rotate(-45deg);
      border-radius: 50% 50% 50% 0;
      background: #111;
      border: 3px solid white;
      box-shadow:
        0 7px 18px rgba(0,0,0,.28);
    }

    .nexo-pin::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      left: 13px;
      top: 13px;
      border-radius: 50%;
      background: white;
    }

    .nexo-pin::before {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: inherit;
      border: 1px solid rgba(17,17,17,.18);
    }

    /* =====================================================
       POPUP PREMIUM
       ===================================================== */

    .leaflet-popup-content-wrapper {
      padding: 0;
      border-radius: 23px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }

    .leaflet-popup-content {
      width: min(310px, 78vw) !important;
      margin: 0;
    }

    .leaflet-popup-tip {
      box-shadow: none;
    }

    .leaflet-popup-close-button {
      z-index: 5;
      top: 9px !important;
      right: 9px !important;
      width: 30px !important;
      height: 30px !important;
      border-radius: 50%;
      background: rgba(255,255,255,.9) !important;
      color: #111 !important;
      font-size: 20px !important;
      line-height: 28px !important;
      text-align: center;
    }

    .property-card {
      background: white;
      overflow: hidden;
    }

    .property-image {
      position: relative;
      width: 100%;
      height: 174px;
      background: linear-gradient(
        145deg,
        #e7e7e9,
        #d4d4d7
      );
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 11px;
    }

    .property-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .image-overlay {
      position: absolute;
      left: 12px;
      bottom: 12px;
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(0,0,0,.68);
      color: white;
      font-size: 9px;
      font-weight: 800;
      backdrop-filter: blur(10px);
    }

    .property-content {
      padding: 16px;
    }

    .property-type {
      color: #888;
      font-size: 9px;
      font-weight: 850;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .property-title {
      margin-top: 5px;
      font-size: 19px;
      font-weight: 850;
      letter-spacing: -.045em;
    }

    .property-price {
      margin-top: 7px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -.035em;
    }

    .property-location {
      margin-top: 5px;
      color: #777;
      font-size: 11px;
      line-height: 1.4;
    }

    .property-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .property-stat {
      padding: 7px 9px;
      border-radius: 999px;
      background: #f2f2f4;
      color: #555;
      font-size: 9px;
      font-weight: 750;
    }

    .property-address {
      margin-top: 11px;
      color: #666;
      font-size: 10px;
      line-height: 1.4;
    }

    .view-property {
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      border-radius: 13px;
      background: #111;
      color: white;
      font-size: 11px;
      font-weight: 800;
    }

    .view-property:active {
      transform: scale(.98);
    }

    /* =====================================================
       DESKTOP
       ===================================================== */

    @media (min-width: 700px) {
      .header {
        padding-top: 18px;
      }

      .brand {
        height: 52px;
      }

      .search {
        height: 52px;
      }
    }

    /* =====================================================
       MÓVIL
       ===================================================== */

    @media (max-width: 600px) {
      .brand {
        padding: 0 14px;
        font-size: 15px;
      }

      .search input {
        font-size: 12px;
      }

      .property-image {
        height: 155px;
      }
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <!-- =====================================================
       CABECERA
       ===================================================== -->

  <header class="header">

    <div class="header-inner">

      <div class="top-row">

        <div class="brand">
          NEXO
        </div>

        <div class="search">

          <span class="search-icon">⌕</span>

          <input
            id="searchInput"
            type="search"
            placeholder="Buscar ciudad, zona o dirección"
            autocomplete="off"
          >

          <button
            id="clearSearch"
            class="clear"
            type="button"
          >
            ×
          </button>

        </div>

      </div>

      <div class="filters">

        <button
          class="filter active"
          data-type="all"
          type="button"
        >
          Todas
        </button>

        <button
          class="filter"
          data-type="Casa"
          type="button"
        >
          Casas
        </button>

        <button
          class="filter"
          data-type="Apartamento"
          type="button"
        >
          Apartamentos
        </button>

        <button
          class="filter"
          data-type="Villa"
          type="button"
        >
          Villas
        </button>

        <button
          class="filter"
          data-type="Terreno"
          type="button"
        >
          Terrenos
        </button>

        <button
          class="filter"
          data-type="Local"
          type="button"
        >
          Locales
        </button>

      </div>

    </div>

  </header>

  <!-- =====================================================
       CONTADOR
       ===================================================== -->

  <div
    id="counter"
    class="counter"
  >
    Cargando...
  </div>

  <!-- =====================================================
       CONTROLES
       ===================================================== -->

  <div class="controls">

    <button
      id="fitButton"
      class="control"
      type="button"
      aria-label="Mostrar propiedades"
      title="Mostrar propiedades"
    >
      ⛶
    </button>

    <button
      id="locationButton"
      class="control"
      type="button"
      aria-label="Mi ubicación"
      title="Mi ubicación"
    >
      ⊙
    </button>

  </div>

  <!-- =====================================================
       ESTADO
       ===================================================== -->

  <div
    id="status"
    class="status"
  >

    <div
      id="statusTitle"
      class="status-title"
    >
      Cargando NEXO
    </div>

    <div
      id="statusText"
      class="status-text"
    >
      Buscando propiedades...
    </div>

  </div>

  <!-- =====================================================
       LEAFLET
       ===================================================== -->

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    "use strict";

    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const mapElement =
      document.getElementById("map");

    const searchInput =
      document.getElementById("searchInput");

    const clearSearch =
      document.getElementById("clearSearch");

    const counter =
      document.getElementById("counter");

    const status =
      document.getElementById("status");

    const statusTitle =
      document.getElementById("statusTitle");

    const statusText =
      document.getElementById("statusText");

    const fitButton =
      document.getElementById("fitButton");

    const locationButton =
      document.getElementById("locationButton");

    /* =====================================================
       ESTADO
       ===================================================== */

    let allProperties = [];
    let filteredProperties = [];
    let activeType = "all";

    /* =====================================================
       MAPA
       ===================================================== */

    const map = L.map(
      mapElement,
      {
        zoomControl: false,
        preferCanvas: true,
        minZoom: 8,
        maxZoom: 19
      }
    );

    /*
     * IMPORTANTE:
     * Nunca hacemos un fitBounds vacío.
     * Cuba es siempre la vista inicial.
     */

    const CUBA_CENTER = [
      23.1136,
      -82.3666
    ];

    map.setView(
      CUBA_CENTER,
      11
    );

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);

    /* =====================================================
       CAPA DE MARCADORES
       ===================================================== */

    const markerLayer =
      L.layerGroup().addTo(map);

    /* =====================================================
       UTILIDADES
       ===================================================== */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

    function normalize(value) {

      return String(value ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();

    }

    function money(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return "$0";
      }

      const number =
        Number(
          String(value)
            .replace(/[$,\s]/g, "")
        );

      if (!Number.isFinite(number)) {
        return String(value);
      }

      return "$" +
        number.toLocaleString(
          "en-US",
          {
            maximumFractionDigits: 0
          }
        );

    }

    function parsePhotos(property) {

      if (Array.isArray(property.photos)) {
        return property.photos.filter(Boolean);
      }

      if (typeof property.photos === "string") {

        try {

          const parsed =
            JSON.parse(property.photos);

          if (Array.isArray(parsed)) {
            return parsed.filter(Boolean);
          }

        } catch (error) {

          console.warn(
            "NEXO: fotografías inválidas",
            error
          );

        }

      }

      return [];

    }

    /* =====================================================
       ESTADO VISUAL
       ===================================================== */

    function showStatus(title, text) {

      statusTitle.textContent = title;
      statusText.textContent = text;

      status.classList.remove("hidden");

    }

    function hideStatus() {

      status.classList.add("hidden");

    }

    /* =====================================================
       ICONO NEXO
       ===================================================== */

    const nexoIcon =
      L.divIcon({
        className: "nexo-pin-wrap",
        html:
          '<div class="nexo-pin"></div>',
        iconSize: [42, 42],
        iconAnchor: [21, 42],
        popupAnchor: [0, -38]
      });

    /* =====================================================
       TARJETA
       ===================================================== */

    function buildPropertyCard(property) {

      const photos =
        parsePhotos(property);

      const image =
        photos.length
          ? photos[0]
          : "";

      const title =
        property.title ||
        property.property_type ||
        "Propiedad";

      const location =
        [
          property.neighborhood,
          property.city
        ]
          .filter(Boolean)
          .join(" · ");

      const stats = [];

      if (
        property.bedrooms !== null &&
        property.bedrooms !== undefined &&
        property.bedrooms !== ""
      ) {

        stats.push(
          "🛏 " +
          escapeHTML(property.bedrooms)
        );

      }

      if (
        property.bathrooms !== null &&
        property.bathrooms !== undefined &&
        property.bathrooms !== ""
      ) {

        stats.push(
          "🚿 " +
          escapeHTML(property.bathrooms)
        );

      }

      if (
        property.square_meters !== null &&
        property.square_meters !== undefined &&
        property.square_meters !== ""
      ) {

        stats.push(
          escapeHTML(
            property.square_meters
          ) +
          " m²"
        );

      }

      const statsHTML =
        stats.length
          ? `
            <div class="property-stats">
              ${stats.map(
                item =>
                  `<span class="property-stat">${item}</span>`
              ).join("")}
            </div>
          `
          : "";

      const imageHTML =
        image
          ? `
            <div class="property-image">

              <img
                src="${escapeHTML(image)}"
                alt="${escapeHTML(title)}"
                loading="lazy"
                onerror="
                  this.style.display='none';
                  this.parentElement.innerHTML='<span>Sin fotografía</span>';
                "
              >

              <div class="image-overlay">
                NEXO
              </div>

            </div>
          `
          : `
            <div class="property-image">
              Sin fotografía
            </div>
          `;

      const addressHTML =
        property.address
          ? `
            <div class="property-address">
              📍 ${escapeHTML(property.address)}
            </div>
          `
          : "";

      return `
        <div class="property-card">

          ${imageHTML}

          <div class="property-content">

            <div class="property-type">
              ${escapeHTML(
                property.property_type ||
                "Propiedad"
              )}
            </div>

            <div class="property-title">
              ${escapeHTML(title)}
            </div>

            <div class="property-price">
              ${money(property.price)}
            </div>

            ${
              location
                ? `
                  <div class="property-location">
                    ${escapeHTML(location)}
                  </div>
                `
                : ""
            }

            ${statsHTML}

            ${addressHTML}

            <button
              type="button"
              class="view-property"
              onclick="focusProperty(${Number(property.id)})"
            >
              Ver ubicación
            </button>

          </div>

        </div>
      `;

    }

    /* =====================================================
       ENFOCAR PROPIEDAD
       ===================================================== */

    window.focusProperty =
      function(id) {

        const property =
          allProperties.find(
            item =>
              Number(item.id) ===
              Number(id)
          );

        if (!property) return;

        const lat =
          Number(property.latitude);

        const lng =
          Number(property.longitude);

        if (
          !Number.isFinite(lat) ||
          !Number.isFinite(lng)
        ) {
          return;
        }

        map.setView(
          [lat, lng],
          Math.max(map.getZoom(), 16),
          {
            animate: true,
            duration: .5
          }
        );

      };

    /* =====================================================
       MARCADORES
       ===================================================== */

    function renderMarkers() {

      markerLayer.clearLayers();

      filteredProperties.forEach(
        property => {

          const lat =
            Number(property.latitude);

          const lng =
            Number(property.longitude);

          if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lng)
          ) {
            return;
          }

          const marker =
            L.marker(
              [lat, lng],
              {
                icon: nexoIcon
              }
            );

          marker.bindPopup(
            buildPropertyCard(property),
            {
              maxWidth: 320,
              closeButton: true,
              autoPan: true,
              autoPanPaddingTopLeft:
                [20, 130],
              autoPanPaddingBottomRight:
                [20, 100]
            }
          );

          marker.addTo(markerLayer);

        }
      );

      updateCounter();

    }

    /* =====================================================
       AJUSTAR PROPIEDADES
       ===================================================== */

    function fitVisibleProperties() {

      const coordinates =
        filteredProperties
          .map(property => {

            const lat =
              Number(property.latitude);

            const lng =
              Number(property.longitude);

            if (
              !Number.isFinite(lat) ||
              !Number.isFinite(lng)
            ) {
              return null;
            }

            return [lat, lng];

          })
          .filter(Boolean);

      /*
       * Sin coordenadas:
       * jamás hacemos fitBounds.
       */

      if (!coordinates.length) {

        map.setView(
          CUBA_CENTER,
          11,
          {
            animate: true
          }
        );

        return;
      }

      /*
       * Una sola propiedad.
       */

      if (coordinates.length === 1) {

        map.setView(
          coordinates[0],
          15,
          {
            animate: true
          }
        );

        return;
      }

      /*
       * Varias propiedades.
       */

      const bounds =
        L.latLngBounds(
          coordinates
        );

      if (!bounds.isValid()) {

        map.setView(
          CUBA_CENTER,
          11
        );

        return;
      }

      map.fitBounds(
        bounds,
        {
          paddingTopLeft: [30, 170],
          paddingBottomRight: [30, 120],
          maxZoom: 15,
          animate: true
        }
      );

    }

    /* =====================================================
       CONTADOR
       ===================================================== */

    function updateCounter() {

      const total =
        filteredProperties.length;

      const located =
        filteredProperties.filter(
          property => {

            const lat =
              Number(property.latitude);

            const lng =
              Number(property.longitude);

            return (
              Number.isFinite(lat) &&
              Number.isFinite(lng)
            );

          }
        ).length;

      if (total === located) {

        counter.textContent =
          total +
          " " +
          (
            total === 1
              ? "propiedad"
              : "propiedades"
          );

      } else {

        counter.textContent =
          total +
          " propiedades · " +
          located +
          " ubicadas";

      }

    }

    /* =====================================================
       FILTROS
       ===================================================== */

    function applyFilters() {

      const search =
        normalize(
          searchInput.value
        );

      filteredProperties =
        allProperties.filter(
          property => {

            if (
              activeType !== "all" &&
              normalize(
                property.property_type
              ) !== normalize(activeType)
            ) {
              return false;
            }

            if (!search) {
              return true;
            }

            const searchable =
              [
                property.property_type,
                property.title,
                property.city,
                property.neighborhood,
                property.address,
                property.description
              ]
                .filter(Boolean)
                .map(normalize)
                .join(" ");

            return searchable.includes(search);

          }
        );

      renderMarkers();

      /*
       * Solo ajustamos si hay resultados.
       */

      if (filteredProperties.length) {

        fitVisibleProperties();

        hideStatus();

      } else {

        map.setView(
          CUBA_CENTER,
          11,
          {
            animate: true
          }
        );

        showStatus(
          "Sin resultados",
          "No encontramos propiedades con esos criterios."
        );

      }

    }

    /* =====================================================
       FILTROS CLICK
       ===================================================== */

    document
      .querySelectorAll(".filter")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(".filter")
              .forEach(item =>
                item.classList.remove("active")
              );

            button.classList.add("active");

            activeType =
              button.dataset.type ||
              "all";

            applyFilters();

          }
        );

      });

    /* =====================================================
       BÚSQUEDA
       ===================================================== */

    searchInput.addEventListener(
      "input",
      () => {

        clearSearch.classList.toggle(
          "show",
          Boolean(
            searchInput.value.trim()
          )
        );

        applyFilters();

      }
    );

    clearSearch.addEventListener(
      "click",
      () => {

        searchInput.value = "";

        clearSearch.classList.remove(
          "show"
        );

        applyFilters();

        searchInput.focus();

      }
    );

    /* =====================================================
       BOTÓN AJUSTAR
       ===================================================== */

    fitButton.addEventListener(
      "click",
      () => {

        /*
         * Solo ajusta propiedades existentes.
         * Nunca puede mandar el mapa al océano.
         */

        if (
          filteredProperties.length
        ) {

          fitVisibleProperties();

        } else {

          map.setView(
            CUBA_CENTER,
            11,
            {
              animate: true
            }
          );

        }

      }
    );

    /* =====================================================
       UBICACIÓN DEL USUARIO
       ===================================================== */

    let userLocationMarker = null;

    locationButton.addEventListener(
      "click",
      () => {

        if (!navigator.geolocation) {

          alert(
            "Tu dispositivo no permite obtener la ubicación."
          );

          return;
        }

        locationButton.disabled = true;

        navigator.geolocation.getCurrentPosition(

          position => {

            const lat =
              position.coords.latitude;

            const lng =
              position.coords.longitude;

            if (userLocationMarker) {

              map.removeLayer(
                userLocationMarker
              );

            }

            userLocationMarker =
              L.circleMarker(
                [lat, lng],
                {
                  radius: 8,
                  weight: 3
                }
              )
                .addTo(map)
                .bindPopup(
                  "Tu ubicación"
                );

            map.setView(
              [lat, lng],
              15,
              {
                animate: true
              }
            );

            locationButton.disabled =
              false;

          },

          error => {

            console.warn(
              "NEXO ubicación:",
              error
            );

            alert(
              "No se pudo obtener tu ubicación."
            );

            locationButton.disabled =
              false;

          },

          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 60000
          }

        );

      }
    );

    /* =====================================================
       CARGAR PROPIEDADES
       ===================================================== */

    async function loadProperties() {

      showStatus(
        "Cargando NEXO",
        "Conectando con las propiedades..."
      );

      try {

        const response =
          await fetch(
            "/api/properties",
            {
              method: "GET",
              headers: {
                "Accept":
                  "application/json"
              },
              cache: "no-store"
            }
          );

        const text =
          await response.text();

        let data;

        try {

          data =
            JSON.parse(text);

        } catch {

          throw new Error(
            "La respuesta del servidor no es JSON."
          );

        }

        if (
          !response.ok ||
          data.success === false
        ) {

          throw new Error(
            data.error ||
            "No se pudieron cargar las propiedades."
          );

        }

        allProperties =
          Array.isArray(data.properties)
            ? data.properties
            : [];

        allProperties =
          allProperties.filter(
            property =>
              !property.status ||
              property.status === "available"
          );

        filteredProperties =
          [...allProperties];

        renderMarkers();

        hideStatus();

        /*
         * Solo ajustamos si hay propiedades
         * con coordenadas.
         */

        const located =
          allProperties.filter(
            property => {

              const lat =
                Number(property.latitude);

              const lng =
                Number(property.longitude);

              return (
                Number.isFinite(lat) &&
                Number.isFinite(lng)
              );

            }
          );

        if (located.length) {

          fitVisibleProperties();

        } else {

          map.setView(
            CUBA_CENTER,
            11
          );

        }

      } catch (error) {

        console.error(
          "NEXO MAP:",
          error
        );

        showStatus(
          "No se pudieron cargar las propiedades",
          error.message ||
          "Comprueba la conexión con NEXO."
        );

        counter.textContent =
          "Error";

      }

    }

    /* =====================================================
       INICIO
       ===================================================== */

    loadProperties();

    /*
     * Leaflet debe recalcular el tamaño
     * después de cargar la página.
     */

    setTimeout(
      () => {
        map.invalidateSize();
      },
      300
    );

    window.addEventListener(
      "resize",
      () => {
        map.invalidateSize();
      }
    );

  </script>

</body>
</html>
