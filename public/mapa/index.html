<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NEXO | Mapa</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f5f3;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .nexo-status {
      position: fixed;
      top: 15px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      padding: 10px 16px;

      border-radius: 999px;

      background: rgba(255,255,255,.96);
      color: #171717;

      font-size: 13px;
      font-weight: 600;

      box-shadow:
        0 8px 30px rgba(0,0,0,.12);

      backdrop-filter: blur(10px);

      white-space: nowrap;
    }

    .nexo-error {
      display: none;

      position: fixed;

      left: 15px;
      right: 15px;
      bottom: 15px;

      z-index: 10000;

      padding: 14px 16px;

      border-radius: 14px;

      background: #b00020;
      color: white;

      font-size: 14px;
      line-height: 1.4;

      box-shadow:
        0 10px 30px rgba(0,0,0,.25);
    }

    .property-card {
      min-width: 220px;
      max-width: 280px;
    }

    .property-card h3 {
      margin-bottom: 7px;

      font-size: 16px;
      font-weight: 700;

      color: #171717;
    }

    .property-card p {
      margin: 4px 0;

      font-size: 13px;
      color: #666;
    }

    .property-price {
      margin-top: 9px;

      font-size: 15px;
      font-weight: 800;

      color: #171717;
    }

    .property-status {
      display: inline-block;

      margin-top: 8px;
      padding: 4px 8px;

      border-radius: 999px;

      background: #f0f0ed;

      font-size: 11px;
      font-weight: 700;

      color: #555;
    }
  </style>
</head>

<body>

  <div
    id="status"
    class="nexo-status"
  >
    Cargando propiedades...
  </div>

  <div id="map"></div>

  <div
    id="error"
    class="nexo-error"
  ></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <script>
    (() => {

      "use strict";


      // ==========================================
      // ELEMENTOS
      // ==========================================

      const statusElement =
        document.getElementById("status");

      const errorElement =
        document.getElementById("error");


      // ==========================================
      // UTILIDADES
      // ==========================================

      function escapeHtml(value) {

        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");

      }


      function showError(message) {

        console.error(
          "NEXO MAP ERROR:",
          message
        );

        errorElement.textContent =
          message;

        errorElement.style.display =
          "block";

        statusElement.style.display =
          "none";

      }


      function formatPrice(price) {

        if (
          price === null ||
          price === undefined ||
          price === ""
        ) {

          return "";

        }

        const number =
          Number(price);

        if (!Number.isFinite(number)) {

          return String(price);

        }

        return new Intl.NumberFormat(
          "es-ES"
        ).format(number);

      }


      // ==========================================
      // COMPROBAR LEAFLET
      // ==========================================

      if (typeof L === "undefined") {

        showError(
          "No se pudo cargar el sistema del mapa."
        );

        return;

      }


      // ==========================================
      // CREAR MAPA
      // ==========================================

      const map =
        L.map("map").setView(
          [23.1136, -82.3666],
          6
        );


      // ==========================================
      // MAPA BASE
      // ==========================================

      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19,

          attribution:
            "&copy; OpenStreetMap contributors"
        }
      ).addTo(map);


      // ==========================================
      // GRUPO DE MARCADORES
      // ==========================================

      const markers =
        L.layerGroup().addTo(map);


      // ==========================================
      // OBTENER PROPIEDADES DE NEXO
      // ==========================================

      async function loadProperties() {

        try {

          statusElement.textContent =
            "Cargando propiedades...";

          statusElement.style.display =
            "block";

          errorElement.style.display =
            "none";


          const response =
            await fetch(
              "/api/properties",
              {
                method: "GET",

                headers: {
                  "Accept":
                    "application/json"
                },

                credentials:
                  "same-origin"
              }
            );


          if (!response.ok) {

            throw new Error(
              `Error HTTP ${response.status}`
            );

          }


          const data =
            await response.json();


          if (!data.success) {

            throw new Error(
              data.error ||
              "No se pudieron obtener las propiedades."
            );

          }


          const properties =
            Array.isArray(data.properties)
              ? data.properties
              : [];


          // ==========================================
          // LIMPIAR MARCADORES ANTERIORES
          // ==========================================

          markers.clearLayers();


          let visibleProperties =
            0;


          // ==========================================
          // PROCESAR PROPIEDADES
          // ==========================================

          properties.forEach(
            property => {

              const lat =
                Number(
                  property.latitude ??
                  property.lat
                );


              const lng =
                Number(
                  property.longitude ??
                  property.lng
                );


              /*
               * Si todavía no tiene coordenadas,
               * la propiedad se conserva en D1 pero
               * no puede aparecer físicamente
               * en el mapa.
               */

              if (
                !Number.isFinite(lat) ||
                !Number.isFinite(lng)
              ) {

                return;

              }


              visibleProperties++;


              // ========================================
              // MARCADOR
              // ========================================

              const marker =
                L.marker([
                  lat,
                  lng
                ]);


              // ========================================
              // INFORMACIÓN
              // ========================================

              const title =
                property.property_type ||
                "Propiedad NEXO";


              const location =
                [
                  property.address,
                  property.neighborhood,
                  property.city
                ]
                .filter(Boolean)
                .join(", ");


              const price =
                formatPrice(
                  property.price
                );


              let popup = `
                <div class="property-card">

                  <h3>
                    ${escapeHtml(title)}
                  </h3>
              `;


              if (location) {

                popup += `
                  <p>
                    ${escapeHtml(location)}
                  </p>
                `;

              }


              if (
                property.bedrooms !== null &&
                property.bedrooms !== undefined
              ) {

                popup += `
                  <p>
                    🛏 ${escapeHtml(
                      property.bedrooms
                    )} habitaciones
                  </p>
                `;

              }


              if (
                property.bathrooms !== null &&
                property.bathrooms !== undefined
              ) {

                popup += `
                  <p>
                    🚿 ${escapeHtml(
                      property.bathrooms
                    )} baños
                  </p>
                `;

              }


              if (
                property.square_meters !== null &&
                property.square_meters !== undefined &&
                property.square_meters !== ""
              ) {

                popup += `
                  <p>
                    ${escapeHtml(
                      property.square_meters
                    )} m²
                  </p>
                `;

              }


              if (price) {

                popup += `
                  <div class="property-price">
                    ${escapeHtml(price)}
                  </div>
                `;

              }


              popup += `
                  <span class="property-status">
                    Disponible
                  </span>

                </div>
              `;


              marker.bindPopup(
                popup
              );


              marker.addTo(
                markers
              );

            }
          );


          // ==========================================
          // NINGUNA PROPIEDAD
          // ==========================================

          if (
            properties.length === 0
          ) {

            statusElement.textContent =
              "NEXO · No hay propiedades disponibles";

            return;

          }


          // ==========================================
          // PROPIEDADES SIN UBICACIÓN
          // ==========================================

          if (
            visibleProperties === 0
          ) {

            statusElement.textContent =
              `${properties.length} propiedad${
                properties.length === 1
                  ? ""
                  : "es"
              } encontrada${
                properties.length === 1
                  ? ""
                  : "s"
              } · esperando ubicación`;

            return;

          }


          // ==========================================
          // MOSTRAR CANTIDAD
          // ==========================================

          statusElement.textContent =
            `${visibleProperties} propiedad${
              visibleProperties === 1
                ? ""
                : "es"
            } en el mapa`;


          // ==========================================
          // CENTRAR UNA PROPIEDAD
          // ==========================================

          if (
            visibleProperties === 1
          ) {

            const layers =
              markers.getLayers();


            const firstMarker =
              layers[0];


            if (
              firstMarker &&
              typeof firstMarker.getLatLng ===
                "function"
            ) {

              map.setView(
                firstMarker.getLatLng(),
                14
              );

            }

            return;

          }


          // ==========================================
          // CENTRAR VARIAS PROPIEDADES
          // ==========================================

          const layers =
            markers.getLayers();


          const coordinates =
            layers
              .filter(
                marker =>
                  marker &&
                  typeof marker.getLatLng ===
                    "function"
              )
              .map(
                marker =>
                  marker.getLatLng()
              );


          if (
            coordinates.length > 0
          ) {

            const bounds =
              L.latLngBounds(
                coordinates
              );


            if (
              bounds.isValid()
            ) {

              map.fitBounds(
                bounds,
                {
                  padding: [
                    40,
                    40
                  ]
                }
              );

            }

          }

        } catch (error) {

          console.error(
            "NEXO MAP:",
            error
          );


          showError(
            "No se pudieron cargar las propiedades de NEXO. " +
            (
              error?.message ||
              "Error desconocido."
            )
          );

        }

      }


      // ==========================================
      // CARGAR PROPIEDADES
      // ==========================================

      loadProperties();


      // ==========================================
      // ACTUALIZACIÓN AUTOMÁTICA
      // ==========================================

      setInterval(
        loadProperties,
        30000
      );


      // ==========================================
      // API GLOBAL
      // ==========================================

      window.NEXO_MAP = {

        map,

        markers,

        loadProperties

      };


    })();
  </script>

</body>
</html>
