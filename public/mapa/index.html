<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#f5f5f7">
<meta name="description" content="NEXO — mapa de propiedades en Cuba">

<title>NEXO · Mapa</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  crossorigin=""
>

<style>
:root{
  --bg:#f5f5f7;
  --white:rgba(255,255,255,.9);
  --text:#111;
  --muted:#737378;
  --line:rgba(0,0,0,.08);
  --shadow:0 18px 55px rgba(0,0,0,.14);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    system-ui,
    sans-serif;
  -webkit-font-smoothing:antialiased;
}

button,
input{
  font:inherit;
}

#map{
  position:fixed;
  inset:0;
  z-index:1;
  background:#e6e6e4;
}

.leaflet-container{
  width:100%;
  height:100%;
  font-family:inherit;
}

/* TOP */

.top{
  position:fixed;
  z-index:1000;
  top:max(12px,env(safe-area-inset-top));
  left:12px;
  right:12px;

  display:flex;
  gap:8px;
  align-items:center;

  pointer-events:none;
}

.brand{
  flex:none;

  height:48px;
  padding:0 15px;

  display:flex;
  align-items:center;

  border:1px solid var(--line);
  border-radius:16px;

  background:var(--white);

  box-shadow:var(--shadow);

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  color:#111;
  font-weight:850;
  letter-spacing:-.08em;

  pointer-events:auto;
}

.search{
  flex:1;
  min-width:0;

  height:48px;

  display:flex;
  align-items:center;

  border:1px solid var(--line);
  border-radius:16px;

  background:var(--white);

  box-shadow:var(--shadow);

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  pointer-events:auto;
}

.search-icon{
  width:40px;
  flex:none;

  display:grid;
  place-items:center;

  color:#777;
  font-size:20px;
}

.search input{
  flex:1;
  min-width:0;
  height:100%;

  border:0;
  outline:0;

  background:transparent;

  color:#111;
  font-size:13px;
}

.search input::placeholder{
  color:#888;
}

.search button{
  width:38px;
  height:38px;
  margin-right:5px;

  border:0;
  border-radius:12px;

  background:#111;
  color:#fff;

  font-size:11px;
  font-weight:750;
}

/* CONTROLES */

.controls{
  position:fixed;
  z-index:1000;

  top:72px;
  right:12px;

  display:flex;
  flex-direction:column;
  gap:8px;
}

.control{
  width:44px;
  height:44px;

  display:grid;
  place-items:center;

  border:1px solid var(--line);
  border-radius:14px;

  background:var(--white);

  box-shadow:var(--shadow);

  color:#111;
  font-size:18px;

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}

.control:active{
  transform:scale(.94);
}

/* PANEL */

.panel{
  position:fixed;
  z-index:1000;

  left:12px;
  bottom:max(12px,env(safe-area-inset-bottom));

  width:min(390px,calc(100% - 24px));
  max-height:min(570px,calc(100vh - 140px));

  display:flex;
  flex-direction:column;

  overflow:hidden;

  border:1px solid var(--line);
  border-radius:25px;

  background:var(--white);

  box-shadow:var(--shadow);

  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
}

.panel-head{
  padding:16px;

  border-bottom:1px solid var(--line);
}

.panel-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.panel-title{
  font-size:15px;
  font-weight:800;
  letter-spacing:-.03em;
}

.panel-count{
  color:var(--muted);
  font-size:10px;
  font-weight:700;
}

.filters{
  display:flex;
  gap:6px;

  margin-top:11px;

  overflow-x:auto;

  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  flex:none;

  padding:8px 12px;

  border:1px solid var(--line);
  border-radius:999px;

  background:#fff;
  color:#666;

  font-size:10px;
  font-weight:750;
}

.filter.active{
  background:#111;
  border-color:#111;
  color:#fff;
}

.list{
  flex:1;
  min-height:0;

  overflow:auto;

  padding:8px;

  -webkit-overflow-scrolling:touch;
}

.card{
  width:100%;

  display:flex;
  gap:10px;

  padding:9px;

  border:0;
  border-radius:15px;

  background:transparent;

  text-align:left;

  cursor:pointer;
}

.card:active{
  background:#eee;
  transform:scale(.99);
}

.card-image{
  width:82px;
  height:70px;
  flex:none;

  overflow:hidden;

  border-radius:11px;

  background:#e5e5e5;
}

.card-image img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.card-info{
  min-width:0;
  flex:1;
}

.card-title{
  overflow:hidden;

  margin-bottom:5px;

  color:#111;

  font-size:13px;
  font-weight:800;

  white-space:nowrap;
  text-overflow:ellipsis;
}

.card-price{
  margin-bottom:4px;

  color:#111;

  font-size:13px;
  font-weight:800;
}

.card-location,
.card-meta{
  overflow:hidden;

  color:#777;

  font-size:10px;

  white-space:nowrap;
  text-overflow:ellipsis;
}

.state{
  padding:30px 15px;

  color:#777;

  text-align:center;

  font-size:12px;
  line-height:1.5;
}

.loading{
  position:fixed;
  z-index:3000;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  padding:13px 17px;

  border-radius:15px;

  background:rgba(255,255,255,.95);

  box-shadow:var(--shadow);

  font-size:11px;
  font-weight:750;

  display:none;
}

.loading.show{
  display:block;
}

/* POPUP */

.popup{
  min-width:220px;
}

.popup img{
  width:100%;
  height:130px;

  object-fit:cover;

  border-radius:10px;

  margin-bottom:9px;
}

.popup-title{
  font-size:14px;
  font-weight:800;
}

.popup-price{
  margin-top:4px;

  font-size:14px;
  font-weight:800;
}

.popup-location{
  margin-top:4px;

  color:#777;

  font-size:10px;
}

.popup-link{
  display:inline-block;

  margin-top:10px;
  padding:8px 11px;

  border-radius:10px;

  background:#111;
  color:#fff;

  font-size:10px;
  font-weight:750;
}

/* MOBILE */

@media(max-width:650px){

  .brand{
    padding:0 13px;
  }

  .panel{
    width:calc(100% - 24px);
    max-height:45vh;
  }

  .controls{
    top:70px;
  }

}

@media(min-width:900px){

  .panel{
    bottom:20px;
  }

}

</style>
</head>

<body>

<div id="map"></div>

<div class="top">

  <a
    href="/"
    class="brand"
    aria-label="Volver a NEXO"
  >
    NEXO
  </a>

  <form
    class="search"
    id="mapSearch"
  >

    <div class="search-icon">
      ⌕
    </div>

    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      placeholder="Buscar ciudad, zona o propiedad..."
    >

    <button type="submit">
      Buscar
    </button>

  </form>

</div>

<div class="controls">

  <button
    class="control"
    id="locateButton"
    type="button"
    aria-label="Mi ubicación"
  >
    ⌾
  </button>

  <button
    class="control"
    id="resetButton"
    type="button"
    aria-label="Ver Cuba"
  >
    ⌂
  </button>

</div>

<section class="panel">

  <div class="panel-head">

    <div class="panel-row">

      <div class="panel-title">
        Propiedades
      </div>

      <div
        class="panel-count"
        id="count"
      >
        Cargando...
      </div>

    </div>

    <div class="filters">

      <button
        class="filter active"
        data-filter="all"
        type="button"
      >
        Todas
      </button>

      <button
        class="filter"
        data-filter="Casa"
        type="button"
      >
        Casas
      </button>

      <button
        class="filter"
        data-filter="Apartamento"
        type="button"
      >
        Apartamentos
      </button>

      <button
        class="filter"
        data-filter="Villa"
        type="button"
      >
        Villas
      </button>

    </div>

  </div>

  <div
    class="list"
    id="propertyList"
  >
    <div class="state">
      Cargando propiedades...
    </div>
  </div>

</section>

<div
  class="loading"
  id="loading"
>
  Actualizando mapa...
</div>

<div
  id="toast"
  style="
    position:fixed;
    z-index:4000;
    left:50%;
    bottom:25px;
    transform:translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    padding:11px 15px;
    border-radius:999px;
    background:#111;
    color:#fff;
    font-size:11px;
    font-weight:700;
    transition:.25s ease;
  "
></div>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  crossorigin=""
></script>

<script>
"use strict";

/* =========================================================
   NEXO MAP 2.0
========================================================= */

const state = {
  map:null,
  markers:[],
  properties:[],
  filtered:[],
  filter:"all"
};

const CUBA = {
  lat:21.5218,
  lng:-77.7812,
  zoom:6
};

const $ = selector =>
  document.querySelector(selector);

document.addEventListener(
  "DOMContentLoaded",
  init
);

async function init(){

  createMap();

  bindControls();

  await loadProperties();

}


/* =========================================================
   MAPA
========================================================= */

function createMap(){

  state.map =
    L.map(
      "map",
      {
        zoomControl:false,
        minZoom:5,
        maxZoom:18,
        maxBounds:[
          [19.5,-86.5],
          [24.0,-73.0]
        ],
        maxBoundsViscosity:.65
      }
    );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:
        '&copy; OpenStreetMap contributors',
      maxZoom:19
    }
  ).addTo(
    state.map
  );

  L.control.zoom({
    position:"bottomright"
  }).addTo(
    state.map
  );

  state.map.setView(
    [CUBA.lat,CUBA.lng],
    CUBA.zoom
  );

}


/* =========================================================
   API
========================================================= */

async function loadProperties(){

  showLoading(true);

  try{

    const response =
      await fetch(
        "/api/properties?status=available&limit=500",
        {
          headers:{
            "Accept":
              "application/json"
          }
        }
      );

    if(!response.ok){
      throw new Error(
        "No se pudo cargar el inventario."
      );
    }

    const data =
      await response.json();

    state.properties =
      Array.isArray(data?.properties)
        ? data.properties
        : Array.isArray(data)
          ? data
          : [];

    applyFilter();

  }catch(error){

    console.error(
      "NEXO MAP:",
      error
    );

    $("#propertyList").innerHTML = `
      <div class="state">
        <strong>
          No pudimos cargar el mapa.
        </strong>
        Comprueba tu conexión e inténtalo nuevamente.
      </div>
    `;

    $("#count").textContent =
      "Sin datos";

  }finally{

    showLoading(false);

  }

}


/* =========================================================
   FILTROS
========================================================= */

function bindControls(){

  document
    .querySelectorAll(
      ".filter"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".filter"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );

          button.classList.add(
            "active"
          );

          state.filter =
            button.dataset.filter ||
            "all";

          applyFilter();

        }
      );

    });


  $("#mapSearch")
    .addEventListener(
      "submit",
      event => {

        event.preventDefault();

        search(
          $("#searchInput").value
        );

      }
    );


  $("#resetButton")
    .addEventListener(
      "click",
      resetMap
    );


  $("#locateButton")
    .addEventListener(
      "click",
      locateUser
    );

}


function applyFilter(){

  let list =
    [...state.properties];

  if(
    state.filter !== "all"
  ){

    list =
      list.filter(
        property =>
          normalize(
            property.property_type ||
            property.type ||
            ""
          ).includes(
            normalize(
              state.filter
            )
          )
      );

  }

  state.filtered =
    list;

  renderMarkers(
    list
  );

  renderList(
    list
  );

}


/* =========================================================
   BÚSQUEDA
========================================================= */

function search(value){

  const query =
    normalize(value);

  if(!query){

    applyFilter();
    resetMap();

    return;
  }

  const results =
    state.properties.filter(
      property => {

        const text =
          normalize([
            property.title,
            property.property_type,
            property.city,
            property.province,
            property.neighborhood,
            property.address,
            property.description
          ].join(" "));

        return text.includes(
          query
        );

      }
    );

  state.filtered =
    results;

  renderMarkers(
    results
  );

  renderList(
    results
  );

  if(results.length){

    const points =
      results
        .filter(hasCoordinates)
        .map(
          property => [
            Number(property.latitude),
            Number(property.longitude)
          ]
        );

    if(points.length){

      state.map.fitBounds(
        L.latLngBounds(points),
        {
          padding:[70,70],
          maxZoom:14
        }
      );

    }

  }

}


/* =========================================================
   MARCADORES
========================================================= */

function renderMarkers(
  properties
){

  state.markers.forEach(
    marker =>
      marker.remove()
  );

  state.markers = [];

  const points = [];

  properties.forEach(
    property => {

      if(!hasCoordinates(
        property
      )){
        return;
      }

      const lat =
        Number(
          property.latitude
        );

      const lng =
        Number(
          property.longitude
        );

      const marker =
        L.marker(
          [lat,lng],
          {
            title:
              property.title ||
              property.property_type ||
              "Propiedad"
          }
        ).addTo(
          state.map
        );

      marker.bindPopup(
        popupHTML(
          property
        ),
        {
          maxWidth:280,
          minWidth:220
        }
      );

      marker.on(
        "click",
        () => {

          highlightCard(
            property.id
          );

        }
      );

      state.markers.push(
        marker
      );

      points.push(
        [lat,lng]
      );

    }
  );

  if(
    points.length === 1 &&
    properties.length === 1
  ){

    state.map.setView(
      points[0],
      15,
      {
        animate:true
      }
    );

  }

}


/* =========================================================
   LISTA
========================================================= */

function renderList(
  properties
){

  const list =
    $("#propertyList");

  $("#count").textContent =
    `${properties.length} ${
      properties.length === 1
        ? "propiedad"
        : "propiedades"
    }`;

  if(!properties.length){

    list.innerHTML = `
      <div class="state">
        <strong>
          No encontramos propiedades.
        </strong>
        Prueba otra búsqueda o cambia el filtro.
      </div>
    `;

    return;
  }

  list.innerHTML =
    properties
      .map(
        property =>
          cardHTML(
            property
          )
      )
      .join("");

  list
    .querySelectorAll(
      "[data-property-id]"
    )
    .forEach(card => {

      card.addEventListener(
        "click",
        () => {

          const id =
            card.dataset.propertyId;

          focusProperty(
            id
          );

        }
      );

    });

}


/* =========================================================
   TARJETA
========================================================= */

function cardHTML(
  property
){

  const image =
    getImage(
      property
    );

  const title =
    property.title ||
    property.property_type ||
    "Propiedad";

  const location =
    [
      property.neighborhood,
      property.city,
      property.province
    ]
      .filter(Boolean)
      .join(" · ");

  return `
    <button
      class="card"
      type="button"
      data-property-id="${
        escapeAttr(
          property.id
        )
      }"
    >

      <div class="card-image">

        ${
          image
            ? `
              <img
                src="${safeURL(image)}"
                alt="${escapeAttr(title)}"
                loading="lazy"
              >
            `
            : `
              <div
                style="
                  width:100%;
                  height:100%;
                  display:grid;
                  place-items:center;
                  color:#999;
                  font-size:20px;
                "
              >
                NEXO
              </div>
            `
        }

      </div>

      <div class="card-info">

        <div class="card-title">
          ${escapeHTML(title)}
        </div>

        <div class="card-price">
          ${formatPrice(
            property.price
          )}
        </div>

        <div class="card-location">
          ${escapeHTML(
            location ||
            "Cuba"
          )}
        </div>

        <div class="card-meta">

          ${
            property.bedrooms ??
            "—"
          }
          hab.
          ·
          ${
            property.bathrooms ??
            "—"
          }
          baños
          ·
          ${
            property.square_meters ??
            "—"
          }
          m²

        </div>

      </div>

    </button>
  `;

}


/* =========================================================
   POPUP
========================================================= */

function popupHTML(
  property
){

  const image =
    getImage(
      property
    );

  const title =
    property.title ||
    property.property_type ||
    "Propiedad";

  const location =
    [
      property.neighborhood,
      property.city,
      property.province
    ]
      .filter(Boolean)
      .join(" · ");

  return `
    <div class="popup">

      ${
        image
          ? `
            <img
              src="${safeURL(image)}"
              alt="${escapeAttr(title)}"
            >
          `
          : ""
      }

      <div class="popup-title">
        ${escapeHTML(title)}
      </div>

      <div class="popup-price">
        ${formatPrice(
          property.price
        )}
      </div>

      <div class="popup-location">
        ${escapeHTML(
          location ||
          "Cuba"
        )}
      </div>

      <a
        class="popup-link"
        href="/?property=${
          encodeURIComponent(
            property.id || ""
          )
        }"
      >
        Ver propiedad →
      </a>

    </div>
  `;

}


/* =========================================================
   FOCUS PROPERTY
========================================================= */

function focusProperty(
  id
){

  const property =
    state.properties.find(
      item =>
        String(item.id) ===
        String(id)
    );

  if(!property){
    return;
  }

  if(
    hasCoordinates(
      property
    )
  ){

    const point = [
      Number(
        property.latitude
      ),
      Number(
        property.longitude
      )
    ];

    state.map.flyTo(
      point,
      15,
      {
        duration:.7
      }
    );

    const marker =
      state.markers.find(
        item => {

          const latlng =
            item.getLatLng();

          return (
            Math.abs(
              latlng.lat -
              Number(
                property.latitude
              )
            ) < .000001 &&
            Math.abs(
              latlng.lng -
              Number(
                property.longitude
              )
            ) < .000001
          );

        }
      );

    if(marker){

      setTimeout(
        () =>
          marker.openPopup(),
        450
      );

    }

  }else{

    toast(
      "Esta propiedad todavía no tiene ubicación en el mapa."
    );

  }

}


/* =========================================================
   HIGHLIGHT
========================================================= */

function highlightCard(
  id
){

  const card =
    document.querySelector(
      `[data-property-id="${CSS.escape(
        String(id)
      )}"]`
    );

  if(!card){
    return;
  }

  card.scrollIntoView({
    behavior:"smooth",
    block:"nearest"
  });

  card.style.background =
    "#eeeeef";

  setTimeout(
    () => {
      card.style.background =
        "";
    },
    1200
  );

}


/* =========================================================
   UBICACIÓN
========================================================= */

function locateUser(){

  if(
    !navigator.geolocation
  ){

    toast(
      "Tu dispositivo no permite obtener la ubicación."
    );

    return;
  }

  showLoading(true);

  navigator.geolocation.getCurrentPosition(
    position => {

      showLoading(false);

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;

      state.map.flyTo(
        [lat,lng],
        13,
        {
          duration:.8
        }
      );

      L.circleMarker(
        [lat,lng],
        {
          radius:8,
          color:"#111",
          fillColor:"#fff",
          fillOpacity:1,
          weight:3
        }
      )
      .addTo(
        state.map
      )
      .bindPopup(
        "Tu ubicación"
      )
      .openPopup();

    },
    error => {

      showLoading(false);

      toast(
        "No pudimos obtener tu ubicación."
      );

      console.warn(
        error
      );

    },
    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:60000
    }
  );

}


/* =========================================================
   RESET
========================================================= */

function resetMap(){

  $("#searchInput").value =
    "";

  document
    .querySelectorAll(
      ".filter"
    )
    .forEach(
      button =>
        button.classList.remove(
          "active"
        )
    );

  document
    .querySelector(
      '[data-filter="all"]'
    )
    ?.classList.add(
      "active"
    );

  state.filter =
    "all";

  state.map.flyTo(
    [CUBA.lat,CUBA.lng],
    CUBA.zoom,
    {
      duration:.7
    }
  );

  applyFilter();

}


/* =========================================================
   UTILIDADES
========================================================= */

function hasCoordinates(
  property
){

  const lat =
    Number(
      property.latitude
    );

  const lng =
    Number(
      property.longitude
    );

  return (
    Number.isFinite(lat) &&
    Number.isFinite(lng) &&
    lat >= 18 &&
    lat <= 25 &&
    lng >= -87 &&
    lng <= -73
  );

}

function getImage(
  property
){

  if(
    property.image ||
    property.photo
  ){

    return (
      property.image ||
      property.photo
    );

  }

  if(
    Array.isArray(
      property.photos
    )
  ){

    return (
      property.photos[0] ||
      ""
    );

  }

  if(
    typeof property.photos ===
    "string"
  ){

    try{

      const parsed =
        JSON.parse(
          property.photos
        );

      if(
        Array.isArray(parsed)
      ){

        return (
          parsed[0] ||
          ""
        );

      }

    }catch(_){}

    return property.photos
      .split(
        /[\n,|]+/
      )[0]
      ?.trim() || "";

  }

  return "";

}

function formatPrice(
  value
){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return "Precio no disponible";

  }

  const number =
    Number(
      String(value)
        .replace(
          /[^\d.-]/g,
          ""
        )
    );

  if(
    !Number.isFinite(number)
  ){

    return "Precio no disponible";

  }

  return "$" +
    number.toLocaleString(
      "en-US",
      {
        maximumFractionDigits:0
      }
    );

}

function normalize(
  value
){

  return String(
    value ?? ""
  )
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .toLowerCase()
    .trim();

}

function escapeHTML(
  value
){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char])
  );

}

function escapeAttr(
  value
){

  return escapeHTML(
    value
  );

}

function safeURL(
  value
){

  try{

    const url =
      new URL(
        value,
        location.origin
      );

    if(
      url.protocol !== "http:" &&
      url.protocol !== "https:"
    ){

      return "";

    }

    return url.href;

  }catch(_){

    return "";

  }

}

function showLoading(
  visible
){

  $("#loading")
    .classList.toggle(
      "show",
      visible
    );

}

function toast(
  message
){

  const element =
    $("#toast");

  element.textContent =
    message;

  element.style.opacity =
    "1";

  element.style.transform =
    "translate(-50%,0)";

  clearTimeout(
    element._timer
  );

  element._timer =
    setTimeout(
      () => {

        element.style.opacity =
          "0";

        element.style.transform =
          "translate(-50%,20px)";

      },
      2400
    );

}
