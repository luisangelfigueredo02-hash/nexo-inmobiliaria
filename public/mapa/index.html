<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NEXO Inmueble | Mapa</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >

  <style>

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background:#f5f5f5;
    }

    body{
      position:relative;
    }


    /* =====================================================
       MAPA
    ===================================================== */

    #map{
      position:absolute;
      inset:0;
      z-index:1;
    }


    /* =====================================================
       BARRA SUPERIOR
    ===================================================== */

    .topbar{

      position:absolute;

      top:15px;
      left:15px;
      right:15px;

      z-index:1000;

      display:flex;
      align-items:center;
      gap:10px;

      pointer-events:none;

    }


    .brand{

      pointer-events:auto;

      display:flex;
      align-items:center;
      gap:8px;

      background:rgba(255,255,255,.96);

      border-radius:14px;

      padding:10px 14px;

      box-shadow:
        0 5px 20px rgba(0,0,0,.12);

      font-weight:800;
      color:#111;

    }


    .brand-mark{

      width:30px;
      height:30px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:9px;

      background:#111;
      color:#fff;

      font-size:14px;

    }


    .brand span{
      font-size:15px;
    }


    /* =====================================================
       BUSCADOR
    ===================================================== */

    .search{

      pointer-events:auto;

      flex:1;

      max-width:520px;

      display:flex;
      align-items:center;

      background:rgba(255,255,255,.96);

      border-radius:14px;

      box-shadow:
        0 5px 20px rgba(0,0,0,.12);

      overflow:hidden;

    }


    .search input{

      flex:1;

      min-width:0;

      border:0;
      outline:0;

      background:transparent;

      padding:12px 14px;

      font-size:14px;

    }


    .search button{

      border:0;

      width:45px;
      height:45px;

      background:#111;
      color:#fff;

      cursor:pointer;

      font-size:16px;

    }


    /* =====================================================
       CONTROLES
    ===================================================== */

    .controls{

      position:absolute;

      right:15px;
      top:85px;

      z-index:1000;

      display:flex;
      flex-direction:column;
      gap:8px;

    }


    .control-btn{

      width:44px;
      height:44px;

      border:0;

      border-radius:13px;

      background:rgba(255,255,255,.96);

      box-shadow:
        0 5px 20px rgba(0,0,0,.12);

      cursor:pointer;

      font-size:18px;

      color:#222;

    }


    .control-btn:active{
      transform:scale(.96);
    }


    /* =====================================================
       PANEL DE PROPIEDADES
    ===================================================== */

    .panel{

      position:absolute;

      left:15px;
      bottom:15px;

      z-index:1000;

      width:min(
        390px,
        calc(100vw - 30px)
      );

      max-height:
        calc(100vh - 110px);

      background:rgba(255,255,255,.97);

      border-radius:18px;

      box-shadow:
        0 10px 35px rgba(0,0,0,.16);

      overflow:hidden;

      display:flex;
      flex-direction:column;

    }


    .panel-header{

      padding:14px 16px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      border-bottom:
        1px solid #eee;

    }


    .panel-title{

      font-size:15px;
      font-weight:800;
      color:#111;

    }


    .panel-count{

      font-size:11px;
      color:#777;

    }


    #propertyList{

      overflow:auto;

      padding:8px;

    }


    /* =====================================================
       TARJETA
    ===================================================== */

    .property-card{

      display:flex;

      gap:10px;

      padding:9px;

      border-radius:13px;

      cursor:pointer;

      transition:
        background .15s ease;

    }


    .property-card:hover{

      background:#f3f3f4;

    }


    .property-image{

      width:78px;
      height:70px;

      flex:0 0 78px;

      border-radius:10px;

      overflow:hidden;

      background:#eee;

    }


    .property-image img{

      width:100%;
      height:100%;

      object-fit:cover;

      display:block;

    }


    .property-info{

      min-width:0;

      flex:1;

    }


    .property-title{

      font-size:13px;
      font-weight:750;

      color:#111;

      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;

      margin-bottom:4px;

    }


    .property-price{

      font-size:13px;
      font-weight:800;

      color:#111;

      margin-bottom:4px;

    }


    .property-meta{

      font-size:10px;
      color:#777;

      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;

    }


    /* =====================================================
       ESTADOS
    ===================================================== */

    .state{

      padding:25px 15px;

      text-align:center;

      font-size:13px;

      color:#777;

    }


    .state.error{
      color:#b42318;
    }


    /* =====================================================
       LOADING
    ===================================================== */

    .loading{

      position:absolute;

      left:50%;
      top:50%;

      transform:
        translate(-50%,-50%);

      z-index:2000;

      background:rgba(255,255,255,.97);

      border-radius:15px;

      padding:14px 18px;

      box-shadow:
        0 8px 30px rgba(0,0,0,.15);

      font-size:13px;

      display:none;

    }


    .loading.show{
      display:block;
    }


    /* =====================================================
       POPUP
    ===================================================== */

    .popup{

      min-width:220px;

    }


    .popup-image{

      width:100%;
      height:120px;

      object-fit:cover;

      border-radius:9px;

      margin-bottom:8px;

    }


    .popup-title{

      font-weight:800;

      font-size:14px;

      margin-bottom:5px;

    }


    .popup-price{

      font-weight:800;

      font-size:14px;

      margin-bottom:5px;

    }


    .popup-meta{

      color:#666;

      font-size:11px;

      margin-bottom:8px;

    }


    .popup-link{

      display:block;

      width:100%;

      padding:8px 10px;

      border-radius:8px;

      background:#111;

      color:#fff;

      text-decoration:none;

      text-align:center;

      font-size:11px;

      font-weight:700;

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media(max-width:700px){

      .topbar{

        top:10px;
        left:10px;
        right:10px;

        flex-wrap:wrap;

      }


      .brand{

        padding:8px 10px;

      }


      .brand span{

        font-size:13px;

      }


      .search{

        order:3;

        flex-basis:100%;

        max-width:none;

      }


      .controls{

        top:115px;
        right:10px;

      }


      .panel{

        left:10px;
        right:10px;

        bottom:10px;

        width:auto;

        max-height:35vh;

      }

    }

  </style>
</head>

<body>


  <!-- =====================================================
       MAPA
  ===================================================== -->

  <div id="map"></div>


  <!-- =====================================================
       BARRA SUPERIOR
  ===================================================== -->

  <div class="topbar">

    <div class="brand">

      <div class="brand-mark">
        N
      </div>

      <span>
        NEXO
      </span>

    </div>


    <form
      class="search"
      id="searchForm"
    >

      <input
        id="searchInput"
        type="search"
        placeholder="Buscar propiedad, ciudad o zona..."
        autocomplete="off"
      >

      <button
        type="submit"
        aria-label="Buscar"
      >
        🔎
      </button>

    </form>

  </div>


  <!-- =====================================================
       CONTROLES DEL MAPA
  ===================================================== -->

  <div class="controls">

    <button
      class="control-btn"
      id="locateButton"
      type="button"
      title="Mi ubicación"
    >
      📍
    </button>


    <button
      class="control-btn"
      id="reloadButton"
      type="button"
      title="Actualizar propiedades"
    >
      ↻
    </button>

  </div>


  <!-- =====================================================
       PANEL
  ===================================================== -->

  <section class="panel">

    <div class="panel-header">

      <div class="panel-title">
        Propiedades
      </div>

      <div
        class="panel-count"
        id="propertyCount"
      >
        0 propiedades
      </div>

    </div>


    <div id="propertyList">

      <div class="state">
        Cargando propiedades...
      </div>

    </div>

  </section>


  <!-- =====================================================
       LOADING
  ===================================================== -->

  <div
    class="loading"
    id="loading"
  >
    Cargando propiedades...
  </div>


  <!-- =====================================================
       LEAFLET
  ===================================================== -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>


  <script>

  "use strict";


  /* =======================================================
     CONFIGURACIÓN
  ======================================================= */

  const NEXO_MAP_CONFIG = {

    apiProperties:
      "/api/properties",

    propertyPage:
      "/",

    cacheKey:
      "nexo_map_properties_v1",

    cacheTime:
      120000,

    defaultZoom:
      6,

    defaultCenter:
      [23.1136,-82.3666]

  };


  /* =======================================================
     ESTADO
  ======================================================= */

  const mapState = {

    map:null,

    properties:[],

    markers:[],

    markerById:
      new Map(),

    loading:false

  };


  /* =======================================================
     ELEMENTOS
  ======================================================= */

  const propertyList =
    document.getElementById(
      "propertyList"
    );


  const propertyCount =
    document.getElementById(
      "propertyCount"
    );


  const loading =
    document.getElementById(
      "loading"
    );


  const searchInput =
    document.getElementById(
      "searchInput"
    );


  const searchForm =
    document.getElementById(
      "searchForm"
    );


  const locateButton =
    document.getElementById(
      "locateButton"
    );


  const reloadButton =
    document.getElementById(
      "reloadButton"
    );


  /* =======================================================
     ESCAPAR HTML
  ======================================================= */

  function escapeHTML(
    value
  ){

    return String(
      value ?? ""
    )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

  }


  /* =======================================================
     NORMALIZAR
  ======================================================= */

  function normalizeText(
    value
  ){

    return String(
      value ?? ""
    )

    .normalize("NFD")

    .replace(
      /[\u0300-\u036f]/g,
      ""
    )

    .toLowerCase()
    .trim();

  }


  /* =======================================================
     PRECIO
  ======================================================= */

  function formatPrice(
    value
  ){

    if(
      value === null ||
      value === undefined ||
      value === ""
    ){

      return "Precio no disponible";

    }


    const number =
      Number(
        String(value)
          .replace(
            /[^0-9.-]/g,
            ""
          )
      );


    if(
      !Number.isFinite(number)
    ){

      return escapeHTML(
        value
      );

    }


    return new Intl.NumberFormat(
      "en-US",
      {
        style:"currency",
        currency:"USD",
        maximumFractionDigits:0
      }
    ).format(number);

  }


  /* =======================================================
     ID
  ======================================================= */

  function getPropertyId(
    property,
    index
  ){

    return String(

      property.id ??
      property.ID ??
      property.property_id ??
      property.slug ??
      ("property-" + index)

    );

  }


  /* =======================================================
     COORDENADAS
  ======================================================= */

  function getCoordinates(
    property
  ){

    let lat =
      property.latitude ??
      property.lat ??
      property.latitud;

    let lng =
      property.longitude ??
      property.lng ??
      property.lon ??
      property.longitud;

    /*
     * Algunos sistemas guardan
     * las coordenadas como strings.
     */

    lat =
      Number(lat);

    lng =
      Number(lng);


    if(
      !Number.isFinite(lat) ||
      !Number.isFinite(lng)
    ){

      return null;

    }


    /*
     * Validación geográfica
     */

    if(
      lat < -90 ||
      lat > 90 ||
      lng < -180 ||
      lng > 180
    ){

      return null;

    }


    return {
      lat,
      lng
    };

  }


  /* =======================================================
     IMAGEN
  ======================================================= */

  function getImage(
    property
  ){

    return (

      property.image_url ||

      property.image ||

      property.photo ||

      property.cover ||

      property.main_image ||

      (
        Array.isArray(
          property.images
        )
        ? property.images[0]
        : ""
      ) ||

      ""

    );

  }


  /* =======================================================
     TÍTULO
  ======================================================= */

  function getTitle(
    property
  ){

    return (

      property.title ||

      property.name ||

      property.nombre ||

      property.address ||

      property.direccion ||

      "Propiedad NEXO"

    );

  }


  /* =======================================================
     CIUDAD
  ======================================================= */

  function getCity(
    property
  ){

    return (

      property.city ||

      property.ciudad ||

      property.municipality ||

      property.municipio ||

      ""

    );

  }


  /* =======================================================
     TIPO
  ======================================================= */

  function getType(
    property
  ){

    return (

      property.property_type ||

      property.type ||

      property.tipo ||

      ""

    );

  }


  /* =======================================================
     HABITACIONES
  ======================================================= */

  function getBedrooms(
    property
  ){

    return (

      property.bedrooms ??

      property.rooms ??

      property.habitaciones ??

      null

    );

  }


  /* =======================================================
     BAÑOS
  ======================================================= */

  function getBathrooms(
    property
  ){

    return (

      property.bathrooms ??

      property.banos ??

      null

    );

  }


  /* =======================================================
     URL
  ======================================================= */

  function getPropertyURL(
    property
  ){

    /*
     * Si el Worker ya proporciona
     * una URL específica usamos esa.
     */

    if(
      property.url
    ){

      return property.url;

    }


    if(
      property.link
    ){

      return property.link;

    }


    /*
     * Si existe slug
     */

    if(
      property.slug
    ){

      return (
        "/propiedad/" +
        encodeURIComponent(
          property.slug
        )
      );

    }


    /*
     * Fallback.
     *
     * No inventamos una ruta
     * de propiedad inexistente.
     */

    return NEXO_MAP_CONFIG.propertyPage;

  }


  /* =======================================================
     INICIALIZAR MAPA
  ======================================================= */

  function initializeMap(){

    mapState.map =
      L.map(
        "map",
        {
          zoomControl:true,
          preferCanvas:true
        }
      );


    /*
     * OpenStreetMap
     */

    L.tileLayer(

      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

      {

        maxZoom:19,

        attribution:
          '&copy; OpenStreetMap contributors'

      }

    ).addTo(
      mapState.map
    );


    mapState.map.setView(

      NEXO_MAP_CONFIG.defaultCenter,

      NEXO_MAP_CONFIG.defaultZoom

    );

  }


  /* =======================================================
     LOADING UI
  ======================================================= */

  function setLoading(
    value
  ){

    mapState.loading =
      Boolean(value);

    loading.classList.toggle(
      "show",
      mapState.loading
    );

  }


  /* =======================================================
     CARGAR CACHE
  ======================================================= */

  function loadCache(){

    try{

      const saved =
        localStorage.getItem(
          NEXO_MAP_CONFIG.cacheKey
        );

      if(!saved){

        return null;

      }


      const data =
        JSON.parse(
          saved
        );


      if(
        !data ||
        !Array.isArray(
          data.properties
        )
      ){

        return null;

      }


      if(
        Date.now() -
        Number(data.timestamp || 0)
        >
        NEXO_MAP_CONFIG.cacheTime
      ){

        return null;

      }


      return data.properties;

    }catch(error){

      console.warn(
        "NEXO map cache:",
        error
      );

      return null;

    }

  }


  /* =======================================================
     GUARDAR CACHE
  ======================================================= */

  function saveCache(
    properties
  ){

    try{

      localStorage.setItem(

        NEXO_MAP_CONFIG.cacheKey,

        JSON.stringify({

          timestamp:
            Date.now(),

          properties

        })

      );

    }catch(error){

      console.warn(
        "NEXO map cache save:",
        error
      );

    }

  }


  /* =======================================================
     OBTENER PROPIEDADES DEL WORKER
  ======================================================= */

  async function fetchProperties(){

    /*
     * Primero intentamos cache.
     */

    const cached =
      loadCache();


    if(
      cached &&
      cached.length
    ){

      mapState.properties =
        cached;

      renderProperties(
        cached
      );

    }


    setLoading(true);


    try{

      const response =
        await fetch(

          NEXO_MAP_CONFIG.apiProperties,

          {

            method:"GET",

            headers:{

              "Accept":
                "application/json",

              "X-NEXO-CLIENT":
                "nexo-map-v1"

            },

            cache:"no-store"

          }

        );


      if(!response.ok){

        throw new Error(
          "El Worker respondió con HTTP " +
          response.status
        );

      }


      const data =
        await response.json();


      if(
        !data ||
        !data.success
      ){

        throw new Error(

          data?.error ||

          "El Worker no devolvió propiedades."

        );

      }


      const properties =

        Array.isArray(
          data.properties
        )

        ? data.properties

        : [];


      mapState.properties =
        properties;


      saveCache(
        properties
      );


      renderProperties(
        properties
      );


    }catch(error){

      console.error(
        "NEXO MAP:",
        error
      );


      /*
       * Si tenemos cache,
       * mantenemos el mapa.
       */

      if(
        !mapState.properties.length
      ){

        renderError(
          "No se pudieron cargar las propiedades. " +
          "Comprueba la conexión con NEXO."
        );

      }

    }finally{

      setLoading(false);

    }

  }


  /* =======================================================
     CREAR MARCADOR
  ======================================================= */

  function createMarker(
    property,
    index
  ){

    const coordinates =
      getCoordinates(
        property
      );


    /*
     * SIN COORDENADAS
     *
     * No colocamos el marcador
     * en una ubicación inventada.
     */

    if(!coordinates){

      return null;

    }


    const title =
      getTitle(
        property
      );


    const image =
      getImage(
        property
      );


    const city =
      getCity(
        property
      );


    const type =
      getType(
        property
      );


    const bedrooms =
      getBedrooms(
        property
      );


    const bathrooms =
      getBathrooms(
        property
      );


    const price =
      formatPrice(
        property.price ??
        property.precio
      );


    const id =
      getPropertyId(
        property,
        index
      );


    const marker =
      L.marker(

        [
          coordinates.lat,
          coordinates.lng
        ]

      );


    let popupHTML =

      '<div class="popup">';


    if(image){

      popupHTML +=

        '<img class="popup-image" ' +

        'src="' +
        escapeHTML(image) +
        '" ' +

        'alt="' +
        escapeHTML(title) +
        '" ' +

        'loading="lazy">';

    }


    popupHTML +=

      '<div class="popup-title">' +

      escapeHTML(title) +

      '</div>' +


      '<div class="popup-price">' +

      price +

      '</div>';


    const meta = [

      type,

      city,

      bedrooms !== null &&
      bedrooms !== undefined
        ? bedrooms + " hab."
        : "",

      bathrooms !== null &&
      bathrooms !== undefined
        ? bathrooms + " baños"
        : ""

    ]

    .filter(Boolean)
    .join(" · ");


    if(meta){

      popupHTML +=

        '<div class="popup-meta">' +

        escapeHTML(meta) +

        '</div>';

    }


    popupHTML +=

      '<a class="popup-link" ' +

      'href="' +
      escapeHTML(
        getPropertyURL(
          property
        )
      ) +
      '">' +

      'Ver propiedad' +

      '</a>';


    popupHTML +=
      '</div>';


    marker.bindPopup(
      popupHTML
    );


    marker.__nexoId =
      id;


    marker.__nexoProperty =
      property;


    return marker;

  }


  /* =======================================================
     LIMPIAR MARCADORES
  ======================================================= */

  function clearMarkers(){

    for(
      const marker
      of mapState.markers
    ){

      try{

        mapState.map.removeLayer(
          marker
        );

      }catch(error){}

    }


    mapState.markers = [];

    mapState.markerById.clear();

  }


  /* =======================================================
     RENDERIZAR MARCADORES
  ======================================================= */

  function renderMarkers(
    properties
  ){

    clearMarkers();


    const bounds =
      [];


    properties.forEach(
      (
        property,
        index
      )=>{

        const marker =
          createMarker(
            property,
            index
          );


        if(!marker){

          return;

        }


        marker.addTo(
          mapState.map
        );


        mapState.markers.push(
          marker
        );


        mapState.markerById.set(

          marker.__nexoId,

          marker

        );


        const coordinates =
          getCoordinates(
            property
          );


        if(coordinates){

          bounds.push([

            coordinates.lat,
            coordinates.lng

          ]);

        }

      }
    );


    /*
     * Ajustar mapa automáticamente
     * cuando existen propiedades.
     */

    if(bounds.length === 1){

      mapState.map.setView(
        bounds[0],
        14
      );

    }

    else if(bounds.length > 1){

      mapState.map.fitBounds(
        bounds,
        {
          padding:[40,40],
          maxZoom:14
        }
      );

    }

  }


  /* =======================================================
     RENDERIZAR LISTA
  ======================================================= */

  function renderProperties(
    properties
  ){

    propertyList.innerHTML =
      "";


    propertyCount.textContent =

      properties.length === 1

        ? "1 propiedad"

        : properties.length +
          " propiedades";


    if(!properties.length){

      propertyList.innerHTML =

        '<div class="state">' +

        'No hay propiedades disponibles.' +

        '</div>';

      clearMarkers();

      return;

    }


    /*
     * Marcadores
     */

    renderMarkers(
      properties
    );


    /*
     * Lista
     */

    for(
      let index = 0;
      index < properties.length;
      index++
    ){

      const property =
        properties[index];


      const id =
        getPropertyId(
          property,
          index
        );


      const card =
        document.createElement(
          "article"
        );


      card.className =
        "property-card";


      card.dataset.id =
        id;


      const image =
        getImage(
          property
        );


      const title =
        getTitle(
          property
        );


      const price =
        formatPrice(

          property.price ??
          property.precio

        );


      const city =
        getCity(
          property
        );


      const type =
        getType(
          property
        );


      const bedrooms =
        getBedrooms(
          property
        );


      card.innerHTML =

        '<div class="property-image">' +

          (
            image

              ?

            '<img src="' +
            escapeHTML(image) +
            '" alt="' +
            escapeHTML(title) +
            '" loading="lazy">'

              :

            '<div style="' +

            'width:100%;height:100%;' +

            'display:flex;' +

            'align-items:center;' +

            'justify-content:center;' +

            'font-size:22px;' +

            '">🏠</div>'

          ) +

        '</div>' +


        '<div class="property-info">' +

          '<div class="property-title">' +

            escapeHTML(title) +

          '</div>' +


          '<div class="property-price">' +

            price +

          '</div>' +


          '<div class="property-meta">' +

            escapeHTML(

              [

                type,

                city,

                bedrooms !== null &&
                bedrooms !== undefined

                  ? bedrooms + " hab."

                  : ""

              ]

              .filter(Boolean)

              .join(" · ")

            ) +

          '</div>' +

        '</div>';


      card.addEventListener(

        "click",

        ()=>{

          const marker =
            mapState.markerById.get(
              id
            );


          if(!marker){

            /*
             * Puede ser una propiedad
             * sin coordenadas.
             */

            return;

          }


          mapState.map.setView(

            marker.getLatLng(),

            Math.max(
              mapState.map.getZoom(),
              14
            ),

            {
              animate:true
            }

          );


          marker.openPopup();

        }

      );


      propertyList.appendChild(
        card
      );

    }

  }


  /* =======================================================
     ERROR
  ======================================================= */

  function renderError(
    message
  ){

    propertyList.innerHTML =

      '<div class="state error">' +

      escapeHTML(message) +

      '</div>';

    propertyCount.textContent =
      "Sin datos";

  }


  /* =======================================================
     BUSCAR
  ======================================================= */

  function searchProperties(
    query
  ){

    const normalized =
      normalizeText(
        query
      );


    if(!normalized){

      renderProperties(
        mapState.properties
      );

      return;

    }


    const filtered =
      mapState.properties.filter(

        property=>{

          const text =

            [

              getTitle(property),

              getCity(property),

              getType(property),

              property.address,

              property.direccion,

              property.description,

              property.descripcion

            ]

            .filter(Boolean)

            .map(
              normalizeText
            )

            .join(" ");


          return text.includes(
            normalized
          );

        }

      );


    renderProperties(
      filtered
    );


    /*
     * Si no encontramos por texto,
     * no movemos el mapa arbitrariamente.
     */

  }


  /* =======================================================
     UBICACIÓN DEL USUARIO
  ======================================================= */

  function locateUser(){

    if(
      !navigator.geolocation
    ){

      alert(
        "Tu navegador no permite obtener la ubicación."
      );

      return;

    }


    locateButton.textContent =
      "⏳";


    navigator.geolocation.getCurrentPosition(

      position=>{

        const lat =
          position.coords.latitude;


        const lng =
          position.coords.longitude;


        mapState.map.setView(

          [lat,lng],

          14,

          {
            animate:true
          }

        );


        L.circleMarker(

          [lat,lng],

          {

            radius:8,

            weight:3,

            fillOpacity:.9

          }

        )

        .addTo(
          mapState.map
        )

        .bindPopup(
          "Tu ubicación"
        )

        .openPopup();


        locateButton.textContent =
          "📍";

      },


      error=>{

        console.warn(
          "NEXO geolocation:",
          error
        );


        locateButton.textContent =
          "📍";


        alert(
          "No pudimos obtener tu ubicación."
        );

      },

      {

        enableHighAccuracy:true,

        timeout:10000,

        maximumAge:60000

      }

    );

  }


  /* =======================================================
     EVENTOS
  ======================================================= */

  searchForm.addEventListener(

    "submit",

    event=>{

      event.preventDefault();

      searchProperties(
        searchInput.value
      );

    }

  );


  searchInput.addEventListener(

    "input",

    ()=>{

      /*
       * Búsqueda en tiempo real
       */

      searchProperties(
        searchInput.value
      );

    }

  );


  locateButton.addEventListener(

    "click",

    locateUser

  );


  reloadButton.addEventListener(

    "click",

    ()=>{

      fetchProperties();

    }

  );


  /* =======================================================
     INICIAR
  ======================================================= */

  initializeMap();

  fetchProperties();


  /* =======================================================
     ACTUALIZACIÓN AUTOMÁTICA
  ======================================================= */

  setInterval(

    ()=>{

      /*
       * Actualizamos cada 2 minutos.
       *
       * El Worker sigue siendo
       * la fuente principal.
       */

      fetchProperties();

    },

    NEXO_MAP_CONFIG.cacheTime

  );

  </script>

</body>
</html>
