<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>NEXO — Mapa</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>
:root{
  --bg:#f5f5f7;
  --white:#fff;
  --black:#111;
  --text:#171717;
  --muted:#777;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

/* =========================
   MAPA
========================= */

#map{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
}

.leaflet-container{
  width:100%;
  height:100%;
  background:#e5e7eb;
  font-family:inherit;
}

.leaflet-tile{
  image-rendering:auto;
}

/* =========================
   TOPBAR
========================= */

.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:1000;

  padding:
    calc(12px + env(safe-area-inset-top))
    14px
    10px;

  pointer-events:none;
}

.topbar-inner{
  max-width:760px;
  margin:auto;

  display:flex;
  gap:9px;
  align-items:center;

  pointer-events:auto;
}

.brand{
  flex:0 0 auto;

  padding:12px 15px;

  border-radius:15px;

  background:rgba(255,255,255,.96);

  box-shadow:
    0 6px 25px rgba(0,0,0,.12);

  font-size:17px;
  font-weight:800;
  letter-spacing:-.05em;
}

.search{
  flex:1;
  min-width:0;

  display:flex;
  align-items:center;

  overflow:hidden;

  border-radius:15px;

  background:rgba(255,255,255,.96);

  box-shadow:
    0 6px 25px rgba(0,0,0,.12);
}

.search-icon{
  padding-left:13px;
  font-size:15px;
}

.search input{
  width:100%;
  min-width:0;

  padding:13px 10px;

  border:0;
  outline:0;

  background:transparent;

  font-size:13px;
}

.clear{
  display:none;

  width:34px;
  height:34px;

  margin-right:4px;

  border-radius:50%;

  background:#eee;

  color:#555;
}

.clear.show{
  display:block;
}

/* =========================
   FILTROS
========================= */

.filters{
  position:fixed;

  top:
    calc(68px + env(safe-area-inset-top));

  left:0;
  right:0;

  z-index:999;

  padding:0 14px;

  pointer-events:none;
}

.filters-inner{
  max-width:760px;
  margin:auto;

  display:flex;
  gap:8px;

  overflow-x:auto;

  scrollbar-width:none;

  pointer-events:auto;
}

.filters-inner::-webkit-scrollbar{
  display:none;
}

.filter{
  flex:0 0 auto;

  padding:9px 13px;

  border-radius:999px;

  background:rgba(255,255,255,.96);

  border:1px solid rgba(0,0,0,.06);

  box-shadow:
    0 5px 18px rgba(0,0,0,.08);

  color:#444;

  font-size:11px;
  font-weight:700;
}

.filter.active{
  background:#111;
  color:#fff;
}

/* =========================
   CONTADOR
========================= */

.counter{
  position:fixed;

  left:14px;
  bottom:
    calc(16px + env(safe-area-inset-bottom));

  z-index:1000;

  padding:9px 13px;

  border-radius:999px;

  background:rgba(255,255,255,.96);

  box-shadow:
    0 7px 25px rgba(0,0,0,.12);

  font-size:11px;
  font-weight:700;
}

/* =========================
   BOTONES
========================= */

.map-buttons{
  position:fixed;

  right:14px;
  bottom:
    calc(16px + env(safe-area-inset-bottom));

  z-index:1000;

  display:flex;
  flex-direction:column;
  gap:8px;
}

.map-button{
  width:44px;
  height:44px;

  border-radius:14px;

  background:rgba(255,255,255,.96);

  box-shadow:
    0 7px 25px rgba(0,0,0,.12);

  font-size:18px;
}

.map-button:active{
  transform:scale(.94);
}

/* =========================
   ESTADO
========================= */

.status{
  position:fixed;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  z-index:2000;

  width:min(320px,calc(100% - 40px));

  padding:20px;

  border-radius:20px;

  background:rgba(255,255,255,.97);

  box-shadow:
    0 20px 60px rgba(0,0,0,.16);

  text-align:center;
}

.status.hidden{
  display:none;
}

.status-title{
  font-weight:800;
  margin-bottom:5px;
}

.status-text{
  color:#777;
  font-size:13px;
  line-height:1.45;
}

/* =========================
   MARCADOR
========================= */

.nexo-marker{
  position:relative;

  width:34px;
  height:34px;

  border-radius:50% 50% 50% 0;

  background:#111;

  border:3px solid #fff;

  transform:rotate(-45deg);

  box-shadow:
    0 5px 15px rgba(0,0,0,.25);
}

.nexo-marker::after{
  content:"";

  position:absolute;

  width:9px;
  height:9px;

  left:9px;
  top:9px;

  border-radius:50%;

  background:#fff;
}

/* =========================
   POPUP
========================= */

.leaflet-popup-content-wrapper{
  padding:0;

  border-radius:20px;

  overflow:hidden;

  box-shadow:
    0 15px 45px rgba(0,0,0,.18);
}

.leaflet-popup-content{
  margin:0;
  width:min(300px,76vw)!important;
}

.property-card{
  overflow:hidden;
  background:#fff;
}

.property-image{
  width:100%;
  height:150px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#e8e8ea;

  color:#999;

  font-size:11px;
}

.property-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.property-content{
  padding:15px;
}

.property-type{
  color:#888;

  font-size:9px;
  font-weight:800;

  text-transform:uppercase;
  letter-spacing:.1em;
}

.property-title{
  margin-top:5px;

  font-size:18px;
  font-weight:800;

  letter-spacing:-.04em;
}

.property-price{
  margin-top:7px;

  font-size:19px;
  font-weight:800;
}

.property-location{
  margin-top:6px;

  color:#777;

  font-size:11px;
  line-height:1.45;
}

.property-stats{
  display:flex;
  flex-wrap:wrap;
  gap:6px;

  margin-top:12px;
}

.property-stat{
  padding:6px 8px;

  border-radius:999px;

  background:#f1f1f3;

  color:#555;

  font-size:9px;
  font-weight:700;
}

.property-address{
  margin-top:11px;

  color:#666;

  font-size:10px;
  line-height:1.4;
}

.view-property{
  width:100%;

  margin-top:13px;

  padding:11px;

  border-radius:12px;

  background:#111;
  color:#fff;

  font-size:11px;
  font-weight:700;
}

@media(max-width:600px){

  .brand{
    padding:11px 13px;
    font-size:16px;
  }

  .search input{
    font-size:12px;
  }

  .property-image{
    height:145px;
  }
}
</style>
</head>

<body>

<div id="map"></div>

<!-- TOPBAR -->

<div class="topbar">
  <div class="topbar-inner">

    <div class="brand">
      NEXO
    </div>

    <div class="search">

      <span class="search-icon">⌕</span>

      <input
        id="searchInput"
        type="search"
        placeholder="Buscar ciudad, zona o dirección"
        autocomplete="off"
      >

      <button
        id="clearSearch"
        class="clear"
        type="button"
      >
        ×
      </button>

    </div>

  </div>
</div>

<!-- FILTROS -->

<div class="filters">
  <div class="filters-inner">

    <button
      class="filter active"
      data-type="all"
    >
      Todas
    </button>

    <button
      class="filter"
      data-type="Casa"
    >
      Casas
    </button>

    <button
      class="filter"
      data-type="Apartamento"
    >
      Apartamentos
    </button>

    <button
      class="filter"
      data-type="Villa"
    >
      Villas
    </button>

    <button
      class="filter"
      data-type="Terreno"
    >
      Terrenos
    </button>

    <button
      class="filter"
      data-type="Local"
    >
      Locales
    </button>

  </div>
</div>

<!-- CONTADOR -->

<div id="counter" class="counter">
  Cargando...
</div>

<!-- BOTONES -->

<div class="map-buttons">

  <button
    id="fitButton"
    class="map-button"
    type="button"
    aria-label="Mostrar propiedades"
  >
    ⛶
  </button>

  <button
    id="locationButton"
    class="map-button"
    type="button"
    aria-label="Mi ubicación"
  >
    ⊙
  </button>

</div>

<!-- ESTADO -->

<div id="status" class="status">

  <div id="statusTitle" class="status-title">
    Cargando NEXO...
  </div>

  <div id="statusText" class="status-text">
    Buscando propiedades.
  </div>

</div>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>

<script>
"use strict";

/* =========================================================
   ELEMENTOS
========================================================= */

const mapElement =
  document.getElementById("map");

const searchInput =
  document.getElementById("searchInput");

const clearSearch =
  document.getElementById("clearSearch");

const counter =
  document.getElementById("counter");

const status =
  document.getElementById("status");

const statusTitle =
  document.getElementById("statusTitle");

const statusText =
  document.getElementById("statusText");

const fitButton =
  document.getElementById("fitButton");

const locationButton =
  document.getElementById("locationButton");


/* =========================================================
   ESTADO
========================================================= */

let allProperties = [];

let filteredProperties = [];

let activeType = "all";

let userLocationMarker = null;


/* =========================================================
   MAPA
========================================================= */

const map =
  L.map(mapElement, {

    zoomControl:false,

    preferCanvas:true,

    zoomAnimation:true,

    fadeAnimation:true,

    markerZoomAnimation:true,

    worldCopyJump:false,

    maxBoundsViscosity:1

  });


/* Zoom */

L.control.zoom({
  position:"bottomright"
}).addTo(map);


/* Vista inicial */

map.setView(
  [23.1136,-82.3666],
  11
);


/* =========================================================
   OPENSTREETMAP
========================================================= */

const tiles =
  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,

      minZoom:3,

      tileSize:256,

      updateWhenIdle:true,

      updateWhenZooming:false,

      keepBuffer:3,

      detectRetina:true,

      attribution:
        "&copy; OpenStreetMap contributors"
    }
  );


tiles.addTo(map);


/* =========================================================
   CAPA DE MARCADORES
========================================================= */

const markerLayer =
  L.layerGroup();

markerLayer.addTo(map);


/* =========================================================
   ICONO NEXO
========================================================= */

const nexoIcon =
  L.divIcon({

    className:"",

    html:
      '<div class="nexo-marker"></div>',

    iconSize:[34,34],

    iconAnchor:[17,34],

    popupAnchor:[0,-32]

  });


/* =========================================================
   UTILIDADES
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function normalize(value){

  return String(value ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim();

}


function money(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return "Precio no disponible";

  }

  const number =
    Number(
      String(value)
        .replace(/[$,\s]/g,"")
    );

  if(!Number.isFinite(number)){

    return String(value);

  }

  return "$" +
    number.toLocaleString(
      "en-US",
      {
        maximumFractionDigits:0
      }
    );

}


function parsePhotos(property){

  if(
    Array.isArray(property.photos)
  ){

    return property.photos
      .filter(Boolean);

  }

  if(
    typeof property.photos === "string"
  ){

    try{

      const parsed =
        JSON.parse(property.photos);

      if(
        Array.isArray(parsed)
      ){

        return parsed
          .filter(Boolean);

      }

    }catch(error){

      console.warn(
        "NEXO: fotos inválidas",
        error
      );

    }

  }

  return [];

}


/* =========================================================
   ESTADO
========================================================= */

function showStatus(title,text){

  statusTitle.textContent =
    title;

  statusText.textContent =
    text;

  status.classList.remove(
    "hidden"
  );

}


function hideStatus(){

  status.classList.add(
    "hidden"
  );

}


/* =========================================================
   COORDENADAS
========================================================= */

function getCoordinates(property){

  const latitude =
    Number(property.latitude);

  const longitude =
    Number(property.longitude);

  if(
    !Number.isFinite(latitude) ||
    !Number.isFinite(longitude)
  ){

    return null;

  }

  if(
    latitude < -90 ||
    latitude > 90 ||
    longitude < -180 ||
    longitude > 180
  ){

    return null;

  }

  return [
    latitude,
    longitude
  ];

}


/* =========================================================
   TARJETA
========================================================= */

function buildPropertyCard(property){

  const photos =
    parsePhotos(property);

  const image =
    photos.length
      ? photos[0]
      : "";

  const title =
    property.title ||
    property.property_type ||
    "Propiedad";

  const location =
    [
      property.neighborhood,
      property.city
    ]
      .filter(Boolean)
      .join(" · ");

  let stats = [];

  if(
    property.bedrooms !== null &&
    property.bedrooms !== undefined &&
    property.bedrooms !== ""
  ){

    stats.push(
      "🛏 " +
      escapeHTML(
        property.bedrooms
      )
    );

  }

  if(
    property.bathrooms !== null &&
    property.bathrooms !== undefined &&
    property.bathrooms !== ""
  ){

    stats.push(
      "🚿 " +
      escapeHTML(
        property.bathrooms
      )
    );

  }

  if(
    property.square_meters !== null &&
    property.square_meters !== undefined &&
    property.square_meters !== ""
  ){

    stats.push(
      escapeHTML(
        property.square_meters
      ) +
      " m²"
    );

  }

  const statsHTML =
    stats.length
      ? `
        <div class="property-stats">
          ${
            stats.map(
              item =>
                `<span class="property-stat">${item}</span>`
            ).join("")
          }
        </div>
      `
      : "";

  const imageHTML =
    image
      ? `
        <div class="property-image">
          <img
            src="${escapeHTML(image)}"
            alt="${escapeHTML(title)}"
            loading="lazy"
            onerror="
              this.style.display='none';
              this.parentElement.textContent='Sin fotografía';
            "
          >
        </div>
      `
      : `
        <div class="property-image">
          Sin fotografía
        </div>
      `;

  const addressHTML =
    property.address
      ? `
        <div class="property-address">
          📍 ${escapeHTML(property.address)}
        </div>
      `
      : "";

  return `
    <div class="property-card">

      ${imageHTML}

      <div class="property-content">

        <div class="property-type">
          ${escapeHTML(
            property.property_type ||
            "Propiedad"
          )}
        </div>

        <div class="property-title">
          ${escapeHTML(title)}
        </div>

        <div class="property-price">
          ${money(property.price)}
        </div>

        ${
          location
            ? `
              <div class="property-location">
                ${escapeHTML(location)}
              </div>
            `
            : ""
        }

        ${statsHTML}

        ${addressHTML}

        <button
          type="button"
          class="view-property"
          data-property-id="${Number(property.id)}"
        >
          Ver propiedad
        </button>

      </div>

    </div>
  `;

}


/* =========================================================
   ABRIR PROPIEDAD
========================================================= */

function openProperty(property){

  const coords =
    getCoordinates(property);

  if(!coords){

    return;

  }

  map.flyTo(
    coords,
    Math.max(
      map.getZoom(),
      16
    ),
    {
      animate:true,
      duration:.6
    }
  );

}


/* =========================================================
   MARCADORES
========================================================= */

function renderMarkers(){

  markerLayer.clearLayers();

  let located = 0;

  filteredProperties.forEach(
    property => {

      const coords =
        getCoordinates(property);

      /*
       * SIN coordenadas = SIN PIN.
       */

      if(!coords){

        return;

      }

      located++;

      const marker =
        L.marker(
          coords,
          {
            icon:nexoIcon,

            keyboard:true,

            title:
              property.property_type ||
              "Propiedad"
          }
        );


      marker.bindPopup(
        buildPropertyCard(property),
        {
          maxWidth:320,

          minWidth:240,

          closeButton:true,

          autoPan:true,

          autoPanPaddingTopLeft:
            [20,140],

          autoPanPaddingBottomRight:
            [20,80]
        }
      );


      marker.on(
        "popupopen",
        event => {

          const popup =
            event.popup;

          const element =
            popup.getElement();

          if(!element){

            return;

          }

          const button =
            element.querySelector(
              ".view-property"
            );

          if(!button){

            return;

          }

          button.onclick =
            () => {

              openProperty(
                property
              );

              popup.close();

            };

        }
      );


      markerLayer.addLayer(
        marker
      );

    }
  );

  updateCounter(
    located
  );

}


/* =========================================================
   CONTADOR
========================================================= */

function updateCounter(located){

  const total =
    filteredProperties.length;

  if(total === 0){

    counter.textContent =
      "0 propiedades";

    return;

  }

  if(total === located){

    counter.textContent =
      total +
      (
        total === 1
          ? " propiedad"
          : " propiedades"
      );

    return;

  }

  counter.textContent =
    total +
    " propiedades · " +
    located +
    " ubicadas";

}


/* =========================================================
   AJUSTAR MAPA
========================================================= */

function fitVisibleProperties(){

  const coordinates =
    filteredProperties
      .map(getCoordinates)
      .filter(Boolean);


  if(!coordinates.length){

    map.setView(
      [23.1136,-82.3666],
      11,
      {
        animate:false
      }
    );

    return;

  }


  if(coordinates.length === 1){

    map.setView(
      coordinates[0],
      15,
      {
        animate:true
      }
    );

    return;

  }


  const bounds =
    L.latLngBounds(
      coordinates
    );


  if(!bounds.isValid()){

    return;

  }


  map.fitBounds(
    bounds,
    {
      paddingTopLeft:
        [25,150],

      paddingBottomRight:
        [25,100],

      maxZoom:16,

      animate:true,

      duration:.5
    }
  );

}


/* =========================================================
   FILTROS
========================================================= */

function applyFilters(){

  const search =
    normalize(
      searchInput.value
    );


  filteredProperties =
    allProperties.filter(
      property => {

        if(
          activeType !== "all" &&
          normalize(
            property.property_type
          ) !==
          normalize(
            activeType
          )
        ){

          return false;

        }


        if(!search){

          return true;

        }


        const searchable =
          [
            property.property_type,
            property.title,
            property.city,
            property.neighborhood,
            property.address,
            property.description
          ]
            .filter(Boolean)
            .map(normalize)
            .join(" ");


        return searchable.includes(
          search
        );

      }
    );


  renderMarkers();


  if(
    filteredProperties.length === 0
  ){

    showStatus(
      "Sin resultados",
      "No encontramos propiedades con esos criterios."
    );

  }else{

    hideStatus();

  }


  fitVisibleProperties();

}


/* =========================================================
   BOTONES DE FILTRO
========================================================= */

document
  .querySelectorAll(".filter")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(".filter")
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          activeType =
            button.dataset.type ||
            "all";


          applyFilters();

        }
      );

    }
  );


/* =========================================================
   BUSCADOR
========================================================= */

searchInput.addEventListener(
  "input",
  () => {

    clearSearch.classList.toggle(
      "show",
      Boolean(
        searchInput.value.trim()
      )
    );

    applyFilters();

  }
);


clearSearch.addEventListener(
  "click",
  () => {

    searchInput.value = "";

    clearSearch.classList.remove(
      "show"
    );

    applyFilters();

    searchInput.focus();

  }
);


/* =========================================================
   BOTÓN AJUSTAR
========================================================= */

fitButton.addEventListener(
  "click",
  () => {

    fitVisibleProperties();

  }
);


/* =========================================================
   UBICACIÓN
========================================================= */

locationButton.addEventListener(
  "click",
  () => {

    if(
      !navigator.geolocation
    ){

      alert(
        "Tu dispositivo no permite obtener la ubicación."
      );

      return;

    }


    locationButton.disabled =
      true;


    navigator.geolocation.getCurrentPosition(

      position => {

        const coords = [
          position.coords.latitude,
          position.coords.longitude
        ];


        if(userLocationMarker){

          map.removeLayer(
            userLocationMarker
          );

        }


        userLocationMarker =
          L.circleMarker(
            coords,
            {
              radius:8,
              weight:3
            }
          )
            .addTo(map);


        userLocationMarker.bindPopup(
          "Tu ubicación"
        );


        map.flyTo(
          coords,
          15,
          {
            animate:true,
            duration:.6
          }
        );


        locationButton.disabled =
          false;

      },


      error => {

        console.warn(
          "NEXO ubicación:",
          error
        );


        alert(
          "No se pudo obtener tu ubicación."
        );


        locationButton.disabled =
          false;

      },


      {
        enableHighAccuracy:true,

        timeout:10000,

        maximumAge:60000
      }

    );

  }
);


/* =========================================================
   CARGAR PROPIEDADES
========================================================= */

async function loadProperties(){

  showStatus(
    "Cargando propiedades",
    "Conectando con NEXO..."
  );


  try{

    const response =
      await fetch(
        "/api/properties",
        {
          method:"GET",

          headers:{
            "Accept":
              "application/json"
          },

          cache:"no-store"
        }
      );


    const text =
      await response.text();


    let data;


    try{

      data =
        JSON.parse(text);

    }catch(error){

      throw new Error(
        "La respuesta del servidor no es JSON."
      );

    }


    if(
      !response.ok ||
      data.success === false
    ){

      throw new Error(
        data.error ||
        "Error HTTP " +
        response.status
      );

    }


    allProperties =
      Array.isArray(
        data.properties
      )
        ? data.properties
        : [];


    /*
     * Solo propiedades disponibles.
     */

    allProperties =
      allProperties.filter(
        property =>
          !property.status ||
          property.status ===
            "available"
      );


    filteredProperties =
      [...allProperties];


    renderMarkers();


    hideStatus();


    const located =
      allProperties
        .map(getCoordinates)
        .filter(Boolean);


    if(located.length){

      fitVisibleProperties();

    }else{

      map.setView(
        [23.1136,-82.3666],
        11,
        {
          animate:false
        }
      );

    }


  }catch(error){

    console.error(
      "NEXO MAP:",
      error
    );


    counter.textContent =
      "Error";


    showStatus(
      "No se pudieron cargar las propiedades",
      error.message ||
      "Comprueba la conexión con NEXO."
    );

  }

}


/* =========================================================
   CORRECCIÓN DEL TAMAÑO DEL MAPA
========================================================= */

function refreshMapSize(){

  map.invalidateSize({
    pan:false,
    debounceMoveend:true
  });

}


/*
 * Esperamos a que el navegador haya
 * pintado completamente el mapa.
 */

requestAnimationFrame(
  () => {

    refreshMapSize();

    setTimeout(
      refreshMapSize,
      250
    );

    setTimeout(
      refreshMapSize,
      700
    );

  }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  refreshMapSize
);


window.addEventListener(
  "orientationchange",
  () => {

    setTimeout(
      refreshMapSize,
      300
    );

  }
);


/* =========================================================
   INICIO
========================================================= */

loadProperties();

</script>
