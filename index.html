<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXO | Real Estate</title>
  <meta
    name="description"
    content="NEXO — Encuentra tu próximo hogar."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #0b0b0b;
      --dark: #111111;
      --white: #ffffff;
      --gray: #a7a7a7;
      --line: #242424;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 11, 11, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      max-width: 1200px;
      margin: auto;
      min-height: 72px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 4px;
    }

    .menu {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .menu a {
      color: var(--white);
      text-decoration: none;
      font-size: 14px;
    }

    .menu a:hover {
      opacity: 0.7;
    }

    .admin-button {
      border: 1px solid var(--white);
      padding: 9px 15px;
      border-radius: 999px;
    }

    /* HERO */

    .hero {
      min-height: 78vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 20px;
      background:
        radial-gradient(circle at center, #202020 0%, #0b0b0b 55%);
    }

    .hero-content {
      max-width: 800px;
    }

    .hero h1 {
      font-size: clamp(48px, 12vw, 110px);
      line-height: 0.95;
      letter-spacing: 8px;
      font-weight: 800;
    }

    .hero p {
      margin-top: 24px;
      color: var(--gray);
      font-size: 18px;
      line-height: 1.6;
    }

    .hero-button {
      display: inline-block;
      margin-top: 34px;
      padding: 14px 24px;
      border-radius: 999px;
      background: var(--white);
      color: var(--black);
      text-decoration: none;
      font-weight: 600;
    }

    /* PROPERTIES */

    .properties-section {
      max-width: 1200px;
      margin: auto;
      padding: 70px 20px 100px;
    }

    .section-title {
      margin-bottom: 30px;
    }

    .section-title span {
      color: var(--gray);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .section-title h2 {
      margin-top: 8px;
      font-size: 34px;
    }

    .property-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .property-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: var(--dark);
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .property-card:hover {
      transform: translateY(-4px);
      border-color: #444;
    }

    .property-image {
      height: 240px;
      background:
        linear-gradient(135deg, #292929, #111111);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 13px;
    }

    .property-info {
      padding: 20px;
    }

    .property-info h3 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .property-location {
      color: var(--gray);
      font-size: 14px;
    }

    .property-price {
      margin-top: 18px;
      font-size: 19px;
      font-weight: 700;
    }

    .property-details {
      margin-top: 12px;
      color: var(--gray);
      font-size: 13px;
    }

    /* EMPTY STATE */

    .empty-state {
      border: 1px dashed #333;
      border-radius: 18px;
      padding: 60px 20px;
      text-align: center;
      color: var(--gray);
    }

    .empty-state strong {
      display: block;
      color: var(--white);
      font-size: 18px;
      margin-bottom: 8px;
    }

    /* FOOTER */

    footer {
      border-top: 1px solid var(--line);
      padding: 30px 20px;
      text-align: center;
      color: #666;
      font-size: 13px;
    }

    /* MOBILE */

    @media (max-width: 800px) {

      .menu a:not(.admin-button) {
        display: none;
      }

      .hero {
        min-height: 70vh;
      }

      .property-grid {
        grid-template-columns: 1fr;
      }

      .property-image {
        height: 230px;
      }
    }
  </style>
</head>

<body>

  <header>
    <nav class="nav">
      <div class="logo">NEXO</div>

      <div class="menu">
        <a href="#propiedades">Propiedades</a>
        <a href="#contacto">Contacto</a>
        <a href="#" class="admin-button">Admin</a>
      </div>
    </nav>
  </header>

  <main>

    <section class="hero">
      <div class="hero-content">

        <h1>NEXO</h1>

        <p>
          Encuentra propiedades que conecten contigo.
          Una nueva forma de descubrir tu próximo hogar.
        </p>

        <a href="#propiedades" class="hero-button">
          Explorar propiedades
        </a>

      </div>
    </section>


    <section id="propiedades" class="properties-section">

      <div class="section-title">
        <span>NEXO Properties</span>
        <h2>Propiedades disponibles</h2>
      </div>

      <div id="propertyGrid">

        <div class="empty-state">
          <strong>Próximamente</strong>
          Las propiedades aparecerán aquí automáticamente.
        </div>

      </div>

    </section>

  </main>


  <footer id="contacto">
    © 2026 NEXO. Todos los derechos reservados.
  </footer>


  <script>

    /*
      NEXO
      Frontend inicial.

      La conexión con Cloudflare D1 se añadirá
      posteriormente mediante nuestra API.
    */

    console.log("NEXO iniciado correctamente.");

  </script>

</body>
</html>
