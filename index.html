<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXO</title>

  <meta
    name="description"
    content="NEXO — Descubre propiedades que conectan contigo."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #080808;
      --dark: #111111;
      --white: #ffffff;
      --gray: #999999;
      --line: #252525;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: var(--black);
      color: var(--white);
      min-height: 100vh;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(8, 8, 8, 0.92);
      backdrop-filter: blur(16px);

      border-bottom: 1px solid var(--line);
    }

    .nav {
      max-width: 1200px;
      min-height: 72px;

      margin: auto;
      padding: 0 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 5px;
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .menu a {
      color: var(--white);
      text-decoration: none;
      font-size: 14px;
    }

    .menu a:hover {
      opacity: 0.7;
    }

    .admin-button {
      border: 1px solid var(--white);
      padding: 9px 16px;
      border-radius: 999px;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 78vh;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 80px 20px;

      background:
        radial-gradient(
          circle at center,
          #242424 0%,
          #080808 58%
        );
    }

    .hero-content {
      max-width: 850px;
    }

    .hero h1 {
      font-size: clamp(58px, 14vw, 120px);
      line-height: 0.9;

      font-weight: 800;
      letter-spacing: 10px;
    }

    .hero p {
      max-width: 650px;

      margin: 28px auto 0;

      color: var(--gray);

      font-size: 18px;
      line-height: 1.6;
    }

    .hero-button {
      display: inline-block;

      margin-top: 36px;

      padding: 15px 26px;

      border-radius: 999px;

      background: var(--white);
      color: var(--black);

      text-decoration: none;

      font-weight: 600;
    }

    .hero-button:hover {
      opacity: 0.85;
    }

    /* =========================
       PROPERTIES
    ========================= */

    .properties-section {
      max-width: 1200px;

      margin: auto;

      padding: 80px 20px 110px;
    }

    .section-title {
      margin-bottom: 30px;
    }

    .section-title span {
      color: var(--gray);

      font-size: 12px;

      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .section-title h2 {
      margin-top: 8px;

      font-size: 36px;
    }

    /* =========================
       PROPERTY GRID
    ========================= */

    .property-grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 20px;
    }

    /* =========================
       PROPERTY CARD
    ========================= */

    .property-card {
      overflow: hidden;

      background: var(--dark);

      border: 1px solid var(--line);
      border-radius: 18px;

      transition:
        transform 0.25s ease,
        border-color 0.25s ease;
    }

    .property-card:hover {
      transform: translateY(-4px);
      border-color: #444;
    }

    .property-image {
      width: 100%;
      height: 240px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #292929,
          #111111
        );

      color: #666;

      font-size: 13px;
    }

    .property-info {
      padding: 20px;
    }

    .property-info h3 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .property-location {
      color: var(--gray);
      font-size: 14px;
    }

    .property-price {
      margin-top: 18px;

      font-size: 19px;
      font-weight: 700;
    }

    .property-details {
      margin-top: 12px;

      color: var(--gray);

      font-size: 13px;
    }

    /* =========================
       EMPTY STATE
    ========================= */

    .empty-state {
      grid-column: 1 / -1;

      padding: 60px 20px;

      text-align: center;

      border: 1px dashed #333;
      border-radius: 18px;

      color: var(--gray);
    }

    .empty-state strong {
      display: block;

      margin-bottom: 8px;

      color: var(--white);

      font-size: 18px;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      border-top: 1px solid var(--line);

      padding: 30px 20px;

      text-align: center;

      color: #666;

      font-size: 13px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      .menu a:not(.admin-button) {
        display: none;
      }

      .hero {
        min-height: 70vh;
      }

      .hero h1 {
        letter-spacing: 6px;
      }

      .property-grid {
        grid-template-columns: 1fr;
      }

      .property-image {
        height: 230px;
      }

      .section-title h2 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <nav class="nav">

      <div class="logo">
        NEXO
      </div>

      <div class="menu">

        <a href="#propiedades">
          Propiedades
        </a>

        <a href="#contacto">
          Contacto
        </a>

        <a href="#" class="admin-button">
          Admin
        </a>

      </div>

    </nav>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main>

    <!-- HERO -->

    <section class="hero">

      <div class="hero-content">

        <h1>
          NEXO
        </h1>

        <p>
          Descubre propiedades que conectan contigo.
          Una nueva forma de encontrar tu próximo hogar.
        </p>

        <a
          href="#propiedades"
          class="hero-button"
        >
          Explorar propiedades
        </a>

      </div>

    </section>


    <!-- PROPERTIES -->

    <section
      id="propiedades"
      class="properties-section"
    >

      <div class="section-title">

        <span>
          NEXO
        </span>

        <h2>
          Propiedades disponibles
        </h2>

      </div>


      <div
        id="propertyGrid"
        class="property-grid"
      >

        <div class="empty-state">

          <strong>
            NEXO está listo
          </strong>

          <span>
            Las propiedades aparecerán aquí automáticamente.
          </span>

        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer id="contacto">

    © 2026 NEXO

  </footer>


  <!-- =========================
       NEXO JAVASCRIPT
  ========================== -->

  <script src="app.js"></script>

</body>
</html>
